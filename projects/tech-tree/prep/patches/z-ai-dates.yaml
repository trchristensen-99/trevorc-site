# Not AI: SpaceX's ship-to-ship transfer has slipped from 2025 to 2027, and
# announced dates like it usually slip further (forecasts compared).
- id: starship-orbital-refueling
  date: { window: [2027.5, 2032], likely: 2028.7 }
  was: 2028

# The record line of launch prices moves in jumps (a new vehicle every few
# decades: Saturn V in 1967, then nothing cheaper until Falcon 9 in 2010), so
# carrying it forward as a steady trend gives nonsense (median about 2105,
# upper quartile after 2270). Its forecasts compared use published
# forecasts instead.
- id: launch-100-dollars-kg
  trend: false
