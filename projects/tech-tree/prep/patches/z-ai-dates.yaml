# Long-range windows moved earlier to allow for AI (November 2026). For each,
# the build worked out when it would come if its window had ignored AI and
# the AI milestones then arrived on their likely dates (forecast.mjs, ifAI),
# and the best guess moved halfway there: even odds that transformative AI
# arrives about on schedule and speeds things up as modeled. The window opens
# earlier by the same amount; its late end stays, in case AI disappoints.
# `was` keeps the earlier best guess, shown in the app.

