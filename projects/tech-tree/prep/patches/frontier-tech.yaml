# Chipmaking
# ---------------------------------------------------------------------------

- id: high-na-euv
  name: High-NA EUV in chip production
  summary: >-
    EUV scanners with larger-aperture optics (numerical aperture 0.55) that
    print finer lines in one exposure. Each costs about $380 million;
    Intel, Samsung and SK hynix have bought them, while TSMC plans to skip
    them for its A14 node.
  criterion: >-
    High-NA EUV is used for at least one layer in high-volume manufacturing
    of a commercial chip.
  date: { window: [2027, 2030], likely: 2028 }
  efforts:
    - who: ASML
      where: Netherlands
      when: 2025
      outcome: achieved
      note: First EXE:5000 to Intel in December 2023; first production-grade EXE:5200 shipped in 2025 (about 175 wafers an hour).
    - who: Intel
      where: USA
      when: 2027
      outcome: ongoing
      note: Finished acceptance of an EXE:5200B for its 14A node in December 2025; risk production 2027, volume 2028.
    - who: Samsung; SK hynix
      where: South Korea
      when: 2028
      outcome: ongoing
      note: Both target High-NA in DRAM production by 2028.
    - who: TSMC
      where: Taiwan
      when: 2028
      outcome: rival
      note: Sticking with standard EUV and multiple patterning for A14.
  forecast:
    note: >-
      No one was using High-NA in volume production by October 2026. Intel's
      14A and the memory makers all point to 2027 to 2028, so 2028 is the
      likely first use in a product.
    sources:
      - title: TrendForce, Samsung and SK hynix set High-NA EUV timelines for DRAM (2026)
        url: https://www.trendforce.com/news/2026/09/09/news-the-race-to-2028-samsung-sk-hynix-set-high-na-euv-timelines-for-dram-as-micron-stays-tight-lipped/
      - title: TrendForce, ASML confirms first EXE:5200 shipment (2025)
        url: https://www.trendforce.com/news/2025/07/17/news-asml-confirms-first-high-na-euv-exe5200-shipment-reportedly-prepping-for-intels-14a-in-2027/
  sources:
    - title: Tom's Hardware, ASML's roadmap for chipmaking lithography tools examined
      url: https://www.tomshardware.com/tech-industry/semiconductors/asml-lithograpy-roadmap-examined-from-duv-to-hyper-na
    - title: DigiTimes, Intel completes High-NA EUV acceptance (2025)
      url: https://www.digitimes.com/news/a20251218PD232/intel-euv-technology-transistor-testing.html

