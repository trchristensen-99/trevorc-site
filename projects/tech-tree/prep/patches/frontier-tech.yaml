- id: small-modular-reactors
  name: Small modular reactors (first units)
  status: achieved
  summary: >-
    Factory-built reactors under about 300 MW, meant to cut nuclear costs
    through series production rather than one-off megaprojects. The first
    run in Russia (2020) and China (2023); Western units are under
    construction for about 2030, and US test reactors went critical in 2026.
  efforts:
    - who: Rosatom, Akademik Lomonosov floating plant
      where: Russia
      when: 2020
      outcome: achieved
      note: Two 35 MWe KLT-40S reactors on a barge at Pevek, fully commissioned May 2020.
    - who: China Huaneng, Tsinghua University, HTR-PM
      where: China
      when: 2023
      outcome: achieved
      note: High-temperature gas-cooled pebble-bed reactor, commercial operation December 2023.
    - who: CNNC, Linglong One (ACP100)
      where: China
      when: 2026
      outcome: ongoing
      note: 125 MWe land-based PWR at Changjiang, Hainan, construction from July 2021; commercial operation was expected in 2026.
    - who: Ontario Power Generation and GE Vernova Hitachi, BWRX-300 at Darlington
      where: Canada
      when: 2030
      outcome: ongoing
      note: Construction license April 2025; first grid power targeted for the end of 2030.
    - who: TerraPower Natrium (Kemmerer, Wyoming); Kairos Power Hermes; X-energy with Dow
      where: USA
      when: 2026
      outcome: ongoing
      note: Natrium construction permit March 2026 and construction start April 2026; Kairos's 50 MWe Hermes 2 broke ground April 2026.
    - who: US DOE Reactor Pilot Program (Antares, Valar Atomics, Aalo, Oklo)
      where: USA
      when: 2026
      outcome: achieved
      note: Small test reactors went critical from June 2026 (Antares Mark-0 first, then Valar, Aalo by July 4 and Oklo in August).
    - who: NuScale (with ENTRA1 and TVA); Rolls-Royce SMR
      where: USA, UK
      when: 2025
      outcome: ongoing
  sources:
    - title: IAEA, Small Modular Reactors
      url: https://www.iaea.org/topics/small-modular-reactors
    - title: World Nuclear News, Russia commissions floating NPP (2020)
      url: https://www.world-nuclear-news.org/Articles/Russia-commissions-floating-NPP
    - title: POWER, Aalo test reactor reaches criticality (2026)
      url: https://www.powermag.com/aalo-atomics-test-reactor-reaches-criticality-at-inl-fourth-doe-authorized-advanced-reactor-by-july-4/
    - title: World Nuclear News, Darlington SMR foundation module milestone (2026)
      url: https://www.world-nuclear-news.org/articles/darlington-smr-nuclear-project-foundation-module-milestone

- id: molten-salt-thorium
  criterion: >-
    A molten salt reactor of at least 100 MW thermal runs on a thorium fuel
    cycle (breeding uranium-233 from thorium) and produces electricity.
  date: { window: [2033, 2050], likely: 2038 }
  forecast:
    note: >-
      China moved fastest: construction from 2018, criticality of the 2 MWt
      TMSR-LF1 in October 2023, and thorium-to-uranium conversion announced
      November 2025 (with a conversion ratio of only about 0.1). Its stated
      next goal is a 100 MWt demonstration by 2035, which state projects
      have usually met within a few years. Salt corrosion, tritium and fuel
      reprocessing are unsolved at commercial scale, and thorium is not
      needed while uranium is cheap, so Western efforts lag. Best guess
      2038 in China.
    sources:
      - title: World Nuclear News, Chinese MSR achieves conversion of thorium-uranium fuel
        url: https://world-nuclear-news.org/articles/chinese-msr-achieves-conversion-of-thorium-uranium-fuel
      - title: Wikipedia, TMSR-LF1
        url: https://en.wikipedia.org/wiki/TMSR-LF1

- id: fusion-power
  summary: >-
    A power plant that makes net electricity by fusion for months at a
    time, with abundant fuel and no long-lived high-level waste. Laser
    fusion has passed scientific gain; no device has yet made net
    electricity, and four rival confinement routes are racing.
  criterion: >-
    A fusion plant delivers at least 50 MW of net electricity to a grid and
    runs for months, with at least six months of operation at 50 percent
    or higher availability.
  requires: [fusion-net-electricity]
  routes:
    - name: Tokamak
      requires: [magnetic-fusion-gain, tritium-breeding-blanket]
      note: ARC (CFS, Virginia, early 2030s), STEP (UK, 2040), China's CFEDR, ITER's successors.
    - name: Stellarator
      requires: [optimized-stellarator, tritium-breeding-blanket]
      note: Type One Energy's Infinity Two at TVA, Proxima Fusion's Stellaris.
    - name: Inertial
      requires: [fusion-drivers, tritium-breeding-blanket]
      note: Xcimer, Focused Energy, Marvel Fusion, Pacific Fusion.
    - name: Magnetized target and pulsed magnetic
      requires: [magneto-inertial-fusion]
      note: Helion's Orion (deuterium and helium-3, little tritium needed), General Fusion, Zap Energy.
  helped_by: [hts-fusion-magnets, fusion-triple-product-ignition, laser, deep-learning, stored-program-computer]
  date: { window: [2034, 2060], likely: 2040 }
  forecast:
    note: >-
      Read as first fusion electricity sold steadily to a grid. Company
      dates (Helion 2028, CFS early 2030s, STEP 2040) have a poor record:
      SPARC slipped from 2025 to 2027, ITER from 2016 to 2034 for first
      research operation, and Helion missed a 2024 electricity goal. Private
      firms raised about $14 billion by mid-2026 (FIA) and most say the
      early 2030s. Metaculus's 100 MW question sat near 2041 in earlier
      snapshots. Tritium breeding, materials under neutron flux and plant
      availability are untested. I put the first net-electric run around
      2034 and a plant running for months around 2040.
    sources:
      - title: Metaculus, When will the first 100 MW fusion electrical facility come into service?
        url: https://www.metaculus.com/questions/363/when-will-the-first-100-megawatt-fusion-based-electrical-generation-facility-come-into-service
      - title: Fusion Industry Association, 2026 global fusion industry report
        url: https://www.fusionindustryassociation.org/fusion-industry-attracts-record-annual-funding-of-4-48bn-raising-total-to-14-24bn/
      - title: Physics World, ITER hit by decade-long delay and 5 billion euro price hike
        url: https://physicsworld.com/a/iter-fusion-reactor-hit-by-massive-decade-long-delay-and-e5bn-price-hike/
      - title: Helion, world's first fusion power purchase agreement with Microsoft (2023)
        url: https://www.helionenergy.com/newsroom/helion-announces-worlds-first-fusion-ppa-with-microsoft

# ---------------------------------------------------------------------------
# Solar, batteries, storage, hydrogen, geothermal
# ---------------------------------------------------------------------------

- id: perovskite-silicon-tandem
  name: Perovskite-silicon tandem modules in mass production
  summary: >-
    A perovskite layer stacked on a silicon cell to harvest blue and red
    light separately, beating silicon's practical limit of about 27
    percent. Lab cells reached 35.5 percent in 2026, but commercial modules
    are small-volume and about 25 percent; durable mass production is the
    open problem.
  criterion: >-
    Tandem modules ship at more than 1 GW a year with certified module
    efficiency of at least 28 percent and pass standard IEC durability
    certification.
  date: { window: [2028, 2036], likely: 2031 }
  efforts:
    - who: LONGi Green Energy
      where: China
      when: 2026
      outcome: ongoing
      note: Certified 35.5 percent cell (ESTI, July 2026), after 33.9 percent in 2023; said in June 2026 it had no active mass-production plan.
    - who: Oxford PV
      where: UK, Germany
      when: 2024
      outcome: ongoing
      note: First commercial tandem module shipments (2024) at about 25 percent; targets 27 percent in 2027 and 30 percent in 2030.
    - who: Hanwha Qcells, Trina, JinkoSolar, GCL
      where: South Korea, China
      when: 2026
      outcome: ongoing
      note: Pilot lines.
    - who: Helmholtz-Zentrum Berlin, KAUST, EPFL and CSEM, Fraunhofer ISE
      where: Germany, Saudi Arabia, Switzerland
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      Cell records rise about half a point a year, but perovskite layers
      still degrade faster than silicon, and silicon modules at about 11
      cents a watt are a hard price to beat. Oxford PV's own roadmap puts
      27 percent modules in 2027. Judgment: GW-scale, certified 28 percent
      modules around 2031.
    sources:
      - title: pv magazine, LONGi sets new world record with 35.5 percent tandem cell (2026)
        url: https://www.pv-magazine.com/2026/07/15/longi-sets-new-world-record-with-35-5-efficient-perovskite-silicon-tandem-cell/
      - title: Oxford PV
        url: https://www.oxfordpv.com/
  sources:
    - title: LONGi, 35.5 percent tandem cell world record (2026)
      url: https://www.longi.com/en/news/crystalline-silicon-perovskite-tandem-solar-cell-new-world-efficiency-2026/
    - title: NREL, Best research-cell efficiency chart
      url: https://www.nrel.gov/pv/cell-efficiency.html

- id: sodium-ion-battery
  status: achieved
  date: 2026
  summary: >-
    A battery chemistry like lithium-ion but using abundant sodium, trading
    some energy density for lower cost and good cold-weather performance.
    CATL's sodium cells went into a mass-produced car in 2026, and sodium
    storage orders reached tens of GWh.
  efforts:
    - who: CATL (Naxtra) with Changan
      where: China
      when: 2026
      outcome: achieved
      note: 175 Wh/kg cells; a car CATL calls the first mass-produced sodium-battery passenger car was unveiled in February 2026, with 10,000 to 20,000 cars expected that year; a 60 GWh, three-year sodium storage order from HyperStrong (April 2026) and 40 GWh of new capacity in Fujian.
    - who: BYD, HiNa Battery (with JAC Yiwei)
      where: China
      when: 2024
      outcome: independent
      note: Small production runs in cars from 2023 to 2024.
    - who: Natron Energy
      where: USA
      when: 2025
      outcome: abandoned
      note: Prussian-blue sodium startup that shut down in 2025.
  sources:
    - title: CnEVPost, CATL sodium batteries begin deployment in production passenger vehicles (2026)
      url: https://cnevpost.com/2026/02/05/catl-sodium-batteries-begin-deployment-in-production-passenger-vehicles/
    - title: CnEVPost, CATL expects 10,000 EVs to use sodium batteries in 2026
      url: https://cnevpost.com/2026/06/24/catl-expects-10000-evs-sodium-batteries-2026/
    - title: CnEVPost, CATL secures world's largest sodium-ion battery order (2026)
      url: https://cnevpost.com/2026/04/27/catl-secures-worlds-largest-sodium-ion-battery-order/

- id: solid-state-batteries
  criterion: >-
    All-solid-state cells (no liquid electrolyte) power a series-production
    car sold in at least 10,000 units in one year.
  date: { window: [2027, 2035], likely: 2030 }
  helped_by: [battery-pack-100-dollars-kwh]
  forecast:
    note: >-
      Every major player points to 2027 to 2028 for small runs, but these
      dates have slipped repeatedly (Toyota's from 2020, QuantumScape's from
      2024), and as of early 2026 none had commercialized all-solid cells in
      cars. Liquid LFP (about $81 per kWh for packs in 2025) and sodium keep
      getting cheaper, which raises the bar. Small runs late 2020s; 10,000
      cars a year around 2030.
    sources:
      - title: Wikipedia, Solid-state battery
        url: https://en.wikipedia.org/wiki/Solid-state_battery
      - title: BloombergNEF, Lithium-ion battery pack prices fall to $108 per kilowatt-hour (2025)
        url: https://about.bnef.com/insights/clean-energy/lithium-ion-battery-pack-prices-fall-to-108-per-kilowatt-hour-despite-rising-metal-prices-bloombergnef/

- id: long-duration-storage
  name: Multi-day energy storage at scale
  summary: >-
    Storage that holds energy for a day or more rather than hours, using
    iron-air or flow batteries, compressed air or heat, to cover windless,
    dark spells on a renewable grid. Pumped hydro already does this where
    geography allows; the newer kinds are just reaching commercial use.
  criterion: >-
    Storage systems that can discharge at full power for 24 hours or more,
    other than pumped hydro, reach at least 10 GWh in commercial operation
    worldwide.
  helped_by: [grid-batteries, compressed-air-storage]
  date: { window: [2027, 2036], likely: 2030 }
  efforts:
    - who: Form Energy, iron-air
      where: USA
      when: 2026
      outcome: ongoing
      note: 100-hour batteries; a 1.5 MW, 150 MWh first system with Great River Energy in Minnesota; a 12 GWh deal with Crusoe (March 2026) and a $750 million round (August 2026).
    - who: Dalian Rongke Power, vanadium flow battery
      where: China
      when: 2022
      outcome: achieved
      note: 100 MW and 400 MWh in Dalian, about four hours.
    - who: Hydrostor; Chinese compressed air plants
      where: Canada, USA, China
      when: 2026
      outcome: ongoing
      note: China's 300 to 600 MW plants store about four to five hours.
    - who: Antora, Rondo
      where: USA
      when: 2024
      outcome: ongoing
      note: Thermal batteries for industrial heat.
  forecast:
    note: >-
      Almost all storage built so far lasts two to eight hours, because
      lithium batteries got cheap so fast. Form Energy's contracted 12 GWh
      alone would meet the bar once built, probably near the end of the
      decade. Judgment: 2030.
    sources:
      - title: Form Energy, news
        url: https://formenergy.com/news/
      - title: Great River Energy, Cambridge energy storage project
        url: https://greatriverenergy.com/what-we-do/cambridge-energy-storage-project
  sources:
    - title: MIT Technology Review, Form Energy (2026 climate tech companies to watch)
      url: https://www.technologyreview.com/2026/10/06/1145020/2026-climate-tech-companies-to-watch-form-energy-iron-batteries/
    - title: LDES Council
      url: https://www.ldescouncil.com/

- id: green-hydrogen
  name: Green hydrogen at scale
  summary: >-
    Splitting water with renewable electricity to make hydrogen for steel,
    ammonia and fuels without fossil carbon. It works, but costs two to
    four times hydrogen from natural gas, and low-emission hydrogen was
    under 1 percent of the roughly 100 million tonnes used in 2024.
  criterion: >-
    Hydrogen from electrolysis powered by low-carbon electricity reaches 10
    million tonnes a year, about a tenth of world hydrogen use.
  date: { window: [2033, 2055], likely: 2040 }
  efforts:
    - who: Sinopec, Kuqa solar hydrogen plant
      where: China
      when: 2023
      outcome: achieved
      note: About 260 MW of electrolyzers, then the largest.
    - who: NEOM Green Hydrogen Company (ACWA Power, Air Products)
      where: Saudi Arabia
      when: 2027
      outcome: ongoing
      note: About 4 GW of solar and wind for 600 tonnes of hydrogen a day; 90 percent built by March 2026, with first product due 2027.
    - who: Stegra (formerly H2 Green Steel), Boden
      where: Sweden
      when: 2026
      outcome: ongoing
      note: Hydrogen-reduced steel; hit funding trouble in 2025.
    - who: LONGi Hydrogen, Peric, thyssenkrupp nucera, Electric Hydrogen
      where: China, Germany, USA
      when: 2026
      outcome: ongoing
      note: Electrolyzers cost $600 to 1,200 per kW in China and $2,000 to 2,600 outside it (IEA 2025); China has about 65 percent of installed and committed capacity.
  forecast:
    note: >-
      Low-emission hydrogen was on track for about 1 million tonnes in 2025,
      and projects operating or committed reach 4.2 million tonnes a year by
      2030, while the announced 2030 pipeline shrank from 49 to 37 million
      tonnes in a year (IEA). Growth from there depends on carbon prices and
      mandates. Judgment: 10 million tonnes of electrolytic hydrogen around
      2040.
    sources:
      - title: IEA, Global Hydrogen Review 2025, executive summary
        url: https://www.iea.org/reports/global-hydrogen-review-2025/executive-summary
      - title: NEOM Green Hydrogen Company
        url: https://nghc.com/
  sources:
    - title: IEA, Global Hydrogen Review 2025
      url: https://www.iea.org/reports/global-hydrogen-review-2025

- id: enhanced-geothermal
  name: Enhanced geothermal power plants
  status: achieved
  summary: >-
    Making geothermal power away from volcanic hot springs by drilling into
    hot dry rock and fracturing it to circulate water, borrowing shale
    drilling methods. Fervo's Project Red sent power to the grid in 2023,
    and its Cape Station in Utah began commercial operation in October 2026.
  efforts:
    - who: Los Alamos, Fenton Hill hot dry rock project
      where: USA
      when: 1974
      outcome: abandoned
      note: Proved the concept but not the economics; ended 1995.
    - who: Soultz-sous-Forets
      where: France
      when: 2008
      outcome: achieved
      note: Small EGS plant, about 1.5 MW.
    - who: Fervo Energy, Project Red
      where: USA
      when: 2023
      outcome: achieved
      note: 3.5 MW to NV Energy from November 2023, from a horizontal well pair at 191 °C.
    - who: Fervo Energy, Cape Station
      where: USA
      when: 2026
      outcome: achieved
      note: First power September 24, 2026; first 33 MW block in commercial operation October 1, 2026; about 100 MW due by January 2027.
    - who: DOE Utah FORGE; Sage Geosystems
      where: USA
      when: 2026
      outcome: ongoing
  sources:
    - title: Canary Media, America's first enhanced geothermal plant just got up and running (2023)
      url: https://www.canarymedia.com/articles/geothermal/americas-first-enhanced-geothermal-plant-just-got-up-and-running
    - title: ThinkGeoEnergy, Fervo reports first power at Cape Station (2026)
      url: https://www.thinkgeoenergy.com/fervo-energy-reports-first-power-generation-at-cape-station-enhanced-geothermal-site-utah/
    - title: Enhanced geothermal system, Wikipedia
      url: https://en.wikipedia.org/wiki/Enhanced_geothermal_system

- id: space-based-solar
  criterion: >-
    At least 1 MW of power is beamed from a satellite in orbit and fed into
    a grid on Earth.
  forecast:
    note: >-
      Only milliwatts have been beamed from space (Caltech, 2023). Japan's
      OHISAMA, meant to beam about 1 kW from orbit, had slipped to 2026 or
      later without launching, and Aetherflux turned toward orbital data
      centers. NASA's 2024 study found it costlier than ground renewables
      unless launch and in-space assembly costs fall dramatically, while
      ground solar plus batteries keeps getting cheaper. China is the most
      likely first mover.
    sources:
      - title: NASA OTPS, Space-based solar power (2024)
        url: https://www.nasa.gov/organizations/otps/space-based-solar-power-report/
      - title: Caltech, In a first, Caltech's space solar power demonstrator beams power to Earth
        url: https://www.caltech.edu/about/news/in-a-first-caltechs-space-solar-power-demonstrator-wirelessly-transmits-power-in-space
      - title: Wikipedia, Cowboy Space Corporation (formerly Aetherflux)
        url: https://en.wikipedia.org/wiki/Cowboy_Space_Corporation
  helped_by: [fully-reusable-rockets, launch-100-dollars-kg]

# ---------------------------------------------------------------------------
# Carbon removal and climate
# ---------------------------------------------------------------------------

- id: direct-air-capture
  name: Direct air capture at megaton scale
  summary: >-
    Machines that pull CO2 straight out of the air with sorbents or
    solvents so it can be buried, proposed by Klaus Lackner in 1999. Plants
    have run since 2017 but capture hundreds to a few thousand tonnes a
    year, far below their ratings, at several hundred dollars a tonne.
  criterion: >-
    Direct air capture plants worldwide remove and permanently store at
    least 1 million tonnes of CO2 a year, net of their own emissions and
    verified by a third party.
  date: { window: [2029, 2042], likely: 2033 }
  status: ongoing
  efforts:
    - who: Climeworks (Capricorn 2017, Orca 2021, Mammoth 2024)
      where: Switzerland, Iceland
      when: 2024
      outcome: ongoing
      note: Mammoth (designed for 36,000 tonnes a year) captured 105 tonnes in its first ten months with 12 of 72 units installed; all Iceland plants had captured about 2,400 tonnes by May 2025.
    - who: 1PointFive (Occidental), Stratos, with Carbon Engineering technology
      where: USA
      when: 2026
      outcome: ongoing
      note: Designed for 500,000 tonnes a year in two phases; first-phase commissioning was delayed in mid-2026 with no new date.
    - who: Heirloom; CarbonCapture Inc.; Sirona
      where: USA, Kenya
      when: 2023
      outcome: ongoing
  forecast:
    note: >-
      Stratos alone would pass the bar if it runs near design, but every
      plant so far has run far below nameplate, and buyers paid about $340 a
      tonne on average for durable removal (CDR.fyi). Judgment: about 2033,
      once Stratos and the US DAC hubs operate for a full year.
    sources:
      - title: Heimildin, Climeworks capture figures (2025)
        url: https://heimildin.is/grein/24581/
      - title: Decarbonfuse, Stratos DAC delay (2026)
        url: https://decarbonfuse.com/posts/stratos-dac-delay-inside-the-holdup-at-the-world-s-largest-carbon-capture-plant
      - title: CDR.fyi
        url: https://www.cdr.fyi/
  sources:
    - title: Gasworld, Climeworks upgrades DAC at Iceland facility after low capture
      url: https://www.gasworld.com/story/climeworks-upgrades-dac-tech-at-iceland-facility-after-low-co2-capture-record/2259464.article/
    - title: RBN Energy, Stratos DAC project targets Q2 2026 startup
      url: https://rbnenergy.com/daily-posts/analyst-insight/stratos-dac-project-target-q2-2026-startup

- id: gigaton-carbon-removal
  criterion: >-
    Engineered, durable methods (storing carbon for centuries or more)
    remove at least 1 billion tonnes of CO2 a year, verified.
  requires: [carbon-capture]
  routes:
    - name: Direct air capture
      requires: [direct-air-capture]
      note: Energy-hungry; pairs with cheap solar, wind and geothermal.
    - name: Bioenergy with capture
      requires: [beccs]
      note: Cheapest at scale but limited by land and biomass.
    - name: Enhanced rock weathering
      requires: [enhanced-weathering]
      note: Cheap to spread, hard to measure.
  helped_by: [carbon-pricing, solar-photovoltaic, geothermal-at-scale]
  forecast:
    note: >-
      Durable removal is about 2 million tonnes a year and growing about 40
      percent a year (CDR.fyi, 2026); buyers have contracted about 50
      million tonnes but only 1.7 million have been delivered. At 40 percent
      a year, a gigaton takes about 18 years, to the mid-2040s; but removal
      only sells if policy pays for it, and plants have underperformed
      (Mammoth). Climate pathways call for several gigatons by 2050. If
      carbon prices or mandates arrive in the 2030s, the mid-2050s is
      plausible; otherwise later.
    sources:
      - title: CDR.fyi
        url: https://www.cdr.fyi/
      - title: CDR.fyi, monthly recap June 2026
        url: https://www.cdr.fyi/blog/cdr-monthly-recap-june-2026
      - title: The State of Carbon Dioxide Removal, 3rd edition (2026)
        url: https://www.stateofcdr.org/report/3rd-edition

- id: solar-geoengineering
  criterion: >-
    Reflective particles are deliberately put into the stratosphere at
    scale (on the order of a million tonnes of sulfur dioxide or equivalent
    a year) for at least a year, with the stated aim of lowering global
    temperature.
  efforts:
    - who: Paul Crutzen (2006 essay); Mikhail Budyko (1974)
      where: Germany, USSR
      when: 2006
      outcome: achieved
    - who: Harvard SCoPEx
      where: USA, Sweden
      when: 2024
      outcome: abandoned
      note: Balloon test cancelled after opposition in Sweden.
    - who: UK ARIA Exploring Climate Cooling program
      where: UK
      when: 2025
      outcome: ongoing
      note: About £57 million for 22 projects, including small outdoor tests that release no particles into the stratosphere.
    - who: Stardust Solutions
      where: Israel, USA
      when: 2025
      outcome: ongoing
      note: Raised $60 million in October 2025 ($75 million in all) to develop a reflective particle and delivery system.
    - who: Make Sunsets
      where: USA
      when: 2023
      outcome: ongoing
      note: Small sulfur balloon releases; Mexico banned such experiments in 2023, and Tennessee (2024) and Florida (2025) passed laws restricting geoengineering.
  forecast:
    note: >-
      Technically feasible within about a decade of a decision (Smith and
      Wagner estimated about $2 billion a year for the first years). The
      barrier is political: a single country could act, which makes timing
      depend on climate damage and governance, and opposition grew in
      2023 to 2025. Very uncertain.
    sources:
      - title: Smith and Wagner 2018, Stratospheric aerosol injection tactics and costs, Environmental Research Letters
        url: https://iopscience.iop.org/article/10.1088/1748-9326/aae98d
      - title: Wikipedia, Solar radiation modification
        url: https://en.wikipedia.org/wiki/Solar_radiation_modification
      - title: MIT Technology Review, How one controversial startup hopes to cool the planet (2025)
        url: https://www.technologyreview.com/2025/12/10/1129079/how-one-controversial-startup-hopes-to-cool-the-planet/

# ---------------------------------------------------------------------------
# Superconductors
# ---------------------------------------------------------------------------

- id: room-temperature-superconductor
  criterion: >-
    A material shows zero resistance and expels magnetic fields (the
    Meissner effect) above 273 K (0 °C) at ordinary atmospheric pressure, in
    a bulk sample, replicated by at least two independent laboratories.
  requires: [superconductors-high-temp, hydride-superconductors]
  helped_by: [deep-learning, quantum-computing]
  efforts:
    - who: Mikhail Eremets (Max Planck Mainz), hydrides H3S and LaH10
      where: Germany
      when: 2019
      outcome: achieved
      note: Superconductivity up to about 250 K, but at about 1.7 million atmospheres.
    - who: Ranga Dias (Rochester)
      where: USA
      when: 2023
      outcome: abandoned
      note: Room-temperature claims retracted from Nature in 2022 and 2023; Rochester found misconduct in 2024.
    - who: Quantum Energy Research Centre, LK-99
      where: South Korea
      when: 2023
      outcome: abandoned
      note: A viral July 2023 claim of a room-temperature superconductor; within weeks replications traced its behavior to copper sulfide impurities.
    - who: Paul Chu and colleagues (University of Houston)
      where: USA
      when: 2026
      outcome: ongoing
      note: Kept a mercury cuprate superconducting at 151 K at ambient pressure after a "pressure quench" (PNAS, March 2026), above the 133 K record that stood since 1993, though it degrades above 200 K.
    - who: Nickelate and AI materials-discovery efforts (Google DeepMind GNoME, Microsoft)
      where: USA, UK, China
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      The ambient-pressure record sat at about 133 K (mercury cuprates) from
      1993 until a metastable 151 K in 2026, while hydrides reach about 250 K
      only above a million atmospheres. No theory rules out room
      temperature at ambient pressure, but none says how to get there, and
      the field has a run of collapsed claims (Dias; LK-99). AI materials
      screening raises the number of candidates tried, not the odds per
      candidate. Judgment with very low confidence; it may never happen.
    sources:
      - title: Nature, LK-99 isn't a superconductor (2023)
        url: https://www.nature.com/articles/d41586-023-02585-7
      - title: Deng et al. 2026, pressure-quenched Hg-1223 at 151 K, PNAS
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12993975
      - title: Drozdov et al. 2019, Superconductivity at 250 K in lanthanum hydride, Nature
        url: https://www.nature.com/articles/s41586-019-1201-8
  sources:
    - title: Nature, LK-99 isn't a superconductor (2023)
      url: https://www.nature.com/articles/d41586-023-02585-7
    - title: Wikipedia, LK-99
      url: https://en.wikipedia.org/wiki/LK-99

