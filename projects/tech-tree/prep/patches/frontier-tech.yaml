- id: fully-reusable-rockets
  criterion: >-
    An orbital rocket's upper stage returns intact from orbit and flies to
    orbit again, with its booster also reused.
  date: { window: [2027, 2031], likely: 2027 }
  efforts:
    - who: SpaceX, Starship and Super Heavy
      where: USA
      when: 2026
      outcome: ongoing
      note: First flight April 2023; first tower catch of a booster October 2024 and first booster reflight May 2025; V3 debut May 22, 2026; first orbital flight September 28, 2026 (26 Starlink satellites deployed, splashdown off Hawaii). No ship had been caught or reflown; a first ship catch was planned for the next flight.
    - who: CALT, Long March 9 (reusable redesign); LandSpace
      where: China
      when: 2033
      outcome: ongoing
    - who: Stoke Space (Nova), Relativity (Terran R)
      where: USA
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      The booster side is done, and Starship reached orbit in September
      2026. The ship still needs a catch, a heat shield that survives
      without heavy refurbishment and a reflight. SpaceX has usually met its
      technical goals two to three times later than Musk's dates, but the
      remaining steps are incremental. Judgment: 2027.
    sources:
      - title: Wikipedia, SpaceX Starship flight tests
        url: https://en.wikipedia.org/wiki/SpaceX_Starship_flight_tests
      - title: Wikipedia, Starship flight test 14
        url: https://en.wikipedia.org/wiki/Starship_flight_test_14
  sources:
    - title: SpaceX, Starship
      url: https://www.spacex.com/vehicles/starship/
    - title: Wikipedia, SpaceX Starship flight tests
      url: https://en.wikipedia.org/wiki/SpaceX_Starship_flight_tests
  helped_by: [nasa-cots, venture-capital, launch-1000-dollars-kg]

- id: crewed-lunar-return
  summary: >-
    Landing people on the Moon for the first time since 1972, this time near
    the south pole where ice may supply water and fuel. Artemis II flew four
    astronauts around the Moon in April 2026; the US aims to land in 2028
    and China by 2030, by different routes.
  criterion: >-
    A crew lands on the Moon, works on the surface and returns safely to
    Earth.
  requires: [moon-landing, human-spaceflight]
  routes:
    - name: Refueled lander (Artemis)
      requires: [starship-orbital-refueling, propellant-depot]
      note: NASA's Orion carries the crew to lunar orbit; a Starship or Blue Moon lander filled in Earth orbit takes them down.
    - name: Expendable heavy lift (China)
      requires: [space-stations]
      note: Two Long March 10 launches, the Mengzhou crew ship and the Lanyue lander meet in lunar orbit, with no refueling.
  helped_by: [nasa-cots, fully-reusable-rockets, commercial-lunar-landers]
  date: { window: [2028, 2033], likely: 2029 }
  efforts:
    - who: NASA Artemis (SLS, Orion; SpaceX Starship HLS and Blue Origin Blue Moon landers)
      where: USA
      when: 2028
      outcome: ongoing
      note: Artemis II crewed flyby April 1 to 11, 2026. In February 2026 NASA made Artemis III a 2027 Earth-orbit docking test and moved the first landing to Artemis IV, targeted early 2028; the uncrewed Starship lunar demo slipped to late 2027.
    - who: CMSA (Long March 10, Mengzhou, Lanyue)
      where: China
      when: 2030
      outcome: ongoing
      note: Pad abort (June 2025) and a Long March 10 first-stage test with an in-flight abort (February 2026); first uncrewed Mengzhou flight about 2027; landing planned by 2030.
  forecast:
    note: >-
      US landings depend on ship-to-ship propellant transfer, not yet shown
      (now planned for early 2027), and Artemis dates have slipped from 2024
      to 2028. China's program has met its milestones on schedule so far and
      needs no refueling. Best guess 2029, by either.
    sources:
      - title: Wikipedia, Artemis program
        url: https://en.wikipedia.org/wiki/Artemis_program
      - title: Wikipedia, Artemis III
        url: https://en.wikipedia.org/wiki/Artemis_III
      - title: Wikipedia, Mengzhou (spacecraft)
        url: https://en.wikipedia.org/wiki/Mengzhou_(spacecraft)
      - title: CSIS, Artemis rewritten, NASA's new Moon plan
        url: https://aerospace.csis.org/artemis-rewritten-nasas-new-moon-plan-its-risks-and-whether-the-u-s-can-still-beat-china/

- id: crewed-mars-landing
  criterion: >-
    A crew lands on Mars and later returns safely to Earth.
  requires: [space-stations, mars-rovers, closed-loop-life-support]
  routes:
    - name: Refueled Starship
      requires: [starship-orbital-refueling, propellant-depot, mars-propellant-production]
      note: SpaceX's plan, refueling in Earth orbit and making return propellant on Mars.
    - name: Nuclear propulsion
      requires: [nuclear-space-propulsion]
      note: NASA's longer-term architectures, which shorten the trip and carry return propellant.
  helped_by: [crewed-lunar-return, lunar-base, small-modular-reactors]
  date: { window: [2035, 2060], likely: 2043 }
  efforts:
    - who: SpaceX, Starship
      where: USA
      when: 2033
      outcome: ongoing
      note: Musk gave 50 percent odds for an uncrewed 2026 attempt in May 2025, then said in February 2026 that Mars would wait about five to seven years while SpaceX focuses on the Moon.
    - who: NASA Moon to Mars architecture; Space Reactor-1 Freedom
      where: USA
      when: 2040
      outcome: ongoing
      note: A nuclear electric pathfinder with Mars flybys is proposed for December 2028.
    - who: CNSA
      where: China
      when: 2033
      outcome: ongoing
      note: Officials have floated crewed missions in the 2030s.
  forecast:
    note: >-
      Metaculus's question had a median in the mid-2030s in earlier
      snapshots. I am later: propellant transfer, Mars propellant
      production and long-duration life support are all undemonstrated,
      launch windows come every 26 months, and SpaceX has now deferred Mars
      for the Moon. If uncrewed Starships land around 2031 to 2033 and make
      propellant, crews could follow in the late 2030s; early to mid 2040s is
      my median.
    sources:
      - title: Metaculus, Date first human lands on Mars
        url: https://www.metaculus.com/questions/17154/date-first-human-lands-on-mars
      - title: Wikipedia, SpaceX Mars program
        url: https://en.wikipedia.org/wiki/SpaceX_Mars_program

- id: mars-settlement
  criterion: >-
    At least 100 people live on Mars continuously for five years or more,
    with crew rotations, making their own water, oxygen and propellant and
    most of their food locally.
  requires: [crewed-mars-landing, closed-loop-life-support, mars-propellant-production]
  helped_by: [3d-printing, small-modular-reactors, molecular-nanotechnology, launch-100-dollars-kg]
  date: { window: [2055, 2130], likely: 2075 }

- id: asteroid-mining
  criterion: >-
    Material mined from an asteroid (water or metal) is sold to a paying
    customer, in space or on Earth.
  helped_by: [fully-reusable-rockets, orbital-manufacturing, propellant-depot, artemis-accords, launch-1000-dollars-kg]
  efforts:
    - who: Planetary Resources; Deep Space Industries
      where: USA
      when: 2018
      outcome: abandoned
      note: Both well-funded startups were sold off in 2018 to 2019 without mining.
    - who: AstroForge
      where: USA
      when: 2025
      outcome: ongoing
      note: Its Odin flyby probe was lost days after launch in February 2025; a next mission (DeepSpace-2) is listed for late 2026 or 2027.
    - who: Karman+; Origin Space
      where: USA, China
      when: 2026
      outcome: ongoing
      note: Karman+ plans a first mission to the asteroid Apophis.

- id: orbital-manufacturing
  criterion: >-
    At least one company returns products made in orbit to Earth on a
    regular schedule (at least monthly) and sells them commercially.
  date: { window: [2027, 2035], likely: 2030 }
  efforts:
    - who: Varda Space Industries, W-series capsules
      where: USA
      when: 2026
      outcome: ongoing
      note: W-1 crystallized ritonavir and landed in Utah in February 2024; W-2 to W-6 flew in 2025 to 2026, about one every two to three months, carrying defense and NASA payloads; W-4 was lost on reentry in May 2026.
    - who: Space Forge (ForgeStar-1)
      where: UK
      when: 2025
      outcome: ongoing
      note: Launched June 2025 and ran its 1,000 °C furnace in orbit.
    - who: ISS National Lab, Redwire, Flawless Photonics
      where: USA
      when: 2024
      outcome: ongoing
      note: ZBLAN optical fiber drawn in orbit.
  forecast:
    note: >-
      Varda's flight rate rose from one in 2023 to four in 2025, but its
      payloads are mostly test and government work, not products for sale.
      Cheaper launch and reentry should allow monthly returns by about
      2030. Judgment.
    sources:
      - title: Wikipedia, Varda Space Industries
        url: https://en.wikipedia.org/wiki/Varda_Space_Industries
      - title: Wikipedia, Space Forge
        url: https://en.wikipedia.org/wiki/Space_Forge
  sources:
    - title: Varda Space Industries
      url: https://www.varda.com/
    - title: Wikipedia, Varda Space Industries
      url: https://en.wikipedia.org/wiki/Varda_Space_Industries

- id: interstellar-probe
  criterion: >-
    A spacecraft is launched at a speed (at least about 1 percent of light
    speed) and on a trajectory that would carry it to another star system
    within 100 years.

- id: electric-aviation
  criterion: >-
    Electric air taxis with an FAA or EASA type certificate carry paying
    passengers on regular service in at least one US or European city.
  date: { window: [2027, 2031], likely: 2027 }
  efforts:
    - who: EHang, EH216-S
      where: China
      when: 2025
      outcome: achieved
      note: Chinese type certificate in 2023 and approval for pilotless commercial passenger operations in March 2025.
    - who: Joby Aviation
      where: USA
      when: 2026
      outcome: ongoing
      note: Its first FAA-conforming aircraft began type inspection flight testing in March 2026, the fifth and final stage of certification; no type certificate by October 2026.
    - who: Archer Aviation; Beta Technologies
      where: USA, United Arab Emirates
      when: 2026
      outcome: ongoing
      note: Archer flew its Midnight in Abu Dhabi in 2025 but had not begun FAA type inspection testing.
    - who: Lilium; Volocopter
      where: Germany
      when: 2025
      outcome: abandoned
      note: Lilium shut down in 2025; Volocopter went insolvent and was sold.
  forecast:
    note: >-
      Joby is closest; final-stage certification flight testing usually
      takes a year or more, and first service would follow soon after. China
      already allows commercial eVTOL passenger flights. Judgment: 2027.
    sources:
      - title: Joby Aviation, second quarter 2026 results
        url: https://www.jobyaviation.com/news/joby-reports-second-quarter-2026-financial-results
      - title: Wikipedia, Joby Aviation
        url: https://en.wikipedia.org/wiki/Joby_Aviation
  sources:
    - title: Wikipedia, Joby Aviation
      url: https://en.wikipedia.org/wiki/Joby_Aviation
    - title: EHang, Wikipedia
      url: https://en.wikipedia.org/wiki/EHang
    - title: Wikipedia, Archer Aviation
      url: https://en.wikipedia.org/wiki/Archer_Aviation
