# Changes to existing frontier nodes in computing and AI, electronics,
# physics, energy, engineering and space, chemistry and materials: each
# future node gets a checkable criterion, an honest date window and a
# forecast, and links to the intermediate steps and routes added in
# nodes/g-frontier-tech.yaml. Nodes already achieved by October 2026 are
# marked so. Each entry replaces whole fields.

# ---------------------------------------------------------------------------
# AI
# ---------------------------------------------------------------------------

- id: ai-agents
  status: achieved
  date: 2025
  summary: >-
    Language models that act on their own over many steps, using tools,
    code, browsers and whole computers to finish tasks. The length of
    software task they finish half the time grew from about an hour (early
    2025) to about 12 to 17 hours of expert work (2026), doubling about
    every four months.
  effort:
    note: >-
      METR's 50 percent time horizon crossed 1 hour with Claude 3.7 Sonnet
      (February 2025) and 8 hours with Claude Opus 4.6 (February 2026, about
      12 hours); an early Claude Mythos Preview measured about 17 hours
      (April 2026). Since 2023 it has doubled about every 130 days. METR
      says its tasks cannot measure reliably above about 16 hours.
  sources:
    - title: Kwa et al. 2025 (METR), Measuring AI Ability to Complete Long Tasks
      url: https://arxiv.org/abs/2503.14499
    - title: METR, Time horizon 1.1 (January 2026)
      url: https://metr.org/blog/2026-01-29-time-horizon-1-1/
    - title: METR, benchmark results (time horizons by model)
      url: https://metr.org/assets/benchmark_results_1_1.yaml
    - title: Anthropic, Introducing computer use
      url: https://www.anthropic.com/news/3-5-models-and-computer-use

- id: ai-datacenters
  status: achieved
  date: 2026
  summary: >-
    Purpose-built campuses with hundreds of thousands of AI chips drawing a
    gigawatt or more, for training and serving frontier models. By 2026
    Epoch counted one campus above 1 GW of IT power and several near it;
    power and chip supply, more than algorithms, now set the pace of
    scaling.
  efforts:
    - who: Anthropic and Amazon (New Carlisle, Indiana)
      where: USA
      when: 2026
      outcome: achieved
      note: About 1,037 MW of IT power in Epoch's data, the only site above 1 GW.
    - who: xAI (Colossus and Colossus 2, Memphis)
      where: USA
      when: 2026
      outcome: ongoing
      note: Colossus was built in about four months in 2024; Colossus 2 had about 440,000 GB300 chips and about 946 MW by late 2026.
    - who: OpenAI, SoftBank, Oracle (Stargate)
      where: USA
      when: 2025
      outcome: ongoing
      note: A 10 GW commitment from January 2025; the Abilene, Texas site (about 618 MW) trained GPT-6 Astra.
    - who: Microsoft (Fairwater); Google; Meta
      where: USA
      when: 2026
      outcome: ongoing
  sources:
    - title: Epoch AI, Frontier data centers
      url: https://epoch.ai/data/data-centers
    - title: Epoch AI, Can AI scaling continue through 2030?
      url: https://epoch.ai/blog/can-ai-scaling-continue-through-2030
    - title: Wikipedia, Colossus (supercomputer)
      url: https://en.wikipedia.org/wiki/Colossus_(supercomputer)
    - title: Wikipedia, Stargate LLC
      url: https://en.wikipedia.org/wiki/Stargate_LLC

- id: robot-foundation-models
  status: achieved
  summary: >-
    Vision-language-action models that turn camera images and instructions
    directly into robot motions and transfer across tasks and robot bodies.
    They work in demonstrations and pilots; general-purpose robots doing
    paid work at scale are the next step.
  efforts:
    - who: Google DeepMind
      where: USA and UK
      when: 2023
      outcome: achieved
      note: RT-2 (July 2023); Gemini Robotics (March 2025).
    - who: Physical Intelligence
      where: USA
      when: 2024
      outcome: ongoing
      note: pi0 (October 2024), pi0.5 (April 2025), pi*0.6 (November 2025), pi0.7 (April 2026), and an API in October 2026.
    - who: Nvidia; Figure; Tesla; Unitree
      where: USA and China
      when: 2025
      outcome: ongoing
  sources:
    - title: Brohan et al. 2023, RT-2
      url: https://arxiv.org/abs/2307.15818
    - title: Physical Intelligence, blog
      url: https://www.pi.website/blog

- id: autonomous-vehicles
  name: Driverless robotaxi service
  status: achieved
  summary: >-
    Cars that carry paying passengers with no one in the driver's seat,
    using cameras, lidar, radar and neural networks. Waymo began fully
    driverless public rides in Phoenix in 2020; scaling to many cities is
    the next step.
  sources:
    - title: Wikipedia, Waymo
      url: https://en.wikipedia.org/wiki/Waymo
    - title: Wikipedia, DARPA Grand Challenge
      url: https://en.wikipedia.org/wiki/DARPA_Grand_Challenge

- id: automated-ai-research
  name: Fully automated AI research (superhuman AI researcher)
  tier: 2
  summary: >-
    AI that does the whole job of a frontier lab's best research scientists,
    choosing questions, designing and running experiments and inventing new
    methods, so AI progress itself speeds up. OpenAI has set it as a goal
    for 2028; it is the main mechanism in fast-takeoff scenarios.
  criterion: >-
    The AI 2027 "superhuman AI researcher" bar: AI that can do the work of
    a frontier lab's best human AI researcher, at least as well and about
    30 times faster, with about 30 times as many copies as the lab has
    researchers. In practice, a frontier lab reports that AI systems, not
    people, now originate and carry out most of its research, with humans
    mainly setting goals and checking safety.
  requires: [superhuman-coder]
  helped_by: [ai-horizon-1-year, ai-datacenters, ai-discovered-results, continual-learning-ai]
  date: { window: [2028, 2040], likely: 2031 }
  efforts:
    - who: OpenAI
      where: USA
      when: 2028
      outcome: ongoing
      note: In October 2025 Sam Altman said OpenAI was tracking toward an intern-level research assistant by September 2026 and a fully automated "legitimate AI researcher" by 2028.
    - who: Anthropic; Google DeepMind; xAI; Meta Superintelligence Labs
      where: USA, UK
      when: 2026
      outcome: ongoing
      note: All use their own models heavily for research coding by 2026.
  forecast:
    note: >-
      This needs the automated coder first (judged about 2029 here) plus
      research taste and long-horizon judgment. In August 2026 the AI 2027
      authors put "top-expert-dominating AI" at November 2028 (Kokotajlo)
      and July 2032 (Lifland). METR judged that GPT-6-era models (GPT-5.6
      Sol, June 2026) would not yet enable fully automated AI research. I put
      it two years after the automated coder, at 2031, with a long tail if
      continual learning proves necessary and hard.
    sources:
      - title: TechCrunch, Sam Altman says OpenAI will have a legitimate AI researcher by 2028 (2025)
        url: https://techcrunch.com/2025/10/28/sam-altman-says-openai-will-have-a-legitimate-ai-researcher-by-2028/
      - title: AI Futures Project, Q2.5 2026 timelines update (August 2026)
        url: https://blog.aifutures.org/p/q25-2026-timelines-update-uplift
      - title: METR, GPT-5.6 Sol evaluation (June 2026)
        url: https://metr.org/blog/2026-06-26-gpt-5-6-sol/
  sources:
    - title: AI 2027, takeoff forecast (definitions)
      url: https://ai-2027.com/research/takeoff-forecast
    - title: TechCrunch, Sam Altman says OpenAI will have a legitimate AI researcher by 2028 (2025)
      url: https://techcrunch.com/2025/10/28/sam-altman-says-openai-will-have-a-legitimate-ai-researcher-by-2028/

- id: agi
  name: Artificial general intelligence
  summary: >-
    AI that can do essentially any cognitive work a skilled human can do,
    including learning a new job on the job, at similar or lower cost. It
    would transform the economy and science, and how to make it safe is one
    of the central open problems of the time.
  criterion: >-
    A single AI system that (1) can do at least 90 percent of the tasks in
    jobs done at a computer, across the economy, at the level of a competent
    professional and at lower cost than one; (2) learns a new job from
    experience about as fast as a capable human hire; and (3) would resolve
    Metaculus's "first general AI system" question, whose tests include a
    two-hour adversarial Turing test and controlling a robot through a
    complex assembly task.
  requires: [frontier-models, ai-agents, ai-datacenters, ai-horizon-1-workday]
  routes:
    - name: Scaling today's methods
      requires: [reasoning-models, superhuman-coder, ai-horizon-1-year]
      note: Larger pretraining, reinforcement learning on longer tasks and more inference compute keep closing gaps, as time horizons have grown since 2019.
    - name: AI-automated research
      requires: [automated-ai-research]
      note: AI researchers find the remaining ideas themselves, possibly quickly (the intelligence explosion of AI 2027).
    - name: New paradigm
      requires: [continual-learning-ai]
      note: Scaling stalls short of general ability, and on-the-job learning or learned world models (as LeCun's AMI Labs argues) supply the missing piece.
  helped_by: [robot-foundation-models, general-purpose-robots, multimodal-models, ai-autonomous-science]
  date: { window: [2028, 2045], likely: 2032 }
  efforts:
    - who: OpenAI, Google DeepMind, Anthropic, xAI, Meta Superintelligence Labs
      where: USA and UK
      when: 2026
      outcome: ongoing
      note: All state AGI or superintelligence as a goal; OpenAI presented GPT-6 Astra (September 2026) as the start of an "AGI era".
    - who: DeepSeek, Alibaba, Moonshot, Zhipu and others
      where: China
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      Frontier training compute has grown about 4 to 5 times a year, to about
      1e27 FLOP (GPT-6 Astra, 2026, per Epoch), and METR's time horizons
      doubled about every four months to around 12 to 17 hours by 2026.
      Carried forward, AI handles month-long projects around 2029 and
      year-long ones around 2031; the question is whether that reaches
      messy, open-ended work and on-the-job learning. In August 2026 the AI
      2027 authors put top-expert-level AI at 2028 (Kokotajlo) and 2032
      (Lifland); Dwarkesh Patel put human-like on-the-job learning at 2032;
      Metaculus's strong-AGI question sat around the early 2030s in 2025 to
      2026; the 2023 survey of 2,778 AI researchers gave 50 percent for
      human-level machine intelligence by 2047, earlier with each survey. I
      put the median at 2032, with a long tail if scaling slows when compute
      growth meets power and capital limits around 2030.
    sources:
      - title: Metaculus, When will the first general AI system be devised, tested, and publicly announced?
        url: https://www.metaculus.com/questions/5121/
      - title: AI Futures Project, Q2.5 2026 timelines update (August 2026)
        url: https://blog.aifutures.org/p/q25-2026-timelines-update-uplift
      - title: Dwarkesh Patel, Why I don't think AGI is right around the corner (2025)
        url: https://www.dwarkesh.com/p/timelines-june-2025
      - title: Grace et al. 2024, Thousands of AI Authors on the Future of AI (2023 ESPAI survey)
        url: https://arxiv.org/abs/2401.02843
      - title: Epoch AI, Training compute of frontier AI models grows by 4-5x per year
        url: https://epoch.ai/blog/training-compute-of-frontier-ai-models-grows-by-4-5x-per-year
      - title: METR, Time horizon 1.1 (January 2026)
        url: https://metr.org/blog/2026-01-29-time-horizon-1-1/

# ---------------------------------------------------------------------------
# Quantum computing
# ---------------------------------------------------------------------------

- id: quantum-computing
  status: achieved
  summary: >-
    Machines that compute with qubits held in superposition and
    entanglement. First demonstrated with two qubits in 1998, they reached
    hundreds to thousands of physical qubits by 2026 on several competing
    platforms; doing useful work better than classical computers is the
    next step.
  helped_by: [quantum-error-correction, superconductivity, laser, superconducting-qubits, trapped-ion-qubits]

- id: fault-tolerant-quantum-computer
  summary: >-
    A quantum computer with about 100 or more error-corrected logical
    qubits that can run very long computations reliably, enough for useful
    chemistry and materials simulation. Five hardware platforms are racing,
    with company targets around 2029.
  criterion: >-
    John Preskill's "megaquop" bar: about 100 or more logical qubits with
    error rates near one in a million per logical operation, running
    circuits of at least about 10,000 layers (a million or more logical
    operations) correctly.
  requires: [below-threshold-error-correction, logical-qubit-processors, quantum-computing]
  helped_by: [quantum-gate-four-nines, useful-quantum-advantage]
  routes:
    - name: Superconducting circuits
      requires: [superconducting-qubits]
      note: IBM (Starling, 200 logical qubits and 100 million operations, by 2029), Google (magic-state cultivation shown 2026), USTC, Rigetti, AWS.
    - name: Trapped ions
      requires: [trapped-ion-qubits]
      note: Quantinuum (Helios 2025, Apollo targeted 2029), IonQ.
    - name: Neutral atoms
      requires: [neutral-atom-arrays]
      note: QuEra and Harvard, Atom Computing, Pasqal, Infleqtion; Google started a neutral-atom program in 2026.
    - name: Photons
      requires: [photonic-qubits]
      note: PsiQuantum (utility-scale sites in Brisbane and Chicago), Xanadu.
    - name: Topological qubits
      requires: [topological-qubits]
      note: Microsoft; still unproven.
  date: { window: [2028, 2037], likely: 2030 }
  efforts:
    - who: IBM
      where: USA
      when: 2029
      outcome: ongoing
      note: Starling, about 200 logical qubits running 100 million gates, planned for Poughkeepsie by 2029 using qLDPC codes; Blue Jay (2,000 logical qubits) after 2033.
    - who: Google Quantum AI
      where: USA
      when: 2029
      outcome: ongoing
      note: Below-threshold surface code (2024); magic states at 99.99 percent fidelity by cultivation (Science, October 2026).
    - who: Quantinuum
      where: USA and UK
      when: 2029
      outcome: ongoing
      note: Apollo, a universal fault-tolerant machine, targeted for 2029.
    - who: DARPA Quantum Benchmarking Initiative
      where: USA
      when: 2033
      outcome: ongoing
      note: Aims to judge by 2033 whether any approach can reach utility scale; stage C (government verification) included Atom Computing, Diraq (silicon spins), IBM, IonQ, Microsoft and PsiQuantum as of October 2026.
  forecast:
    note: >-
      Logical qubit counts went from 1 to about 48 between 2023 and 2026, at
      small code sizes and short circuits, and IBM, Quantinuum and others
      target 100 to 200 logical qubits around 2029. Such roadmaps have
      usually slipped a year or two, but progress since 2024 has been on or
      ahead of schedule and several platforms are competing, so my best
      guess is 2030, with a tail into the late 2030s if error rates stall.
    sources:
      - title: Preskill 2025, Beyond NISQ, the megaquop machine (arXiv)
        url: https://arxiv.org/abs/2502.17368
      - title: IBM, Sets the course to build the world's first large-scale fault-tolerant quantum computer (2025)
        url: https://newsroom.ibm.com/2025-06-10-IBM-Sets-the-Course-to-Build-Worlds-First-Large-Scale,-Fault-Tolerant-Quantum-Computer-at-New-IBM-Quantum-Data-Center
      - title: DARPA, Quantum Benchmarking Initiative
        url: https://www.darpa.mil/research/programs/quantum-benchmarking-initiative
      - title: Quantum Computing Report, Google demonstrates magic-state cultivation (2026)
        url: https://quantumcomputingreport.com/google-quantum-ai-demonstrates-magic-state-cultivation-on-willow-processor-in-science-milestone/
  sources:
    - title: IBM, How IBM will build the world's first large-scale fault-tolerant quantum computer
      url: https://www.ibm.com/quantum/blog/large-scale-ftqc
    - title: Preskill 2025, Beyond NISQ, the megaquop machine (arXiv)
      url: https://arxiv.org/abs/2502.17368

- id: cryptographically-relevant-quantum-computer
  name: Quantum computer that breaks public-key encryption
  summary: >-
    A quantum computer able to run Shor's algorithm against 2048-bit RSA or
    256-bit elliptic-curve keys, breaking much of today's internet
    encryption, including data recorded now and decrypted later. Estimates
    of the hardware needed fell sharply in 2025 and 2026.
  criterion: >-
    A quantum computer factors a 2048-bit RSA modulus, or solves a 256-bit
    elliptic-curve discrete logarithm, and the result is publicly verified.
  date: { window: [2030, 2045], likely: 2035 }
  forecast:
    note: >-
      Craig Gidney estimated in May 2025 that RSA-2048 could be factored in
      under a week with fewer than a million noisy qubits; a March 2026
      paper put 256-bit elliptic curves at under 500,000 physical qubits
      running for minutes. That is still hundreds of times larger than 2026
      machines. In the Global Risk Institute's 2025 survey (published March
      2026), experts gave 28 to 49 percent odds within 10 years and 51 to 70
      percent within 15. NIST's final transition plan (October 2026)
      deprecates RSA and elliptic-curve signatures after 2030 and disallows
      them after 2035. I put the median about five years after the first
      fault-tolerant machines.
    sources:
      - title: Gidney 2025, How to factor 2048 bit RSA integers with less than a million noisy qubits
        url: https://arxiv.org/abs/2505.15917
      - title: Babbush, Gidney, Boneh et al. 2026, elliptic-curve resource estimate (arXiv)
        url: https://arxiv.org/abs/2603.28846
      - title: Global Risk Institute, Quantum Threat Timeline Report 2025
        url: https://globalriskinstitute.org/publication/quantum-threat-timeline-report-2025b/
      - title: NIST IR 8547, Transition to post-quantum cryptography standards (final, 2026)
        url: https://csrc.nist.gov/pubs/ir/8547/final
  sources:
    - title: Gidney 2025, How to factor 2048 bit RSA integers with less than a million noisy qubits
      url: https://arxiv.org/abs/2505.15917
    - title: NIST IR 8547 (final, 2026)
      url: https://csrc.nist.gov/pubs/ir/8547/final

