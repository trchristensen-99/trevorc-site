# How AI milestones would speed up the rest of the frontier. See SCHEMA.md,
# "Acceleration". Each technology's remaining work is split into kinds;
# once a milestone arrives (and over its ramp), the kinds it helps go
# faster, and by Amdahl's law the rest goes no faster, so a technology
# that is mostly clinical trials gains little from faster design.
#
# The multipliers are my judgment, anchored on the sources given; most
# measurements so far are of coding, and the further from software, the
# thinner the evidence. Status as of 2026-10-30.

work:                 # short names; what each covers is in the comment
  ai-research: AI research          # AI research and engineering itself
  software: software                # writing and testing software
  design: design and analysis       # design, theory, simulation and analysis on computers
  experiments: experiments          # lab, field and test-flight experiments
  trials: trials and approval       # clinical trials, certification and regulatory review
  building: building                # building, manufacturing and scaling up
  adoption: adoption                # adoption, financing and changing institutions
  proof: proof                      # finding and checking proofs, in mathematics and formal verification

mechanisms:
  - id: automated-coding
    name: Automated coding
    from: superhuman-coder
    speedup: { software: 10, ai-research: 5, proof: 5 }
    ramp: 1
    note: >-
      AI 2027's takeoff model put AI research progress at 5 times its human
      pace with a superhuman coder, and its authors' 2026 model puts coding
      uplift then at 20 to 32 times. Measured gains so far are far smaller:
      METR's 2025 trial found experienced developers 19 percent slower with
      AI, and its 2026 rerun about 18 percent faster, though it calls that
      unreliable. 10 times for software, once coders are fully automated,
      sits between.
    sources:
      - title: AI Futures Project, AI 2027 takeoff forecast
        url: https://ai-2027.com/research/takeoff-forecast
      - title: AI Futures Project, Q2.5 2026 timelines update
        url: https://blog.aifutures.org/p/q25-2026-timelines-update-uplift
      - title: METR, Measuring the impact of early-2025 AI on experienced open-source developer productivity
        url: https://arxiv.org/pdf/2507.09089
      - title: METR, uplift update (February 2026)
        url: https://metr.org/blog/2026-02-24-uplift-update/

  - id: automated-ai-research
    name: Automated AI research
    from: automated-ai-research
    speedup: { ai-research: 25 }
    ramp: 1
    note: >-
      AI 2027's figure for a superhuman AI researcher: AI research 25 times
      its human pace. It speeds AI itself; its effect on other fields comes
      through the AI milestones it brings sooner.
    sources:
      - title: AI Futures Project, AI 2027 takeoff forecast
        url: https://ai-2027.com/research/takeoff-forecast

  - id: ai-science
    name: AI-led science
    from: ai-autonomous-science
    speedup: { design: 2.5, proof: 4 }
    ramp: 2
    note: >-
      AI that makes discoveries on its own speeds the design and analysis
      side of research. Insilico reports 12 to 18 months from target to drug
      candidate against an industry 2.5 to 4 years, about 2 to 3 times, and
      beta users said one run of Edison's Kosmos did about six months of
      their work, though only 58 percent of its interpretations held up.
    sources:
      - title: Insilico Medicine, timelines to developmental candidate
        url: https://www.eurekalert.org/news-releases/1073344
      - title: Edison Scientific, Announcing Kosmos
        url: https://edisonscientific.com/articles/announcing-kosmos

  - id: lab-robots
    name: Automated experiments
    from: autonomous-labs
    speedup: { experiments: 3 }
    ramp: 3
    note: >-
      Self-driving labs run experiments day and night and choose each next
      one from the last. Across published studies, the median cut in
      experiments needed to reach a target was 6 times; each experiment
      still takes as long as its chemistry or biology does, so the calendar
      gain is smaller.
    sources:
      - title: Benchmarking self-driving labs (arXiv 2508.06642)
        url: https://arxiv.org/pdf/2508.06642
      - title: Szymanski et al., An autonomous laboratory for the accelerated synthesis of novel materials (A-Lab), Nature 2023
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10700133

  - id: robot-work
    name: Robots at work
    from: general-purpose-robots
    speedup: { building: 1.5, experiments: 1.3 }
    ramp: 4
    note: >-
      General-purpose robots take on construction, assembly and lab chores,
      but they have to be made and deployed first, so the gain is modest
      until robots build robots.

  - id: virtual-cells
    name: Experiments on virtual cells
    from: virtual-cell
    speedup: { experiments: 2, design: 1.5 }
    ramp: 3
    only: { tracks: [molecular-biology, synthetic-biology, life-science, genetic-medicine, drugs, longevity, surgery-organs, neurotech] }
    note: >-
      A model that predicts what a perturbation will do works like today's
      cell-line screens, but on the computer: it picks what is worth testing
      in organoids and animals, so biologists run only the confirming
      experiments. Half the experiments is my judgment.

  - id: human-models
    name: Human models in place of animals
    from: organoids-replace-animal-tests
    speedup: { experiments: 1.5, trials: 1.15 }
    ramp: 4
    only: { tracks: [genetic-medicine, drugs, longevity, surgery-organs, neurotech] }
    note: >-
      Organoids and organ chips grown from human cells, run at scale in
      automated labs, replace slow animal studies before trials and predict
      human results better, so fewer drugs fail in people. Trials stay the
      standard of evidence; a little less failure is the gain there. Both
      figures are my judgment.
    sources:
      - title: FDA announces plan to phase out animal testing requirement for monoclonal antibodies and other drugs (April 2025)
        url: https://www.fda.gov/news-events/press-announcements/fda-announces-plan-phase-out-animal-testing-requirement-monoclonal-antibodies-and-other-drugs

  - id: ai-materials
    name: AI materials discovery
    from: ai-discovered-material
    speedup: { design: 2, experiments: 1.5 }
    ramp: 3
    only: { tracks: [modern-materials, nanotech, storage-fuels, renewables, components, chipmaking, nuclear-energy, nuclear-particle, quantum-atomic, industrial-chemistry, classical-chemistry] }
    note: >-
      Once AI-led searches routinely find materials that work, finding a
      better electrolyte, magnet, superconductor or wall material for a
      reactor becomes faster, though qualifying it still takes time.

  - id: robot-industry
    name: Robots building robots
    from: robots-build-robots
    speedup: { building: 3 }
    ramp: 5
    note: >-
      When robots make robots, building is limited by materials, energy and
      permits rather than labor. Three times as fast is a judgment; the
      industrial explosion argument says far more is possible.
    sources:
      - title: Davidson and Hadshar, The industrial explosion (Forethought, 2025)
        url: https://www.forethought.org/research/the-industrial-explosion

  - id: agi
    name: General AI
    from: agi
    speedup: { software: 30, ai-research: 25, design: 8, experiments: 1.5, trials: 1.2, building: 1.3, adoption: 1.1, proof: 30 }
    ramp: 3
    note: >-
      AI that can do any computer-based job speeds everything that happens on
      a computer and a little of what doesn't: better-designed experiments
      and trials fail less often (AI-discovered drugs have passed phase 1 at
      75 to 90 percent against about 52 percent, but phase 2 at about the
      usual rate), and planning and paperwork speed up building and
      approvals. Economists who model this expect what can't be automated to
      set the pace (Aghion, Jones and Jones). The ramp is for it to be
      deployed and trusted.
    sources:
      - title: Jayatunga et al. 2024, How successful are AI-discovered drugs in clinical trials?
        url: https://www.htworld.co.uk/news/ai/ai-discovered-drugs-achieved-higher-success-rate-than-those-by-humans-study/
      - title: BIO, Clinical Development Success Rates 2011 to 2020
        url: https://go.bio.org/rs/490-EHZ-999/images/ClinicalDevelopmentSuccessRates2011_2020.pdf
      - title: Aghion, Jones and Jones, Artificial Intelligence and Economic Growth (NBER w23928)
        url: https://www.nber.org/system/files/working_papers/w23928/w23928.pdf

  - id: superintelligence
    name: Superintelligence
    from: artificial-superintelligence
    speedup: { software: 100, ai-research: 250, design: 50, experiments: 5, trials: 2, building: 3, adoption: 1.3, proof: 200 }
    ramp: 3
    note: >-
      Pure speculation beyond the AI 2027 figure of 250 times for AI research
      with a superintelligent AI researcher. Physical experiments still take
      as long as they take, trials need people to live through them, and
      building needs materials and energy, so these stay far slower than
      thought.
    sources:
      - title: AI Futures Project, AI 2027 takeoff forecast
        url: https://ai-2027.com/research/takeoff-forecast

  - id: ai-proving
    name: AI proving theorems
    from: ai-resolves-open-conjecture
    speedup: { proof: 3 }
    ramp: 1
    note: >-
      On the Erdős problems database, 224 problems moved to solved in the
      year from September 2025, against 111 from the start of 2024 to
      August 2025, about three times the pace, though some were old
      solutions found in the literature. Formalizing went faster still:
      Fermat's Last Theorem took AI agents 11 days against a five-year
      plan, and the classification of finite simple groups 24 days. A
      proof can be checked by computer in minutes, with no experiment to
      wait for, which is why mathematics moved first; what doesn't speed
      up is people accepting it. Three times for finding proofs is my
      judgment.
    sources:
      - title: erdosproblems community database, statistics history
        url: https://github.com/teorth/erdosproblems
      - title: Quanta Magazine, Why the legendary Erdős problems are falling to AI (August 2026)
        url: https://www.quantamagazine.org/why-the-legendary-erdos-problems-are-falling-to-ai-20260803/
      - title: Anthropic, Formalizing Fermat's Last Theorem (September 2026)
        url: https://www.anthropic.com/research/formalizing-fermats-last-theorem

  - id: verified-code
    name: Verified software
    from: verified-software-mainstream
    speedup: { software: 1.2, trials: 1.15 }
    ramp: 4
    only: { tracks: [aviation, land-transport, software, computers] }
    note: >-
      When proofs of correctness are cheap, safety-critical software can be
      certified from the proof instead of long test campaigns. Both figures
      are my judgment; there is no measurement yet.

  # Not only AI: some future technologies speed up others in their field.
  - id: biomarker-trials
    name: Shorter aging trials
    from: aging-biomarker-endpoint
    speedup: { trials: 2 }
    ramp: 2
    only: { tracks: [longevity] }
    note: >-
      Once regulators accept a biomarker of aging as a trial endpoint, a
      trial can show benefit in a few years instead of waiting for disease
      or death, as surrogate endpoints have done for other conditions under
      the FDA's accelerated approval. Twice as fast is my judgment.
    sources:
      - title: FDA, Accelerated Approval Program
        url: https://www.fda.gov/drugs/nda-and-bla-approvals/accelerated-approval-program

  - id: cheap-launch
    name: Cheap launch
    from: launch-1000-dollars-kg
    speedup: { experiments: 1.5, building: 1.5 }
    ramp: 3
    only: { tracks: [space, astronomy] }
    note: >-
      When getting to orbit costs a few hundred dollars a kilogram rather
      than thousands, space hardware can be flown, tested and replaced more
      often, and built heavier and simpler. A half again as fast is my
      judgment.

  - id: cheap-energy
    name: Abundant clean power
    from: fusion-power
    speedup: { building: 1.5, experiments: 1.2 }
    ramp: 8
    only: { tracks: [carbon, industrial-chemistry, storage-fuels, earth-climate, deep-learning, space, nuclear-energy] }
    note: >-
      Electricity is a large share of the cost of capturing carbon from the
      air, making hydrogen and synthetic fuels, desalinating water and
      running data centers. Plentiful firm power that is cheap to build
      lets these scale faster; fusion plants take years to build in
      numbers, hence the long ramp. A half again as fast is my judgment.

