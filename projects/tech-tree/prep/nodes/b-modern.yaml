      note: The V-2 reached space in 1944 and was fired at London and Antwerp.
  effort:
    span: [1936, 1945]
    people: 6000
    note: Peenemunde had about 5,000 staff by 1942, plus tens of thousands of forced laborers at the Mittelwerk; at least 10,000 prisoners died building V-2s, more than were killed by them. The site alone cost about 300 million Reichsmarks.
  sources:
    - title: V-2 rocket (Wikipedia)
      url: https://en.wikipedia.org/wiki/V-2_rocket
    - title: Robert H. Goddard (Wikipedia)
      url: https://en.wikipedia.org/wiki/Robert_H._Goddard

- id: panama-canal
  name: Panama Canal
  kind: infrastructure
  fields: [engineering, society]
  date: 1914
  status: achieved
  tier: 3
  summary: >-
    A lock canal across the Isthmus of Panama cut thousands of miles from sea routes between
    the Atlantic and Pacific, built after a failed French attempt and a campaign against mosquitoes.
  requires: [dynamite, railway, electric-motor]
  helped_by: [germ-theory, portland-cement]
  efforts:
    - who: Ferdinand de Lesseps (Compagnie universelle)
      where: Panama
      when: 1881
      outcome: abandoned
      note: A sea-level design failed in 1889 amid disease and bankruptcy; about 22,000 workers died.
    - who: US government, chief engineers John Stevens and George Goethals; William Gorgas on sanitation
      where: Panama
      when: 1914
      outcome: achieved
      note: Opened 15 August 1914.
  effort:
    span: [1904, 1914]
    people: 43000
    cost_usd: 1.2e10
    note: Peak workforce about 43,400 in 1913; 5,609 recorded deaths in the US era. The US spent about 375 million dollars (including 40 million for French assets), roughly 12 billion 2025 dollars.
  sources:
    - title: Panama Canal (Wikipedia)
      url: https://en.wikipedia.org/wiki/Panama_Canal
    - title: History of the Panama Canal (Wikipedia)
      url: https://en.wikipedia.org/wiki/History_of_the_Panama_Canal

# ---------------------------------------------------------------- modern physics

- id: cathode-ray-tube
  name: Cathode-ray tube
  kind: device
  fields: [physics, electronics]
  date: 1875
  status: achieved
  tier: 3
  summary: >-
    Glass tubes pumped to low pressure, with a high voltage across them, glowed with rays from
    the negative electrode; they revealed X-rays and the electron and later became TV screens.
  requires: [vacuum-pump, electromagnetic-induction, glassmaking]
  efforts:
    - who: Heinrich Geissler, Julius Plucker
      where: Bonn, Germany
      when: 1857
      outcome: achieved
      note: Geissler's mercury pump and discharge tubes; Plucker saw cathode rays in 1858.
    - who: William Crookes
      where: London
      when: 1875
      outcome: achieved
      note: Higher-vacuum Crookes tubes.
    - who: Karl Ferdinand Braun
      where: Strasbourg
      when: 1897
      outcome: achieved
      note: The CRT with a fluorescent screen, the basis of the oscilloscope and television.
  sources:
    - title: Crookes tube (Wikipedia)
      url: https://en.wikipedia.org/wiki/Crookes_tube
    - title: Cathode-ray tube (Wikipedia)
      url: https://en.wikipedia.org/wiki/Cathode-ray_tube

- id: x-rays
  name: X-rays
  kind: discovery
  fields: [physics, medicine]
  date: 1895
  status: achieved
  tier: 2
  summary: >-
    Röntgen found penetrating rays from a discharge tube that imaged bones through flesh; within
    months they were used in medicine, and later revealed crystal and molecular structure.
  requires: [cathode-ray-tube]
  helped_by: [photography]
  efforts:
    - who: Wilhelm Rontgen
      where: Wurzburg, Germany
      when: 1895
      outcome: achieved
      note: Discovered 8 November 1895; first Nobel Prize in Physics, 1901.
    - who: Max von Laue; William Henry and Lawrence Bragg
      where: Munich, England
      when: 1912
      outcome: achieved
      note: X-ray diffraction by crystals.
  sources:
    - title: Nobel Prize in Physics 1901
      url: https://www.nobelprize.org/prizes/physics/1901/summary/
    - title: X-ray (Wikipedia)
      url: https://en.wikipedia.org/wiki/X-ray

- id: radioactivity
  name: Radioactivity
  kind: discovery
  fields: [physics, chemistry]
  date: 1896
  status: achieved
  tier: 2
  summary: >-
    Some elements emit energetic radiation as their atoms transmute, which showed atoms are not
    eternal and held vast stores of energy.
  requires: [photography]
  helped_by: [x-rays, electric-battery]
  uses: [res-uranium]
  efforts:
    - who: Henri Becquerel
      where: Paris
      when: 1896
      outcome: achieved
      note: Uranium salts fogged photographic plates in the dark.
    - who: Marie and Pierre Curie
      where: Paris
      when: 1898
      outcome: achieved
      note: Polonium and radium, refined from tonnes of pitchblende. Nobel Prizes 1903 and 1911.
    - who: Ernest Rutherford, Frederick Soddy
      where: Montreal
      when: 1902
      outcome: achieved
      note: Radioactive decay as transmutation; alpha and beta rays.
  sources:
    - title: Nobel Prize in Physics 1903
      url: https://www.nobelprize.org/prizes/physics/1903/summary/
    - title: Radioactive decay (Wikipedia)
      url: https://en.wikipedia.org/wiki/Radioactive_decay

- id: electron
  name: Discovery of the electron
  kind: discovery
  fields: [physics, electronics]
  date: 1897
  status: achieved
  tier: 2
  summary: >-
    J. J. Thomson showed cathode rays are streams of tiny charged particles found in all
    atoms, the first subatomic particle and the carrier of current in every circuit.
  requires: [cathode-ray-tube, maxwell-equations]
  efforts:
    - who: J. J. Thomson
      where: Cavendish Laboratory, Cambridge
      when: 1897
      outcome: achieved
      note: Measured the charge-to-mass ratio. Nobel Prize 1906.
    - who: Emil Wiechert; Walter Kaufmann
      where: Germany
      when: 1897
      outcome: independent
      note: Similar measurements the same year.
  sources:
    - title: Nobel Prize in Physics 1906
      url: https://www.nobelprize.org/prizes/physics/1906/summary/
    - title: Electron (Wikipedia)
      url: https://en.wikipedia.org/wiki/Electron

- id: quantum-hypothesis
  name: Quantum hypothesis
  kind: discovery
  fields: [physics]
  date: 1900
  status: achieved
  tier: 2
  summary: >-
    Planck explained the spectrum of hot bodies by assuming energy comes in discrete quanta, and
    Einstein used light quanta (photons) to explain the photoelectric effect.
  requires: [statistical-mechanics, maxwell-equations, spectroscopy]
  efforts:
    - who: Max Planck
      where: Berlin
      when: 1900
      outcome: achieved
      note: Presented 14 December 1900. Nobel Prize 1918.
    - who: Albert Einstein
      where: Bern
      when: 1905
      outcome: achieved
      note: Light quanta and the photoelectric effect; Nobel Prize 1921.
  sources:
    - title: Nobel Prize in Physics 1918
      url: https://www.nobelprize.org/prizes/physics/1918/summary/
    - title: Old quantum theory (Wikipedia)
      url: https://en.wikipedia.org/wiki/Old_quantum_theory

- id: relativity
  name: Theory of relativity
  kind: discovery
  fields: [physics]
  date: [1905, 1915]
  status: achieved
  tier: 1
  summary: >-
    Space and time are relative to the observer and mass is a form of energy (special
    relativity), and gravity is the curvature of spacetime (general relativity).
  requires: [maxwell-equations, newtonian-mechanics, non-euclidean-geometry]
  efforts:
    - who: Albert Einstein
      where: Bern and Berlin
      when: 1905
      outcome: achieved
      note: Special relativity and E = mc squared in 1905; general relativity in November 1915.
    - who: Hendrik Lorentz, Henri Poincare
      where: Netherlands, France
      when: 1904
      outcome: rival
      note: Much of the mathematics of special relativity, without its reinterpretation of time.
    - who: David Hilbert
      where: Gottingen
      when: 1915
      outcome: independent
      note: Derived the field equations from a variational principle at nearly the same time.
    - who: Arthur Eddington, Frank Dyson
      where: Principe and Brazil
      when: 1919
      outcome: achieved
      note: The eclipse expedition measured light bending by the Sun.
  effort:
    span: [1907, 1915]
    people: 3
    note: About eight years from the equivalence principle to the field equations, with Marcel Grossmann teaching Einstein Riemannian geometry.
  sources:
    - title: History of special relativity (Wikipedia)
      url: https://en.wikipedia.org/wiki/History_of_special_relativity
    - title: History of general relativity (Wikipedia)
      url: https://en.wikipedia.org/wiki/History_of_general_relativity

- id: atomic-nucleus
  name: Atomic nucleus
  kind: discovery
  fields: [physics]
  date: 1911
  status: achieved
  tier: 2
  summary: >-
    Alpha particles bouncing back from gold foil showed that an atom's mass and positive charge sit
    in a tiny nucleus; Bohr then put the electrons in quantized orbits around it.
  requires: [radioactivity, electron]
  efforts:
    - who: Ernest Rutherford, with Hans Geiger and Ernest Marsden
      where: Manchester
      when: 1911
      outcome: achieved
      note: Gold foil experiment 1909, interpretation 1911. Rutherford split nitrogen with alphas in 1917.
    - who: Niels Bohr
      where: Manchester and Copenhagen
      when: 1913
      outcome: achieved
      note: The Bohr model explained hydrogen's spectral lines.
  sources:
    - title: Rutherford model (Wikipedia)
      url: https://en.wikipedia.org/wiki/Rutherford_model
    - title: Bohr model (Wikipedia)
      url: https://en.wikipedia.org/wiki/Bohr_model

- id: superconductivity
  name: Superconductivity
  kind: discovery
  fields: [physics, materials]
  date: 1911
  status: achieved
  tier: 3
  summary: >-
    Mercury cooled in liquid helium lost all electrical resistance; it took until 1957 for BCS
    theory to explain why.
  requires: [refrigeration]
  uses: [res-helium]
  efforts:
    - who: Heike Kamerlingh Onnes
      where: Leiden
      when: 1911
      outcome: achieved
      note: Nobel Prize 1913. Walther Meissner and Robert Ochsenfeld found the expulsion of magnetic fields in 1933.
  sources:
    - title: Nobel Prize in Physics 1913
      url: https://www.nobelprize.org/prizes/physics/1913/summary/
    - title: Superconductivity (Wikipedia)
      url: https://en.wikipedia.org/wiki/Superconductivity

- id: quantum-mechanics
  name: Quantum mechanics
  kind: discovery
  fields: [physics, chemistry]
  date: [1925, 1927]
  status: achieved
  tier: 1
  summary: >-
    A complete theory of atoms and light in which matter behaves as waves of probability;
    it explains chemical bonds, solids and semiconductors.
  requires: [quantum-hypothesis, atomic-nucleus, calculus]
  helped_by: [fourier-analysis, scientific-societies]
  efforts:
    - who: Werner Heisenberg, Max Born, Pascual Jordan
      where: Gottingen
      when: 1925
      outcome: achieved
      note: Matrix mechanics.
    - who: Louis de Broglie; Erwin Schrodinger
      where: Paris, Zurich
      when: 1926
      outcome: achieved
      note: Matter waves (1924) and the wave equation (1926).
    - who: Paul Dirac
      where: Cambridge
      when: 1928
      outcome: achieved
      note: Unified formulation and the relativistic electron equation.
  effort:
    span: [1924, 1928]
    people: 30
    note: A few dozen physicists in a handful of centers (Gottingen, Copenhagen, Munich, Zurich, Cambridge) built it in about four years.
  sources:
    - title: History of quantum mechanics (Wikipedia)
      url: https://en.wikipedia.org/wiki/History_of_quantum_mechanics
    - title: Nobel Prize in Physics 1932
      url: https://www.nobelprize.org/prizes/physics/1932/summary/

- id: semiconductor-physics
  name: Band theory of semiconductors
  kind: discovery
  fields: [physics, electronics, materials]
  date: 1931
  status: achieved
  tier: 3
  summary: >-
    Quantum mechanics applied to crystals explained why some solids conduct, some insulate and
    some sit in between, the theory behind crystal radio detectors and later the transistor.
  requires: [quantum-mechanics, radio]
  efforts:
    - who: Jagadish Chandra Bose; Greenleaf Pickard
      where: India, USA
      when: 1906
      outcome: achieved
      note: Crystal detectors for radio (Bose's patent 1904, Pickard's silicon cat's whisker 1906), used without understanding.
    - who: Felix Bloch
      where: Leipzig
      when: 1928
      outcome: achieved
      note: Electron waves in a periodic lattice.
    - who: Alan Herries Wilson
      where: Cambridge and Leipzig
      when: 1931
      outcome: achieved
      note: Band theory of semiconductors. Schottky and Mott explained metal-semiconductor junctions in 1938 to 1939.
  sources:
    - title: Electronic band structure (Wikipedia)
      url: https://en.wikipedia.org/wiki/Electronic_band_structure
    - title: Crystal detector (Wikipedia)
      url: https://en.wikipedia.org/wiki/Crystal_detector

- id: cyclotron
  name: Particle accelerators and the cyclotron
  kind: device
  fields: [physics, electronics]
  date: 1931
  status: achieved
  tier: 3
  summary: >-
    Machines that accelerate charged particles to high energies to smash nuclei; the cyclotron
    spirals them in a magnet and became the workhorse of nuclear physics and isotope production.
  requires: [atomic-nucleus, vacuum-tube, vacuum-pump, electromagnetism]
  efforts:
    - who: Ernest Lawrence, M. Stanley Livingston
      where: Berkeley, USA
      when: 1931
      outcome: achieved
      note: Patented 1932. Nobel Prize 1939.
    - who: John Cockcroft, Ernest Walton
      where: Cavendish Laboratory
      when: 1932
      outcome: achieved
      note: First nucleus split by artificially accelerated protons. Nobel Prize 1951.
  sources:
    - title: Cyclotron (Wikipedia)
      url: https://en.wikipedia.org/wiki/Cyclotron
    - title: Nobel Prize in Physics 1939
      url: https://www.nobelprize.org/prizes/physics/1939/summary/

- id: neutron
  name: Neutron
  kind: discovery
  fields: [physics]
  date: 1932
  status: achieved
  tier: 3
  summary: >-
    An uncharged particle in the nucleus; because it is not repelled by nuclei it is the ideal
    probe and trigger for nuclear reactions.
  requires: [atomic-nucleus, radioactivity]
  efforts:
    - who: James Chadwick
      where: Cavendish Laboratory, Cambridge
      when: 1932
      outcome: achieved
      note: Nobel Prize 1935.
    - who: Irene and Frederic Joliot-Curie; Walther Bothe
      where: Paris, Germany
      when: 1931
      outcome: rival
      note: Saw the radiation first but misread it as gamma rays.
    - who: Enrico Fermi
      where: Rome
      when: 1934
      outcome: achieved
      note: Bombarded elements with slow neutrons, unknowingly splitting uranium.
  sources:
    - title: Nobel Prize in Physics 1935
      url: https://www.nobelprize.org/prizes/physics/1935/summary/
    - title: Discovery of the neutron (Wikipedia)
      url: https://en.wikipedia.org/wiki/Discovery_of_the_neutron

- id: nuclear-fission
  name: Nuclear fission
  kind: discovery
  fields: [physics, energy]
  date: 1938
  status: achieved
  tier: 1
  summary: >-
    A uranium nucleus struck by a neutron splits in two, releasing about 200 million electron
    volts and more neutrons, which made a chain reaction possible.
  requires: [neutron, radioactivity]
  helped_by: [relativity, quantum-mechanics, cyclotron]
  uses: [res-uranium]
  efforts:
    - who: Otto Hahn, Fritz Strassmann
      where: Berlin
      when: 1938
      outcome: achieved
      note: Found barium in irradiated uranium in December 1938. Hahn alone got the 1944 Nobel Prize.
    - who: Lise Meitner, Otto Frisch
      where: Sweden and Copenhagen
      when: 1939
      outcome: achieved
      note: Explained and named fission (Nature, February 1939). Meitner had fled Nazi Germany.
    - who: Leo Szilard
      where: London
      when: 1933
      outcome: achieved
      note: Conceived the neutron chain reaction and patented it in 1934.
  sources:
    - title: Discovery of nuclear fission (Wikipedia)
      url: https://en.wikipedia.org/wiki/Discovery_of_nuclear_fission
    - title: Nobel Prize in Chemistry 1944
      url: https://www.nobelprize.org/prizes/chemistry/1944/summary/

- id: nuclear-reactor
  name: Nuclear reactor (controlled chain reaction)
  kind: device
  fields: [physics, energy]
  date: 1942
  status: achieved
  tier: 2
  summary: >-
    Chicago Pile-1, a stack of graphite and uranium, sustained the first controlled nuclear chain
    reaction; production reactors at Hanford then bred plutonium.
  requires: [nuclear-fission]
  helped_by: [big-science]
  uses: [res-uranium]
  efforts:
    - who: Enrico Fermi, Leo Szilard and the Metallurgical Laboratory
      where: University of Chicago, USA
      when: 1942
      outcome: achieved
      note: Went critical on 2 December 1942.
    - who: DuPont, Hanford B Reactor
      where: Washington, USA
      when: 1944
      outcome: achieved
      note: First large-scale production reactor, critical in September 1944.
    - who: German Uranverein (Heisenberg)
      where: Germany
      when: 1945
      outcome: abandoned
      note: The Haigerloch pile never reached criticality.
  effort:
    span: [1939, 1942]
    people: 50
    note: CP-1 used about 350 tonnes of graphite, 36 tonnes of uranium oxide and 5.6 tonnes of uranium metal; about 49 people were present at criticality.
  sources:
    - title: Chicago Pile-1 (Wikipedia)
      url: https://en.wikipedia.org/wiki/Chicago_Pile-1
    - title: B Reactor (Wikipedia)
      url: https://en.wikipedia.org/wiki/B_Reactor

- id: nuclear-weapon
  name: Nuclear weapon (Manhattan Project)
  kind: device
  fields: [physics, energy, society]
  date: 1945
  status: achieved
  tier: 1
  summary: >-
    The first fission bombs, from enriched uranium and reactor-made plutonium, were tested at
    Trinity and used on Hiroshima and Nagasaki, a scale of science and industry without precedent.
  requires: [nuclear-fission, nuclear-reactor, cyclotron, big-science]
  helped_by: [quantum-mechanics, refrigeration, power-grid]
  uses: [res-uranium]
  efforts:
    - who: Manhattan Project (Leslie Groves, J. Robert Oppenheimer)
      where: USA, with Britain and Canada
      when: 1945
      outcome: achieved
      note: Trinity test 16 July 1945; Hiroshima 6 August and Nagasaki 9 August 1945. Uranium was enriched at Oak Ridge by calutrons and gaseous diffusion, plutonium bred at Hanford.
    - who: Otto Frisch, Rudolf Peierls; MAUD Committee (Tube Alloys)
      where: Britain
      when: 1941
      outcome: achieved
      note: The Frisch-Peierls memorandum (March 1940) showed a bomb needed kilograms, not tonnes; the MAUD report (1941) spurred the US effort.
    - who: German Uranverein
      where: Germany
      when: 1939
      outcome: abandoned
    - who: Soviet project (Igor Kurchatov)
      where: USSR
      when: 1949
      outcome: rival
      note: Tested its first bomb in August 1949, aided by espionage.
  effort:
    span: [1942, 1946]
    people: 130000
    cost_usd: 3.5e10
    note: Nearly 2 billion dollars in 1940s money, roughly 28 to 36 billion 2025 dollars depending on the deflator; about 130,000 people at peak across some 30 sites. Most of the cost was the enrichment and plutonium plants at Oak Ridge and Hanford.
  sources:
    - title: Manhattan Project (Wikipedia)
      url: https://en.wikipedia.org/wiki/Manhattan_Project
    - title: The Manhattan Project (US Department of Energy, Office of History)
      url: https://www.osti.gov/opennet/manhattan-project-history/
