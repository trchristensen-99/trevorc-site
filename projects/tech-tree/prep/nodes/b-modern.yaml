- id: longitude-chronometer
  name: Marine chronometer
  kind: device
  fields: [engineering, physics]
  date: 1761
  status: achieved
  tier: 3
  summary: >-
    A clock accurate enough at sea to carry home-port time let navigators find longitude, a
    problem Britain had offered a large prize to solve.
  requires: [mechanical-clock]
  helped_by: [transoceanic-voyages, newtonian-mechanics]
  competes: []
  efforts:
