# Part B: 1450 to 1945. Physical sciences, mathematics, energy, industry,
# transport, materials, chemistry, communications, nuclear physics and the
# institutions of the period.

# ---------------------------------------------------------------- print, method, institutions of science

- id: printing-press
  name: Movable-type printing press
  kind: device
  fields: [society, engineering]
  date: 1450
  status: achieved
  tier: 1
  summary: >-
    Gutenberg combined cast metal type, oil-based ink and a screw press, making books cheap
    enough that knowledge could be copied exactly and spread across Europe within decades.
  requires: [paper, alphabet]
  helped_by: [coinage]
  uses: [res-tin]
  efforts:
    - who: Johannes Gutenberg, financed by Johann Fust
      where: Mainz, Germany
      when: 1450
      outcome: achieved
      note: The 42-line Bible was finished around 1454 to 1455. The hand mold for casting type drew on goldsmiths' punch-cutting.
    - who: Bi Sheng
      where: China
      when: 1040
      outcome: independent
      note: Ceramic movable type, described by Shen Kuo. It did not displace woodblock printing.
    - who: Printers of the Jikji
      where: Goryeo, Korea
      when: 1377
      outcome: independent
      note: The oldest surviving book printed with movable metal type.
  effort:
    span: [1440, 1455]
    people: 10
    note: Gutenberg borrowed at least 1,600 guilders from Fust and lost the workshop to him in a lawsuit in 1455.
  sources:
    - title: Printing press (Wikipedia)
      url: https://en.wikipedia.org/wiki/Printing_press
    - title: Johannes Gutenberg (Wikipedia)
      url: https://en.wikipedia.org/wiki/Johannes_Gutenberg

- id: scientific-method
  name: Experimental scientific method
  kind: institution
  fields: [society, physics]
  date: 1620
  status: achieved
  tier: 1
  summary: >-
    The practice of testing claims about nature with controlled experiment, measurement and
    mathematics, rather than deferring to ancient authority, took shape with Galileo and Bacon.
  requires: [printing-press, universities]
  helped_by: [heliocentrism, telescope]
  efforts:
    - who: Francis Bacon
      where: England
      when: 1620
      outcome: achieved
      note: Novum Organum argued for systematic induction from experiment.
    - who: Galileo Galilei
      where: Italy
      when: 1610
      outcome: achieved
      note: Combined experiment, instruments and mathematical description.
    - who: Ibn al-Haytham
      where: Cairo
      when: 1021
      outcome: independent
      note: His Book of Optics used controlled experiments centuries earlier.
  sources:
    - title: Scientific method (Wikipedia)
      url: https://en.wikipedia.org/wiki/Scientific_method
    - title: Novum Organum (Wikipedia)
      url: https://en.wikipedia.org/wiki/Novum_Organum

- id: scientific-societies
  name: Scientific societies and journals
  kind: institution
  fields: [society, physics]
  date: 1660
  status: achieved
  tier: 2
  summary: >-
    Standing bodies such as the Royal Society and the Paris Academy, and the first scientific
    journals in 1665, gave natural philosophers a shared venue to report, replicate and argue.
  requires: [scientific-method, printing-press]
  efforts:
    - who: Accademia dei Lincei
      where: Rome
      when: 1603
      outcome: achieved
      note: An early society; Galileo was a member.
    - who: Royal Society of London
      where: England
      when: 1660
      outcome: achieved
      note: Chartered 1662. Philosophical Transactions began in March 1665.
    - who: Academie des sciences
      where: Paris
      when: 1666
      outcome: achieved
      note: State-funded; the Journal des scavans also began in 1665.
  sources:
    - title: Royal Society (Wikipedia)
      url: https://en.wikipedia.org/wiki/Royal_Society
    - title: Philosophical Transactions of the Royal Society (Wikipedia)
      url: https://en.wikipedia.org/wiki/Philosophical_Transactions_of_the_Royal_Society

- id: peer-review
  name: Peer review
  kind: institution
  fields: [society]
  date: 1731
  status: achieved
  tier: 2
  summary: >-
    Having other experts judge a paper before publication began with 18th-century society
    journals and became the standard gate for scientific publishing in the 20th century.
  requires: [scientific-societies]
  efforts:
    - who: Royal Society of Edinburgh, Medical Essays and Observations
      where: Scotland
      when: 1731
      outcome: achieved
      note: Submissions were sent to members judged knowledgeable on the topic.
    - who: Royal Society Committee on Papers
      where: London
      when: 1752
      outcome: achieved
      note: Written referee reports followed in the 1830s. Universal external review only became normal after 1945.
  sources:
    - title: Scholarly peer review (Wikipedia)
      url: https://en.wikipedia.org/wiki/Scholarly_peer_review
    - title: "Csiszar, Peer review: Troubled from the start (Nature, 2016)"
      url: https://www.nature.com/articles/532306a

- id: industrial-research-lab
  name: Industrial research laboratory
  kind: institution
  fields: [society, chemistry]
  date: 1876
  status: achieved
  tier: 2
  summary: >-
    Firms began paying teams of scientists to invent on purpose, starting with Edison's Menlo
    Park and the German dye companies, then GE, DuPont and Bell Labs.
  requires: [scientific-method, patents]
  helped_by: [synthetic-dyes, universities]
  efforts:
    - who: Thomas Edison
      where: Menlo Park, New Jersey, USA
      when: 1876
      outcome: achieved
      note: An "invention factory" with machinists, chemists and glassblowers.
    - who: BASF, Bayer, Hoechst
      where: Germany
      when: 1877
      outcome: independent
      note: Dye firms built in-house research labs staffed by university chemists in the 1870s and 1880s.
    - who: General Electric Research Laboratory
      where: Schenectady, New York, USA
      when: 1900
      outcome: achieved
      note: Followed by DuPont (1903) and Bell Telephone Laboratories (1925).
  sources:
    - title: Thomas Edison (Wikipedia)
      url: https://en.wikipedia.org/wiki/Thomas_Edison
    - title: Research and development (Wikipedia)
      url: https://en.wikipedia.org/wiki/Research_and_development

- id: big-science
  name: State-funded big science
  kind: institution
  fields: [society, physics]
  date: 1941
  status: achieved
  tier: 3
  summary: >-
    In the Second World War governments organized science as a national project, contracting
    universities and firms through bodies like the US Office of Scientific Research and Development.
  requires: [industrial-research-lab, universities]
  helped_by: [cyclotron]
  efforts:
    - who: Vannevar Bush, NDRC (1940) and OSRD (1941)
      where: USA
      when: 1941
      outcome: achieved
      note: Funded radar, the proximity fuze, penicillin production and the early atomic program. Bush's 1945 report Science, the Endless Frontier led to the NSF.
    - who: Ernest Lawrence's Radiation Laboratory
      where: Berkeley, USA
      when: 1931
      outcome: achieved
      note: A prewar model of large team physics built around big machines.
  sources:
    - title: Office of Scientific Research and Development (Wikipedia)
      url: https://en.wikipedia.org/wiki/Office_of_Scientific_Research_and_Development
    - title: Big science (Wikipedia)
      url: https://en.wikipedia.org/wiki/Big_science

# ---------------------------------------------------------------- economic institutions

- id: patents
  name: Patent system
  kind: institution
  fields: [society]
  date: 1474
  status: achieved
  tier: 2
  summary: >-
    A legal right to exclusive use of an invention for a fixed term, in exchange for disclosing
    it, first codified in Venice and later in England's Statute of Monopolies and the US Constitution.
  requires: [law-codes]
  helped_by: [printing-press]
  efforts:
    - who: Venetian Senate
      where: Venice
      when: 1474
      outcome: achieved
      note: The Venetian Patent Statute granted 10-year privileges for new devices.
    - who: English Parliament
      where: England
      when: 1624
      outcome: achieved
      note: The Statute of Monopolies limited patents to true inventions for 14 years.
    - who: US Congress
      where: USA
      when: 1790
      outcome: achieved
      note: The Patent Act of 1790.
  sources:
    - title: History of patent law (Wikipedia)
      url: https://en.wikipedia.org/wiki/History_of_patent_law

- id: joint-stock-company
  name: Joint-stock company
  kind: institution
  fields: [society]
  date: 1553
  status: achieved
  tier: 1
  summary: >-
    Pooling capital from many investors into transferable shares of one permanent enterprise let
    merchants fund long, risky ventures like ocean trade that no single family could afford.
  requires: [double-entry-bookkeeping, coinage]
  helped_by: [transoceanic-voyages, printing-press]
  efforts:
    - who: Muscovy Company
      where: London
      when: 1553
      outcome: achieved
      note: Chartered 1555. An early English joint-stock trading company.
    - who: English East India Company
      where: London
      when: 1600
      outcome: achieved
    - who: Dutch East India Company (VOC)
      where: Amsterdam
      when: 1602
      outcome: achieved
      note: First company with permanent capital and freely traded shares.
  sources:
    - title: Joint-stock company (Wikipedia)
      url: https://en.wikipedia.org/wiki/Joint-stock_company
    - title: Dutch East India Company (Britannica)
      url: https://www.britannica.com/money/Dutch-East-India-Company

- id: stock-exchange
  name: Stock exchange
  kind: institution
  fields: [society]
  date: 1602
  status: achieved
  tier: 2
  summary: >-
    A standing market where shares of companies could be bought and sold at any time, which made
    long-lived company capital liquid for individual investors.
  requires: [joint-stock-company]
  efforts:
    - who: Amsterdam Stock Exchange
      where: Amsterdam
      when: 1602
      outcome: achieved
      note: Trading in VOC shares; a dedicated exchange building opened in 1611.
    - who: London coffee houses, later the London Stock Exchange
      where: London
      when: 1698
      outcome: achieved
      note: Formally organized in 1801.
  sources:
    - title: Amsterdam Stock Exchange (Wikipedia)
      url: https://en.wikipedia.org/wiki/Amsterdam_Stock_Exchange

- id: central-banking
  name: Central bank
  kind: institution
  fields: [society]
  date: 1668
  status: achieved
  tier: 2
  summary: >-
    A bank chartered by the state to manage government debt, issue currency and act as lender of
    last resort, beginning with Sweden's Riksbank and the Bank of England.
  requires: [coinage, double-entry-bookkeeping]
  helped_by: [joint-stock-company]
  efforts:
    - who: Sveriges Riksbank
      where: Stockholm
      when: 1668
      outcome: achieved
      note: Successor to Stockholms Banco, which issued Europe's first banknotes in 1661.
    - who: Bank of England
      where: London
      when: 1694
      outcome: achieved
      note: Founded as a joint-stock company to lend to the government. Bagehot's Lombard Street (1873) set out the lender-of-last-resort role.
    - who: US Federal Reserve
      where: USA
      when: 1913
      outcome: achieved
  sources:
    - title: Central bank (Wikipedia)
      url: https://en.wikipedia.org/wiki/Central_bank
    - title: Sveriges Riksbank (Wikipedia)
      url: https://en.wikipedia.org/wiki/Sveriges_Riksbank

- id: insurance-modern
  name: Modern insurance
  kind: institution
  fields: [society, math]
  date: 1762
  status: achieved
  tier: 3
  summary: >-
    Insurance priced from data and probability, so that premiums match measured risk, grew from
    marine underwriting at Lloyd's and fire offices to actuarial life insurance.
  requires: [probability-theory, statistics]
  helped_by: [joint-stock-company]
  efforts:
    - who: Nicholas Barbon's Fire Office
      where: London
      when: 1680
      outcome: achieved
      note: Set up after the Great Fire of 1666.
    - who: Edward Lloyd's coffee house
      where: London
      when: 1688
      outcome: achieved
      note: Center of marine underwriting, later Lloyd's of London.
    - who: Equitable Life Assurance Society
      where: London
      when: 1762
      outcome: achieved
      note: First mutual life insurer to set premiums by age from mortality tables.
  sources:
    - title: History of insurance (Wikipedia)
      url: https://en.wikipedia.org/wiki/History_of_insurance
    - title: Equitable Life Assurance Society (Wikipedia)
      url: https://en.wikipedia.org/wiki/Equitable_Life_Assurance_Society

- id: factory-system
  name: Factory system
  kind: institution
  fields: [society, engineering]
  date: 1771
  status: achieved
  tier: 2
  summary: >-
    Gathering workers and powered machines under one roof, with set hours and division of labor,
    replaced home spinning and weaving and became the template for industrial production.
  requires: [water-frame, watermill]
  helped_by: [spinning-jenny, joint-stock-company]
  efforts:
    - who: John and Thomas Lombe
      where: Derby, England
      when: 1721
      outcome: achieved
      note: A water-powered silk mill, an early precursor.
    - who: Richard Arkwright
      where: Cromford, England
      when: 1771
      outcome: achieved
      note: Cromford Mill ran water frames around the clock in shifts and became the model copied across Britain and America.
  sources:
    - title: Factory system (Wikipedia)
      url: https://en.wikipedia.org/wiki/Factory_system
    - title: Cromford Mill (Wikipedia)
      url: https://en.wikipedia.org/wiki/Cromford_Mill

# ---------------------------------------------------------------- mathematics

- id: analytic-geometry
  name: Analytic geometry
  kind: discovery
  fields: [math]
  date: 1637
  status: achieved
  tier: 3
  summary: >-
    Describing curves with algebraic equations in coordinates joined geometry and algebra, and
    gave calculus its working language.
  requires: [algebra, geometry]
  helped_by: [printing-press]
  efforts:
    - who: Rene Descartes
      where: Netherlands
      when: 1637
      outcome: achieved
      note: La Geometrie, an appendix to the Discourse on Method.
    - who: Pierre de Fermat
      where: France
      when: 1636
      outcome: independent
      note: Circulated in manuscript, published after his death.
  sources:
    - title: Analytic geometry (Wikipedia)
      url: https://en.wikipedia.org/wiki/Analytic_geometry

- id: calculus
  name: Calculus
  kind: discovery
  fields: [math, physics]
  date: 1666
  status: achieved
  tier: 1
  summary: >-
    The mathematics of rates of change and accumulation, which let physics state laws as
    equations of motion and solve them.
  requires: [analytic-geometry]
  efforts:
    - who: Isaac Newton
      where: England
      when: 1666
      outcome: achieved
      note: Developed fluxions in 1665 to 1666; published much later.
    - who: Gottfried Wilhelm Leibniz
      where: Germany
      when: 1675
      outcome: independent
      note: Published first, in 1684, with the notation still used today. A bitter priority dispute followed.
    - who: Kerala school (Madhava)
      where: India
      when: 1400
      outcome: independent
      note: Infinite series for trigonometric functions, without a general calculus.
  effort:
    span: [1664, 1666]
    people: 2
    note: Two people, each working largely alone, on the shoulders of Fermat, Barrow and Wallis.
  sources:
    - title: History of calculus (Wikipedia)
      url: https://en.wikipedia.org/wiki/History_of_calculus
    - title: Leibniz-Newton calculus controversy (Wikipedia)
      url: https://en.wikipedia.org/wiki/Leibniz%E2%80%93Newton_calculus_controversy

- id: probability-theory
  name: Probability theory
  kind: discovery
  fields: [math]
  date: 1654
  status: achieved
  tier: 2
  summary: >-
    A mathematics of chance, begun in letters about gambling problems, that became the basis of
    insurance, statistics, statistical physics and information theory.
  requires: [algebra]
  helped_by: [printing-press]
  efforts:
    - who: Blaise Pascal, Pierre de Fermat
      where: France
      when: 1654
      outcome: achieved
      note: Correspondence solving the problem of points.
    - who: Gerolamo Cardano
      where: Italy
      when: 1564
      outcome: independent
      note: Liber de ludo aleae, written about 1564, published 1663.
    - who: Christiaan Huygens
      where: Netherlands
      when: 1657
      outcome: achieved
      note: First printed treatise. Jacob Bernoulli's Ars Conjectandi (1713) proved the law of large numbers.
  sources:
    - title: History of probability (Wikipedia)
      url: https://en.wikipedia.org/wiki/History_of_probability

- id: statistics
  name: Statistics
  kind: technique
  fields: [math, society]
  date: 1662
  status: achieved
  tier: 2
  summary: >-
    Drawing conclusions from counts and measurements, from Graunt's mortality tables through
    least squares and the normal curve to Fisher's significance tests and experimental design.
  requires: [place-value-zero]
  helped_by: [probability-theory, printing-press]
  efforts:
    - who: John Graunt
      where: London
      when: 1662
      outcome: achieved
      note: Natural and Political Observations on the Bills of Mortality. Edmond Halley's life table followed in 1693.
    - who: Adrien-Marie Legendre, Carl Friedrich Gauss
      where: France, Germany
      when: 1805
      outcome: achieved
      note: Least squares (Legendre 1805, Gauss 1809) and the normal error curve.
    - who: Karl Pearson, Ronald Fisher
      where: England
      when: 1925
      outcome: achieved
      note: Correlation and chi-squared (1900); Fisher's Statistical Methods for Research Workers (1925) and randomized experimental design.
  sources:
    - title: History of statistics (Wikipedia)
      url: https://en.wikipedia.org/wiki/History_of_statistics
    - title: John Graunt (Wikipedia)
      url: https://en.wikipedia.org/wiki/John_Graunt

- id: fourier-analysis
  name: Fourier analysis
  kind: discovery
  fields: [math, physics]
  date: 1807
  status: achieved
  tier: 3
  summary: >-
    Any periodic signal can be written as a sum of sine waves. Fourier found it while studying
    heat flow, and it became basic to acoustics, radio, quantum mechanics and signal processing.
  requires: [calculus]
  efforts:
    - who: Joseph Fourier
      where: France
      when: 1807
      outcome: achieved
      note: Memoir on heat in 1807; Theorie analytique de la chaleur in 1822.
  sources:
    - title: Fourier series (Wikipedia)
      url: https://en.wikipedia.org/wiki/Fourier_series

- id: non-euclidean-geometry
  name: Non-Euclidean and Riemannian geometry
  kind: discovery
  fields: [math]
  date: 1829
  status: achieved
  tier: 3
  summary: >-
    Consistent geometries in which Euclid's parallel postulate fails, generalized by Riemann to
    curved spaces of any dimension, later the language of general relativity.
  requires: [geometry, calculus]
  efforts:
    - who: Nikolai Lobachevsky
      where: Russia
      when: 1829
      outcome: achieved
    - who: Janos Bolyai
      where: Hungary
      when: 1832
      outcome: independent
    - who: Carl Friedrich Gauss
      where: Germany
      when: 1824
      outcome: independent
      note: Worked it out but did not publish.
    - who: Bernhard Riemann
      where: Germany
      when: 1854
      outcome: achieved
      note: Habilitation lecture on the foundations of geometry. Ricci and Levi-Civita's tensor calculus (1900) made it usable.
  sources:
    - title: Non-Euclidean geometry (Wikipedia)
      url: https://en.wikipedia.org/wiki/Non-Euclidean_geometry
    - title: Riemannian geometry (Wikipedia)
      url: https://en.wikipedia.org/wiki/Riemannian_geometry

- id: boolean-logic
  name: Boolean logic
  kind: discovery
  fields: [math, computing]
  date: 1847
  status: achieved
  tier: 2
  summary: >-
    George Boole showed that logical reasoning could be done as algebra on true and false values,
    the mathematics that every digital circuit now implements.
  requires: [algebra]
  efforts:
    - who: George Boole
      where: England and Ireland
      when: 1847
      outcome: achieved
      note: The Mathematical Analysis of Logic (1847) and The Laws of Thought (1854).
    - who: Augustus De Morgan
      where: England
      when: 1847
      outcome: independent
      note: Formal Logic, same year; De Morgan's laws.
  sources:
    - title: Boolean algebra (Wikipedia)
      url: https://en.wikipedia.org/wiki/Boolean_algebra
    - title: George Boole (Stanford Encyclopedia of Philosophy)
      url: https://plato.stanford.edu/entries/boole/

- id: mathematical-logic
  name: Formal mathematical logic
  kind: discovery
  fields: [math, computing]
  date: 1879
  status: achieved
  tier: 3
  summary: >-
    A precise symbolic language for quantifiers and proofs, built to put all of mathematics on
    logical foundations, which raised the question of what can be proved or computed.
  requires: [boolean-logic]
  efforts:
    - who: Gottlob Frege
      where: Jena, Germany
      when: 1879
      outcome: achieved
      note: Begriffsschrift, the first full predicate logic.
    - who: Giuseppe Peano
      where: Italy
      when: 1889
      outcome: achieved
      note: Axioms for arithmetic.
    - who: Bertrand Russell, Alfred North Whitehead
      where: England
      when: 1910
      outcome: achieved
      note: Principia Mathematica, 1910 to 1913. David Hilbert's program of the 1920s sought a complete and decidable foundation.
  sources:
    - title: Begriffsschrift (Wikipedia)
      url: https://en.wikipedia.org/wiki/Begriffsschrift
    - title: Mathematical logic (Wikipedia)
      url: https://en.wikipedia.org/wiki/Mathematical_logic

- id: computability-theory
  name: Computability theory
  kind: discovery
  fields: [computing, math]
  date: 1936
  status: achieved
  tier: 2
  summary: >-
    Turing and Church defined precisely what an algorithm is and proved some problems can never
    be solved by one; Turing's universal machine is the abstract model of the stored-program computer.
  requires: [mathematical-logic]
  efforts:
    - who: Kurt Godel
      where: Vienna
      when: 1931
      outcome: achieved
      note: Incompleteness theorems showed Hilbert's complete foundation was impossible.
    - who: Alan Turing
      where: Cambridge, England
      when: 1936
      outcome: achieved
      note: On Computable Numbers, with an Application to the Entscheidungsproblem.
    - who: Alonzo Church
      where: Princeton, USA
      when: 1936
      outcome: independent
      note: Lambda calculus; Emil Post's similar model appeared the same year.
  sources:
    - title: Turing machine (Wikipedia)
      url: https://en.wikipedia.org/wiki/Turing_machine
    - title: Church-Turing thesis (Stanford Encyclopedia of Philosophy)
      url: https://plato.stanford.edu/entries/church-turing/

- id: switching-circuit-theory
  name: Switching circuit theory
  kind: discovery
  fields: [computing, electronics]
  date: 1937
  status: achieved
  tier: 3
  summary: >-
    Claude Shannon showed that networks of relays and switches compute Boolean algebra, so logic
    could be designed on paper and built in hardware.
  requires: [boolean-logic, relay]
  helped_by: [telephone]
  efforts:
    - who: Claude Shannon
      where: MIT, USA
      when: 1937
      outcome: achieved
      note: Master's thesis A Symbolic Analysis of Relay and Switching Circuits, published 1938.
    - who: Akira Nakashima
      where: NEC, Japan
      when: 1935
      outcome: independent
    - who: Victor Shestakov
      where: Moscow
      when: 1935
      outcome: independent
      note: Proposed in 1935, published 1941.
  sources:
    - title: A Symbolic Analysis of Relay and Switching Circuits (Wikipedia)
      url: https://en.wikipedia.org/wiki/A_Symbolic_Analysis_of_Relay_and_Switching_Circuits
    - title: Switching circuit theory (Wikipedia)
      url: https://en.wikipedia.org/wiki/Switching_circuit_theory

- id: information-theory
  name: Information theory
  kind: discovery
  fields: [computing, math, electronics]
  date: 1948
  status: achieved
  tier: 2
  summary: >-
    Shannon defined information in bits and proved how much can be sent through a noisy channel,
    setting the limits for all later communication, compression and coding.
  requires: [probability-theory, fourier-analysis, telephone]
  helped_by: [statistical-mechanics, switching-circuit-theory, radar]
  efforts:
    - who: Claude Shannon (Bell Labs)
      where: USA
      when: 1948
      outcome: achieved
      note: A Mathematical Theory of Communication.
    - who: Harry Nyquist, Ralph Hartley (Bell Labs)
      where: USA
      when: 1928
      outcome: achieved
      note: Earlier results on telegraph speed and a logarithmic measure of information.
    - who: Vladimir Kotelnikov
      where: USSR
      when: 1933
      outcome: independent
      note: The sampling theorem.
    - who: Norbert Wiener
      where: MIT, USA
      when: 1948
      outcome: independent
      note: A related statistical theory of communication in Cybernetics.
  sources:
    - title: A Mathematical Theory of Communication (Wikipedia)
      url: https://en.wikipedia.org/wiki/A_Mathematical_Theory_of_Communication
    - title: Information theory (Wikipedia)
      url: https://en.wikipedia.org/wiki/Information_theory

# ---------------------------------------------------------------- pre-electronic computing

- id: jacquard-loom
  name: Jacquard loom
  kind: device
  fields: [computing, engineering]
  date: 1804
  status: achieved
  tier: 3
  summary: >-
    A loom controlled by chains of punched cards, so a pattern became a stored program; the cards
    inspired Babbage's engine and Hollerith's tabulators.
  helped_by: [factory-system]
  efforts:
    - who: Joseph Marie Jacquard
      where: Lyon, France
      when: 1804
      outcome: achieved
    - who: Basile Bouchon, Jean-Baptiste Falcon, Jacques de Vaucanson
      where: France
      when: 1725
      outcome: achieved
      note: Punched paper and card loom controls from 1725 to 1745.
  sources:
    - title: Jacquard machine (Wikipedia)
      url: https://en.wikipedia.org/wiki/Jacquard_machine

- id: analytical-engine
  name: Difference and Analytical Engines
  kind: device
  fields: [computing]
  date: 1837
  status: achieved
  tier: 3
  summary: >-
    Charles Babbage designed a steam-age mechanical computer with memory, a processing unit and
    card input; Ada Lovelace wrote programs for it, but it was never built.
  requires: [jacquard-loom, machine-tools]
  efforts:
    - who: Charles Babbage
      where: London
      when: 1822
      outcome: abandoned
      note: Difference Engine No. 1, funded by the British government, abandoned in 1842.
    - who: Charles Babbage, Ada Lovelace
      where: London
      when: 1837
      outcome: abandoned
      note: Analytical Engine design; Lovelace's 1843 notes include the first published program.
    - who: Pascal, Leibniz
      where: France, Germany
      when: 1642
      outcome: achieved
      note: Mechanical calculators (Pascaline 1642, stepped reckoner 1673).
  effort:
    span: [1822, 1842]
    people: 10
    cost_usd: 3e6
    note: The government spent about 17,000 pounds on the Difference Engine before abandoning it; the 2025-dollar figure is a rough conversion.
  sources:
    - title: Analytical engine (Wikipedia)
      url: https://en.wikipedia.org/wiki/Analytical_engine
    - title: The Engines (Computer History Museum)
      url: https://www.computerhistory.org/babbage/engines/

- id: tabulating-machine
