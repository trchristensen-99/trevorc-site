# ---------------------------------------------------------------- electricity and magnetism

- id: leyden-jar
  name: Leyden jar
  kind: device
  fields: [physics, electronics]
  date: 1745
  status: achieved
  tier: 3
  summary: >-
    A glass jar lined with metal foil stored static electric charge, the first capacitor, and
    let experimenters study electricity with strong sparks; Franklin used it to show lightning is electric.
  requires: [glassmaking]
  helped_by: [scientific-societies]
  efforts:
    - who: Ewald Georg von Kleist
      where: Pomerania
      when: 1745
      outcome: achieved
    - who: Pieter van Musschenbroek
      where: Leiden, Netherlands
      when: 1746
      outcome: independent
    - who: Otto von Guericke, Francis Hauksbee
      where: Germany, England
      when: 1663
      outcome: achieved
      note: Friction machines that generated the charge.
  sources:
    - title: Leyden jar (Wikipedia)
      url: https://en.wikipedia.org/wiki/Leyden_jar

- id: electric-battery
  name: Electric battery (voltaic pile)
  kind: device
  fields: [physics, chemistry, electronics]
  date: 1800
  status: achieved
  tier: 2
  summary: >-
    Stacked zinc and copper discs in brine gave the first steady electric current, enabling
    electrochemistry (Davy isolated sodium and potassium in 1807) and electromagnetism.
  requires: [leyden-jar]
  uses: [res-copper, res-zinc]
  efforts:
    - who: Alessandro Volta
      where: Pavia, Italy
      when: 1800
      outcome: achieved
      note: Built to refute Luigi Galvani's animal electricity (1791).
    - who: William Nicholson, Anthony Carlisle
      where: London
      when: 1800
      outcome: achieved
      note: Electrolysis of water weeks after Volta's report.
    - who: Humphry Davy
      where: London
      when: 1807
      outcome: achieved
      note: Isolated potassium, sodium and later several other elements by electrolysis.
  sources:
    - title: Voltaic pile (Wikipedia)
      url: https://en.wikipedia.org/wiki/Voltaic_pile

- id: electromagnetism
  name: Electromagnetism
  kind: discovery
  fields: [physics, electronics]
  date: 1820
  status: achieved
  tier: 2
  summary: >-
    An electric current deflects a compass needle; electricity and magnetism are linked, and a
    coil of wire around iron makes a strong controllable electromagnet.
  requires: [electric-battery, compass]
  efforts:
    - who: Hans Christian Orsted
      where: Copenhagen
      when: 1820
      outcome: achieved
    - who: Andre-Marie Ampere
      where: Paris
      when: 1820
      outcome: achieved
      note: Mathematical law of forces between currents, weeks after Orsted.
    - who: William Sturgeon, Joseph Henry
      where: England, USA
      when: 1824
      outcome: achieved
      note: The electromagnet (Sturgeon 1824); Henry's much stronger insulated-coil magnets around 1830.
  sources:
    - title: Hans Christian Orsted (Wikipedia)
      url: https://en.wikipedia.org/wiki/Hans_Christian_%C3%98rsted
    - title: Electromagnet (Wikipedia)
      url: https://en.wikipedia.org/wiki/Electromagnet

- id: electric-motor
  name: Electric motor
  kind: device
  fields: [electronics, engineering]
  date: 1834
  status: achieved
  tier: 3
  summary: >-
    Electromagnetic forces turned into continuous rotation; practical motors arrived when the
    dynamo could supply cheap current, and they later freed factories from line shafts.
  requires: [electromagnetism]
  efforts:
    - who: Michael Faraday
      where: London
      when: 1821
      outcome: achieved
      note: Electromagnetic rotation demonstration.
    - who: Moritz von Jacobi
      where: Konigsberg and St. Petersburg
      when: 1834
      outcome: achieved
      note: First useful rotating motor; powered a boat on the Neva in 1839.
    - who: Thomas Davenport
      where: Vermont, USA
      when: 1837
      outcome: independent
      note: First US motor patent.
  sources:
    - title: Electric motor (Wikipedia)
      url: https://en.wikipedia.org/wiki/Electric_motor

- id: electromagnetic-induction
  name: Electromagnetic induction
  kind: discovery
  fields: [physics, electronics]
  date: 1831
  status: achieved
  tier: 1
  summary: >-
    A changing magnetic field produces an electric current, the principle behind every
    generator, transformer and induction coil.
  requires: [electromagnetism, electric-battery]
  efforts:
    - who: Michael Faraday
      where: Royal Institution, London
      when: 1831
      outcome: achieved
      note: The induction ring experiment of 29 August 1831.
    - who: Joseph Henry
      where: Albany, USA
      when: 1832
      outcome: independent
      note: Found it independently and also discovered self-induction.
  sources:
    - title: Electromagnetic induction (Wikipedia)
      url: https://en.wikipedia.org/wiki/Electromagnetic_induction
    - title: Faraday's law of induction (Britannica)
      url: https://www.britannica.com/science/Faradays-law-of-induction

- id: electric-generator
  name: Dynamo (electric generator)
  kind: device
  fields: [energy, electronics]
  date: 1866
  status: achieved
  tier: 2
  summary: >-
    Machines that turn mechanical rotation into current; the self-exciting dynamo made
    electricity cheap and plentiful enough for lighting, electroplating and industry.
  requires: [electromagnetic-induction]
  helped_by: [steam-engine]
  efforts:
    - who: Hippolyte Pixii
      where: Paris
      when: 1832
      outcome: achieved
      note: Hand-cranked magneto generator.
    - who: Werner von Siemens; Charles Wheatstone; Samuel Varley
      where: Berlin and London
      when: 1866
      outcome: independent
      note: Self-excited dynamos announced almost simultaneously in 1866 to 1867. Anyos Jedlik had the idea earlier.
    - who: Zenobe Gramme
      where: Paris
      when: 1871
      outcome: achieved
      note: The ring-armature dynamo, the first commercially successful design.
  sources:
    - title: Electric generator (Wikipedia)
      url: https://en.wikipedia.org/wiki/Electric_generator
    - title: Dynamo (Wikipedia)
      url: https://en.wikipedia.org/wiki/Dynamo

- id: maxwell-equations
  name: Maxwell's equations
  kind: discovery
  fields: [physics, electronics]
  date: 1865
  status: achieved
  tier: 1
  summary: >-
    Maxwell unified electricity, magnetism and light into one field theory and predicted
    electromagnetic waves traveling at the speed of light.
  requires: [electromagnetic-induction, calculus]
  helped_by: [newtonian-mechanics]
  efforts:
    - who: James Clerk Maxwell
      where: London and Glenlair, Scotland
      when: 1865
      outcome: achieved
      note: A Dynamical Theory of the Electromagnetic Field (1865); Treatise on Electricity and Magnetism (1873).
    - who: Oliver Heaviside
      where: England
      when: 1884
      outcome: achieved
      note: Recast Maxwell's 20 equations into the four vector equations used today.
  effort:
    span: [1855, 1873]
    people: 1
    note: Built on Faraday's field lines, worked out over about 18 years.
  sources:
    - title: "A Dynamical Theory of the Electromagnetic Field (Wikipedia)"
      url: https://en.wikipedia.org/wiki/A_Dynamical_Theory_of_the_Electromagnetic_Field
    - title: Maxwell's equations (Wikipedia)
      url: https://en.wikipedia.org/wiki/Maxwell%27s_equations

- id: electromagnetic-waves
  name: Radio waves (Hertz)
  kind: discovery
  fields: [physics, electronics]
  date: 1887
  status: achieved
  tier: 2
  summary: >-
    Heinrich Hertz generated and detected electromagnetic waves with spark gaps, confirming
