  efforts:
    - who: Heinrich Hertz
      where: Karlsruhe, Germany
      when: 1887
      outcome: achieved
    - who: Oliver Lodge
      where: Liverpool
      when: 1888
      outcome: independent
      note: Detected waves along wires about the same time.
  sources:
    - title: Heinrich Hertz (Wikipedia)
      url: https://en.wikipedia.org/wiki/Heinrich_Hertz

