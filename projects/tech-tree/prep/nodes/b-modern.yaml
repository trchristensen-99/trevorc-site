# ---------------------------------------------------------------- astronomy and mechanics

- id: heliocentrism
  name: Heliocentric model
  kind: discovery
  fields: [physics]
  date: 1543
  status: achieved
  tier: 1
  summary: >-
    Copernicus put the Sun at the center with Earth as one moving planet, which Kepler and
    Galileo later confirmed and which opened the road to Newton.
  requires: [astronomy-ancient, geometry]
  helped_by: [printing-press]
  efforts:
    - who: Nicolaus Copernicus
      where: Poland
      when: 1543
      outcome: achieved
      note: De revolutionibus orbium coelestium.
    - who: Aristarchus of Samos
      where: Greece
      when: -270
      outcome: independent
      note: Proposed a Sun-centered cosmos that did not catch on.
  effort:
    span: [1510, 1543]
    people: 1
    note: About three decades of one astronomer's work.
  sources:
    - title: Copernican heliocentrism (Wikipedia)
      url: https://en.wikipedia.org/wiki/Copernican_heliocentrism

- id: telescope
  name: Telescope
  kind: device
  fields: [physics]
  date: 1608
  status: achieved
  tier: 2
  summary: >-
    Two lenses in a tube magnified distant objects; turned to the sky, it showed Jupiter's moons
    and the phases of Venus, evidence for a Sun-centered system.
  requires: [lenses, glassmaking]
  efforts:
    - who: Hans Lipperhey
      where: Middelburg, Netherlands
      when: 1608
      outcome: achieved
      note: First patent application; Jacob Metius and Zacharias Janssen made rival claims.
    - who: Galileo Galilei
      where: Padua, Italy
      when: 1609
      outcome: achieved
      note: Improved it to about 20x and published Sidereus Nuncius in 1610.
    - who: Isaac Newton
      where: England
      when: 1668
      outcome: achieved
      note: The reflecting telescope.
  sources:
    - title: History of the telescope (Wikipedia)
      url: https://en.wikipedia.org/wiki/History_of_the_telescope

- id: keplers-laws
  name: Kepler's laws of planetary motion
  kind: discovery
  fields: [physics]
  date: 1609
  status: achieved
  tier: 3
  summary: >-
    Planets move in ellipses, sweep equal areas in equal times, and have periods tied to orbit
    size; Kepler fit these to Tycho Brahe's naked-eye data.
  requires: [heliocentrism, geometry]
  efforts:
    - who: Johannes Kepler, using Tycho Brahe's observations
      where: Prague
      when: 1609
      outcome: achieved
      note: Astronomia nova (1609) gave the first two laws; Harmonices Mundi (1619) the third.
  effort:
    span: [1601, 1609]
    people: 1
    note: About eight years of hand calculation on the orbit of Mars, from data Tycho's observatory gathered over some 20 years.
  sources:
    - title: Kepler's laws of planetary motion (Wikipedia)
      url: https://en.wikipedia.org/wiki/Kepler%27s_laws_of_planetary_motion

- id: galilean-kinematics
  name: Galilean kinematics
  kind: discovery
  fields: [physics]
  date: 1638
  status: achieved
  tier: 3
  summary: >-
    Galileo measured falling and rolling bodies and found uniform acceleration, parabolic
    trajectories and the principle of inertia.
  requires: [scientific-method, geometry]
  efforts:
    - who: Galileo Galilei
      where: Italy
      when: 1638
      outcome: achieved
      note: Two New Sciences, written under house arrest and printed in Leiden.
  sources:
    - title: Two New Sciences (Wikipedia)
      url: https://en.wikipedia.org/wiki/Two_New_Sciences

- id: vacuum-pump
  name: Vacuum pump
  kind: device
  fields: [physics, engineering]
  date: 1650
  status: achieved
  tier: 3
  summary: >-
    Pumps that removed air from a vessel showed that the atmosphere has weight and pressure, an
    idea behind the steam engine, and later made light bulbs and vacuum tubes possible.
  requires: [scientific-method]
  helped_by: [glassmaking]
  efforts:
    - who: Evangelista Torricelli
      where: Florence
      when: 1643
      outcome: achieved
      note: The mercury barometer showed air pressure and made a vacuum.
    - who: Otto von Guericke
      where: Magdeburg, Germany
      when: 1650
      outcome: achieved
      note: First air pump; Magdeburg hemispheres demonstration in 1654.
    - who: Robert Boyle, Robert Hooke
      where: Oxford
      when: 1659
      outcome: achieved
      note: An improved pump and Boyle's law (1662). Sprengel's mercury pump (1865) later gave the hard vacuum for light bulbs.
  sources:
    - title: Vacuum pump (Wikipedia)
      url: https://en.wikipedia.org/wiki/Vacuum_pump
    - title: Otto von Guericke (Britannica)
      url: https://www.britannica.com/biography/Otto-von-Guericke

- id: newtonian-mechanics
  name: Newtonian mechanics and gravitation
  kind: discovery
  fields: [physics]
  date: 1687
  status: achieved
  tier: 1
  summary: >-
    Three laws of motion and universal gravitation explained both falling apples and planetary
    orbits with one set of equations, the model for all later physics.
  requires: [calculus, keplers-laws, galilean-kinematics]
  helped_by: [scientific-societies, telescope]
  efforts:
    - who: Isaac Newton
      where: Cambridge, England
      when: 1687
      outcome: achieved
      note: Philosophiae Naturalis Principia Mathematica, published with Edmond Halley's funding.
    - who: Robert Hooke
      where: London
      when: 1679
      outcome: rival
      note: Suggested an inverse-square law of attraction to Newton but could not derive orbits.
  sources:
    - title: Philosophiae Naturalis Principia Mathematica (Wikipedia)
      url: https://en.wikipedia.org/wiki/Philosophi%C3%A6_Naturalis_Principia_Mathematica

- id: aerodynamics
  name: Aerodynamics of the fixed wing
  kind: discovery
  fields: [engineering, physics]
  date: 1804
  status: achieved
  tier: 3
  summary: >-
    George Cayley separated lift from thrust and flew fixed-wing gliders; Lilienthal's
    measured glider flights and wind tunnel data then showed how to build and control wings.
  requires: [newtonian-mechanics]
  efforts:
    - who: George Cayley
      where: England
      when: 1804
      outcome: achieved
      note: Model glider in 1804, a crewed glider in 1853.
    - who: Otto Lilienthal
      where: Germany
      when: 1891
      outcome: achieved
      note: About 2,000 glider flights before his fatal crash in 1896.
    - who: Francis Wenham
      where: England
      when: 1871
      outcome: achieved
      note: First wind tunnel.
  sources:
    - title: George Cayley (Wikipedia)
      url: https://en.wikipedia.org/wiki/George_Cayley
    - title: Otto Lilienthal (Wikipedia)
      url: https://en.wikipedia.org/wiki/Otto_Lilienthal

# ---------------------------------------------------------------- navigation

- id: transoceanic-voyages
  name: Transoceanic navigation
  kind: technique
  fields: [engineering, society]
  date: 1492
  status: achieved
  tier: 2
  summary: >-
