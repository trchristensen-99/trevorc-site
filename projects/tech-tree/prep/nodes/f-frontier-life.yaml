- id: engineered-microbe-manufacturing
  name: Engineered microbes as chemical factories
  kind: technique
  fields: [biology, chemistry]
  track: synthetic-biology
  date: 2013
  status: achieved
  tier: 3
  summary: >-
    Yeast and bacteria given whole new metabolic pathways to make drugs and
    chemicals: semi-synthetic artemisinin at industrial scale (2013), opiate
    precursors from sugar (2015). Biology can make the molecule; beating the
    incumbent on cost is harder, and Sanofi stopped artemisinin production
    by 2015.
  requires: [recombinant-dna]
  helped_by: [crispr-cas9]
  efforts:
    - who: Jay Keasling (UC Berkeley), Amyris and Sanofi
      where: USA, Italy
      when: [2003, 2015]
      outcome: achieved
      note: Production began in 2013, targeting 35 tonnes a year; none was made in 2015 as plant-derived prices fell.
    - who: Christina Smolke (Stanford; Antheia)
      where: USA
      when: [2015, 2024]
      outcome: achieved
      note: A yeast pathway of more than 20 enzymes (2015); Antheia's first commercial thebaine delivery from 116,000 liter fermentations in 2024.
  sources:
    - title: "Paddon et al., Nature 496:528 (2013)"
      url: https://doi.org/10.1038/nature12051
    - title: "Galanie et al., Science 349:1095 (2015)"
      url: https://doi.org/10.1126/science.aac9373
    - title: "Antheia: first commercial delivery of thebaine (2024)"
      url: https://prnewswire.com/news-releases/antheia-marks-corporate-milestone-with-first-commercial-delivery-of-thebaine-302289197.html

- id: minimal-cell
  name: Minimal synthetic cell
  kind: technique
  fields: [biology]
  track: synthetic-biology
  date: 2016
  status: achieved
  tier: 3
  summary: >-
    JCVI-syn3.0, a bacterium running on a designed genome cut to 473 genes,
    fewer than any free-living organism; the job of about a third of them is
    still unknown. Its successor syn3A (2019) restored normal division.
  requires: [synthetic-bacterial-genome]
  efforts:
    - who: Clyde Hutchison, John Glass, Craig Venter and colleagues (J. Craig Venter Institute)
      where: USA
      when: 2016
      outcome: achieved
  sources:
    - title: "Hutchison et al., Science 351 (2016)"
      url: https://doi.org/10.1126/science.aad6253
    - title: "Breuer et al., eLife 8:e36842 (2019)"
      url: https://elifesciences.org/articles/36842

- id: recoded-genome
  name: Recoded genomes
  kind: technique
  fields: [biology, chemistry]
  track: synthetic-biology
  date: 2019
  status: achieved
  tier: 3
  summary: >-
    E. coli with its 4-megabase genome rewritten to use fewer codons: 61
    instead of 64 (2019), then 57 (2025), freeing codons to encode
    non-natural amino acids and, in principle, making cells resistant to
    viruses.
  requires: [synthetic-bacterial-genome]
  efforts:
    - who: Julius Fredens, Jason Chin and colleagues (MRC Laboratory of Molecular Biology)
      where: Cambridge, UK
      when: [2019, 2025]
      outcome: achieved
      note: Syn57 made over 101,000 codon changes across the genome.
  sources:
    - title: "Fredens et al., Nature 569:514 (2019)"
      url: https://doi.org/10.1038/s41586-019-1192-5
    - title: "Robertson et al., Science 390 (2025)"
      url: https://doi.org/10.1126/science.ady4368

- id: synthetic-yeast-genome
  name: Synthetic yeast genome (Sc2.0)
  kind: technique
  fields: [biology, chemistry]
  track: synthetic-biology
  date: [2014, 2025]
  status: achieved
  tier: 3
  summary: >-
    All 16 chromosomes of baker's yeast, about 12 megabases, redesigned and
    built from synthetic DNA by an international consortium, the first
    synthetic genome of a cell with a nucleus. The last chromosome was
    finished in January 2025; combining them all in one strain was still
    under way.
  requires: [synthetic-bacterial-genome]
  efforts:
    - who: Sc2.0 consortium (Jef Boeke, NYU, with groups in China, the UK, Australia, Singapore and the USA)
      where: International
      when: [2006, 2025]
      outcome: achieved
      note: A strain carrying 6.5 synthetic chromosomes was reported in 2023.
  sources:
    - title: "Zhao et al., Cell 186:5220 (2023)"
      url: https://doi.org/10.1016/j.cell.2023.09.025
    - title: "Lab Online: final chromosome completed in the synthetic yeast genome (2025)"
      url: https://www.labonline.com.au/content/life-scientist/news/scientists-complete-final-chromosome-in-synthetic-yeast-genome-628368406

- id: synthetic-human-chromosome
  name: A synthetic human chromosome
  kind: technique
  fields: [biology, chemistry]
  track: synthetic-biology
  date: { window: [2030, 2040], likely: 2034 }
  status: ongoing
  tier: 3
  criterion: >-
    A complete human chromosome (at least 50 megabases, about 2 percent of
    the genome), written from synthetic DNA, replaces its natural
    counterpart in a human cell line, which then grows normally.
  summary: >-
    The proof of concept for writing mammalian genomes, and the target of
    the UK's Synthetic Human Genome project. It is four times the size of
    the whole yeast genome and full of repeated sequence.
  requires: [synthetic-yeast-genome, t2t-complete-genome]
  helped_by: [recoded-genome, long-read-sequencing]
  efforts:
    - who: Synthetic Human Genome Project (SynHG; Jason Chin, Wellcome-funded)
      where: UK
      when: [2025, 2030]
      outcome: ongoing
      note: £10 million over five years from June 2025, with a 5 to 10 year horizon for a synthetic chromosome.
  forecast:
    note: >-
      SynHG's own horizon is 5 to 10 years from 2025, so 2030 to 2035. Yeast
      took 2006 to 2025 for 12 megabases, but assembly has sped up since and
      enzymatic synthesis now delivers 50 kilobase sequence-perfect clones.
      I put 2034.
    sources:
      - title: "Wellcome: new project to pioneer human genome synthesis (2025)"
        url: https://wellcome.org/news/new-project-pioneer-principles-human-genome-synthesis
      - title: "Drug Discovery News: Ansa's 50 kb clonal DNA product (2025)"
        url: https://www.drugdiscoverynews.com/ansa-biotechnologies-redefines-what-s-possible-in-dna-synthesis-with-50-kb-sequence-perfect-clonal-product-16751
  sources:
    - title: "Wellcome: new project to pioneer human genome synthesis (2025)"
      url: https://wellcome.org/news/new-project-pioneer-principles-human-genome-synthesis

# ===========================================================================
# Agriculture and food
# ===========================================================================

- id: precision-fermentation
  name: Precision fermentation of animal proteins
  kind: technique
  fields: [agriculture, biology]
  track: animals-food
  date: [2019, 2026]
  status: ongoing
  tier: 3
  criterion: >-
    A fermentation-made animal protein (dairy whey or casein, egg white) is
    sold at a bulk price at or below the conventional ingredient it
    replaces, at a scale of at least 10,000 tonnes a year.
  summary: >-
    Brewing real milk and egg proteins in microbes rather than taking them
    from animals. Products are on sale (Perfect Day whey since 2020,
    Impossible's soy leghemoglobin since 2019), but volumes are small and
    costs are several times those of the dairy proteins they replace.
  requires: [engineered-microbe-manufacturing]
  efforts:
    - who: Impossible Foods (soy leghemoglobin)
      where: USA
      when: [2018, 2019]
      outcome: achieved
      note: FDA GRAS letter in 2018 and color additive approval in 2019, which opened retail sales.
    - who: Perfect Day (beta-lactoglobulin whey)
      where: USA, India
      when: [2019, 2026]
      outcome: ongoing
      note: Its existing plant is sold out; a joint-venture plant in Gujarat is due to start in late 2026 and ramp up in 2027.
    - who: Remilk; EVERY Company (egg proteins)
      where: Israel, USA
      when: [2025, 2026]
      outcome: ongoing
  forecast:
    note: >-
      Modeled costs are around 50 euros per kilogram at current scale
      against under 15 euros for whey hydrolysate, so parity needs roughly
      another order of magnitude of scale. Plants coming online in 2026 and
      2027 are the next step; I expect parity for the cheapest protein in
      the 2030s.
    sources:
      - title: "AgFunderNews: Perfect Day's Gujarat facility on track for 2026 (December 2025)"
        url: https://agfundernews.com/perfect-day-says-gujarat-facility-on-track-for-2026-start-2027-ramp-up-for-recombinant-whey-protein
  sources:
    - title: "AgFunderNews: Perfect Day's Gujarat facility on track for 2026 (December 2025)"
      url: https://agfundernews.com/perfect-day-says-gujarat-facility-on-track-for-2026-start-2027-ramp-up-for-recombinant-whey-protein
    - title: "The Spoon: Remilk launches recombinant milk in Israel (2025)"
      url: https://thespoon.tech/remilk-launches-recombinant-dmilk-in-through-joint-venture-eyes-us-launch-in-2026/

- id: cultivated-meat-parity
  name: Cultivated meat at price parity
  kind: milestone
  fields: [agriculture, biology]
  track: animals-food
  date: { window: [2038, 2070], likely: 2048 }
  status: speculative
  tier: 2
  criterion: >-
    A product that is at least 51 percent cultivated animal cells sells
    wholesale at or below the price of the conventional meat it replaces
    (about $6 to $10 per kilogram for ground beef), at a production volume
    of at least 10,000 tonnes a year.
  summary: >-
    The point at which growing meat beats raising animals on cost, which is
    what would decide whether it ever matters. Cultivated meat is approved
    in several countries but sells in gram quantities at restaurant prices.
  requires: [cultivated-meat]
  helped_by: [precision-fermentation, engineered-microbe-manufacturing]
  efforts:
    - who: UPSIDE Foods, GOOD Meat, Mosa Meat, Aleph Farms, Vow, Wildtype, Mission Barns
      where: USA, Netherlands, Israel, Australia, Singapore
      when: [2020, 2026]
      outcome: ongoing
      note: Investment fell to $73.9 million in 2025 from a peak near $1 billion in 2021, and about 140 companies remain; Believer Meats shut down in December 2025.
  forecast:
    note: >-
      David Humbird's 2021 techno-economic analysis puts cell mass at $22 to
      $51 per kilogram at large scale and argues about $25 is the floor with
      known bioprocess technology; CE Delft's more optimistic model gives
      $5.66 per kilogram cost of goods by 2030 for a 10,000 tonne plant.
      Industry claims of $10 to $15 per kilogram are disputed. With funding
      down sharply and seven US states banning sales, I put wholesale parity
      at scale around 2048, and give real weight to it never happening.
    sources:
      - title: "Humbird, Scale-up economics for cultured meat, Biotechnology and Bioengineering 118:3239 (2021)"
        url: https://doi.org/10.1002/bit.27848
      - title: "GFI: cultivated meat and seafood state of the industry report"
        url: https://gfi.org/resource/cultivated-meat-and-seafood-state-of-the-industry-report/
  sources:
    - title: "Humbird, Biotechnology and Bioengineering 118:3239 (2021)"
      url: https://doi.org/10.1002/bit.27848

- id: gene-edited-crops
  name: Gene-edited crops
  kind: technique
  fields: [agriculture, biology]
  track: crops
  date: [2019, 2026]
  status: achieved
  tier: 3
  summary: >-
    Crops with small, targeted DNA edits and no foreign genes, which several
    countries now regulate like conventional breeding rather than as GMOs:
    high-oleic soybean (US, 2019), a GABA tomato (Japan, 2021), and crops
    under England's Precision Breeding regulations (in force November 2025)
    and the EU's new genomic techniques regulation (adopted June 2026).
  requires: [crispr-cas9, gm-crops]
  efforts:
    - who: Calyxt (high-oleic soybean oil)
      where: USA
      when: 2019
      outcome: achieved
    - who: Sanatech Seed (GABA tomato)
      where: Japan
      when: 2021
      outcome: achieved
    - who: UK and EU regulators
      where: UK, EU
      when: [2023, 2026]
      outcome: achieved
      note: England's Precision Breeding Act regulations took effect November 13, 2025; Regulation (EU) 2026/1388 was published June 26, 2026.
  sources:
    - title: "The Genetic Technology (Precision Breeding) Regulations 2025 (SI 2025/581)"
      url: https://www.legislation.gov.uk/uksi/2025/581/made
    - title: "European Parliament legislative observatory, new genomic techniques (2023/0226(COD))"
      url: https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2023/0226(COD)

- id: improved-photosynthesis
  name: Engineered photosynthesis in the field
  kind: technique
  fields: [agriculture, biology]
  track: crops
  date: 2022
  status: achieved
  tier: 3
  summary: >-
    Changing how plants handle light and photorespiration to raise yield.
    Speeding a leaf's recovery from sun protection lifted tobacco biomass
    about 15 percent (2016) and soybean seed yield by up to 33 percent in
    field trials (2022). No such crop is grown commercially.
  requires: [gm-crops]
  efforts:
    - who: Johannes Kromdijk, Stephen Long and the RIPE project (Illinois, Gates Foundation funded)
      where: USA, UK
      when: [2016, 2022]
      outcome: achieved
    - who: Amanda De Souza, Stephen Long (RIPE)
      where: USA
      when: 2022
      outcome: achieved
      note: Soybean yield up to 33 percent higher across five transformation events, with unchanged protein and oil.
  sources:
    - title: "Kromdijk et al., Science 354:857 (2016)"
      url: https://doi.org/10.1126/science.aai8878
    - title: "De Souza et al., Science 377:851 (2022)"
      url: https://doi.org/10.1126/science.adc9831

- id: c4-rice
  name: C4 rice
  kind: technique
  fields: [agriculture, biology]
  track: crops
  date: { window: [2038, 2065], likely: 2048 }
  status: ongoing
  tier: 3
  criterion: >-
    A rice variety running a working C4 photosynthetic cycle yields at least
    30 percent more grain per hectare than its parent in multi-season field
    trials, and is approved for farmers to grow.
  summary: >-
    Rewiring rice to use the more efficient photosynthesis of maize and
    sugarcane, which would raise yield by about half and cut water and
    nitrogen needs. It means installing both a new leaf anatomy and a new
    biochemistry, the most ambitious plant engineering project attempted.
  requires: [improved-photosynthesis]
  helped_by: [crispr-cas9, gene-edited-crops]
  efforts:
    - who: C4 Rice Project (IRRI, Oxford, Cambridge; Julian Hibberd, Jane Langdale; Gates Foundation funded)
      where: Philippines, UK
      when: [2008, 2026]
      outcome: ongoing
      note: Five C4 enzymes expressed in rice with labeled carbon showing malate forming (2019), and the bundle sheath made to resemble a C4 plant's; joining anatomy to biochemistry remains undone.
  forecast:
    note: >-
      Eighteen years in, the project has the parts but not a working cycle.
      Project statements have pointed to rice reaching farmers' fields
      around 2039. Plant breeding and regulatory approval add roughly a
      decade after a working prototype, so I put approved field use around
      2048.
    sources:
      - title: "Ermakova et al., On the road to C4 rice, Plant Journal (2019)"
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7065233/
      - title: "University of Cambridge, Department of Plant Sciences: Hibberd, Improving crop yield through enhanced photosynthesis (C4 rice)"
        url: https://www.plantsci.cam.ac.uk/node/34271
  sources:
    - title: "Ermakova et al., On the road to C4 rice, Plant Journal (2019)"
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7065233/

- id: nitrogen-fixing-cereals
  name: Nitrogen-fixing cereals
  kind: technique
  fields: [agriculture, biology]
  track: crops
  date: { window: [2035, 2065], likely: 2045 }
  status: ongoing
  tier: 3
  criterion: >-
    A commercial cereal variety (maize, wheat or rice) that, through its own
    genes or an engineered symbiosis, supplies at least half its nitrogen
    from the air, cutting applied fertilizer by 50 percent or more at equal
    yield in multi-season field trials.
  summary: >-
    Giving grain crops the nitrogen-fixing trick of legumes, which would cut
    the biggest input cost in farming and a large share of farming's
    emissions. Microbial products deliver perhaps a fifth of a maize crop's
    nitrogen today.
  requires: [nitrogen-fertilizer-scale, crispr-cas9]
  routes:
    - name: Engineered microbes
      requires: [engineered-microbe-manufacturing]
      note: Give soil bacteria that already live on roots a working nitrogenase, the approach now sold commercially.
    - name: Engineered plants
      requires: [gene-edited-crops]
      note: >-
        Change the plant itself, by recruiting nitrogen-fixing bacteria with
        root exudates, copying the Sierra Mixe maize mucilage trait, or
        putting nitrogenase into plant organelles.
  efforts:
    - who: Pivot Bio (PROVEN)
      where: USA
      when: [2019, 2026]
      outcome: ongoing
      note: More than 15 million cumulative acres; university studies find up to 35 to 40 pounds of nitrogen per acre, about a fifth of a maize crop's need.
    - who: Alan Bennett, Allen Van Deynze (UC Davis), Sierra Mixe maize
      where: USA, Mexico
      when: 2018
      outcome: achieved
      note: A landrace maize whose aerial-root mucilage hosts nitrogen-fixing bacteria supplying 29 to 82 percent of its nitrogen.
    - who: Guntur Subbarao and colleagues (JIRCAS and CIMMYT), nitrification-inhibiting wheat
      where: Japan, Mexico
      when: 2021
      outcome: achieved
      note: A wild-grass chromosome segment roughly doubled root nitrification inhibition, raising yield and cutting nitrous oxide.
    - who: Eduardo Blumwald (UC Davis)
      where: USA
      when: 2022
      outcome: ongoing
      note: Gene-edited rice exuding more apigenin, which recruits nitrogen-fixing biofilms.
  forecast:
    note: >-
      Microbial products are commercial but cover only about a fifth of a
      crop's nitrogen, and the trend in their performance is slow. Putting
      nitrogenase, which is poisoned by oxygen, into plant organelles has
      been attempted for over a decade without a working cereal. Half of a
      crop's nitrogen from the air, at field scale, looks like the 2040s.
    sources:
      - title: "Van Deynze et al., PLOS Biology 16:e2006352 (2018)"
        url: https://doi.org/10.1371/journal.pbio.2006352
      - title: "Subbarao et al., PNAS 118 (2021)"
        url: https://doi.org/10.1073/pnas.2106595118
      - title: "Pivot Bio: peer-reviewed study of its nitrogen-fixing microbes (2025)"
        url: https://www.biospace.com/press-releases/peer-reviewed-study-validates-pivot-bios-gene-edited-microbes-as-a-third-source-of-nitrogen-delivery
  sources:
    - title: "Van Deynze et al., PLOS Biology 16:e2006352 (2018)"
      url: https://doi.org/10.1371/journal.pbio.2006352
    - title: "Subbarao et al., PNAS 118 (2021)"
      url: https://doi.org/10.1073/pnas.2106595118
