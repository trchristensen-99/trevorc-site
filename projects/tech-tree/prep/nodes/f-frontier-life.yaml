- id: organ-transplantation
  name: Organ transplantation
  kind: technique
  fields: [medicine]
  track: surgery-organs
  date: 1954
  status: achieved
  tier: 2
  summary: >-
    Replacing a failed organ with a donor's. Joseph Murray transplanted a
    kidney between identical twins in 1954, sidestepping rejection; drugs
    that suppress the immune system (azathioprine, then ciclosporin in the
    1980s) made transplants between unrelated people routine.
  requires: [antiseptic-surgery, anesthesia, blood-transfusion]
  efforts:
    - who: Joseph Murray, John Merrill, Hartwell Harrison (Peter Bent Brigham Hospital)
      where: Boston, USA
      when: 1954
      outcome: achieved
      note: Ronald Herrick's kidney given to his twin Richard on December 23, 1954. Murray shared the 1990 Nobel Prize.
  sources:
    - title: "Merrill et al., JAMA 160:277 (1956)"
      url: https://doi.org/10.1001/jama.1956.02960390027008
    - title: "Harvard Medical School: transplant pioneer, Nobel laureate dies at 93"
      url: https://hms.harvard.edu/news/transplant-pioneer-nobel-laureate-dies-age-93

- id: pig-organ-xenotransplant
  name: Gene-edited pig organs in living patients
  kind: technique
  fields: [medicine, biology]
  track: surgery-organs
  date: 2022
  status: achieved
  tier: 3
  summary: >-
    Hearts and kidneys from pigs with ten to 69 gene edits, transplanted into
    living people as compassionate-use cases. The record by 2026 is a pig
    kidney that kept a man off dialysis for 271 days.
  requires: [organ-transplantation, crispr-cas9]
  efforts:
    - who: Bartley Griffith, Muhammad Mohiuddin (University of Maryland), with Revivicor
      where: USA
      when: [2022, 2023]
      outcome: achieved
      note: Pig hearts in David Bennett (2022, about 60 days) and Lawrence Faucette (2023, about six weeks).
    - who: Massachusetts General Hospital with eGenesis; NYU Langone (Robert Montgomery) with United Therapeutics
      where: USA
      when: [2024, 2026]
      outcome: achieved
      note: Rick Slayman (2024); Towana Looney (130 days, 2024 to 2025); Tim Andrews (271 days dialysis-free, then a human kidney in January 2026). Five eGenesis patients by September 2026, none past a year.
    - who: Beicheng Sun (First Affiliated Hospital of Anhui Medical University)
      where: China
      when: 2025
      outcome: achieved
      note: An auxiliary pig liver in a living patient, removed after 38 days.
  sources:
    - title: "Harvard Medical School: pig kidney patient becomes first to progress to a human kidney (2026)"
      url: https://hms.harvard.edu/news/patient-who-received-pig-kidney-becomes-first-progress-human-kidney-transplant
    - title: "eGenesis: clinical update on EGEN-2784 (September 2026)"
      url: https://egenesisbio.com/news-media/press-releases/egenesis-announces-clinical-update-in-ongoing-expanded-access-study-of-egen-2784-in-patients-with-kidney-failure

- id: xenotransplant-approved
  name: Pig kidney transplants approved as treatment
  kind: technique
  fields: [medicine, biology]
  track: surgery-organs
  date: { window: [2030, 2040], likely: 2033 }
  status: ongoing
  tier: 2
  criterion: >-
    A regulator (FDA or equivalent) licenses a gene-edited pig kidney (or
    heart) for patients with organ failure after a clinical trial in which a
    majority of recipients keep a working graft at one year.
  summary: >-
    An unlimited supply of organs grown in pigs, ending the waiting list
    (about 90,000 Americans wait for a kidney). The first formal trials began
    in late 2025.
  requires: [pig-organ-xenotransplant, randomized-controlled-trial]
  efforts:
    - who: United Therapeutics (Revivicor), EXPAND trial of the UKidney
      where: USA
      when: [2025, 2026]
      outcome: ongoing
      note: First trial transplant at NYU Langone in November 2025; a first cohort of six with a 24-week endpoint, designed to support a licensing application. A pig heart trial (EXPRESS) was cleared in May 2026.
    - who: eGenesis, RESTORE trial of EGEN-2784
      where: USA
      when: 2027
      outcome: ongoing
      note: An FDA-cleared trial of 33 patients aged 50 to 70, due to start in early 2027.
  forecast:
    note: >-
      No recipient has yet passed one year with a working pig kidney. Trials
      with 24-week endpoints started in 2025 to 2027; expanding cohorts and a
      licensing review typically take five or more years. A Metaculus
      question on xenotransplantation becoming routine had a community median
      around 2043 (few forecasters). I put the first licensed product around
      2033, and routine use (thousands a year) a decade later.
    sources:
      - title: "United Therapeutics: first transplant in the EXPAND trial (November 2025)"
        url: https://ir.unither.com/~/media/Files/U/United-Therapeutics-IR/documents/press-releases/2025/united-therapeutics-corporation-announces-first-transplant-in-expand-clinical-trial-of-ukidney-in-patients-with-end-stage-renal-disease.pdf
      - title: "eGenesis: clinical update on EGEN-2784 (September 2026)"
        url: https://egenesisbio.com/news-media/press-releases/egenesis-announces-clinical-update-in-ongoing-expanded-access-study-of-egen-2784-in-patients-with-kidney-failure
  sources:
    - title: "eGenesis: clinical update on EGEN-2784 (September 2026)"
      url: https://egenesisbio.com/news-media/press-releases/egenesis-announces-clinical-update-in-ongoing-expanded-access-study-of-egen-2784-in-patients-with-kidney-failure

- id: organoids
  name: Organoids
  kind: technique
  fields: [biology, medicine]
  track: life-science
  date: 2009
  status: achieved
  tier: 3
  summary: >-
    Stem cells grown in a gel organize themselves into miniature, simplified
    organs: gut (2009), brain (2013), kidney, liver and more. They are used
    to model disease and test drugs, and FDA's 2025 plan to phase out
    required animal testing leans on them.
  requires: [cell-culture]
  helped_by: [induced-pluripotent-stem-cells]
  efforts:
    - who: Toshiro Sato, Hans Clevers (Hubrecht Institute)
      where: Netherlands
      when: 2009
      outcome: achieved
      note: A single Lgr5 stem cell built crypt-villus gut structures in a dish.
    - who: Madeline Lancaster, Juergen Knoblich (IMBA)
      where: Austria
      when: 2013
      outcome: achieved
      note: Cerebral organoids.
    - who: Ryuichi Okamoto (Tokyo Medical and Dental University)
      where: Japan
      when: 2022
      outcome: achieved
      note: The first transplant of a patient's own colon organoids into a person with ulcerative colitis.
  sources:
    - title: "Sato et al., Nature 459:262 (2009)"
      url: https://doi.org/10.1038/nature07935
    - title: "Lancaster et al., Nature 501:373 (2013)"
      url: https://doi.org/10.1038/nature12517
    - title: "FDA plan to phase out animal testing requirements (April 2025)"
      url: https://www.fda.gov/news-events/press-announcements/fda-announces-plan-phase-out-animal-testing-requirement-monoclonal-antibodies-and-other-drugs

- id: engineered-tissue-implants
  name: Lab-grown tissue implants
  kind: technique
  fields: [medicine, biology]
  track: surgery-organs
  date: 2006
  status: achieved
  tier: 3
  summary: >-
    Simple engineered tissues, grown from a patient's own cells on a
    scaffold, implanted in people: bladder walls (2006), a bioprinted ear
    (2022), a bioprinted trachea (2023) and cornea (2025). All are thin or
    hollow structures that need little blood supply.
  requires: [cell-culture]
  helped_by: [3d-printing]
  efforts:
    - who: Anthony Atala (Children's Hospital Boston, later Wake Forest)
      where: USA
      when: 2006
      outcome: achieved
      note: Engineered bladder tissue grafted into seven children with spina bifida.
    - who: 3DBio Therapeutics (AuriNovo ear)
      where: USA
      when: 2022
      outcome: achieved
      note: A bioprinted ear made from the patient's own cartilage cells, in a phase 1/2a trial.
    - who: Precise Bio (bioprinted cornea, Rambam Medical Center)
      where: Israel
      when: 2025
      outcome: achieved
  sources:
    - title: "Atala et al., Lancet 367:1241 (2006)"
      url: https://doi.org/10.1016/S0140-6736(06)68438-9
    - title: "Nature news: doctors grow organs from patients' own cells (2006)"
      url: https://www.nature.com/news/2006/060403/full/news060403-3.html

- id: lab-grown-solid-organ
  name: A lab-grown solid organ that keeps a person alive
  kind: technique
  fields: [medicine, biology, engineering]
  track: surgery-organs
  date: { window: [2035, 2060], likely: 2045 }
  status: speculative
  tier: 2
  criterion: >-
    A bioprinted or otherwise lab-grown vascularized solid organ (kidney,
    liver, heart or lung, or a lobe big enough to replace the organ's
    function) is transplanted into a person and sustains that function, with
    no dialysis or other support, for at least a year.
  summary: >-
    Building a whole organ, blood vessels and all, from a patient's own
    cells, so it needs no donor and no immune suppression. Thick tissue
    needs a dense network of vessels, which no one can yet print.
  requires: [engineered-tissue-implants, organoids, induced-pluripotent-stem-cells]
  helped_by: [3d-printing, crispr-cas9]
  competes: [xenotransplant-approved]
  efforts:
    - who: ARPA-H PRINT program (Carnegie Mellon, Wake Forest, Wyss Institute, UC San Diego, UT Southwestern)
      where: USA
      when: [2026, 2031]
      outcome: ongoing
      note: Up to $176.8 million over five years from January 2026 to bioprint livers and kidney tissue; Carnegie Mellon aims to be ready for a first human trial of a liver construct around 2031.
    - who: United Therapeutics (lung scaffolds); Wake Forest Institute for Regenerative Medicine
      where: USA
      when: [2010, 2026]
      outcome: ongoing
  forecast:
    note: >-
      No vascularized solid organ has been built and implanted in a person.
      PRINT's goal is a first human trial of a partial liver around 2031,
      which would be a small graft assisting the patient's own organ. A whole
      organ that replaces function for a year is a much higher bar, so I put
      it in the mid 2040s.
    sources:
      - title: "ARPA-H: teams set to bioprint universally matched organs on demand (January 2026)"
        url: https://arpa-h.gov/news-and-events/arpa-h-awards-teams-set-bioprint-universally-matched-organs-demand
  sources:
    - title: "ARPA-H: teams set to bioprint universally matched organs on demand (January 2026)"
      url: https://arpa-h.gov/news-and-events/arpa-h-awards-teams-set-bioprint-universally-matched-organs-demand

- id: organ-vitrification
  name: A vitrified organ transplanted and working
  kind: technique
  fields: [medicine, physics]
  track: surgery-organs
  date: 2023
  status: achieved
  tier: 3
  summary: >-
    Rat kidneys were cooled to a glass without ice crystals, stored for up to
    100 days, rewarmed evenly with iron-oxide nanoparticles in a magnetic
    field, and transplanted; all five recipients regained full kidney
    function. In 2026 the same method recovered pig kidneys of human size.
  requires: [organ-transplantation]
  efforts:
    - who: John Bischof, Erik Finger and colleagues (University of Minnesota)
      where: USA
      when: 2023
      outcome: achieved
    - who: ATP-Bio (NSF center) and University of Minnesota
      where: USA
      when: 2026
      outcome: ongoing
      note: A preprint (October 2026) reports human-scale pig kidneys stored up to a year at -150 C; transplanted ones had blood flow and made urine, but follow-up was about two hours.
  sources:
    - title: "Han et al., Nature Communications 14:3407 (2023)"
      url: https://doi.org/10.1038/s41467-023-38824-8
    - title: "ATP-Bio: cryopreservation and nanowarming of human-scale kidneys (October 2026)"
      url: https://atp-bio.org/press-release-landmark-study-demonstrates-first-successful-long-term-cryopreservation-and-nanowarming-of-human-scale-kidneys/

- id: organ-banking
  name: Organ banking by cryopreservation
  kind: technique
  fields: [medicine, physics]
  track: surgery-organs
  date: { window: [2032, 2050], likely: 2038 }
  status: speculative
  tier: 3
  criterion: >-
    A human kidney (or other solid organ) that was vitrified and stored for
    at least a month is rewarmed and transplanted into a patient, and works
    for at least a year.
  summary: >-
    Storing donor organs indefinitely instead of for hours, so organs can be
    matched and shipped anywhere, and a first step toward reversible
    cryopreservation of larger systems.
  requires: [organ-vitrification]
  helped_by: [xenotransplant-approved]
  efforts:
    - who: ATP-Bio and University of Minnesota (Bischof, Finger)
      where: USA
      when: [2020, 2026]
      outcome: ongoing
    - who: Until Labs (formerly Cradle)
      where: USA
      when: [2024, 2026]
      outcome: ongoing
      note: Raised a $58 million series A in 2025 for organ and tissue cryopreservation; no organ-level results published.
  forecast:
    note: >-
      Rat kidneys work after vitrification (2023), and human-size pig kidneys
      survived a few hours after transplant (2026 preprint). The next steps
      are long-term survival of a large animal on a vitrified kidney, then a
      first human case; each has taken several years in this field. I put
      the first human case in the late 2030s.
    sources:
      - title: "ATP-Bio: cryopreservation and nanowarming of human-scale kidneys (October 2026)"
        url: https://atp-bio.org/press-release-landmark-study-demonstrates-first-successful-long-term-cryopreservation-and-nanowarming-of-human-scale-kidneys/
  sources:
    - title: "ATP-Bio: cryopreservation and nanowarming of human-scale kidneys (October 2026)"
      url: https://atp-bio.org/press-release-landmark-study-demonstrates-first-successful-long-term-cryopreservation-and-nanowarming-of-human-scale-kidneys/

- id: cryonics
  name: Cryonics
  kind: institution
  fields: [medicine, society]
  track: surgery-organs
  date: 1967
  status: achieved
  tier: 3
  summary: >-
    Storing legally dead people at liquid nitrogen temperature in the hope
    that future medicine can revive and repair them. James Bedford was the
    first, in 1967. About 500 people are stored, mainly at Alcor and the
    Cryonics Institute; none has been revived, and the damage from freezing
    and from delays after death is not known to be reversible.
  requires: [refrigeration]
  efforts:
    - who: Cryonics Society of California (James Bedford)
      where: USA
      when: 1967
      outcome: achieved
    - who: Alcor Life Extension Foundation; Cryonics Institute; Tomorrow Bio
      where: USA, Germany
      when: [1972, 2026]
      outcome: ongoing
    - who: Robert McIntyre and Gregory Fahy (21st Century Medicine), aldehyde-stabilized cryopreservation
      where: USA
      when: [2015, 2018]
      outcome: achieved
      note: Preserved rabbit and pig brain connectomes well enough to win the Brain Preservation Foundation prizes, but the fixative rules out biological revival.
  sources:
    - title: Wikipedia, James Bedford
      url: https://en.wikipedia.org/wiki/James_Bedford
    - title: "McIntyre and Fahy, Aldehyde-stabilized cryopreservation, Cryobiology 71:448 (2015)"
      url: https://doi.org/10.1016/j.cryobiol.2015.09.003

- id: reversible-suspended-animation
  name: Reversible whole-body cryopreservation
  kind: technique
  fields: [medicine, physics]
  track: surgery-organs
  date: { window: [2060, 2200], likely: 2090 }
  status: speculative
  tier: 2
  criterion: >-
    A large mammal (at least a dog or pig) is cooled below -100 C for at
    least a month, rewarmed and revived with normal behavior and memory; for
    humans, the same done deliberately to a living patient as a medical
    procedure.
  summary: >-
    Pausing a whole body and restarting it later, the "pause and wait" route
    around aging: a person could wait out a disease, or aging itself, until
    a cure exists. It needs whole-organ vitrification scaled up to every
    tissue at once, including the brain.
  requires: [organ-banking]
  helped_by: [cryonics, molecular-nanotechnology]
  efforts:
    - who: Until Labs; ATP-Bio
      where: USA
      when: [2024, 2026]
      outcome: ongoing
      note: Working on tissue and organ scale; Until Labs reported recovering electrical activity in cryopreserved rodent brain slices (2024).
  forecast:
    note: >-
      No mammal larger than tissue samples and rat kidneys has been
      vitrified and recovered. Metaculus forecasters give about a 5 percent
      chance that a cryonically preserved person is revived before 2100, and
      in earlier snapshots put the first large mammal revived from
      cryopreservation around 2079. I put a deliberate, reversible procedure
      around 2090, with a long tail.
    sources:
      - title: "Metaculus: will a cryonically frozen individual be resuscitated before 2100?"
        url: https://www.metaculus.com/questions/13672/
  sources:
    - title: "Han et al., Nature Communications 14:3407 (2023)"
      url: https://doi.org/10.1038/s41467-023-38824-8

# ===========================================================================
# Genetic medicine: gene editing in patients (medicine, track genetic-medicine)
# ===========================================================================

- id: base-editing
  name: Base and prime editing
  kind: technique
  fields: [biology, medicine]
  track: molecular-biology
  date: [2016, 2019]
  status: achieved
  tier: 3
  summary: >-
    CRISPR tools that rewrite DNA letters without cutting both strands: base
    editors (2016) swap one base for another, and prime editors (2019) write
    short insertions, deletions and all twelve kinds of point change. Most
    disease-causing variants are within their reach.
  requires: [crispr-cas9]
  efforts:
    - who: Alexis Komor, David Liu (Broad Institute)
      where: USA
      when: 2016
      outcome: achieved
    - who: Andrew Anzalone, David Liu (Broad Institute)
      where: USA
      when: 2019
      outcome: achieved
      note: Prime editing; the first patients were treated by Prime Medicine in 2024 to 2025.
  sources:
    - title: "Komor et al., Nature 533:420 (2016)"
      url: https://doi.org/10.1038/nature17946
    - title: "Anzalone et al., Nature 576:149 (2019)"
      url: https://doi.org/10.1038/s41586-019-1711-4

- id: crispr-therapy-approved
  name: First approved CRISPR therapy
  kind: technique
  fields: [medicine, biology]
  track: genetic-medicine
  date: 2023
  status: achieved
  tier: 2
  summary: >-
    Casgevy edits a patient's own blood stem cells outside the body to switch
    fetal hemoglobin back on, curing most patients' sickle cell crises. The
    UK approved it in November 2023 and the FDA in December 2023.
  requires: [crispr-cas9, gene-therapy, randomized-controlled-trial]
  efforts:
    - who: Vertex Pharmaceuticals and CRISPR Therapeutics
      where: USA, Switzerland
      when: [2019, 2023]
      outcome: achieved
      note: Treatment needs chemotherapy conditioning and costs about $2 million in the US.
  sources:
    - title: "FDA approves first gene therapies to treat sickle cell disease (December 2023)"
      url: https://www.fda.gov/news-events/press-announcements/fda-approves-first-gene-therapies-treat-patients-sickle-cell-disease
    - title: "Frangoul et al., NEJM 384:252 (2021)"
      url: https://doi.org/10.1056/NEJMoa2031054

- id: in-vivo-gene-editing
  name: In vivo gene editing approved
  kind: technique
  fields: [medicine, biology]
  track: genetic-medicine
  date: { window: [2027, 2029], likely: 2027 }
  status: ongoing
  tier: 2
  criterion: >-
    The FDA or EMA approves a gene-editing therapy delivered directly into
    the body (not cells edited outside it), after a randomized phase 3 trial.
  summary: >-
    Editing genes inside the body with a single infusion, usually lipid
    nanoparticles that carry the editor to the liver. Trials have knocked
    out disease genes for years at a time, and a personalized base editor
    treated a baby with a rare metabolic disease in 2025.
  requires: [crispr-cas9, gene-therapy, randomized-controlled-trial]
  helped_by: [base-editing, modified-nucleoside-mrna]
  efforts:
    - who: Intellia Therapeutics (lonvo-z, NTLA-2002, hereditary angioedema; nex-z, NTLA-2001, ATTR amyloidosis)
      where: USA
      when: [2021, 2026]
      outcome: ongoing
      note: First in vivo CRISPR in humans (2021). Lonvo-z cut attacks 87 percent in phase 3; FDA accepted its application with a decision date of March 10, 2027. Nex-z was on clinical hold from October 2025 to early 2026 after a patient's death.
    - who: Verve Therapeutics (acquired by Eli Lilly), VERVE-102 base editor for PCSK9
      where: USA
      when: [2022, 2026]
      outcome: ongoing
      note: One dose cut LDL cholesterol by up to 62 percent for up to 18 months in phase 1b (2026).
    - who: Kiran Musunuru, Rebecca Ahrens-Nicklas (CHOP and Penn)
      where: USA
      when: 2025
      outcome: achieved
      note: A base editor designed for one baby (KJ Muldoon) with CPS1 deficiency, made and given within months.
  forecast:
    note: >-
      Lonvo-z has a priority review decision date of March 10, 2027, with no
      advisory committee planned. Approval on that date is likely but not
      certain given the nex-z safety event, so 2027 with a window to 2029.
    sources:
      - title: "Intellia: lonvo-z application accepted with priority review (September 2026)"
        url: https://www.sec.gov/Archives/edgar/data/0001652130/000119312526385194/ntla-ex99_1.htm
      - title: "Gillmore et al., NEJM 385:493 (2021)"
        url: https://doi.org/10.1056/NEJMoa2107454
  sources:
    - title: "Musunuru et al., NEJM 392:2235 (2025)"
      url: https://doi.org/10.1056/NEJMoa2504747
    - title: "Lilly: VERVE-102 phase 1b results (BioSpace, 2026)"
      url: https://www.biospace.com/press-releases/a-single-dose-of-lillys-pcsk9-base-editor-verve-102-reduced-pcsk9-by-up-to-88-and-ldl-c-by-up-to-62-with-durable-effects-supporting-its-potential-as-a-one-time-treatment-for-hypercholesterolemia

# ===========================================================================
# The brain: connectomes and emulation (biology, track life-science)
# ===========================================================================

- id: worm-connectome
  name: First complete connectome (C. elegans)
  kind: discovery
  fields: [biology]
  track: life-science
  date: 1986
  status: achieved
  tier: 3
  summary: >-
    The full wiring diagram of the nematode worm, 302 neurons and about 7,000
    synapses, traced by hand from serial electron micrographs over more than
    a decade. Forty years later the worm still has not been convincingly
    simulated from it.
  requires: [electron-microscope]
  efforts:
    - who: John White, Eileen Southgate, Nichol Thomson, Sydney Brenner (MRC Laboratory of Molecular Biology)
      where: Cambridge, UK
      when: [1970, 1986]
      outcome: achieved
  sources:
    - title: "White et al., Phil. Trans. R. Soc. B 314:1 (1986)"
      url: https://doi.org/10.1098/rstb.1986.0056

- id: expansion-microscopy
  name: Expansion microscopy
  kind: technique
  fields: [biology, physics]
  track: life-science
  date: 2015
  status: achieved
  tier: 3
  summary: >-
    Tissue is embedded in a swellable gel and physically enlarged about
    fourfold or more, so an ordinary light microscope resolves detail near
    70 nanometers. With protein labels it is a candidate route to cheaper
    connectomes that also record which molecules sit at each synapse.
  requires: [microscope]
  efforts:
    - who: Fei Chen, Paul Tillberg, Edward Boyden (MIT)
      where: USA
      when: 2015
      outcome: achieved
    - who: E11 Bio (PRISM, protein barcodes plus expansion)
      where: USA
      when: [2023, 2026]
      outcome: ongoing
      note: Aims to cut the cost of a mouse connectome about 100-fold compared with electron microscopy.
  sources:
    - title: "Chen, Tillberg and Boyden, Science 347:543 (2015)"
      url: https://doi.org/10.1126/science.1260088
    - title: "MIT News: a brief history of expansion microscopy (2025)"
      url: https://news.mit.edu/2025/brief-history-expansion-microscopy-0423

- id: fly-connectome
  name: Whole fly brain connectome
  kind: discovery
  fields: [biology, computing]
  track: life-science
  date: 2024
  status: achieved
  tier: 2
  summary: >-
    The complete wiring of an adult fruit fly brain: about 139,000 neurons
    and 50 million synapses, reconstructed from electron microscopy by AI
    segmentation and years of human proofreading. A whole male central
    nervous system (about 167,000 neurons) followed in 2025 to 2026.
  requires: [electron-microscope, deep-learning, worm-connectome]
  efforts:
    - who: FlyWire Consortium (Mala Murthy, Sebastian Seung, Princeton, and many labs)
      where: USA and international
      when: [2017, 2024]
      outcome: achieved
    - who: Janelia FlyEM, University of Cambridge and Google
      where: USA, UK
      when: [2018, 2026]
      outcome: achieved
      note: The male central nervous system, brain plus nerve cord.
  sources:
    - title: "Dorkenwald et al., Nature 634:124 (2024)"
      url: https://doi.org/10.1038/s41586-024-07558-y
    - title: "Janelia FlyEM: male CNS connectome"
      url: https://www.janelia.org/project-team/flyem/male-cns-connectome

- id: mouse-cortex-connectome
  name: Cubic-millimeter mammal connectomes
  kind: discovery
  fields: [biology, computing]
  track: life-science
  date: [2024, 2025]
  status: achieved
  tier: 3
  summary: >-
    One cubic millimeter of mammalian cortex mapped at synapse resolution:
    a fragment of human temporal cortex (2024, 1.4 petabytes) and mouse
    visual cortex with matched recordings of activity (2025, about 200,000
    cells and 524 million synapses). A whole mouse brain is about 500 times
    larger.
  requires: [fly-connectome]
  efforts:
    - who: Jeff Lichtman (Harvard) and Viren Jain (Google), H01
      where: USA
      when: 2024
      outcome: achieved
    - who: MICrONS Consortium (Allen Institute, Princeton, Baylor; IARPA-funded)
      where: USA
      when: [2016, 2025]
      outcome: achieved
      note: Over 150 scientists for more than seven years.
  sources:
    - title: "Shapson-Coe et al., Science 384 (2024)"
      url: https://doi.org/10.1126/science.adk4858
    - title: "MICrONS Consortium, Nature 640:435 (2025)"
      url: https://doi.org/10.1038/s41586-025-08790-w

- id: whole-mouse-connectome
  name: Whole mouse brain connectome
  kind: discovery
  fields: [biology, computing]
  track: life-science
  date: { window: [2030, 2045], likely: 2036 }
  status: ongoing
  tier: 2
  criterion: >-
    A synapse-resolution, proofread wiring diagram of an entire adult mouse
    brain (about 70 million neurons), publicly released.
  summary: >-
    The first complete connectome of a mammal brain, about 1,000 times the
    fly's. Imaging is feasible; the bottleneck is proofreading the
    reconstruction, estimated at 100,000 person-years with today's tools.
  requires: [mouse-cortex-connectome]
  routes:
    - name: Electron microscopy
      requires: [electron-microscope]
      note: The proven method, but costs estimated at $7 to 21 billion, mostly proofreading, unless AI removes it.
    - name: Expansion microscopy
      requires: [expansion-microscopy]
      note: Light microscopy with protein barcodes to trace neurons; cheaper and adds molecular labels, but not yet shown at scale.
  helped_by: [deep-learning, ai-agents]
  efforts:
    - who: NIH BRAIN CONNECTS
      where: USA
      when: [2023, 2028]
      outcome: ongoing
      note: $150 million over five years; its flagship maps 10 cubic millimeters of mouse hippocampus, about a fiftieth of the brain.
    - who: E11 Bio
      where: USA
      when: [2023, 2026]
      outcome: ongoing
      note: Targets a whole mouse connectome within about five years of 2024 by expansion microscopy.
  forecast:
    note: >-
      Wellcome's 2023 Scaling Connectomics report set a whole mouse brain as
      a 10 to 15 year goal, which gives 2033 to 2038. E11 Bio's roadmap is
      faster (about 2029) but depends on an unproven method. Each step so far
      (fly 2024, cubic millimeter 2025) took seven or more years from start.
      I put 2036.
    sources:
      - title: "Wellcome: Scaling connectomics (2023)"
        url: https://wellcome.org/insights/reports/scaling-connectomics
      - title: "E11 Bio: roadmap (2024)"
        url: https://e11.bio/blog/roadmap
  sources:
    - title: "Wellcome: Scaling connectomics (2023)"
      url: https://wellcome.org/insights/reports/scaling-connectomics

- id: animal-brain-emulation
  name: A whole small-animal brain emulated
  kind: technique
  fields: [biology, computing]
  track: life-science
  date: { window: [2028, 2042], likely: 2033 }
  status: ongoing
  tier: 2
  criterion: >-
    A simulation built from an animal's connectome plus measured neuron and
    synapse properties (worm, larval zebrafish or fly), coupled to a body,
    reproduces most of the animal's natural behaviors and its recorded
    neural activity without being trained to do so, confirmed in a
    peer-reviewed study.
  summary: >-
    The test case for brain emulation: does a wiring diagram plus physiology
    reproduce what a real nervous system does? Simple fly-brain models
    already predict some circuits, but no organism, not even the
    302-neuron worm, has been emulated in full.
  requires: [fly-connectome]
  helped_by: [gpu, deep-learning]
  efforts:
    - who: Philip Shiu, Kristin Scott and colleagues (UC Berkeley)
      where: USA
      when: 2024
      outcome: achieved
      note: A simple spiking model of the whole fly brain predicted feeding and grooming circuits, confirmed with optogenetics.
    - who: Lei Ma and colleagues (BAAIWorm, Beijing Academy of AI and Peking University)
      where: China
      when: 2024
      outcome: ongoing
      note: A closed-loop model of worm brain, body and environment that reproduces steering toward food.
    - who: Eon Systems
      where: USA
      when: 2026
      outcome: ongoing
      note: Claimed in March 2026 a fly-brain model in a simulated body that walks, grooms and feeds; not peer reviewed.
    - who: OpenWorm
      where: International
      when: [2011, 2026]
      outcome: ongoing
  forecast:
    note: >-
      The 2025 State of Brain Emulation report distinguishes simulations that
      reproduce outputs from emulations that recreate internal dynamics, and
      finds no organism emulated yet; fewer than 500 people work on it. The
      limiting data are whole-brain activity recordings and synapse
      properties, now being collected for the worm, larval zebrafish and fly.
      I put a convincing fly or worm emulation around 2033.
    sources:
      - title: "Zanichelli et al., State of Brain Emulation Report 2025 (arXiv)"
        url: https://arxiv.org/abs/2510.15745
      - title: "Shiu et al., Nature 634:210 (2024)"
        url: https://doi.org/10.1038/s41586-024-07763-9
  sources:
    - title: "Shiu et al., Nature 634:210 (2024)"
      url: https://doi.org/10.1038/s41586-024-07763-9
    - title: "Zhao et al., BAAIWorm, Nature Computational Science 4:978 (2024)"
      url: https://doi.org/10.1038/s43588-024-00738-w
    - title: "The Decoder: startup claims full brain emulation of a fruit fly (2026)"
      url: https://the-decoder.com/startup-claims-first-full-brain-emulation-of-a-fruit-fly-in-a-simulated-body/

- id: mouse-brain-emulation
  name: A mouse brain emulated
  kind: technique
  fields: [biology, computing]
  track: life-science
  date: { window: [2040, 2075], likely: 2052 }
  status: speculative
  tier: 3
  criterion: >-
    An emulation built from one mouse's connectome and molecular data
    reproduces that mouse's learned behaviors (for example a trained maze or
    task) and its recorded neural activity better than any generic model.
  summary: >-
    The first emulation of a mammal brain, and of an individual's memories
    rather than a species' wiring.
  requires: [whole-mouse-connectome, animal-brain-emulation]
  helped_by: [agi]
  forecast:
    note: >-
      Needs a mouse connectome (about 2036 here) plus a way to read synapse
      strengths and molecular state from the same brain, which no method yet
      does, plus the fly-to-mouse jump in simulation (about 500 times more
      neurons). I put it in the early 2050s.
    sources:
      - title: "Zanichelli et al., State of Brain Emulation Report 2025 (arXiv)"
        url: https://arxiv.org/abs/2510.15745
  sources:
    - title: "Zanichelli et al., State of Brain Emulation Report 2025 (arXiv)"
      url: https://arxiv.org/abs/2510.15745

- id: human-connectome
  name: Whole human brain connectome
  kind: discovery
  fields: [biology, computing]
  track: life-science
  date: { window: [2045, 2100], likely: 2062 }
  status: speculative
  tier: 3
  criterion: >-
    A synapse-resolution wiring diagram of an entire human brain (about 86
    billion neurons and 100 trillion or more synapses), reconstructed and
    proofread to the accuracy of the fly connectome.
  summary: >-
    About 1,000 times the volume of a mouse brain and a zettabyte-scale
    dataset by electron microscopy. The 2024 cubic millimeter of human
    cortex was about a millionth of it.
  requires: [whole-mouse-connectome]
  forecast:
    note: >-
      Mapped volume grew from a fly brain to a cubic millimeter in about a
      year (2024 to 2025), and a mouse brain is expected in the 2030s. If the
      roughly 1,000-fold step from mouse to human takes two to three decades
      as earlier steps did, a human brain arrives in the 2060s.
    sources:
      - title: "Wellcome: Scaling connectomics (2023)"
        url: https://wellcome.org/insights/reports/scaling-connectomics
      - title: "Shapson-Coe et al., Science 384 (2024)"
        url: https://doi.org/10.1126/science.adk4858
  sources:
    - title: "Shapson-Coe et al., Science 384 (2024)"
      url: https://doi.org/10.1126/science.adk4858

# ===========================================================================
# Brain-computer interfaces (electronics, track neurotech)
# ===========================================================================

- id: speech-neuroprosthesis
  name: Speech neuroprosthesis
  kind: device
  fields: [electronics, medicine]
  track: neurotech
  date: 2023
  status: achieved
  tier: 3
  summary: >-
    Implants that decode attempted speech in people who cannot speak: 62 to
    78 words a minute in 2023, 97 percent accuracy over months in 2024, and
    near-instant synthesized voice in 2025. Natural conversation runs about
    150 words a minute.
  requires: [brain-computer-interfaces, deep-learning]
  efforts:
    - who: Francis Willett, Jaimie Henderson, Krishna Shenoy (Stanford, BrainGate)
      where: USA
      when: 2023
      outcome: achieved
      note: 62 words a minute, 24 percent word error on a large vocabulary.
    - who: Edward Chang and colleagues (UCSF)
      where: USA
      when: [2023, 2025]
      outcome: achieved
      note: 78 words a minute with an avatar (2023); streaming voice in 80 millisecond steps (2025).
    - who: Nicholas Card, Sergey Stavisky, David Brandman (UC Davis)
      where: USA
      when: [2024, 2025]
      outcome: achieved
      note: 97.5 percent accuracy over 8.4 months in a man with ALS.
  sources:
    - title: "Willett et al., Nature 620:1031 (2023)"
      url: https://doi.org/10.1038/s41586-023-06377-x
    - title: "Metzger et al., Nature 620:1037 (2023)"
      url: https://doi.org/10.1038/s41586-023-06443-4
    - title: "Card et al., NEJM 391:609 (2024)"
      url: https://doi.org/10.1056/NEJMoa2314132
    - title: "Littlejohn et al., Nature Neuroscience 28:902 (2025)"
      url: https://doi.org/10.1038/s41593-025-01905-6

- id: bci-approved
  name: Implanted BCI approved for paralysis
  kind: device
  fields: [electronics, medicine]
  track: neurotech
  date: { window: [2028, 2033], likely: 2030 }
  status: ongoing
  tier: 2
  criterion: >-
    The FDA (or EU notified bodies) grants market approval (PMA or De Novo,
    or a CE mark) to an implanted brain-computer interface that lets people
    with paralysis control a computer or communicate, for permanent home
    use.
  summary: >-
    The point where implanted interfaces become a medical product rather
    than a research trial. China approved a low-channel implant (Neuracle's
    NEO, eight electrodes on the brain's surface) in March 2026; no
    high-bandwidth device is approved in the US or Europe.
  requires: [brain-computer-interfaces, randomized-controlled-trial]
  helped_by: [speech-neuroprosthesis]
  efforts:
    - who: Synchron (Stentrode, delivered through a blood vessel)
      where: USA
      when: [2019, 2026]
      outcome: ongoing
      note: Six patients in its US early feasibility study with no device-related serious adverse events at 12 months; a $200 million round in 2025 funds a pivotal trial, still being prepared in mid 2026.
    - who: Neuralink
      where: USA, Canada, UK, UAE
      when: [2024, 2026]
      outcome: ongoing
      note: 21 participants by January 2026 by its own count, more since; a speech trial started in late 2025.
    - who: Paradromics (Connexus)
      where: USA
      when: [2025, 2026]
      outcome: ongoing
      note: FDA approved its trial in November 2025; first long-term implant June 2026 at the University of Michigan.
    - who: Neuracle (NEO)
      where: China
      when: 2026
      outcome: rival
      note: Approved by China's NMPA in March 2026 for spinal cord injury, described as the world's first approved invasive BCI.
  forecast:
    note: >-
      No company had started a pivotal trial by mid 2026. Pivotal device
      trials typically run two to three years, with a year of review, which
      points to about 2029 to 2031. One analysis expects Synchron to file
      around 2027 or later. I put the first US approval in 2030.
    sources:
      - title: "TechTimes: Synchron targets 2026 pivotal trial (June 2026)"
        url: https://www.techtimes.com/articles/317929/20260606/synchron-brain-implant-targets-2026-pivotal-trial-first-fda-approved-bci.htm
      - title: "MIT Technology Review: China approves a brain chip (June 2026)"
        url: https://www.technologyreview.com/2026/06/01/1138133/china-world-first-brain-chip/
  sources:
    - title: "MIT Technology Review: China approves a brain chip (June 2026)"
      url: https://www.technologyreview.com/2026/06/01/1138133/china-world-first-brain-chip/
    - title: "University of Michigan: first human Paradromics implant (2026)"
      url: https://www.uofmhealth.org/news-release/university-michigan-implants-first-human-paradromics-wireless-brain-computer-interface-designed

