# The frontier of the life sciences: the intermediate steps that the big
# goals (rejuvenation, organ replacement, brain emulation, synthetic
# genomes, molecular nanotechnology, cheap cultivated meat) actually depend
# on. Achieved steps are included so the path is legible. Changes to the
# existing goal nodes are in patches/frontier-life.yaml.

# ===========================================================================
# Aging and longevity (medicine, track longevity)
# ===========================================================================

- id: mouse-lifespan-drug
  name: A drug that extends mouse lifespan when started late
  kind: discovery
  fields: [medicine, biology]
  track: longevity
  date: 2009
  status: achieved
  tier: 3
  summary: >-
    Rapamycin fed to genetically mixed mice from 20 months of age (roughly 60
    in human terms) extended median and maximum lifespan in both sexes at
    three independent sites. It was the first drug shown to slow aging in a
    mammal, and the start of the "geroprotector" idea.
  requires: [randomized-controlled-trial]
  efforts:
    - who: David Harrison, Randy Strong, Richard Miller (NIA Interventions Testing Program)
      where: Jackson Laboratory, UT Health San Antonio, University of Michigan, USA
      when: 2009
      outcome: achieved
      note: Lifespan to 90 percent mortality rose 14 percent in females and 9 percent in males.
    - who: NIA Interventions Testing Program, later compounds
      where: USA
      when: [2009, 2026]
      outcome: ongoing
      note: Acarbose, 17-alpha-estradiol and canagliflozin also extended lifespan (canagliflozin by 14 percent in males only); fisetin did not.
  sources:
    - title: "Harrison et al., Nature 460:392 (2009)"
      url: https://doi.org/10.1038/nature08221
    - title: "Harrison et al. 2009, full text (PubMed Central)"
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2786175/

- id: epigenetic-aging-clocks
  name: Epigenetic aging clocks
  kind: technique
  fields: [medicine, biology, computing]
  track: longevity
  date: 2013
  status: achieved
  tier: 3
  summary: >-
    Models that estimate biological age from DNA methylation at a few hundred
    sites. Steve Horvath's 2013 pan-tissue clock was the first to work across
    tissues; later clocks (GrimAge 2019, DunedinPACE 2022) predict death and
    disease or the pace of aging, and are now used as exploratory trial
    endpoints.
  requires: [microarrays, statistics]
  helped_by: [deep-learning-genomics]
  efforts:
    - who: Steve Horvath (UCLA)
      where: USA
      when: 2013
      outcome: achieved
      note: Pan-tissue clock from 353 CpG sites; Gregory Hannum and colleagues published a blood clock the same year.
    - who: Ake Lu and Steve Horvath (GrimAge); Daniel Belsky and Terrie Moffitt (DunedinPACE)
      where: USA, New Zealand
      when: [2019, 2022]
      outcome: achieved
    - who: Biomarkers of Aging Consortium
      where: International
      when: [2022, 2026]
      outcome: ongoing
      note: Its 2024 Nature Medicine paper notes there is still no consensus on how to validate aging biomarkers.
  sources:
    - title: "Horvath, Genome Biology 14:R115 (2013)"
      url: https://doi.org/10.1186/gb-2013-14-10-r115
    - title: "Moqri et al., Validation of biomarkers of aging, Nature Medicine (2024)"
      url: https://doi.org/10.1038/s41591-023-02784-9

- id: aging-biomarker-endpoint
  name: An aging biomarker accepted as a trial endpoint
  kind: institution
  fields: [medicine, society]
  track: longevity
  date: { window: [2030, 2045], likely: 2036 }
  status: ongoing
  tier: 2
  criterion: >-
    The FDA or EMA accepts a measure of biological aging (a clock, composite
    or functional index) as a surrogate or primary endpoint that can support
    approval of a drug whose claim is slowing aging, through biomarker
    qualification or in an approved drug's label. Use as an exploratory
    endpoint does not count.
  summary: >-
    The institutional step that makes aging drugs testable in a few years
    instead of the decades a lifespan trial would take. Without it, every
    route to rejuvenation has to prove itself one disease at a time.
  requires: [epigenetic-aging-clocks, randomized-controlled-trial]
  helped_by: [deep-learning-genomics]
  efforts:
    - who: ARPA-H PROSPR program (seven teams including Stanford, UT Health San Antonio, Columbia)
      where: USA
      when: [2026, 2031]
      outcome: ongoing
      note: Up to $144 million over five years, awarded February 2026, to find early biomarkers that can serve as surrogates for long-term health outcomes in 1 to 3 year trials.
    - who: Biomarkers of Aging Consortium
      where: International
      when: [2022, 2026]
      outcome: ongoing
    - who: XPRIZE Healthspan
      where: International
      when: [2023, 2030]
      outcome: ongoing
      note: $101 million prize for restoring muscle, cognitive and immune function by 10 or more years; 20 finalists named in August 2026, results due in 2030.
  forecast:
    note: >-
      No aging biomarker has been qualified; only a handful of biomarkers of
      any kind have ever been fully qualified through FDA's program, and none
      as surrogate endpoints. PROSPR's cohort and trial data arrive around
      2030 to 2031 and XPRIZE results in 2030, so the evidence package could
      exist by the early 2030s. Biomarker qualification typically takes years
      more, so I put acceptance around 2036, with a real chance it never
      comes for clocks and a functional index is accepted instead.
    sources:
      - title: "ARPA-H: PROSPR research teams (February 2026)"
        url: https://arpa-h.gov/news-and-events/research-teams-add-more-healthy-years-americans-lives-they-age
      - title: "XPRIZE: 20 Healthspan finalist teams advance (August 2026)"
        url: https://www.xprize.org/news/20-healthspan-finalist-teams-advance-in-the-race-to-extend-healthy-aging
  sources:
    - title: "ARPA-H: PROSPR research teams (February 2026)"
      url: https://arpa-h.gov/news-and-events/research-teams-add-more-healthy-years-americans-lives-they-age
    - title: "Moqri et al., Validation of biomarkers of aging, Nature Medicine (2024)"
      url: https://doi.org/10.1038/s41591-023-02784-9

- id: dog-lifespan-drug
  name: A drug approved to extend dogs' lives
  kind: technique
  fields: [medicine, agriculture]
  track: longevity
  date: { window: [2027, 2031], likely: 2028 }
  status: ongoing
  tier: 3
  criterion: >-
    A regulator (in practice FDA's Center for Veterinary Medicine) grants
    conditional or full approval to a drug labeled to extend lifespan or
    healthy lifespan in dogs.
  summary: >-
    The first drug with a lifespan claim on its label, in any species. Loyal's
    LOY-002, a daily pill for senior dogs, has passed two of the three major
    technical sections of FDA review.
  requires: [mouse-lifespan-drug]
  efforts:
    - who: Loyal (Celine Halioua), LOY-002
      where: USA
      when: [2019, 2026]
      outcome: ongoing
      note: FDA accepted the effectiveness section (February 2025) and target animal safety section (January 2026); manufacturing is pending. The STAY study enrolled 1,300 dogs at 70 clinics by July 2025.
    - who: Dog Aging Project (TRIAD rapamycin trial)
      where: USA
      when: [2021, 2026]
      outcome: ongoing
  forecast:
    note: >-
      Loyal says it expects to complete the manufacturing section and apply
      for conditional approval in 2027. FDA reviews of that section commonly
      take a year, so 2028 is the likely date.
    sources:
      - title: "Loyal: LOY-002 target animal safety section accepted (January 2026)"
        url: https://loyal.com/posts/loy-002-tas-announcement
  sources:
    - title: "Loyal: LOY-002 target animal safety section accepted (January 2026)"
      url: https://loyal.com/posts/loy-002-tas-announcement

- id: aging-drug-approved
  name: A drug approved to slow human aging
  kind: technique
  fields: [medicine, society]
  track: longevity
  date: { window: [2033, 2055], likely: 2040 }
  status: speculative
  tier: 2
  criterion: >-
    A major regulator (FDA or EMA) approves a drug for healthy older people
    on the basis of a randomized trial showing it delays a composite of
    several age-related diseases (for example cardiovascular disease, cancer,
    dementia and death), or improves an accepted aging endpoint, rather than
    treating one disease.
  summary: >-
    Aging treated as an indication in its own right, the model proposed by
    the TAME trial of metformin. Several candidate geroprotectors exist
    (rapamycin, metformin, GLP-1 and SGLT2 drugs); none has been tested this
    way to completion.
  requires: [mouse-lifespan-drug, randomized-controlled-trial]
  helped_by: [aging-biomarker-endpoint, dog-lifespan-drug]
  efforts:
    - who: TAME trial (Nir Barzilai, American Federation for Aging Research)
      where: USA
      when: [2015, 2026]
      outcome: ongoing
      note: Designed for about 3,000 people aged 65 to 79 over six years with a composite endpoint; still described as awaiting full funding in 2026 and not yet enrolling.
    - who: PEARL trial of low-dose rapamycin (AgelessRx)
      where: USA
      when: 2025
      outcome: abandoned
      note: 114 people for 48 weeks; missed its primary endpoint (visceral fat), with modest gains in women's lean mass.
    - who: SELECT trial of semaglutide (Novo Nordisk)
      where: International
      when: 2023
      outcome: ongoing
      note: In 17,604 adults with obesity, all-cause death fell by about 19 percent (hazard ratio 0.81), a hint of broad protective effects, though not a formally tested result.
    - who: VITAL-H (UT Health San Antonio, ARPA-H PROSPR)
      where: USA
      when: [2026, 2031]
      outcome: ongoing
      note: A hybrid trial of an SGLT2 inhibitor, rapamycin and semaglutide on healthspan biomarkers.
  forecast:
    note: >-
      FDA does not recognize aging as an indication. A TAME-style trial takes
      about six years after funding, plus a year or two for review, so even a
      2027 start gives 2034 at the earliest. A biomarker endpoint (about 2036
      in this tree) would let shorter trials support a claim. GLP-1 drugs may
      get there sideways by accumulating broad outcome labels. I put the
      first approval whose claim is aging itself around 2040.
    sources:
      - title: "Lincoff et al., SELECT, NEJM 389:2221 (2023)"
        url: https://doi.org/10.1056/NEJMoa2307563
      - title: "Moel et al., PEARL rapamycin trial, Aging 17 (2025)"
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12074816/
      - title: "ARPA-H: PROSPR research teams (February 2026)"
        url: https://arpa-h.gov/news-and-events/research-teams-add-more-healthy-years-americans-lives-they-age
  sources:
    - title: "Moel et al., PEARL rapamycin trial, Aging 17 (2025)"
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12074816/

- id: senolytics-approved
  name: A senolytic drug approved
  kind: technique
  fields: [medicine, biology]
  track: longevity
  date: { window: [2031, 2045], likely: 2036 }
  status: ongoing
  tier: 3
  criterion: >-
    A drug whose mechanism is selectively killing senescent cells is approved
    by the FDA or EMA for any indication after meeting its primary endpoint
    in a randomized trial.
  summary: >-
    Drugs that clear senescent cells, which accumulate with age and secrete
    inflammatory signals. Clearing them extends healthy life in mice, but
    the first human trials have mostly missed their endpoints.
  requires: [randomized-controlled-trial, cell-culture]
  helped_by: [mouse-lifespan-drug]
  efforts:
    - who: James Kirkland, Sundeep Khosla and colleagues (Mayo Clinic), dasatinib plus quercetin
      where: USA
      when: [2015, 2024]
      outcome: ongoing
      note: A 2024 phase 2 bone trial in 60 women missed its primary endpoint; benefit appeared only in those with many senescent cells.
    - who: Unity Biotechnology (UBX1325)
      where: USA
      when: [2011, 2025]
      outcome: abandoned
      note: Missed its primary endpoint in diabetic macular edema in 2025; the board approved a plan of dissolution in June 2025.
    - who: Rubedo Life Sciences and others
      where: USA
      when: 2026
      outcome: ongoing
      note: Early-stage topical and systemic senolytics.
  forecast:
    note: >-
      As of 2026 no senolytic is approved and none is in phase 3. A new
      phase 2 success in the late 2020s, then phase 3 and review, gives the
      mid 2030s. I put 2036, with a real chance the class fails.
    sources:
      - title: "Unity Biotechnology 8-K, plan of dissolution (June 2025)"
        url: https://www.sec.gov/Archives/edgar/data/1463361/000095017025091210/ubx-20250627.htm
  sources:
    - title: "Unity Biotechnology 8-K, plan of dissolution (June 2025)"
      url: https://www.sec.gov/Archives/edgar/data/1463361/000095017025091210/ubx-20250627.htm

- id: partial-reprogramming
  name: Partial epigenetic reprogramming in animals
  kind: discovery
  fields: [medicine, biology]
  track: longevity
  date: 2016
  status: achieved
  tier: 2
  summary: >-
    Briefly switching on the Yamanaka factors resets aging marks without
    turning cells back into stem cells. Cyclic expression extended lifespan
    in progeroid mice and improved tissue repair in normal ones; later work
    restored vision in old mice with three factors (OSK).
  requires: [induced-pluripotent-stem-cells, gene-therapy]
  efforts:
    - who: Alejandro Ocampo, Juan Carlos Izpisua Belmonte (Salk Institute)
      where: USA
      when: 2016
      outcome: achieved
    - who: Yuancheng Lu, David Sinclair (Harvard)
      where: USA
      when: 2020
      outcome: achieved
      note: OSK gene therapy restored vision in aged mice and in a glaucoma model (Nature 2020).
  sources:
    - title: "Ocampo et al., Cell 167:1719 (2016)"
      url: https://doi.org/10.1016/j.cell.2016.11.052
    - title: "Lu et al., Nature 588:124 (2020)"
      url: https://doi.org/10.1038/s41586-020-2975-4

- id: reprogramming-human-trial
  name: Partial reprogramming shown to work in a human organ
  kind: technique
  fields: [medicine, biology]
  track: longevity
  date: { window: [2028, 2034], likely: 2030 }
  status: ongoing
  tier: 3
  criterion: >-
    A controlled human trial of an in vivo partial reprogramming therapy
    reports both acceptable safety and a measured functional benefit (for
    example vision in optic neuropathy) in one organ.
  summary: >-
    The first test of rejuvenating cells in place in people, starting in the
    eye, where a small dose can be injected locally and switched on and off
    with an oral drug.
  requires: [partial-reprogramming]
  efforts:
    - who: Life Biosciences (ER-100)
      where: Boston, USA
      when: 2026
      outcome: ongoing
      note: IND cleared January 2026; first patient dosed June 2026 (NCT07290244), about 18 patients with glaucoma or NAION; primary safety completion due May 2027.
    - who: NewLimit
      where: San Francisco, USA
      when: 2026
      outcome: ongoing
      note: Raised $435 million in 2026 and plans a first human trial of a liver reprogramming medicine in 2027.
    - who: Altos Labs, Retro Biosciences, YouthBio
      where: USA
      when: [2022, 2026]
      outcome: ongoing
      note: No disclosed reprogramming candidate in the clinic as of 2026.
  forecast:
    note: >-
      ER-100's phase 1 finishes its primary safety readout in 2027; a
      controlled efficacy result needs a phase 2, about 2029 to 2031.
    sources:
      - title: "Life Biosciences: first patient dosed with ER-100 (June 2026)"
        url: https://www.lifebiosciences.com/life-biosciences-announces-first-patient-dosed-in-phase-1-trial-of-er-100-for-optic-neuropathies/
      - title: "ClinicalTrials.gov NCT07290244"
        url: https://clinicaltrials.gov/study/NCT07290244
  sources:
    - title: "Life Biosciences: first patient dosed with ER-100 (June 2026)"
      url: https://www.lifebiosciences.com/life-biosciences-announces-first-patient-dosed-in-phase-1-trial-of-er-100-for-optic-neuropathies/
    - title: "NewLimit raises $435 million (BioSpace, 2026)"
      url: https://www.biospace.com/business/newlimit-snags-435m-after-seeing-age-reversal-in-human-liver-cells

- id: systemic-reprogramming
  name: Whole-body partial reprogramming in humans
  kind: technique
  fields: [medicine, biology]
  track: longevity
  date: { window: [2035, 2060], likely: 2044 }
  status: speculative
  tier: 2
  criterion: >-
    A reprogramming therapy delivered systemically (to most major organs, not
    one eye or one tissue) shows in a randomized trial a reduction of at
    least 5 years in a validated aging measure across several organ systems,
    without excess cancer, over at least two years of follow-up.
  summary: >-
    Rejuvenating cells throughout the body by delivering reprogramming
    factors everywhere, the version of reprogramming that would matter for
    aging as a whole. Safe delivery to every tissue, and avoiding tumors from
    over-reprogramming, are the obstacles.
  requires: [reprogramming-human-trial]
  helped_by: [aging-biomarker-endpoint, in-vivo-gene-editing]
  efforts:
    - who: Altos Labs, NewLimit, Retro Biosciences, Life Biosciences
      where: USA
      when: [2022, 2026]
      outcome: ongoing
      note: Together these companies have raised well over $4 billion; none has a systemic reprogramming therapy in humans as of 2026.
  forecast:
    note: >-
      Local reprogramming in the eye began in 2026 and liver trials are
      planned from 2027. Systemic gene delivery to most organs does not yet
      exist for any therapy, and a two-year randomized trial with organ-level
      aging measures would follow years of dose-finding. I put a result
      meeting this bar in the 2040s, with very wide uncertainty.
    sources:
      - title: "NewLimit raises $435 million (BioSpace, 2026)"
        url: https://www.biospace.com/business/newlimit-snags-435m-after-seeing-age-reversal-in-human-liver-cells
  sources:
    - title: "NewLimit raises $435 million (BioSpace, 2026)"
      url: https://www.biospace.com/business/newlimit-snags-435m-after-seeing-age-reversal-in-human-liver-cells

- id: longevity-escape-velocity
  name: Longevity escape velocity
  kind: milestone
  fields: [medicine, society]
  track: longevity
  date: { window: [2045, 2150], likely: 2070 }
  status: speculative
  tier: 1
  criterion: >-
    In at least one country, remaining life expectancy at age 60 rises by at
    least one year per calendar year, sustained for ten years, so that older
    people's expected remaining lifespan stops shrinking.
  summary: >-
    The point where medicine adds years of life faster than they pass for
    people who are already old. Today life expectancy in rich countries
    rises by roughly 0.1 to 0.2 years per year.
  requires: [aging-reversal]
  efforts:
    - who: Aubrey de Grey (who coined the term) and the SENS and LEV foundations
      where: USA, UK
      when: [2004, 2026]
      outcome: ongoing
  forecast:
    note: >-
      Metaculus' question on this (life expectancy rising a year per year)
      has had community medians between about 2050 and 2060 in recent
      snapshots, with an interquartile range from about 2039 to after 2180;
      I could not read the live value. Life expectancy gains in rich
      countries slowed after 2010. Measured at age 60, this needs a
      rejuvenation therapy that is widely used, not just approved, so I put
      it about a decade after rejuvenation therapies, around 2070, and well
      later than the forecasting community.
    sources:
      - title: "Metaculus: when will a country reach longevity escape velocity?"
        url: https://www.metaculus.com/questions/6592/date-life-expectancy-hits-escape-velocity
  sources:
    - title: "Metaculus: when will a country reach longevity escape velocity?"
      url: https://www.metaculus.com/questions/6592/date-life-expectancy-hits-escape-velocity

