- id: single-atom-manipulation
  name: Positioning single atoms
  kind: technique
  fields: [materials, physics]
  track: nanotech
  date: 1989
  status: achieved
  tier: 3
  summary: >-
    The tip of a scanning tunneling microscope used to drag individual atoms
    into place: 35 xenon atoms spelling "IBM" on nickel at 4 kelvin. It
    showed that matter can be arranged atom by atom, though only slowly, in
    ultra-high vacuum and near absolute zero.
  requires: [scanning-tunneling-microscope]
  efforts:
    - who: Donald Eigler, Erhard Schweizer (IBM Almaden)
      where: USA
      when: 1989
      outcome: achieved
      note: Published in Nature in April 1990.
    - who: Saw-Wai Hla (Ohio University and Argonne)
      where: USA
      when: 2023
      outcome: achieved
      note: X-ray characterization of a single atom, extending what can be measured one atom at a time.
  sources:
    - title: "Eigler and Schweizer, Nature 344:524 (1990)"
      url: https://doi.org/10.1038/344524a0
    - title: "Ajayi et al., Nature 618:69 (2023)"
      url: https://doi.org/10.1038/s41586-023-06011-w

- id: tip-mechanosynthesis
  name: Covalent chemistry with a microscope tip
  kind: technique
  fields: [materials, physics, chemistry]
  track: nanotech
  date: [2003, 2012]
  status: achieved
  tier: 3
  summary: >-
    Making and breaking covalent bonds at chosen sites with a probe tip:
    pulling single silicon atoms out of a surface and putting them back
    (2003), and placing single phosphorus atoms in silicon with
    atomic-lattice accuracy by hydrogen-resist lithography, used to build a
    single-atom transistor (2012) and silicon qubit arrays.
  requires: [single-atom-manipulation]
  efforts:
    - who: Noriaki Oyabu, Oscar Custance, Seizo Morita (Osaka University)
      where: Japan
      when: 2003
      outcome: achieved
      note: Mechanical vertical manipulation of silicon atoms with an atomic force microscope.
    - who: Michelle Simmons (UNSW; Silicon Quantum Computing)
      where: Australia
      when: [2012, 2026]
      outcome: ongoing
      note: Single-atom transistor (2012); later arrays of thousands of atom-placed qubit registers.
    - who: Zyvex Labs (hydrogen depassivation lithography)
      where: USA
      when: [2008, 2026]
      outcome: ongoing
  sources:
    - title: "Oyabu et al., Physical Review Letters 90:176102 (2003)"
      url: https://doi.org/10.1103/PhysRevLett.90.176102
    - title: "Fuechsle et al., Nature Nanotechnology 7:242 (2012)"
      url: https://doi.org/10.1038/nnano.2012.21

- id: positional-assembly-3d
  name: Tip-built three-dimensional covalent structures
  kind: technique
  fields: [materials, chemistry, physics]
  track: nanotech
  date: { window: [2035, 2070], likely: 2045 }
  status: speculative
  tier: 3
  criterion: >-
    A peer-reviewed demonstration of a probe tip (or array of tips) adding
    atoms or small molecules one at a time to a growing covalent 3D
    structure of at least 1,000 atoms, with per-step yield above 99 percent,
    following a programmed blueprint.
  summary: >-
    Drexler's "mechanosynthesis": building solid objects such as diamond
    lattices by moving reactive fragments into place with tools. Designs and
    simulations exist (Freitas and Merkle), but nobody has built a
    three-dimensional covalent structure this way.
  requires: [tip-mechanosynthesis]
  helped_by: [deep-learning]
  efforts:
    - who: Robert Freitas, Ralph Merkle; CBN Nano Technologies
      where: USA, Canada
      when: [2004, 2026]
      outcome: ongoing
      note: Tooltip designs and patents for diamond mechanosynthesis; no experimental build reported.
    - who: Zyvex Labs DARPA atomically precise manufacturing program
      where: USA
      when: [2008, 2018]
      outcome: abandoned
      note: Roughly $15 million over five years for tip-based silicon patterning.
  forecast:
    note: >-
      Covalent tip chemistry works for single sites on flat surfaces at
      cryogenic temperatures; throughput and reliability are many orders of
      magnitude short of building in 3D. Funding is small. My judgment is
      that a 1,000-atom demonstration needs two decades of focused work that
      has barely started, so the mid 2040s, with a long tail.
    sources:
      - title: "C&EN: the Drexler and Smalley debate on molecular assemblers (2003)"
        url: https://doi.org/10.1021/cen-v081n048.p037
  sources:
    - title: "C&EN: the Drexler and Smalley debate on molecular assemblers (2003)"
      url: https://doi.org/10.1021/cen-v081n048.p037

- id: dna-origami
  name: DNA origami
  kind: technique
  fields: [materials, biology, chemistry]
  track: nanotech
  date: 2006
  status: achieved
  tier: 2
  summary: >-
    A long single DNA strand folded into almost any 2D or 3D shape about 100
    nanometers across by a few hundred short "staple" strands, with features
    every 6 nanometers. By 2017 assemblies reached gigadaltons; they are used
    as scaffolds to place molecules, as nanopores and as drug carriers in
    animal studies.
  requires: [recombinant-dna, dna-double-helix]
  efforts:
    - who: Nadrian Seeman (New York University)
      where: USA
      when: 1982
      outcome: achieved
      note: Proposed building with branched DNA junctions, founding structural DNA nanotechnology.
    - who: Paul Rothemund (Caltech)
      where: USA
      when: 2006
      outcome: achieved
    - who: Hendrik Dietz (TU Munich); William Shih, Peng Yin (Harvard Wyss Institute)
      where: Germany, USA
      when: [2009, 2017]
      outcome: achieved
      note: 3D origami, DNA bricks and gigadalton-scale assemblies. No DNA nanostructure medicine has reached a human trial as of 2026.
  sources:
    - title: "Rothemund, Nature 440:297 (2006)"
      url: https://doi.org/10.1038/nature04586
    - title: "Wagenbauer, Sigl and Dietz, Nature 552:78 (2017)"
      url: https://doi.org/10.1038/nature24651

- id: de-novo-protein-design
  name: De novo protein design
  kind: technique
  fields: [biology, computing, chemistry]
  track: synthetic-biology
  date: [2003, 2023]
  status: achieved
  tier: 2
  summary: >-
    Designing proteins that nature never made, from scratch: a new fold
    (Top7, 2003), self-assembling nanoparticles in an approved vaccine
    (2022), and since RFdiffusion (2023) binders, enzymes and antivenoms
    designed by generative AI in days. It earned David Baker half of the
    2024 Nobel Prize in Chemistry.
  requires: [protein-crystallography, recombinant-dna]
  helped_by: [protein-structure-prediction, deep-learning, diffusion-models]
  efforts:
    - who: Brian Kuhlman, David Baker (University of Washington)
      where: USA
      when: 2003
      outcome: achieved
      note: Top7, a protein fold not seen in nature.
    - who: UW Institute for Protein Design and SK bioscience (SKYCovione)
      where: USA, South Korea
      when: 2022
      outcome: achieved
      note: A COVID-19 vaccine built on a designed nanoparticle, approved in Korea in June 2022.
    - who: Joseph Watson, David Baker and colleagues (RFdiffusion)
      where: USA
      when: 2023
      outcome: achieved
      note: Followed by designed serine hydrolase enzymes and snake-toxin binders in 2025.
  sources:
    - title: "Kuhlman et al., Science 302:1364 (2003)"
      url: https://doi.org/10.1126/science.1089427
    - title: "Watson et al., Nature 620:1089 (2023)"
      url: https://doi.org/10.1038/s41586-023-06415-8
    - title: "Nobel Prize in Chemistry 2024"
      url: https://www.nobelprize.org/prizes/chemistry/2024/summary/

- id: artificial-molecular-machines
  name: Artificial molecular machines
  kind: technique
  fields: [materials, chemistry]
  track: nanotech
  date: [1991, 2016]
  status: achieved
  tier: 3
  summary: >-
    Synthetic molecules with parts that move on command: shuttles (1991),
    light-driven rotary motors (1999), a molecular car. The 2016 Nobel Prize
    went to Jean-Pierre Sauvage, Fraser Stoddart and Ben Feringa.
  requires: [chemical-structure-theory]
  efforts:
    - who: Fraser Stoddart (molecular shuttle, 1991); Ben Feringa (rotary motor, 1999); Jean-Pierre Sauvage (catenanes, 1983)
      where: UK and USA, Netherlands, France
      when: [1983, 2016]
      outcome: achieved
  sources:
    - title: "Nobel Prize in Chemistry 2016"
      url: https://www.nobelprize.org/prizes/chemistry/2016/summary/
    - title: "Koumura et al., Nature 401:152 (1999)"
      url: https://doi.org/10.1038/43646

- id: molecule-building-machines
  name: Machines that build molecules
  kind: technique
  fields: [materials, chemistry]
  track: nanotech
  date: [2013, 2017]
  status: achieved
  tier: 3
  summary: >-
    Synthetic machines that make a specific product step by step: a rotaxane
    that walks along a track and joins amino acids in order, a crude
    ribosome (2013), and a programmable molecular arm that builds any of
    four stereoisomers (2017). They are slow (hours per bond), single-use
    and make only short products.
  requires: [artificial-molecular-machines]
  efforts:
    - who: David Leigh (University of Manchester)
      where: UK
      when: [2013, 2017]
      outcome: achieved
  sources:
    - title: "Lewandowski et al., Science 339:189 (2013)"
      url: https://doi.org/10.1126/science.1229753
    - title: "Kassem et al., Nature 549:374 (2017)"
      url: https://doi.org/10.1038/nature23677

- id: programmable-molecular-assembler
  name: A programmable molecular assembler
  kind: device
  fields: [materials, chemistry, biology]
  track: nanotech
  date: { window: [2035, 2075], likely: 2048 }
  status: speculative
  tier: 2
  criterion: >-
    A designed (not evolved) molecular machine that reads a replaceable
    instruction sequence and builds, by positioned covalent steps, products
    of at least 20 steps from a set of at least five building blocks,
    including non-biological ones, without being consumed, at a rate of at
    least one step per minute.
  summary: >-
    A general-purpose builder at the molecular scale, something like a
    ribosome that can make materials other than proteins. It could come from
    designed proteins and DNA frameworks, from synthetic chemistry, or from
    a mix.
  requires: [molecule-building-machines]
  routes:
    - name: Designed biology
      requires: [de-novo-protein-design, dna-origami]
      note: Use designed proteins and DNA frameworks as the tooling, the path most funding now follows.
    - name: Synthetic chemistry
      requires: [artificial-molecular-machines]
      note: Extend Leigh-style small-molecule machines into faster, reusable programmable synthesizers.
  helped_by: [protein-structure-prediction, deep-learning]
  efforts:
    - who: UK ARIA Universal Fabricators programme
      where: UK
      when: 2026
      outcome: ongoing
      note: About £50 million to get engineered proteins to template the assembly of inorganic and composite materials.
    - who: David Leigh (Manchester); David Baker (UW Institute for Protein Design)
      where: UK, USA
      when: [2013, 2026]
      outcome: ongoing
  forecast:
    note: >-
      Leigh predicted molecular factories within 10 to 20 years in 2017, and
      no step change is reported since. AI protein design is moving faster
      than synthetic chemistry, and ARIA is funding the protein route. My
      judgment is the late 2040s.
    sources:
      - title: "University of Manchester: world's first molecular robot capable of building molecules (2017)"
        url: https://www.manchester.ac.uk/about/news/scientists-create-worlds-first-molecular-robot-capable-of-building-molecules/
      - title: "ARIA: Universal Fabricators programme thesis"
        url: https://app-aria-cm-prod.azurewebsites.net/media/wluhzkuw/universal-fabricators-thesis.pdf
  sources:
    - title: "ARIA: opportunity spaces"
      url: https://www.aria.org.uk/opportunity-spaces/

