# ------------------------------------------------------------- agriculture

- id: cereal-yield-4-tonnes
  name: "World cereal yield of 4 tonnes a hectare"
  kind: milestone
  fields: [agriculture]
  track: crops
  tier: 3
  threshold: { metric: cereal-yield, value: 4, label: "4 t/ha" }
  summary: >-
    The world's farms averaging 4 tonnes of grain per hectare, three times
    the 1961 average.
  requires: [green-revolution, nitrogen-fertilizer-scale]
  helped_by: [hybrid-corn, gm-crops]

- id: cereal-yield-5-tonnes
  name: "World cereal yield of 5 tonnes a hectare"
  kind: milestone
  fields: [agriculture]
  track: crops
  tier: 3
  threshold: { metric: cereal-yield, value: 5, label: "5 t/ha" }
  date: { window: [2038, 2056], likely: 2045 }
  status: speculative
  summary: >-
    The world's farms averaging 5 tonnes of grain per hectare.
  requires: [cereal-yield-4-tonnes]
  helped_by: [gm-crops, precision-agriculture]
  forecast:
    note: >-
      Cereal yields have grown in a straight line rather than exponentially:
      about 0.045 tonnes a hectare a year from 1961 to 2024, but only about
      0.03 a year from 2014 to 2024 (3.89 to 4.21). Carried forward from 4.21
      in 2024, those rates give 5 tonnes between about 2042 and 2050, later
      than the exponential trend's date; I put the likely date at 2045.
    sources:
      - title: "Our World in Data, Cereal yield (FAO)"
        url: https://ourworldindata.org/grapher/cereal-yield
