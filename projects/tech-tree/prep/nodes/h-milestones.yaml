- id: quantum-gate-four-nines
  name: "Two-qubit gates at 99.99% fidelity"
  kind: milestone
  fields: [computing, physics]
  track: computers
  tier: 3
  threshold: { metric: two-qubit-gate-error, value: 0.0001, label: "99.99%" }
