  name: The mathematical literature formalized
  kind: infrastructure
  fields: [math, computing]
  track: proof
  date: { window: [2028, 2042], likely: 2032 }
  status: ongoing
  tier: 3
  summary: >-
    Most of the main theorems in the published literature, not just the
    famous ones, checked by machine in an open library, so errors in old
    papers surface and new work can build on checked results. Formalizing
    has found real gaps: Axiom's agents found 34 serious problems in the
    classification of finite simple groups.
  requires: [landmark-proofs-autoformalized]
  helped_by: [formal-proofs-routine, agi]
  criterion: >-
    An audit of a random sample of at least 500 research papers published
    in the leading general mathematics journals between 1950 and 2025 finds
    the main theorems of at least half of them formalized, with statements
    reviewed, in one or more open formal libraries.
  efforts:
    - who: Lean FRO (Tau Ceti), Math, Inc., Axiom Math, Anthropic, OpenAI
      where: USA, international
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      Fermat's Last Theorem cost about six billion output tokens, and the
      15,000-page classification of finite simple groups took 24 days, so a
      typical paper is far cheaper, and inference prices keep falling. What
      is slow is the background each field needs and checking that the
      formal statements say what the papers say; Tau Ceti's maintainers
      expect a substantial part of graduate mathematics within a year or
      two. Nobody has set this as a public goal for the whole literature.
      Judgment: early 2030s.
