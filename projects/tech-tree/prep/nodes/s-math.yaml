- id: verified-software-mainstream
  name: Formally verified software in the mainstream
  kind: technique
  fields: [computing, math]
  track: software
  date: { window: [2029, 2045], likely: 2034 }
  status: ongoing
  tier: 2
  summary: >-
    Everyday software, not just small kernels and crypto libraries, shipped
    with machine-checked proofs that it does what its specification says.
    seL4 showed it could be done in 2009 at about ten times the cost of
    writing the code; AI that writes proofs could make it cheap, though
    writing good specifications stays hard.
  requires: [machine-checked-mathematics, landmark-proofs-autoformalized]
  helped_by: [superhuman-coder, formal-proofs-routine]
  criterion: >-
    A general-purpose operating system kernel or web browser engine used
    by more than 100 million people ships with machine-checked proofs that
    most of its code meets a formal specification of functional
    correctness, not just memory safety.
  efforts:
    - who: ARIA Safeguarded AI (59 million pounds)
      where: UK
      when: 2026
      outcome: ongoing
      note: Started as a program for provable guarantees on AI systems; in 2025 and 2026 it narrowed to an open toolkit for AI agents that produce formally verified software, applied to cybersecurity, because frontier AI advanced faster than expected.
    - who: Amazon Web Services (Cedar, Dafny)
      where: USA
      when: 2023
      outcome: ongoing
      note: Proved key properties of the Cedar authorization engine and the soundness of its validator, finding design bugs.
    - who: Vero benchmark (Berkeley and others)
      where: USA
      when: 2026
      outcome: ongoing
      note: The best AI agent fully built 27 of 43 formally verified repositories in Lean (August 2026) and closed no specifications on the hardest.
  forecast:
    note: >-
      seL4's proof took about 20 person-years for 8,700 lines of C, against
      2.2 person-years for the kernel; its authors thought a repeat would
      take 6. Mainstream kernels and browsers have tens of millions of lines
      and no formal specifications. AI agents now write Lean proofs at the
      scale of millions of lines, and ARIA's program narrowed its aim to
      AI-built verified software for this reason, but repository-scale
      benchmarks show agents still failing on the hardest specifications.
      Judgment: mid 2030s. A separate node for provable guarantees about AI
      systems themselves is left out: ARIA moved away from that goal and no
      credible checkable version exists yet.
