        url: https://thenextweb.com/news/anthropic-claude-fermat-last-theorem-lean-buzzard
      - title: Lean, Tau Ceti use case
        url: https://lean-lang.org/use-cases/tau-ceti
      - title: AI Weekly, OpenAI publishes 722 AI-generated math preprints on GitHub (October 2026)
        url: https://aiweekly.co/alerts/openai-publishes-722-ai-generated-math-preprints-on-github
      - title: Scientific American, 25 winners of math's Nobel Prize decry the AI invasion of their discipline (September 2026)
        url: https://www.scientificamerican.com/article/25-winners-of-maths-nobel-prize-decry-the-ai-invasion-of-their-discipline/
  sources:
    - title: Anthropic, Formalizing Fermat's Last Theorem (September 2026)
      url: https://www.anthropic.com/research/formalizing-fermats-last-theorem

