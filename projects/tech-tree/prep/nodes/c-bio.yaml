- id: ten-dollar-genome
  name: The $10 genome
  kind: technique
  fields: [biology, medicine]
  date: { window: [2032, 2048], likely: 2038 }
  status: speculative
  tier: 3
  summary: >-
    A 30x human genome for about $10 in sequencing cost (reagents plus
    instrument time), cheaper than most single blood tests.
  requires: [solexa-illumina]
  helped_by: [ultima-genomics, element-aviti, roche-sbx, nanopore-sequencing]
  forecast:
    note: >-
      NHGRI's cost per genome fell about 10x every 2 years in 2008 to 2011,
      then slowed: $1,245 (late 2015) to $525 (2022), a halving about every
      five years. Vendor list prices now claim $80 to $200 (Ultima Solaris
      2025, Illumina NovaSeq X 2022, Element and MGI targets near $100). From
      about $100 in 2025, a halving every 3 to 5 years reaches $10 between
      about 2035 and 2042. Metaculus forecasters expect about $118 for 2026
      and about $64 for 2031 (2021 dollars), which extrapolates to the 2040s.
      Library prep and analysis (now $20 to $50 per sample) would need to
      fall too for an all-in $10 genome, so I put the likely date at 2038.
    sources:
      - title: NHGRI DNA Sequencing Costs Data
        url: https://www.genome.gov/about-genomics/fact-sheets/DNA-Sequencing-Costs-Data
      - title: "Metaculus: human genome sequencing cost in 2026"
        url: https://www.metaculus.com/questions/8909/human-genome-sequencing-cost-in-2026
      - title: "Metaculus: human genome sequencing cost in 2031"
        url: https://www.metaculus.com/questions/11371/human-genome-sequencing-cost-in-2031
  metric: sequencing-cost-per-genome
  sources:
    - title: NHGRI DNA Sequencing Costs Data
      url: https://www.genome.gov/about-genomics/fact-sheets/DNA-Sequencing-Costs-Data

- id: newborn-genome-sequencing
  name: Routine whole-genome sequencing at birth
  kind: institution
  fields: [medicine, biology, society]
  date: { window: [2030, 2045], likely: 2035 }
  status: speculative
  tier: 3
  summary: >-
    Every newborn in a national health system is offered whole-genome
    sequencing as standard screening, replacing or extending the heel-prick
    blood spot test.
  requires: [thousand-dollar-genome, randomized-controlled-trial]
  helped_by: [ten-dollar-genome, deep-learning-genomics]
  efforts:
    - who: Genomics England Generation Study
      where: England
      when: [2024, 2027]
      outcome: ongoing
      note: Aims to sequence 100,000 newborns for about 200 treatable conditions; about half recruited by March 2026.
    - who: BabySeq (Boston), GUARDIAN (New York), and programs in Australia and elsewhere
      where: USA, Australia
      when: [2015, 2026]
      outcome: ongoing
  forecast:
    note: >-
      The technology and cost (about $200 to $500 per genome) are already
      there; the bottlenecks are evidence of benefit, interpretation, consent
      and health-system budgets. England's 10-Year Health Plan states an
      ambition to offer genomic sequencing to all newborns, with reporting
      that it should be universal by about 2035, after the Generation Study
      reports in 2027 to 2028. National programs usually slip, so I put the
      first country-wide routine offer around 2035 and routine use in most
      high-income countries in the 2040s.
    sources:
      - title: Genomics England Generation Study
        url: https://www.genomicsengland.co.uk/initiatives/newborns
      - title: "Generation Study recruitment milestone (Digital Health, March 2026)"
        url: https://www.digitalhealth.net/2026/03/major-genomics-data-study-hits-recruitment-milestone/
  sources:
    - title: Genomics England Generation Study
      url: https://www.genomicsengland.co.uk/initiatives/newborns

- id: synthetic-mammalian-genome
  name: De novo synthesis of a mammalian genome
  kind: technique
  fields: [biology, chemistry]
  date: { window: [2040, 2075], likely: 2052 }
  status: speculative
  tier: 3
  summary: >-
    Chemically writing an entire mammalian genome (about 3 billion base
    pairs) and booting it in a cell, a step beyond reading or editing.
  requires: [synthetic-bacterial-genome, t2t-complete-genome]
  helped_by: [crispr-cas9, long-read-sequencing]
  efforts:
    - who: Synthetic Human Genome Project (SynHG; Jason Chin and others, Wellcome-funded)
      where: UK
      when: [2025, 2030]
      outcome: ongoing
      note: £10 million over five years for tools, aiming at a synthetic human chromosome (about 2 percent of the genome) in five to ten years.
  forecast:
    note: >-
      The largest synthetic genomes grew from 1.08 Mb (2010) to 4 Mb (E. coli,
      2019) and 12 Mb (yeast Sc2.0, 2023): roughly 10x per decade. A mammalian
      genome is about 250x larger than yeast, which at that pace is about 2.4
      decades past 2023, around 2047 to 2050. Repeats, centromeres, chromatin
      and delivery into mammalian cells are much harder than in yeast, while
      DNA synthesis costs (about $0.07 per base for gene-length fragments) must
      fall about 100x more for the cost to be tolerable. SynHG's chromosome
      target in the early 2030s is the next checkpoint.
    sources:
      - title: "Wellcome: new project to pioneer human genome synthesis (2025)"
        url: https://wellcome.org/news/new-project-pioneer-principles-human-genome-synthesis
      - title: "Gibson et al., Science 329:52 (2010)"
        url: https://doi.org/10.1126/science.1190719
  sources:
    - title: "Wellcome: new project to pioneer human genome synthesis (2025)"
      url: https://wellcome.org/news/new-project-pioneer-principles-human-genome-synthesis

- id: aging-reversal
  name: Aging reversal
  kind: technique
  fields: [medicine, biology]
  date: { window: [2040, 2100], likely: 2065 }
  status: speculative
  tier: 2
  summary: >-
    Therapies that reverse biological aging across many tissues, shown in
    trials to restore function and extend healthy human lifespan by a decade
    or more, not just treat single age-related diseases.
  requires: [induced-pluripotent-stem-cells, gene-therapy, randomized-controlled-trial]
  helped_by: [crispr-cas9, deep-learning-genomics, mrna-vaccines]
  efforts:
    - who: Life Biosciences (ER-100, OSK partial reprogramming)
      where: Boston, USA
      when: 2026
      outcome: ongoing
      note: First human trial of partial epigenetic reprogramming, in optic nerve diseases (glaucoma, NAION).
    - who: Altos Labs, Retro Biosciences, NewLimit, Calico
      where: USA
      when: [2013, 2026]
      outcome: ongoing
      note: Altos launched in 2022 with about $3 billion.
  forecast:
    note: >-
      Partial reprogramming reversed aging marks in mice (Ocampo 2016) and
      the first human trial started in 2026, in the eye, where delivery is
      easy. Whole-body rejuvenation needs safe systemic delivery and
      decade-long trials to show lifespan benefit, and no intervention has
      yet extended maximum human lifespan. Metaculus forecasters put
      longevity escape velocity (life expectancy rising a year per year) in
      roughly the 2050s to 2060s. I put a demonstrated, multi-tissue
      rejuvenation therapy with lifespan evidence around 2065, with very wide
      uncertainty.
    sources:
      - title: "Metaculus: when will a country reach longevity escape velocity?"
        url: https://www.metaculus.com/questions/6592/date-life-expectancy-hits-escape-velocity
      - title: "Ocampo et al., Cell 167:1719 (2016)"
        url: https://doi.org/10.1016/j.cell.2016.11.052
      - title: "FDA clears first human trial of epigenetic reprogramming therapy (Longevity.Technology)"
        url: https://longevity.technology/news/fda-clears-first-human-trial-of-epigenetic-reprogramming-therapy/
  sources:
    - title: "Ocampo et al., Cell 167:1719 (2016)"
      url: https://doi.org/10.1016/j.cell.2016.11.052

- id: whole-brain-emulation
  name: Whole-brain emulation
  kind: technique
  fields: [biology, computing]
  date: { window: [2050, 2150], likely: 2085 }
  status: speculative
  tier: 2
  summary: >-
    Scanning a human brain at synaptic resolution and simulating it closely
    enough that the simulation behaves like the person.
  requires: [electron-microscope, deep-learning, single-cell-rna-seq]
  helped_by: [gpu, agi]
  efforts:
    - who: FlyWire Consortium
      where: Princeton and international
      when: 2024
      outcome: achieved
      note: Complete connectome of an adult fruit fly brain, about 140,000 neurons and 50 million synapses.
    - who: MICrONS Consortium
      where: USA
      when: 2025
      outcome: achieved
      note: A cubic millimeter of mouse visual cortex, about 200,000 cells and 500 million synapses, with matched activity recordings.
  forecast:
    note: >-
      The largest complete connectome is a fly brain (2024); a human brain
      has about 600,000 times more neurons and about 10 million times more
      synapses. Mapping volumes have grown about 10x every 5 years with
      automated electron microscopy and AI segmentation, so a mouse brain is
      plausible in the 2030s and a human brain scan in the 2050s to 2060s.
      Knowing the wiring is not enough: molecular state and learning rules
      must be measured too, and it is unproven that a connectome plus models
      reproduces behavior. The Metaculus community median is in the early
      2070s (interquartile range about 2041 to 2200). I lean later, around
      2085.
    sources:
      - title: "Metaculus: when will the first whole human brain be emulated?"
        url: https://www.metaculus.com/questions/2813/date-of-first-human-whole-brain-emulation
      - title: "Dorkenwald et al., FlyWire, Nature 634:124 (2024)"
        url: https://doi.org/10.1038/s41586-024-07558-y
      - title: Mind uploading (Wikipedia, includes Sandberg and Bostrom 2008 roadmap)
        url: https://en.wikipedia.org/wiki/Mind_uploading
  sources:
    - title: "Dorkenwald et al., FlyWire, Nature 634:124 (2024)"
      url: https://doi.org/10.1038/s41586-024-07558-y
