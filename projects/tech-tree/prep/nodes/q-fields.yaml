# Part Q: the thinner fields (physics, chemistry, electronics, society).
# Status as of 2026-11-06.

# ---- physics ----

- id: optical-second
  name: The second redefined by optical clocks
  kind: institution
  fields: [physics, society]
  track: quantum-atomic
  date: { window: [2030.5, 2035], likely: 2030.9 }
  status: ongoing
  tier: 3
  summary: >-
    Replacing the caesium microwave definition of the second, in place since
    1967, with one based on optical atomic clocks, which are now up to 100
    times more accurate than the caesium standard that defines time.
  requires: [atomic-clock, laser]
  helped_by: [gps]
  criterion: >-
    The General Conference on Weights and Measures (CGPM) adopts a new
    definition of the SI second based on one or more optical frequency
    standards.
  efforts:
    - who: BIPM Consultative Committee for Time and Frequency (CCTF)
      where: International
      when: 2026
      outcome: ongoing
      note: The 28th CGPM in October 2026 (Resolution 4) asked for a proposal for the new definition at the 29th CGPM in 2030, with an implementation date.
    - who: JILA, NIST, PTB, NPL, SYRTE, RIKEN and other national labs
      where: USA, Germany, UK, France, Japan
      when: 2024
      outcome: ongoing
      note: JILA's strontium lattice clock reached a systematic uncertainty of 8.1e-19 in 2024.
  forecast:
    note: >-
      The 2026 CGPM did not redefine the second but set 2030 as the target
      for a proposal, noting that the community has not agreed on which atom
      or ensemble to use and that some mandatory criteria, such as better
      international comparisons of optical clocks, are unmet but "could
      realistically be fulfilled by 2030". The CGPM meets every four years,
      so a miss in 2030 means 2034. Judgment: the 2030 CGPM (late 2030), with a real chance of
      slipping to 2034.
    sources:
      - title: BIPM, CGPM 2026 Resolution 4, On the future definition of the second
        url: https://www.bipm.org/en/cgpm-2026/resolution-4
      - title: BIPM, Frequently asked questions concerning the redefinition of the second
        url: https://www.bipm.org/en/faq-redefinition-second
      - title: Aeppli et al., Clock with 8e-19 systematic uncertainty, PRL 133, 023401 (2024)
        url: https://arxiv.org/abs/2403.10664
  sources:
    - title: BIPM, CGPM 2026 Resolution 4, On the future definition of the second
      url: https://www.bipm.org/en/cgpm-2026/resolution-4

- id: nuclear-clock-precision
  name: Nuclear clocks as accurate as atomic clocks
  kind: device
  fields: [physics]
  track: quantum-atomic
  date: { window: [2031, 2045], likely: 2037 }
  status: ongoing
  tier: 3
  summary: >-
    Clocks that tick on a transition inside the thorium-229 nucleus rather
    than in its electrons, which makes them far less sensitive to stray
    fields and a sharp probe of whether constants of nature drift. The first
    working nuclear clocks were reported in October 2026, still about a
    thousand times less stable than the best atomic clocks.
  requires: [atomic-clock, laser]
  helped_by: [optical-second]
  criterion: >-
    A nuclear clock reaches a total systematic uncertainty of 1e-18 or
    better, verified by comparison with optical atomic clocks.
  efforts:
    - who: TU Wien (Thorsten Schumm) with PTB
      where: Austria, Germany
      when: 2026
      outcome: ongoing
      note: Nature, October 2026, a continuous-wave 148 nm laser locked to thorium-229 nuclei in a calcium fluoride crystal, running over 24 hours with instability approaching 1e-15 over a day.
    - who: Tsinghua University and collaborators
      where: China
      when: 2026
      outcome: ongoing
      note: A second nuclear clock synchronized to thorium-229, published in the same issue of Nature.
    - who: JILA (Jun Ye)
      where: USA
      when: 2024
      outcome: ongoing
      note: Measured the thorium-229 transition against a strontium clock with a frequency comb in 2024.
  forecast:
    note: >-
      The two 2026 nuclear clocks run with instability near 1e-15 over a day,
      and their authors expect about four orders of magnitude more stability
      is possible. The best optical clock's systematic uncertainty is 8e-19,
      reached about 20 years after the first optical lattice clocks. Solid
      crystals bring their own shifts, and ion traps for thorium are at an
      earlier stage. Judgment: late 2030s.
    sources:
      - title: Nature Asia press release, first nuclear clocks (October 2026)
        url: https://www.natureasia.com/en/info/press-releases/detail/9455
      - title: Toscani De Col et al., A thorium-229 optical nuclear clock with feedback loop (arXiv 2606.04997)
        url: https://arxiv.org/abs/2606.04997
      - title: Aeppli et al., Clock with 8e-19 systematic uncertainty, PRL 133, 023401 (2024)
        url: https://arxiv.org/abs/2403.10664
  sources:
    - title: Toscani De Col et al., A thorium-229 optical nuclear clock with feedback loop (arXiv 2606.04997)
      url: https://arxiv.org/abs/2606.04997

- id: neutrino-mass-ordering
  name: Neutrino mass ordering settled
  kind: discovery
  fields: [physics]
  track: nuclear-particle
  date: { window: [2029, 2039], likely: 2033 }
  status: ongoing
  tier: 3
  summary: >-
    Finding out whether the third neutrino is the heaviest or the lightest,
    one of the last unknown basic facts of the Standard Model's neutrino
    sector. It decides how to search for whether neutrinos are their own
    antiparticles and how matter could have won over antimatter.
  requires: [standard-model, nuclear-reactor, particle-accelerator]
  helped_by: [big-science]
  criterion: >-
    One experiment, or a combined analysis published by the experiments'
    own collaborations, rejects one of the two mass orderings at 5 sigma or
    more.
  efforts:
    - who: JUNO (Jiangmen Underground Neutrino Observatory)
      where: China
      when: 2025
      outcome: ongoing
      note: A 20,000 tonne reactor neutrino detector that began taking data in August 2025; about 3 sigma alone after about 6.5 years.
    - who: IceCube Upgrade; KM3NeT/ORCA
      where: Antarctica, Mediterranean
      when: 2026
      outcome: ongoing
      note: Atmospheric neutrino detectors; combined with JUNO, studies project 5 sigma within 2 to 7 years of joint data.
    - who: DUNE (Fermilab); Hyper-Kamiokande
      where: USA, Japan
      when: 2031
      outcome: ongoing
      note: Hyper-Kamiokande expects beam data from 2028 and DUNE from about 2031; DUNE aims for 5 sigma within a few years of beam.
  forecast:
    note: >-
      Outside reanalyses of JUNO's first data and global fits favor the
      normal ordering at roughly 2 to 3 sigma. JUNO alone reaches about 3
      sigma after 6.5 years; combined with IceCube Upgrade or ORCA, studies
      project 5 sigma within 2 to 7 years, and DUNE could get there within a
      few years of first beam around 2031 or 2032. Combined fits across
      collaborations can take years to publish. Judgment: about 2033.
    sources:
      - title: Lessons from the first JUNO results (arXiv 2601.09791)
        url: https://arxiv.org/abs/2601.09791
      - title: Combined sensitivity to the neutrino mass ordering with JUNO, the IceCube Upgrade, and PINGU (PRD 2020)
        url: https://jyx.jyu.fi/handle/123456789/68286
      - title: Combined sensitivity of JUNO and KM3NeT/ORCA to the neutrino mass ordering (arXiv 2108.06293)
        url: https://arxiv.org/abs/2108.06293
      - title: DUNE status and science (PoS 2025)
        url: https://pos.sissa.it/485/180/
  sources:
    - title: Lessons from the first JUNO results (arXiv 2601.09791)
      url: https://arxiv.org/abs/2601.09791

- id: space-gravitational-wave-detection
  name: Gravitational waves detected from space
  kind: discovery
  fields: [physics, engineering]
  track: astronomy
  date: { window: [2036, 2046], likely: 2038 }
  status: ongoing
  tier: 2
  summary: >-
    Three spacecraft millions of kilometres apart, swapping laser beams, to
    hear the slow gravitational waves of merging giant black holes and tight
    binary stars, a band no detector on the ground can reach.
  requires: [gravitational-wave-detection, laser, satellites]
  helped_by: [big-science]
  criterion: >-
    A space-based interferometer (LISA, Taiji or TianQin) detects
    gravitational waves in the millihertz band from any source, and the
    result is published.
  efforts:
    - who: ESA LISA (with NASA; prime contractor OHB)
      where: Europe, USA
      when: 2024
      outcome: ongoing
      note: Adopted in January 2024 for launch on an Ariane 6 in 2035. OHB's prime contract was signed in June 2025. The White House proposed ending NASA's share in 2026 and 2027; Congress kept it for 2026, and ESA began buying European replacements in 2025 and 2026.
    - who: Chinese Academy of Sciences (Taiji); Sun Yat-sen University (TianQin)
      where: China
      when: 2026
      outcome: rival
      note: Both aim to fly full constellations around 2035; precursor satellites have flown.
  forecast:
    note: >-
      LISA's launch is set for 2035, and resolved galactic binaries should
      show up soon after it reaches its orbit and starts science. Large ESA
      missions often slip a few years, and the loss of NASA's lasers and
      telescopes would add risk; a Manifold market gives 38 percent to a
      launch in 2035. China's Taiji or TianQin could get there first.
      Judgment: about 2038.
    sources:
      - title: ESA, Capturing the ripples of spacetime, LISA gets go-ahead (January 2024)
        url: https://www.esa.int/Science_Exploration/Space_Science/Capturing_the_ripples_of_spacetime_LISA_gets_go-ahead
      - title: European Spaceflight, ESA begins developing replacements for NASA's contributions to LISA (May 2026)
        url: https://europeanspaceflight.com/?p=6457
      - title: TianQin project site
        url: https://tianqin.sysu.edu.cn/en
  sources:
    - title: ESA, Capturing the ripples of spacetime, LISA gets go-ahead (January 2024)
      url: https://www.esa.int/Science_Exploration/Space_Science/Capturing_the_ripples_of_spacetime_LISA_gets_go-ahead

- id: higgs-factory
  name: A Higgs factory collider
  kind: infrastructure
  fields: [physics]
  track: nuclear-particle
  date: { window: [2042, 2065], likely: 2048 }
  status: ongoing
  tier: 3
  summary: >-
    The next big collider after the LHC: an electron-positron machine that
    makes millions of Higgs bosons in clean collisions, to measure them
    precisely enough to see cracks in the Standard Model. CERN's 91 km
    FCC-ee is the lead design.
  requires: [higgs-boson, particle-accelerator, cern]
  helped_by: [superconductivity, big-science]
  criterion: >-
    A new electron-positron collider designed to produce Higgs bosons
    (FCC-ee, CEPC, ILC or a linear collider at CERN) starts colliding beams
    for physics.
  efforts:
    - who: CERN (Future Circular Collider, FCC-ee)
      where: Switzerland, France
      when: 2026
      outcome: ongoing
      note: The CERN Council named FCC-ee the preferred next flagship in May 2026 and aims for a go or no-go decision by 2028; the feasibility study costs it at CHF 15.3 billion with about 15 years of construction from the early 2030s.
    - who: IHEP (Circular Electron Positron Collider, CEPC)
      where: China
      when: 2026
      outcome: rival
      note: Reported not included in China's 15th five-year plan (2026 to 2030); the study group still aims for a Higgs factory before 2040.
    - who: International Linear Collider proponents
      where: Japan
      when: 2026
      outcome: rival
  forecast:
    note: >-
      If CERN approves FCC-ee in 2028 and construction takes about 15 years
      from the early 2030s, collisions would start in the mid to late 2040s,
      and big projects of this kind usually run late. CEPC could be faster
      but lost its place in the current five-year plan, and the ILC has
      waited for Japanese approval since 2013. Judgment: about 2048, with a
      real chance that none is built.
    sources:
      - title: CERN Courier, CERN Council updates the European Strategy (2026)
        url: https://cerncourier.com/cern-council-updates-the-european-strategy/
      - title: CERN Courier, FCC feasibility study complete (2025)
        url: https://cerncourier.com/a/fcc-feasibility-study-complete/
      - title: Jianchun Wang, HEP in China, DPF 2026
        url: https://indico.fnal.gov/event/72820/contributions/345950/attachments/200117/279027/Dpf2026-Hepinchina-Jianchun%20Wang.pdf
  sources:
    - title: CERN Courier, FCC feasibility study complete (2025)
      url: https://cerncourier.com/a/fcc-feasibility-study-complete/

- id: dark-matter-identified
  name: Dark matter identified
  kind: discovery
  fields: [physics]
  track: nuclear-particle
  date: { window: [2032, 2080], likely: 2050 }
  status: speculative
  tier: 2
  summary: >-
    Catching dark matter, about 85 percent of the matter in the universe, in
    a detector rather than only through its gravity, and so learning what it
    is made of. Decades of searches for WIMPs and axions have found nothing
    convincing, and xenon detectors are nearing the floor set by neutrinos.
  requires: [standard-model]
  helped_by: [particle-accelerator, superconducting-qubits, big-science, ai-autonomous-science]
  criterion: >-
    A non-gravitational detection of dark matter at 5 sigma or more by one
    experiment, confirmed by an independent experiment or method, that
    physicists broadly accept as identifying what at least most dark matter
    is.
  efforts:
    - who: LZ (LUX-ZEPLIN); XENONnT; PandaX-4T
      where: USA, Italy, China
      when: 2025
      outcome: ongoing
      note: LZ published record limits from 4.2 tonne-years in 2025 and runs to about 2028.
    - who: XLZD consortium (XENON, LZ and DARWIN)
      where: International
      when: 2026
      outcome: ongoing
      note: A planned 60 to 80 tonne xenon detector that would reach the neutrino fog for WIMPs, aiming to run in the 2030s.
    - who: ADMX and other axion searches
      where: USA, worldwide
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      Metaculus forecasters give 58 percent to a Nobel Prize for explaining
      dark matter before 2050, which implies a discovery well before then,
      but that is the most optimistic reading. WIMP searches will reach the
      neutrino floor in the 2030s with XLZD; if nothing turns up, the
      remaining candidates (axions, light or ultralight dark matter) need
      many different experiments, and some forms may never be detectable.
      Judgment: about 2050, with a large chance of never.
    sources:
      - title: "Metaculus: Will we know what dark matter is before 2050?"
        url: https://www.metaculus.com/questions/1469/will-we-know-what-dark-matter-is-before-2050/
      - title: Berkeley Lab, LZ's record-setting limits on dark matter interaction published in PRL (2025)
        url: https://www.physics.lbl.gov/lz-results-published-in-prl/
      - title: The XLZD Design Book (arXiv 2410.17137)
        url: https://arxiv.org/abs/2410.17137
  sources:
    - title: The XLZD Design Book (arXiv 2410.17137)
      url: https://arxiv.org/abs/2410.17137

# ---- chemistry ----

- id: electrolytic-ammonia-tenth
  name: A tenth of ammonia made without fossil hydrogen
  kind: technique
  fields: [chemistry, energy, agriculture]
  track: industrial-chemistry
  date: { window: [2031, 2048], likely: 2036 }
  status: ongoing
  tier: 2
  summary: >-
    Making ammonia, the base of nitrogen fertilizer, from hydrogen split
    out of water with clean electricity instead of hydrogen from natural
    gas or coal. Haber-Bosch ammonia now accounts for about 2 percent of
    the world's final energy use and 450 million tonnes of CO2 a year;
    electrolytic ammonia is a fraction of a percent of output, with the
    first giant plant, NEOM in Saudi Arabia, in commissioning.
  requires: [haber-bosch, electrolysis, wind-power, solar-photovoltaic]
  helped_by: [carbon-pricing, solar-power-5-cents-kwh, ai-discovered-material]
  criterion: >-
    In some calendar year, ammonia made with hydrogen from water
    electrolysis powered by low-carbon electricity, or by direct
    electrochemical reduction of nitrogen, is at least 10 percent of world
    ammonia production (about 19 million tonnes of roughly 190 million), by
    the IEA's, IFA's or the Ammonia Energy Association's count.
  efforts:
    - who: NEOM Green Hydrogen Company (ACWA Power, Air Products, NEOM)
      where: Saudi Arabia
      when: 2027
      outcome: ongoing
      note: About 1.2 million tonnes of ammonia a year from 2.2 GW of electrolyzers; construction finished in August 2026 and first ammonia is planned for 2027.
    - who: Ammonia plants in India, China and Denmark using electrolytic hydrogen
      where: India, China, Denmark
      when: 2025
      outcome: ongoing
      note: A 1 million tonne a year plant in India reached investment decision in 2024; a 5,000 tonne flexible plant started in Denmark in 2025.
    - who: Jupiter Ionics; academic groups on lithium-mediated nitrogen reduction
      where: Australia, Denmark, USA
      when: 2026
      outcome: ongoing
      note: Direct electrochemical routes skip separate hydrogen production but are still at lab or small pilot scale.
  forecast:
    note: >-
      The Ammonia Energy Association counted 0.2 million tonnes of
      low-emission ammonia capacity operating in late 2024 and expects 15.1
      million tonnes of electrolysis-based capacity by 2030, from projects
      that are operating, under construction or mature. The IEA is less
      hopeful: its 2025 review cut announced low-emission hydrogen for 2030
      from 49 to 37 million tonnes, with only about 4 million tonnes from
      projects already built or financed, across all uses. Ten percent of
      ammonia needs about 3.4 million tonnes of electrolytic hydrogen, a
      third of the tree's green hydrogen bar, and ammonia is its largest
      ready market. The work is mostly building plants and finding buyers
      for a product that costs two to three times more. Judgment: mid 2030s.
    sources:
      - title: Ammonia Energy Association, Low-Emission Ammonia Plants executive summary (November 2024)
        url: https://ammoniaenergy.org/wp-content/uploads/2024/12/AEA-LEAP-Executive-Summary-November-2024.pdf
      - title: IEA, Global Hydrogen Review 2025, production highlights
        url: https://www.iea.org/reports/global-hydrogen-review-2025/production-highlights-2
      - title: IEA, Ammonia Technology Roadmap, executive summary
        url: https://www.iea.org/reports/ammonia-technology-roadmap/executive-summary
      - title: Decarbonfuse, NEOM green hydrogen megaproject enters commissioning ahead of 2027 start (August 2026)
        url: https://decarbonfuse.com/posts/neom-green-hydrogen-megaproject-enters-commissioning-ahead-of-2027-start
  sources:
    - title: IEA, Ammonia Technology Roadmap, executive summary
      url: https://www.iea.org/reports/ammonia-technology-roadmap/executive-summary
    - title: Ammonia Energy Association, Low-Emission Ammonia Plants executive summary (November 2024)
      url: https://ammoniaenergy.org/wp-content/uploads/2024/12/AEA-LEAP-Executive-Summary-November-2024.pdf

- id: enzymatic-plastic-recycling
  name: Enzymatic plastic recycling at commercial scale
  kind: technique
  fields: [chemistry, biology, materials]
  track: industrial-chemistry
  date: { window: [2028.5, 2037], likely: 2031.5 }
  status: ongoing
  tier: 3
  summary: >-
    Breaking plastic waste back into its building blocks with engineered
    enzymes, so it can be made into new plastic as good as virgin, including
    colored bottles and polyester clothing that melt recycling can't take.
    An engineered enzyme depolymerized 90 percent of PET in 10 hours in
    2020, but the first commercial plants have slipped for lack of
    financing.
  requires: [plastics, de-novo-protein-design]
  helped_by: [protein-structure-prediction, carbon-pricing, autonomous-labs]
  criterion: >-
    A plant that breaks down plastic waste with enzymes, with a capacity of
    at least 20,000 tonnes of waste a year, runs commercially and sells
    recycled monomer or polymer for a full calendar year.
  efforts:
    - who: Carbios, Longlaville plant
      where: France
      when: 2026
      outcome: ongoing
      note: A 50,000 tonne a year PET plant, permitted in 2023 and postponed in 2024; in August 2026 it missed its September financial close target and gave no new start date (previously the first half of 2028).
    - who: Samsara Eco
      where: Australia
      when: 2025
      outcome: ongoing
      note: Opened a first small plant in Jerrabomberra in September 2025 for nylon 6,6 and polyester; plans a 20,000 tonne nylon plant in Asia for 2028.
    - who: Protein Evolution; Epoch Biodesign; academic enzyme engineers
      where: USA, UK
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      The enzymes work at industrial rates (Tournier and colleagues reached
      16.7 grams of terephthalate per litre per hour), so what is left is
      financing, building and competing with cheap virgin PET. Carbios has
      had permits since 2023 and over half its output presold but has
      missed financing dates twice; once financed, its plant was planned to
      take about two years to build. Samsara Eco targets 2028 for its first
      large plant, and announced dates like these usually slip. Counting a
      full year of sales after start-up: about 2031 or 2032.
    sources:
      - title: Tournier et al., An engineered PET depolymerase to break down and recycle plastic bottles, Nature 2020
        url: https://doi.org/10.1038/s41586-020-2149-4
      - title: Petnology, Carbios updates on further delay to recycling plant project (August 2026)
        url: https://www.petnology.com/online/news-detail/carbios-updates-on-further-delay-to-recycling-plant-project
      - title: CHEManager, Carbios confirms Longlaville plant plans while revising project schedule (January 2026)
        url: https://www.chemanager-online.com/en/news/carbios-confirms-longlaville-plant-plans-while-revising-project-schedule
      - title: Environment+Energy Leader, Samsara Eco opens first enzymatic recycling plant (September 2025)
        url: https://www.environmentenergyleader.com/stories/samsara-eco-opens-first-enzymatic-recycling-plant,91072
  sources:
    - title: Tournier et al., An engineered PET depolymerase to break down and recycle plastic bottles, Nature 2020
      url: https://doi.org/10.1038/s41586-020-2149-4
    - title: Indian Chemical News, Carbios obtains building and operating permits (October 2023)
      url: https://www.indianchemicalnews.com/sustainability/carbios-obtains-building-and-operating-permits-for-worlds-first-pet-biorecycling-plant-in-longlaville-19364

- id: automated-synthesis-on-demand
  name: Small molecules made on demand by machine
  kind: technique
  fields: [chemistry, computing]
  track: classical-chemistry
  date: { window: [2029, 2042], likely: 2033 }
  status: ongoing
  tier: 2
  summary: >-
    A machine that takes the structure of a small molecule, plans a route to
    it, and runs the reactions and purification itself, the way a DNA
    synthesizer turned genes into something you order. Robots have made
    handfuls of known drugs from programmed or AI-planned routes since 2019,
    but people still choose conditions and fix failures.
  requires: [chromatography, deep-learning, robot-foundation-models]
  helped_by: [autonomous-labs, ai-autonomous-science, agi, large-language-models]
  criterion: >-
    A system, given only target structures, plans routes and makes at least
    half of a randomly chosen set of 100 drug-like molecules of three or
    more steps, including ones never made before, at 10 milligrams or more
    and 95 percent purity, with no person handling samples or editing
    routes, and the capability is offered as a commercial service.
  efforts:
    - who: Lee Cronin (University of Glasgow) and Chemify
      where: UK
      when: 2025
      outcome: ongoing
      note: The Chemputer ran three pharmaceutical syntheses from a chemical programming language in 2019; Chemify opened its automated Chemifarm in Glasgow in June 2025.
    - who: Connor Coley, Klavs Jensen (MIT)
      where: USA
      when: 2019
      outcome: ongoing
      note: Paired AI retrosynthesis with a robotic flow platform for 15 medicinal compounds, with people still supplying practical details such as solvents.
    - who: Martin Burke (University of Illinois)
      where: USA
      when: 2015
      outcome: ongoing
      note: Iterative coupling of standard building blocks in one automated process.
    - who: Onepot AI; Lilly and other drug companies' automated chemistry labs
      where: USA
      when: 2025
      outcome: ongoing
      note: Onepot raised a 13 million dollar seed round in November 2025 for an automated synthesis lab selling compounds from a catalog.
  forecast:
    note: >-
      The pieces exist separately: AI route planning, robots that run
      written procedures, and building-block chemistry that covers some
      structure classes. What fails is the long tail of reactions that need
      a chemist's judgment and purification of messy mixtures. This is
      mostly design and lab work, where AI planning and self-driving labs
      help most, so an early general AI would pull it forward. I found no
      outside forecast. Judgment: early 2030s.
    sources:
      - title: Coley et al., A robotic platform for flow synthesis of organic compounds informed by AI planning, Science 2019
        url: https://doi.org/10.1126/science.aax1566
      - title: Steiner et al., Organic synthesis in a modular robotic system driven by a chemical programming language, Science 2019
        url: https://doi.org/10.1126/science.aav2211
      - title: Li et al., Synthesis of many different types of organic small molecules using one automated process, Science 2015
        url: https://doi.org/10.1126/science.aaa5414
      - title: Manufacturing Chemist, Chemify launches Chemifarm (June 2025)
        url: https://manufacturingchemist.com/chemify-launches-chemifarm-molecular-design-synthesis
      - title: TechCrunch, Onepot AI raises 13M (November 2025)
        url: https://techcrunch.com/2025/11/19/onepot-ai-raises-13m-to-help-make-chemical-drug-creation-easier
  sources:
    - title: Steiner et al., Organic synthesis in a modular robotic system driven by a chemical programming language, Science 2019
      url: https://doi.org/10.1126/science.aav2211

- id: solar-fuels-at-scale
  name: Fuel made directly from sunlight at scale
  kind: technique
  fields: [chemistry, energy]
  track: industrial-chemistry
  date: { window: [2033, 2060], likely: 2042 }
  status: speculative
  tier: 3
  summary: >-
    Artificial photosynthesis and its cousins: making hydrogen or carbon
    fuels from sunlight, water and CO2 in one step, by photocatalysts,
    photoelectrochemical cells or concentrated solar heat, instead of solar
    panels feeding an electrolyzer. A 100 square meter photocatalytic array
    ran safely for months in 2021 at 0.76 percent efficiency, and
    Synhelion's solar-heat plant in Germany makes a few thousand liters a
    year.
  requires: [semiconductor-physics, thermodynamics, electrolysis]
  helped_by: [ai-discovered-material, autonomous-labs, carbon-pricing]
  competes: [green-hydrogen]
  criterion: >-
    Plants that turn sunlight into hydrogen or a liquid or gaseous fuel
    without first making electricity (photocatalysis, photoelectrochemistry
    or solar thermochemistry) together sell at least 100,000 tonnes of fuel
    in a year.
  efforts:
    - who: Kazunari Domen and Japan's ARPChem consortium
      where: Japan
      when: 2021
      outcome: ongoing
      note: 100 square meter photocatalytic panel array with hydrogen separation, maximum 0.76 percent solar to hydrogen.
    - who: Synhelion (DAWN, Jülich; RISE, Spain)
      where: Switzerland, Germany, Spain
      when: 2027
      outcome: ongoing
      note: DAWN has made syncrude since 2024; RISE, planned at 1,000 tonnes of fuel a year, was due to start in 2027.
    - who: Liquid Sunlight Alliance (Caltech, Berkeley Lab); EPFL; Osaka Metropolitan University and others
      where: USA, Switzerland, Japan
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      Photocatalytic water splitting is about 1 percent efficient at scale
      against about 30 percent for solar cells plus electrolysis in the
      lab, so it must win on cost per square meter, and the gap to cheap
      panels keeps widening. Solar thermochemistry is closer to market, but
      the first commercial plant is planned at 1,000 tonnes a year, a
      hundredth of the bar. Better photocatalysts found by AI-run searches
      are the main hope for a faster path. Judgment: 2040s, and it may lose
      to panels plus electrolyzers entirely.
    sources:
      - title: Nishiyama et al., Photocatalytic solar hydrogen production from water on a 100-m2 scale, Nature 2021
        url: https://doi.org/10.1038/s41586-021-03907-3
      - title: Synhelion, our plants
        url: https://synhelion.com/our-plants
      - title: pv magazine, Synhelion to start producing solar fuels in Spain in 2027 (January 2025)
        url: https://www.pv-magazine.com/?p=39671
  sources:
    - title: Nishiyama et al., Photocatalytic solar hydrogen production from water on a 100-m2 scale, Nature 2021
      url: https://doi.org/10.1038/s41586-021-03907-3

