      url: https://www.tomshardware.com/tech-industry/semiconductors/tsmc-unveils-process-technology-roadmap-through-2029-a12-a13-n2u-announced-a16-slips-to-2027

- id: co-packaged-optics
  name: Co-packaged optics at scale
  kind: technique
  fields: [electronics, computing]
  track: communication
  date: { window: [2029, 2036], likely: 2031 }
  status: ongoing
  tier: 3
  summary: >-
    Putting the lasers and optical links in the same package as a switch or
    AI chip, instead of in plug-in modules at the edge of the board. It cuts
    the power spent moving data several times over and lets AI systems
    spread one fast network across many racks.
  requires: [optical-fiber, advanced-packaging, ai-datacenters]
  helped_by: [ai-accelerators]
  criterion: >-
    Co-packaged optics make up at least a third of the optical links
    (by units or by value) shipped into AI data centers in a year, as
    reported by a major market analyst such as TrendForce, LightCounting or
    Cignal AI.
  efforts:
    - who: Nvidia (Quantum-X and Spectrum-X Photonics switches); TSMC (COUPE)
      where: USA, Taiwan
      when: 2026
      outcome: ongoing
      note: Nvidia's co-packaged switches entered production in 2026; it plans optical NVLink, as an option beside copper, with Feynman systems shipping mid to late 2028.
    - who: Broadcom; Ayar Labs; Lightmatter; Huawei (near-packaged optics)
      where: USA, China
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      TrendForce put co-packaged optics at about 0.5 percent of AI data
      center optical modules in 2026 and said they could reach about 35
      percent around 2030, with the jump coming when the GPU-to-GPU network
      itself goes optical across racks (Rubin Ultra or Feynman). Its June
      2026 forecast has co-packaged and near-packaged optics at over 39
      billion dollars in 2030 against 26 billion for plug-in modules.
      Yield, serviceability and laser supply are the stated obstacles, and
      copper stays cheaper inside a rack. Judgment: 2031.
    sources:
      - title: TrendForce, NVIDIA architecture drives optical interconnects (March 2026)
        url: https://www.trendforce.com/presscenter/news/20260311-12962.html
      - title: TrendForce, optical interconnects and the CPO and NPO market to 2030 (June 2026)
        url: https://trendforce.com/presscenter/news/20260615-13098.html
      - title: The Register, Nvidia optical scale-up (April 2026)
        url: https://www.theregister.com/2026/04/05/nvidia_optical_scale_up/
  sources:
    - title: TrendForce, NVIDIA architecture drives optical interconnects (March 2026)
      url: https://www.trendforce.com/presscenter/news/20260311-12962.html

- id: atomically-thin-transistors
  name: Transistors with 2D-material channels
  kind: technique
  fields: [electronics, materials]
  track: components
  date: { window: [2034, 2050], likely: 2041 }
  status: speculative
  tier: 3
  summary: >-
    Transistors whose channel is a single layer of atoms of a material such
    as molybdenum disulfide, instead of silicon, which stops conducting well
    when made only a few nanometers thick. It is the industry's planned way
    to keep shrinking after silicon stacked transistors.
  requires: [gate-all-around, euv-lithography]
  helped_by: [cfet-transistors, ai-discovered-material, autonomous-labs]
  criterion: >-
    Commercial chips made in high-volume manufacturing use transistors with
    two-dimensional semiconductor channels (MoS2, WSe2 or similar) for at
    least part of their logic.
  efforts:
    - who: imec, ASML and TSMC
      where: Belgium, Netherlands, Taiwan
      when: 2026
      outcome: ongoing
      note: Made MoS2 n-type and WSe2 p-type transistors on the same 300 mm wafer at 50 nm contacted poly pitch, with 94 percent working (VLSI Symposium, June 2026).
    - who: Fudan University (Peng Zhou, Wenzhong Bao)
      where: China
      when: 2025
      outcome: ongoing
      note: RV32-WUJI, a 32-bit RISC-V processor of 5,900 MoS2 transistors, n-type only and running at kilohertz speeds (Nature, April 2025).
  forecast:
    note: >-
      imec plans to bring 2D materials in first as planar devices at its A7
      node, and its 2026 roadmap has 2D transistors as the main logic device
      at A2, in 2043. Device-quality growth, low-resistance contacts, gate
      oxides and good p-type channels are unsolved at scale, and new
      transistor types have usually taken more than a decade from first
      demonstration to production. Judgment: early 2040s.
    sources:
      - title: imec, Introducing 2D-material based devices in the logic scaling roadmap (January 2025)
        url: https://www.imec-int.com/en/articles/introducing-2d-material-based-devices-logic-scaling-roadmap
      - title: Semiconductor Today, imec, ASML and TSMC 300 mm 2D transistor integration (June 2026)
        url: https://semiconductor-today.com/news_items/2026/jun/imec-asml-tsmc-220626.shtml
      - title: Semiconductor Today, Fudan 2D RISC-V processor (April 2025)
        url: https://www.semiconductor-today.com/news_items/2025/apr/fudan-170425.shtml
      - title: Wccftech, imec logic roadmap (May 2026)
        url: https://wccftech.com/sub-1nm-process-node-technology-wont-arrive-till-2034-logic-roadmap-2dfets-sub-0-2nm-2046/
  sources:
    - title: imec, Introducing 2D-material based devices in the logic scaling roadmap (January 2025)
      url: https://www.imec-int.com/en/articles/introducing-2d-material-based-devices-logic-scaling-roadmap

- id: 6g-networks
