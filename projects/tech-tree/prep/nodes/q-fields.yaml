- id: one-nm-class-logic
  name: 1 nm-class chips in volume production
  kind: technique
  fields: [electronics]
  track: chipmaking
  date: { window: [2030, 2034], likely: 2031 }
  status: ongoing
  tier: 3
  summary: >-
    Logic processes that foundries call 1 nanometer class (TSMC's A10, or
    the like), two generations after 2 nm. The names no longer describe any
    real feature size, but each step still packs in more transistors per
    watt, which is what AI chips are limited by.
  requires: [gate-all-around, backside-power-delivery, euv-lithography]
  helped_by: [high-na-euv, cfet-transistors, ai-discovered-material]
  criterion: >-
    A foundry ships commercial chips in high-volume manufacturing on a logic
    process it markets as 1 nm class or smaller (TSMC A10, Intel 10A,
    Samsung SF1.0 or similar names).
  efforts:
    - who: TSMC (A14, A13, A12, A10)
      where: Taiwan
      when: 2026
      outcome: ongoing
      note: A14 is due in volume in 2028 and A13 and A12 in 2029; trial A10 production of about 5,000 wafers a month was reported as planned for 2029.
    - who: Intel (14A); Samsung
      where: USA, South Korea
      when: 2026
      outcome: ongoing
      note: Intel targets 14A risk production in the second half of 2027 and volume in 2028, but says it needs an outside customer to continue past 14A.
  forecast:
    note: >-
      TSMC's April 2026 roadmap runs to A12 and A13 in 2029, and Digitimes,
      via 3DNews, reported A10 trial production planned for 2029, which
      usually means volume about a year later. imec's 2026 roadmap puts its
      A10 node in 2031. TSMC's A16 slipped about a year, from 2026 to 2027,
      so I allow for slips. Judgment: 2031.
    sources:
      - title: Tom's Hardware, TSMC unveils process technology roadmap through 2029 (April 2026)
        url: https://www.tomshardware.com/tech-industry/semiconductors/tsmc-unveils-process-technology-roadmap-through-2029-a12-a13-n2u-announced-a16-slips-to-2027
