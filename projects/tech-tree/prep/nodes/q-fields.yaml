      - title: Wccftech, imec logic roadmap (May 2026)
        url: https://wccftech.com/sub-1nm-process-node-technology-wont-arrive-till-2034-logic-roadmap-2dfets-sub-0-2nm-2046/
      - title: Tom's Hardware, Intel commits to 14A mass production in 2028
        url: https://www.tomshardware.com/pc-components/cpus/intel-commits-to-14a-mass-production-in-2028-as-its-sales-rise-25-percent-year-over-year
  sources:
