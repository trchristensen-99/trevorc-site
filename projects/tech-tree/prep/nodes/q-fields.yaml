# ---- society ----
# Society and institutions: draft future nodes. Status as of 2026-11-06.

- id: ai-verification-treaty
  name: Verified international limits on frontier AI
  kind: institution
  fields: [society, computing]
  track: law-governance
  date: { window: [2029, 2055], likely: 2037 }
  status: speculative
  tier: 2
  summary: >-
    A binding agreement between the leading AI powers that limits frontier
    AI development, for example by a cap on training compute, and lets each
    side check the other through inspections, chip tracking or
    cryptographic proofs of what a data center ran. It would be to AI what
    arms control verification was to nuclear weapons.
  requires: [ai-safety-institutes, frontier-models]
  helped_by: [ai-accelerators, ai-datacenters, earth-observation, public-key-cryptography, agi]
  criterion: >-
    The United States and China, at least, are parties to a treaty or
    binding executive agreement in force that sets limits on frontier AI
    training or deployment (such as a compute threshold) and provides for
    verification beyond self-reporting: on-site inspection, hardware-based
    chip tracking or attestation, or an international monitoring body with
    access to data centers.
  efforts:
    - who: Council of Europe Framework Convention on AI
      where: Europe, USA, others
      when: 2024
      outcome: ongoing
      note: The first binding AI treaty, on human rights and the rule of law; it has no compute limits or verification.
    - who: US and China bilateral AI dialogue (Treasury Secretary Bessent, Vice Premier He Lifeng)
      where: USA, China
      when: 2026
      outcome: ongoing
      note: Agreed in September 2026; CNAS judged neither side ready for an ambitious safety agreement.
    - who: MIRI technical governance team; CNAS; RAND and start-ups building verification tools
      where: USA, UK
      when: 2026
      outcome: ongoing
      note: CNAS put the number of engineers working on AI verification worldwide at about 50.
  forecast:
    note: >-
      No agreement limits frontier AI today. Metaculus forecasters gave about
      8 percent to any formal US and China agreement limiting frontier AI
      before 2029, and about 5 percent to an AGI-limiting treaty before 2030,
      neither requiring verification. A 2026 review of hardware mechanisms
      found the ones a treaty most needs, such as on-chip compute metering
      and proofs of training, are the least mature. Nuclear arms control took
      27 years from the first bomb to the first agreed limits checked by satellite (SALT
      I, 1972). Pressure should rise sharply once AI is general, which the
      tree puts around 2031, but rivalry and the gains from racing push the
      other way. Judgment: late 2030s, with a long tail.
    sources:
      - title: "Metaculus: US and China reach an agreement to limit frontier AI development before 2029?"
        url: https://www.metaculus.com/questions/38418/
      - title: "Metaculus: US-China AGI-limiting treaty signed before 2030?"
        url: https://www.metaculus.com/questions/39149/
      - title: CNAS, U.S.-China AI agreements need verification, not trust (September 2026)
        url: https://www.cnas.org/publications/cnas-insights/cnas-insights-u-s-china-ai-agreements-need-verification-not-trust
      - title: Hardware-level governance of AI compute, a feasibility taxonomy for regulatory compliance and treaty verification (arXiv 2604.04712)
        url: https://arxiv.org/pdf/2604.04712
  sources:
    - title: MIRI, Mechanisms to verify international agreements about AI development (2026)
      url: https://intelligence.org/2026/03/18/mechanisms-to-verify-international-agreements-about-ai-development/
    - title: Council of Europe, Framework Convention on Artificial Intelligence
      url: https://www.coe.int/en/web/artificial-intelligence/the-framework-convention-on-artificial-intelligence

- id: carbon-price-majority
  name: A carbon price on most of the world's emissions
  kind: institution
  fields: [society, energy]
  track: law-governance
  date: { window: [2033, 2060], likely: 2042 }
  status: ongoing
  tier: 3
  summary: >-
    Carbon taxes and emissions trading spreading until most of the world's
    greenhouse gases carry a price. Coverage rose from about 12 percent to
    29 percent in a decade, mostly when China's national market started; the
    rest needs the United States, India and other large emitters, and
    farming and methane.
  requires: [carbon-pricing]
  helped_by: [ipcc, earth-observation]
  criterion: >-
    The World Bank's State and Trends of Carbon Pricing reports that direct
    carbon pricing (emissions trading systems and carbon taxes in force)
    covers at least 50 percent of global greenhouse gas emissions.
  efforts:
    - who: China national emissions trading system
      where: China
      when: 2026
      outcome: ongoing
      note: Added steel, cement and aluminum in 2025; plans to cover all major industrial emitters by 2027 and move to absolute caps by 2030.
    - who: India Carbon Credit Trading Scheme; Japan GX-ETS; Brazil, Indonesia and Turkey markets in development
      where: Asia, South America
      when: 2026
      outcome: ongoing
    - who: Global Carbon Pricing Challenge (Canada, Chile, EU and others)
      where: International
      when: 2021
      outcome: ongoing
      note: Aims for 60 percent of global emissions to be priced by 2030.
  forecast:
    note: >-
      The World Bank's 2026 report puts coverage at just over 29 percent,
      rising to about a third if instruments under development in several
      large emerging economies start, from 28 percent a year earlier and
      about 12 percent a decade before. At the decade's pace of about 1.6
      points a year, half would come around 2040. Most of what is left is
      in countries with no national price (the United States, Russia, much
      of South Asia and Africa) and in farming and methane, which are hard
      to measure and price. A small Metaculus group, counting only CO2 from
      Our World in Data, gave a median of 2036. Canada's 60 percent by 2030
      goal will be missed by a wide margin. Judgment: early 2040s.
    sources:
      - title: World Bank, Direct carbon pricing covers nearly one third of global emissions (May 2026)
        url: https://www.worldbank.org/en/news/press-release/2026/05/19/direct-carbon-pricing-covers-nearly-one-third-of-global-emissions
      - title: Balkan Green Energy News, World Bank says carbon pricing schemes cover 28 percent of global emissions (2025 report)
        url: https://balkangreenenergynews.com/world-bank-carbon-pricing-schemes-cover-28-of-global-emissions/
      - title: "Metaculus: When will a carbon price be paid on 50% or more of the world's carbon emissions?"
        url: https://www.metaculus.com/questions/22546/
      - title: Climate Cooperation China, China unveils roadmap for absolute emission caps, 2027 and 2030 milestones
        url: https://climatecooperation.cn/climate/china-unveils-roadmap-for-absolute-emission-caps-2027-and-2030-milestones-for-national-carbon-markets/
  sources:
    - title: World Bank, State and Trends of Carbon Pricing
      url: https://www.worldbank.org/en/publication/state-and-trends-of-carbon-pricing
    - title: Government of Canada, The Global Carbon Pricing Challenge
      url: https://www.canada.ca/en/services/environment/weather/climatechange/climate-action/pricing-carbon-pollution/global-challenge.html

- id: national-basic-income
  name: Basic income or AI dividend in a large country
  kind: institution
  fields: [society]
  track: economy
  date: { window: [2031, 2065], likely: 2041 }
  status: speculative
  tier: 2
  summary: >-
    A government paying every adult resident a regular unconditional sum,
    funded by taxes, resource rents or a public stake in AI, so income no
    longer depends only on work. It has been tried in pilots and once, in
    Iran from 2010, almost nationally; AI that can do most jobs would make
    it a live question.
  helped_by: [agi, general-purpose-robots, ai-lab-revenue-1t]
  criterion: >-
    A country of at least 10 million people pays an unconditional cash
    benefit to at least two thirds of its adult residents, with no work
    test, worth at least 10 percent of median personal income a year, and
    keeps paying it for at least two years.
  efforts:
    - who: Iran cash subsidy program
      where: Iran
      when: 2010
      outcome: abandoned
      note: Paid every resident about 40 to 45 dollars a month, two thirds of a minimum wage per average household; inflation cut its value 70 percent by 2016 and it was replaced by targeted transfers in 2022.
    - who: Finland basic income experiment; GiveDirectly in Kenya; Alaska Permanent Fund Dividend
      where: Finland, Kenya, USA
      when: 2017
      outcome: ongoing
      note: Pilots and a small state dividend, none national and substantial.
    - who: OpenAI, Industrial policy for the Intelligence Age (public wealth fund proposal)
      where: USA
      when: 2026
      outcome: ongoing
      note: Proposed a national fund, partly seeded by AI companies, giving every citizen a stake.
  forecast:
    note: >-
      Metaculus forecasters, with a looser bar (any country over a million
      people, at least a year of payments), put the median in 2037 and the
      middle half from 2030 to 2051 (snapshot of March 2025). For the US,
      UK, China or an EU country before 2030 they gave about 5 percent.
      Today's welfare states could afford such payments only with large tax
      rises, so the trigger is likely AI taking a large share of jobs and
      profits, which the tree puts after general AI around 2031, plus years
      of politics. Judgment: about 2041.
    sources:
      - title: "Metaculus: When will a 1M-population country adopt Universal Basic Income?"
        url: https://www.metaculus.com/questions/6818/
      - title: "Metaculus: Will the US, UK, China, or any of the countries in the EU enact a universal basic income before 2030?"
        url: https://www.metaculus.com/questions/22388/
      - title: Karshenas and Tabatabai, Iran's cash subsidy programme (LSE presentation, 2018)
        url: https://www.lse.ac.uk/asset-library/events/karshenas-tabatabai-lse-presentation-20-feb-2018-final.pdf
      - title: SiliconANGLE, OpenAI releases policy document on the financial impact and risks of AI (April 2026)
        url: https://siliconangle.com/2026/04/06/openai-releases-policy-document-focused-financial-impact-risks-ai/
  sources:
    - title: Tabatabai, Basic income by default, lessons from Iran's cash subsidy programme (SOAS)
      url: https://library.soas.ac.uk/Record/eprints-31848/Details

- id: ai-run-company
  name: A billion-dollar company run by AI
  kind: institution
  fields: [society, computing]
  track: economy
  date: { window: [2027, 2040], likely: 2031 }
  status: ongoing
  tier: 3
  summary: >-
    A large business whose work, from product to sales to support, is done
    by AI agents, with only a handful of people overseeing it. Tiny firms
    already sell hundreds of millions of dollars a year with AI tools, but
    lean on partner firms' staff for the core work.
  requires: [ai-agents]
  helped_by: [superhuman-coder, continual-learning-ai, agi]
  criterion: >-
    A company with fewer than 10 people (employees plus full-time
    contractors) reports, credibly, at least 1 billion dollars of revenue
    in a year, with most of its core work done by AI rather than by staff
    of partner firms it pays to do that work.
  efforts:
    - who: Medvi (Matthew Gallagher)
      where: USA
      when: 2026
      outcome: rival
      note: A GLP-1 telehealth seller with two employees and about 401 million dollars of 2025 sales, on track for 1.8 billion in 2026; partner firms supply the doctors, prescriptions and pharmacies, and the FDA sent it a warning letter.
    - who: Solo founders building with AI agents
      where: Worldwide
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      Dario Amodei predicted in May 2025 the first billion-dollar company
      with one human employee by 2026, which hasn't happened on a valuation
      bar either. Manifold traders give about even odds of a one-person
      company valued at a billion dollars by the end of 2030, and about 23
      percent to a billion-dollar-revenue company run mainly by an AI chief
      executive before 2030. Revenue is a harder bar than valuation, and
      Medvi shows the headcount bar can be met by outsourcing, which the
      criterion excludes. Agents that can run long projects, which the tree
      expects before 2030, are the main step. Judgment: about 2031.
    sources:
      - title: "Manifold: Will there be a one-person unicorn by 2030?"
        url: https://manifold.markets/SimoneRomeo/will-there-be-a-oneperson-unicorn-b
      - title: "Manifold: Will a company with at least $1B in revenue be run primarily by an AI CEO before 2030?"
        url: https://manifold.markets/EliLifland/will-a-company-with-at-least-1b-in
      - title: CO/AI, Anthropic CEO predicts billion-dollar solo startups by 2026
        url: https://getcoai.com/news/anthropic-ceo-predicts-billion-dollar-solo-startups-by-2026
      - title: Dealroom, From 20k to 1.8B in revenue, how one founder built a telehealth giant (April 2026)
        url: https://dealroom.co/news/127216-from-20k-to-1-8b-in-revenue-how-one-founder-built-a-telehealth-giant-wit/
  sources:
    - title: Dealroom, From 20k to 1.8B in revenue, how one founder built a telehealth giant (April 2026)
      url: https://dealroom.co/news/127216-from-20k-to-1-8b-in-revenue-how-one-founder-built-a-telehealth-giant-wit/

- id: ai-legal-personhood
  name: Legal personhood for an AI
  kind: institution
  fields: [society, computing]
  track: law-governance
  date: { window: [2030, 2080], likely: 2048 }
  status: speculative
  tier: 3
  summary: >-
    A country's law recognizing an AI system itself, not its owner or a
    company wrapped around it, as a person that can hold property, make
    contracts or go to court. Companies got legal personhood centuries ago;
    several US states have passed laws ruling it out for AI.
  requires: [frontier-models]
  helped_by: [joint-stock-company, agi, ai-run-company]
  criterion: >-
    The legislature or highest court of a UN member country recognizes an
    AI system as a legal person in its own right, able to own property,
    enter contracts or sue and be sued in its own name, without a human or
    company standing as its owner.
  efforts:
    - who: Idaho, North Dakota and Utah exclusion laws; Ohio, Oklahoma and other bills
      where: USA
      when: 2026
      outcome: rival
      note: Laws barring courts and agencies from treating AI as a person; the Nonhuman Rights Project has challenged Utah's.
    - who: Legal scholars on AI-controlled companies and AI rights
      where: USA, Europe
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      Manifold traders give about 20 percent to legal personhood for an AI in
      some country by the end of 2030 and about 58 percent by the end of
      2055, thin markets that may count small or symbolic cases. Law has
      been moving the other way: at least nine US state legislatures have
      introduced or passed bills denying AI personhood or consciousness.
      Pressure would grow with general AI, AI-run firms and any evidence of
      AI welfare, and one small country could move first. Judgment: late
      2040s, with a very wide window.
    sources:
      - title: "Manifold: Will an AI be granted legal personhood in any country by end of 2030?"
        url: https://manifold.markets/_deleted_/will-an-ai-be-granted-legal-personh
      - title: "Manifold: Will any country recognize AI or robots as non human persons with legal rights before the end of 2055?"
        url: https://manifold.markets/strutheo/will-any-country-recognize-ai-or-ro
      - title: The Regulatory Review, Legislating AI consciousness without an exit (June 2026)
        url: https://www.theregreview.org/2026/06/29/rost-legislating-ai-consciousness-without-an-exit/
  sources:
    - title: AI Frontiers, It's too early to ban AI personhood
      url: https://ai-frontiers.org/articles/its-too-early-to-ban-ai-personhood

