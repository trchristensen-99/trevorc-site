- id: frontier-models
  name: Frontier AI models (GPT-4 class and beyond)
  kind: device
  fields: [computing, society]
  date: 2023
  status: achieved
  tier: 2
  summary: >-
    The most capable general models, trained with 1e25 FLOP or more from 2023
    and near 1e27 FLOP by 2026, each costing tens to hundreds of millions of
    dollars to train. A handful of labs in the US and China leapfrog each other
    every few months.
  requires: [large-language-models, rlhf, ai-accelerators]
  helped_by: [mixture-of-experts, multimodal-models, chinchilla-scaling]
  metric: ai-training-compute
  efforts:
    - who: OpenAI
      where: USA
      when: 2023
      outcome: achieved
      note: GPT-4 (March 2023, about 2.1e25 FLOP on about 25,000 A100s, per Epoch); GPT-4.5 (February 2025, about 3.8e26 FLOP); GPT-5 (August 2025); GPT-6 Astra (September 3, 2026, about 9.4e26 FLOP on at least 100,000 GB200s in Abilene, Texas, per Epoch; first model rated "Critical" for cybersecurity under OpenAI's framework).
    - who: Anthropic
      where: USA
      when: 2023
      outcome: rival
      note: Claude (March 2023), Claude 3 Opus (March 2024), Claude 4 (May 2025), Opus 4.6 and 4.8 (2026); Claude Mythos Preview (April 2026) was withheld from public release for its cyberattack ability and shared with defenders through Project Glasswing; Claude Fable 5 (June 2026) and the 5.1 and 5.5 models (September to October 2026) followed.
    - who: Google DeepMind
      where: UK and USA
      when: 2023
      outcome: rival
      note: Gemini 1.0 Ultra (December 2023, about 5e25 FLOP per Epoch, speculative), Gemini 2.5 Pro (2025), Gemini 3 Pro (November 2025); Gemini 4 was in post-training as of late September 2026.
    - who: xAI
      where: USA
      when: 2025
      outcome: rival
      note: Grok 3 (February 2025, about 3.5e26 FLOP on 80,000 H100s) and Grok 4 (July 2025, about 5e26 FLOP, speculative); Grok 4.7 (September 2026).
    - who: Meta
      where: USA
      when: 2024
      outcome: rival
      note: Llama 3.1 405B (July 2024, 3.8e25 FLOP on 16,384 H100s), the largest openly disclosed run of 2024; Llama 4 (April 2025) disappointed and Meta reorganized its AI effort.
  effort:
    people: 1000
    cost_usd: 4e8
    note: >-
      Epoch's amortized compute costs (2023 dollars) are about $37 million for
      GPT-4, $30 million for Gemini 1.0 Ultra, $53 million for Llama 3.1 405B,
      $366 million for GPT-4.5 and $390 million for Grok 4 (speculative); total
      development costs are several times higher. Frontier training cost has
      grown about 2.4 times a year since 2016. Technical reports list hundreds
      (GPT-4) to over a thousand (Gemini) contributors.
  sources:
    - title: OpenAI 2023, GPT-4 Technical Report
      url: https://arxiv.org/abs/2303.08774
    - title: Epoch AI, Notable AI Models
      url: https://epoch.ai/data/notable-ai-models
