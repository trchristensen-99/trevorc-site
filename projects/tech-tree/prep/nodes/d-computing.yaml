# AI futures
# ---------------------------------------------------------------------------

- id: automated-ai-research
  name: Automated AI research
  kind: technique
  fields: [computing, society]
  date: { window: [2027, 2038], likely: 2030 }
  status: speculative
  tier: 3
  summary: >-
    AI systems that can do the work of top AI research engineers on their own,
    from running experiments to designing new methods, so AI progress itself
    speeds up. Labs openly aim for it, and it is the main mechanism in fast
    takeoff scenarios.
  requires: [ai-agents, ai-coding-assistants, reasoning-models]
  helped_by: [ai-datacenters]
  forecast:
    note: >-
      Coding agents already finish many-hour software tasks, and METR's task
      horizons doubled about every 4 to 7 months through 2026. Research needs
      month-long autonomy, judgment about which experiments matter, and high
      reliability; extrapolating horizons from about 12 hours in 2026 to about
      a work-month gives roughly 2027 to 2029, and I add a year or two for the
      reliability and taste gap. The AI 2027 scenario put a superhuman coder in
      2027, and its authors' own median forecasts were later.
    sources:
      - title: Kwa et al. 2025 (METR), Measuring AI Ability to Complete Long Tasks
        url: https://arxiv.org/abs/2503.14499
      - title: Kokotajlo et al. 2025, AI 2027
        url: https://ai-2027.com/
      - title: Epoch AI, Training compute of frontier AI models grows by 4-5x per year
        url: https://epoch.ai/blog/training-compute-of-frontier-ai-models-grows-by-4-5x-per-year
  sources:
    - title: Kokotajlo et al. 2025, AI 2027
      url: https://ai-2027.com/

- id: agi
  name: Artificial general intelligence (transformative AI)
  kind: device
  fields: [computing, society]
  date: { window: [2028, 2045], likely: 2032 }
  status: speculative
  tier: 1
  summary: >-
    AI that can do essentially any cognitive work a skilled human can do
    remotely, at similar or lower cost. It would transform the economy and
    science, and how to make it safe is one of the central open problems of the
    time.
  requires: [frontier-models, reasoning-models, ai-agents, ai-datacenters]
  helped_by: [automated-ai-research, robot-foundation-models, multimodal-models]
  efforts:
    - who: OpenAI, Google DeepMind, Anthropic, xAI, Meta Superintelligence Labs
      where: USA and UK
      when: 2026
      outcome: ongoing
      note: All state AGI or superintelligence as a goal; OpenAI presented GPT-6 Astra (September 2026) as the start of an "AGI era".
    - who: DeepSeek, Alibaba, Moonshot, Zhipu and others
      where: China
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      Frontier training compute has grown about 4 to 5 times a year (Epoch),
      reaching about 1e27 FLOP in 2026, and Epoch judged about 2e29 FLOP
      feasible by 2030, limited mainly by power. METR's task horizons doubled
      about every 4 to 7 months to around half a working day by 2026. If those
      trends hold, systems that handle month-long projects arrive around 2028
      to 2030; the gap from there to broadly human-level work across messy,
      long-horizon and physical-world-adjacent jobs is the main uncertainty.
      Metaculus's strong-AGI question had a community median around 2030 to
      2033 in 2025 to 2026 snapshots (down from the 2050s in 2020), while the
      2023 survey of 2,778 AI researchers gave a 50% chance of human-level
      machine intelligence by 2047, a date that has moved earlier with each
      survey. I weight the trend extrapolations most and put the median at
      2032, with a long tail if scaling slows when compute growth hits power
      and capital limits around 2030.
    sources:
      - title: Metaculus, When will the first general AI system be devised, tested, and publicly announced?
        url: https://www.metaculus.com/questions/5121/
      - title: Metaculus, When will the first weakly general AI system be devised, tested, and publicly announced?
        url: https://www.metaculus.com/questions/3479/
      - title: Grace et al. 2024, Thousands of AI Authors on the Future of AI (2023 ESPAI survey)
        url: https://arxiv.org/abs/2401.02843
      - title: Epoch AI, Training compute of frontier AI models grows by 4-5x per year
        url: https://epoch.ai/blog/training-compute-of-frontier-ai-models-grows-by-4-5x-per-year
      - title: Epoch AI, Can AI scaling continue through 2030?
        url: https://epoch.ai/blog/can-ai-scaling-continue-through-2030
      - title: Kwa et al. 2025 (METR), Measuring AI Ability to Complete Long Tasks
        url: https://arxiv.org/abs/2503.14499
  sources:
    - title: Wikipedia, Artificial general intelligence
      url: https://en.wikipedia.org/wiki/Artificial_general_intelligence
