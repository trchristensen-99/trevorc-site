    - who: Meta, xAI, DeepSeek, Mistral, Alibaba, Moonshot and others
      where: USA, China, France
      when: 2023
      outcome: rival
      note: Meta AI, Grok, the DeepSeek app (top of app stores in January 2025), Le Chat, Qwen and Kimi.
  sources:
    - title: Wikipedia, ChatGPT
