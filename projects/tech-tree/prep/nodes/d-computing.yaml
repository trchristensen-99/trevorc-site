# ---------------------------------------------------------------------------
# Quantum computing
# ---------------------------------------------------------------------------

- id: shor-algorithm
  name: "Shor's algorithm"
  kind: technique
  fields: [math, computing, physics]
  date: 1994
  status: achieved
  tier: 3
  summary: >-
    A quantum algorithm that factors large numbers exponentially faster than
    any known classical method, which would break RSA and elliptic-curve
    encryption. It turned quantum computing from a curiosity into a strategic
    goal.
  requires: [quantum-mechanics, computability-theory]
  helped_by: [public-key-cryptography]
  efforts:
    - who: Peter Shor (AT&T Bell Labs)
      where: USA
      when: 1994
      outcome: achieved
      note: Built on Richard Feynman (1981 to 1982) and David Deutsch (1985), who proposed quantum computers; Lov Grover's search algorithm followed in 1996.
  sources:
    - title: Shor 1995, Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer
      url: https://arxiv.org/abs/quant-ph/9508027

- id: quantum-error-correction
  name: Quantum error correction
  kind: technique
  fields: [physics, computing]
  date: 1995
  status: achieved
  tier: 3
  summary: >-
    Spreading one logical qubit across many physical qubits so errors can be
    detected and fixed without measuring the stored information. The threshold
    theorem says arbitrarily long computations are possible once physical
    error rates fall below a fixed level.
  requires: [shor-algorithm, information-theory]
  efforts:
    - who: Peter Shor (1995); Andrew Steane (1996)
      where: USA and UK
      when: 1995
      outcome: achieved
      note: The first quantum codes.
    - who: Dorit Aharonov, Michael Ben-Or; Emanuel Knill, Raymond Laflamme, Wojciech Zurek; Alexei Kitaev
      where: Israel, USA, Russia
      when: 1997
      outcome: achieved
      note: The threshold theorem (1996 to 1997) and Kitaev's toric code, ancestor of the surface code; IBM's qLDPC "gross" codes (2024) cut the overhead.
  sources:
    - title: Wikipedia, Quantum error correction
      url: https://en.wikipedia.org/wiki/Quantum_error_correction

- id: quantum-computing
  name: Quantum computers
  kind: device
  fields: [computing, physics]
  date: 1998
  status: ongoing
  tier: 2
  summary: >-
    Machines that compute with qubits held in superposition and entanglement.
    First demonstrated with two qubits in 1998, they reached hundreds to
    thousands of physical qubits by 2026, but none yet does broadly useful work
    better than classical computers.
  requires: [quantum-mechanics, shor-algorithm, integrated-circuit]
  helped_by: [quantum-error-correction, superconductivity, laser]
  uses: [res-helium]
  efforts:
    - who: Isaac Chuang, Neil Gershenfeld, Mark Kubinec (IBM, MIT, Berkeley); Jonathan Jones, Michele Mosca (Oxford)
      where: USA and UK
      when: 1998
      outcome: achieved
      note: First two-qubit algorithms, using nuclear spins in liquid NMR; Yasunobu Nakamura's superconducting qubit followed in 1999.
    - who: Google Quantum AI (superconducting)
      where: USA
      when: 2024
      outcome: ongoing
      note: Sycamore (2019), Willow (105 qubits, December 2024); "Quantum Echoes" (October 2025) claimed a verifiable advantage on a physics simulation.
    - who: IBM (superconducting)
      where: USA
      when: 2023
      outcome: ongoing
      note: Condor (1,121 qubits, 2023), Heron and Nighthawk processors; Starling, a fault-tolerant machine, targeted for 2029.
    - who: Quantinuum (trapped ions)
      where: USA and UK
      when: 2025
      outcome: ongoing
      note: Helios (November 2025), 98 barium-ion qubits with 99.92% two-qubit gate fidelity; its 2026 IPO filing claims 48 logical qubits from those 98.
    - who: IonQ (trapped ions)
      where: USA
      when: 2026
      outcome: ongoing
      note: Bought Oxford Ionics in 2025; sold its first 256-qubit chip-based system in 2026; targets 1,600 logical qubits in 2028 (company claim).
    - who: PsiQuantum (photonic)
      where: USA and Australia
      when: 2025
      outcome: ongoing
      note: Raised $1 billion in September 2025; building utility-scale sites in Brisbane and Chicago; selected with Microsoft for the final phase of DARPA's US2QC program.
    - who: Microsoft (topological)
      where: USA
      when: 2025
      outcome: ongoing
      note: Majorana 1 (February 2025) claimed eight topological qubits; many physicists say the evidence that they are truly topological is not yet convincing.
    - who: QuEra and Harvard, Atom Computing, Pasqal (neutral atoms); USTC (superconducting and photonic); D-Wave (annealing)
      where: USA, France, China, Canada
      when: 2023
      outcome: rival
      note: Harvard and QuEra ran 48 logical qubits in December 2023; USTC built Jiuzhang (2020) and Zuchongzhi 3.0 (2025).
  sources:
    - title: Chuang, Gershenfeld and Kubinec 1998, Experimental Implementation of Fast Quantum Searching, Physical Review Letters
      url: https://doi.org/10.1103/PhysRevLett.80.3408
    - title: Quantinuum, Introducing Helios
      url: https://www.quantinuum.com/blog/introducing-helios-the-most-accurate-quantum-computer-in-the-world
    - title: Quantinuum Form S-1 (2026)
      url: https://www.sec.gov/Archives/edgar/data/0002110105/000162828026032836/quantinuum-sx1.htm
    - title: NBC News, Microsoft reveals its first quantum computing chip, the Majorana 1
      url: https://www.nbcnews.com/business/business-news/microsoft-reveals-first-quantum-computing-chip-majorana-1-rcna192871

- id: quantum-supremacy
  name: Quantum advantage on a sampling task
  kind: discovery
  fields: [physics, computing]
  date: 2019
  status: achieved
  tier: 3
  summary: >-
    The first demonstration of a quantum computer doing a calculation, sampling
    from random circuits, far faster than the best classical supercomputers
    could. The task has no practical use, and better classical algorithms
    later narrowed the gap.
  requires: [quantum-computing]
  efforts:
    - who: Google AI Quantum (John Martinis and colleagues)
      where: USA
      when: 2019
      outcome: achieved
      note: Sycamore, 53 qubits, 200 seconds versus a claimed 10,000 years; IBM disputed the estimate.
    - who: Jian-Wei Pan and colleagues (USTC)
      where: China
      when: 2020
      outcome: independent
      note: Jiuzhang, a photonic boson-sampling machine.
  sources:
    - title: Arute et al. 2019, Quantum supremacy using a programmable superconducting processor, Nature
      url: https://www.nature.com/articles/s41586-019-1666-5

- id: below-threshold-error-correction
  name: Error correction below threshold
  kind: discovery
  fields: [physics, computing]
  date: 2024
  status: achieved
  tier: 3
  summary: >-
    The first proof that adding more physical qubits to an error-correcting
    code makes a logical qubit better rather than worse. It is the basic
    requirement for scaling to a fault-tolerant machine.
  requires: [quantum-error-correction, quantum-supremacy]
  efforts:
    - who: Google Quantum AI
      where: USA
      when: 2024
      outcome: achieved
      note: On Willow, each step up in surface code size (distance 3 to 5 to 7) cut the logical error rate by about 2.14 times, to 0.143% per cycle.
    - who: Quantinuum and Microsoft; Harvard and QuEra
      where: USA
      when: 2024
      outcome: independent
      note: Logical qubits with lower error rates than their physical qubits on trapped ions and neutral atoms.
  sources:
    - title: Google Quantum AI 2024, Quantum error correction below the surface code threshold, Nature
      url: https://www.nature.com/articles/s41586-024-08449-y
    - title: Google, Meet Willow, our state-of-the-art quantum chip
      url: https://blog.google/technology/research/google-willow-quantum-chip/

- id: post-quantum-cryptography
  name: Post-quantum cryptography
  kind: technique
  fields: [math, computing]
  date: 2024
  status: achieved
  tier: 3
  summary: >-
    Public-key schemes based on math problems, such as lattices, that quantum
    computers are not known to solve. NIST standardized the first three in
    August 2024, and browsers and messaging apps have begun switching.
  requires: [public-key-cryptography, shor-algorithm]
  efforts:
    - who: NIST, with cryptographers worldwide (Kyber and Dilithium from the CRYSTALS team, SPHINCS+)
      where: USA and worldwide
      when: 2024
      outcome: achieved
      note: FIPS 203, 204 and 205 (August 13, 2024) after a competition begun in 2016; NIST's draft IR 8547 deprecates RSA and elliptic curves by 2030 and disallows them by 2035.
    - who: Signal, Apple, Google, Cloudflare
      where: USA
      when: 2023
      outcome: achieved
      note: Signal's PQXDH (2023), iMessage PQ3 (2024) and hybrid key exchange in Chrome.
  sources:
    - title: NIST, Post-quantum cryptography FIPS approved
      url: https://csrc.nist.gov/news/2024/postquantum-cryptography-fips-approved
    - title: NIST IR 8547 (draft), Transition to Post-Quantum Cryptography Standards
      url: https://csrc.nist.gov/pubs/ir/8547/ipd

- id: fault-tolerant-quantum-computer
  name: Fault-tolerant quantum computer
  kind: device
  fields: [computing, physics]
  date: { window: [2028, 2040], likely: 2031 }
  status: speculative
  tier: 2
  summary: >-
    A quantum computer with about 100 or more error-corrected logical qubits
    that can run millions of operations reliably, enough for useful chemistry
    and materials simulation. Several companies target the end of the 2020s.
  requires: [below-threshold-error-correction, quantum-computing]
  efforts:
    - who: IBM
      where: USA
      when: 2029
      outcome: ongoing
      note: Starling, about 200 logical qubits running 100 million gates, planned for Poughkeepsie by 2029 using qLDPC codes.
    - who: Google Quantum AI
      where: USA
      when: 2029
      outcome: ongoing
      note: Aims for a useful error-corrected computer by the end of the decade.
    - who: Quantinuum
      where: USA and UK
      when: 2029
      outcome: ongoing
      note: Apollo, a universal fault-tolerant machine, targeted for 2029.
    - who: PsiQuantum
      where: Australia and USA
      when: 2029
      outcome: ongoing
      note: Utility-scale photonic machines in Brisbane (once promised for end of 2027) and Chicago.
    - who: IonQ; Microsoft; QuEra; DARPA Quantum Benchmarking Initiative
      where: USA
      when: 2028
      outcome: ongoing
      note: DARPA's program aims to judge by 2033 whether any approach can reach utility scale.
  forecast:
    note: >-
      Logical qubit counts went from 1 to about 12 to 48 between 2023 and 2026,
      but at small code distances and short circuit depths. Getting to 100
      logical qubits with error rates near one in a million needs roughly
      tens of thousands of good physical qubits, or far fewer with qLDPC codes
      and high-fidelity ions or atoms. Company roadmaps cluster at 2028 to
      2029, and such roadmaps have historically slipped by a few years, so my
      best guess is 2031, with a wide tail if a key platform stalls.
    sources:
      - title: IBM, Starling large-scale fault-tolerant quantum computer roadmap
        url: https://www.ibm.com/quantum/blog/large-scale-ftqc
      - title: Global Risk Institute, 2024 Quantum Threat Timeline Report
        url: https://globalriskinstitute.org/publication/2024-quantum-threat-timeline-report/
  sources:
    - title: IBM, How IBM will build the world's first large-scale fault-tolerant quantum computer
      url: https://www.ibm.com/quantum/blog/large-scale-ftqc

- id: cryptographically-relevant-quantum-computer
  name: Quantum computer that breaks RSA-2048
  kind: device
  fields: [computing, physics, society]
  date: { window: [2030, 2045], likely: 2035 }
  status: speculative
  tier: 3
  summary: >-
    A quantum computer able to run Shor's algorithm on 2048-bit RSA keys,
    breaking much of today's internet encryption, including data recorded now
    and decrypted later. Estimates of the hardware needed fell sharply in 2025.
  requires: [fault-tolerant-quantum-computer, shor-algorithm]
  competes: [post-quantum-cryptography]
  forecast:
    note: >-
      Craig Gidney (Google) estimated in May 2025 that RSA-2048 could be
      factored in under a week with fewer than a million noisy qubits at 0.1%
      error, about 20 times fewer than his 2019 estimate. That is still roughly
      a thousand times larger than 2026 machines. Experts surveyed by the
      Global Risk Institute in 2024 put a meaningful but minority chance on it
      within 10 years. I put the median about four years after the first
      fault-tolerant machines.
    sources:
      - title: Gidney 2025, How to factor 2048 bit RSA integers with less than a million noisy qubits
        url: https://arxiv.org/abs/2505.15917
      - title: Global Risk Institute, 2024 Quantum Threat Timeline Report
        url: https://globalriskinstitute.org/publication/2024-quantum-threat-timeline-report/
  sources:
    - title: Gidney 2025, How to factor 2048 bit RSA integers with less than a million noisy qubits
      url: https://arxiv.org/abs/2505.15917

