- id: reasoning-models
  name: Reasoning models trained with reinforcement learning
  kind: technique
  fields: [computing]
  date: 2024
  status: achieved
  tier: 2
  summary: >-
    Language models trained by reinforcement learning on problems with
    checkable answers to think in long chains of thought before replying. Their
    accuracy grows with thinking time, adding a second scaling axis
    (test-time compute) and large gains in math and coding.
  requires: [large-language-models, reinforcement-learning, rlhf]
  efforts:
    - who: Jason Wei and colleagues (Google); Takeshi Kojima and colleagues (Tokyo, Google)
