    - who: Google DeepMind; Anthropic; xAI; Alibaba
      where: USA, UK, China
      when: 2025
      outcome: rival
      note: Gemini 2.0 Flash Thinking (December 2024) and Deep Think, Claude 3.7 Sonnet extended thinking (February 2025), Grok 3 Think, QwQ and Qwen3.
  sources:
    - title: DeepSeek-AI 2025, DeepSeek-R1
