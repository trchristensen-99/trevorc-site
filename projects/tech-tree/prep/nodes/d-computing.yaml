# Brain-computer interfaces
# ---------------------------------------------------------------------------

- id: brain-computer-interfaces
  name: Implanted brain-computer interfaces
  kind: device
  fields: [electronics, medicine]
  date: 2004
  status: ongoing
  tier: 3
  summary: >-
    Electrode arrays in the brain whose signals are decoded, increasingly by
    neural networks, to move cursors and robot arms or produce speech for
    paralyzed people. Fewer than a hundred people had high-channel implants by
    2026.
  requires: [integrated-circuit]
  helped_by: [deep-learning]
  efforts:
    - who: John Donoghue and colleagues (Brown University, BrainGate)
      where: USA
      when: 2004
      outcome: achieved
      note: The first person to control a cursor with a Utah array implant, Matt Nagle.
    - who: UCSF (Edward Chang) and Stanford (Francis Willett, Jaimie Henderson) groups
      where: USA
      when: 2023
      outcome: achieved
      note: Speech neuroprostheses decoding about 60 to 80 words a minute.
    - who: Neuralink; Synchron; Precision Neuroscience; Paradromics
      where: USA
      when: 2024
      outcome: ongoing
      note: Neuralink's first human implant was in January 2024; secondary reports put its total near 26 people by mid-2026.
  sources:
    - title: Wikipedia, Brain-computer interface
      url: https://en.wikipedia.org/wiki/Brain%E2%80%93computer_interface

- id: bci-at-scale
  name: Brain-computer interfaces at scale
  kind: device
  fields: [electronics, medicine, society]
  date: { window: [2032, 2050], likely: 2038 }
  status: speculative
  tier: 3
  summary: >-
    Implanted high-bandwidth brain interfaces in routine medical use, with
    tens of thousands of people restored to fluent communication or movement.
    Elective use by healthy people would come later, if at all.
  requires: [brain-computer-interfaces]
  helped_by: [ai-agents]
  forecast:
    note: >-
      Implant counts grew from a handful to a few dozen between 2023 and 2026,
      against Neuralink's 2024 talk of over 1,000 implants in 2026. Reaching
      tens of thousands needs pivotal trials, regulatory approval (likely late
      2020s for the first devices), reimbursement and surgical capacity.
      Medical devices such as cochlear implants took about 15 to 20 years from
      approval to that scale, which points to the late 2030s.
    sources:
      - title: Basenor, Neuralink reaches 26th patient (June 2026, secondary)
        url: https://www.basenor.com/blogs/news/neuralink-reaches-26th-patient-in-ongoing-brain-computer-interface-trials
      - title: Wikipedia, Cochlear implant
        url: https://en.wikipedia.org/wiki/Cochlear_implant
  sources:
    - title: Wikipedia, Brain-computer interface
      url: https://en.wikipedia.org/wiki/Brain%E2%80%93computer_interface

