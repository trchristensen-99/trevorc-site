- id: backside-power-delivery
  name: Backside power delivery
  kind: technique
  fields: [electronics]
  track: chipmaking
  date: 2025
  status: achieved
  tier: 3
  summary: >-
    Moving a chip's power wiring underneath the transistors, so the wires on
    top carry only signals. It frees space and cuts power losses, and is the
    biggest change in chip wiring in decades.
  requires: [gate-all-around, euv-lithography]
  efforts:
    - who: Intel (PowerVia on Intel 18A)
      where: USA
      when: 2025
      outcome: achieved
      note: Intel says it reached high-volume manufacturing on 18A by the end of 2025 in Arizona and Oregon, claiming up to 18 percent more performance or 38 percent less power than Intel 3.
    - who: TSMC (A16, Super Power Rail)
      where: Taiwan
      when: 2026
      outcome: rival
      note: Nanosheet transistors with a backside power rail, scheduled for the second half of 2026.
  sources:
    - title: Intel, Intel 18A process
      url: https://www.intel.com/content/www/us/en/foundry/process/18a.html
    - title: Intel 2026 proxy statement (high-volume manufacturing on 18A)
      url: https://www.sec.gov/Archives/edgar/data/50863/000005086326000061/proxy2026.htm
    - title: TSMC, A16 technology
      url: https://www.tsmc.com/english/dedicatedFoundry/technology/logic/l_A16

- id: cfet-transistors
  name: Stacked complementary transistors (CFET)
  kind: technique
  fields: [electronics]
  track: components
  date: { window: [2031, 2040], likely: 2034 }
  status: speculative
  tier: 3
  summary: >-
    Stacking the n-type and p-type transistor of each logic pair on top of
    each other instead of side by side, roughly halving the area of a logic
    cell. It is the planned successor to gate-all-around nanosheets once
    sideways shrinking runs out.
  requires: [gate-all-around, backside-power-delivery]
  helped_by: [high-na-euv]
  criterion: >-
    Chips built with stacked complementary FETs are in high-volume
    manufacturing for commercial products.
  efforts:
    - who: Intel; TSMC; Samsung
      where: USA, Taiwan, South Korea
      when: 2023
      outcome: ongoing
      note: Showed CFET test devices at IEDM in December 2023 (Intel an inverter at 60 nm pitch, TSMC at 48 nm).
    - who: imec
      where: Belgium
      when: 2023
      outcome: ongoing
      note: Its scaling roadmap puts CFET after forksheet transistors.
  forecast:
    note: >-
      Engineers quoted in 2023 expected production 7 to 10 years out, about
      2030 to 2033. New transistor architectures have usually arrived later
      than first expected (gate-all-around came in 2022 to 2025), so I put it
      in the mid-2030s.
    sources:
      - title: IEEE Spectrum, Intel, Samsung and TSMC demo stacked CFET transistors (2023)
        url: https://spectrum.ieee.org/cfet-intel-samsung-tsmc
      - title: imec, Smaller, better, faster, imec presents chip scaling roadmap (2023)
        url: https://www.imec-int.com/en/articles/smaller-better-faster-imec-presents-chip-scaling-roadmap
  sources:
    - title: IEEE Spectrum, Intel, Samsung and TSMC demo stacked CFET transistors (2023)
      url: https://spectrum.ieee.org/cfet-intel-samsung-tsmc

