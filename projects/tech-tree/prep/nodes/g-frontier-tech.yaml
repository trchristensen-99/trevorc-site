- id: round-the-clock-solar
  name: Round-the-clock solar cheaper than fossil power
  kind: infrastructure
  fields: [energy]
  track: renewables
  date: { window: [2027, 2035], likely: 2030 }
  status: ongoing
  tier: 2
  summary: >-
    Solar panels plus batteries sized to supply a constant load day and
    night nearly all year, which turns cheap daytime solar into firm power.
    In sunny places this cost about $104 per MWh in 2024, falling about a
    fifth a year.
  requires: [solar-photovoltaic, grid-batteries, lithium-iron-phosphate]
  helped_by: [battery-pack-100-dollars-kwh, solar-module-10-cents-watt, sodium-ion-battery]
  criterion: >-
    Unsubsidized solar plus batteries can deliver a constant load for at
    least 97 percent of hours of the year in a sunny region for under $60
    per MWh, below the cost of new coal or nuclear power.
  efforts:
    - who: Ember (analysis)
      where: UK
      when: 2025
      outcome: ongoing
      note: Found that 6 GW of solar and 17 GWh of batteries in Las Vegas could have met a constant 1 GW for 97 percent of hours at $104 per MWh with 2024 prices, down from $132 a year earlier; new coal was about $118 and new nuclear about $182.
    - who: Chinese module and battery makers
      where: China
      when: 2026
      outcome: ongoing
      note: Module prices about $0.11 per watt in October 2026; stationary battery packs averaged $70 per kWh in 2025.
  forecast:
    note: >-
      The cost fell 22 percent in a year as battery prices fell 45 percent
      for stationary packs (BNEF 2025); modules, at about 11 cents a watt,
      fall more slowly now. A continued 10 to 15 percent a year would reach
      $60 by about 2028 to 2030. Land, grid connection and financing costs
      fall less, so judgment: 2030.
    sources:
      - title: Ember, Solar electricity every hour of every day is here (2025)
