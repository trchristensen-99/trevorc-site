# Superconducting tape
# ---------------------------------------------------------------------------

- id: rebco-coated-conductor
  name: REBCO superconducting tape in bulk
  kind: technique
  fields: [materials, electronics]
  track: modern-materials
  date: 2021
  status: achieved
  tier: 3
  summary: >-
    Thin films of rare-earth barium copper oxide grown on metal ribbon, the
    form of high-temperature superconductor that carries very high currents
    in strong magnetic fields. Fusion demand turned it from a specialty
    product into one made by the thousand kilometers.
  requires: [superconductors-high-temp, single-crystal-growth]
  uses: [res-rare-earths]
  efforts:
    - who: SuperOx; Faraday Factory Japan; Fujikura; Shanghai Superconductor; SuperPower
      where: Russia, Japan, China, USA
      when: 2021
      outcome: achieved
      note: SuperOx made over 300 km of 4 mm tape in nine months, mostly for Commonwealth Fusion Systems, which it called the largest order the industry had seen. SPARC needs about 10,000 km.
  sources:
    - title: Molodyk et al. 2021, Development and large volume production of extremely high current density YBa2Cu3O7 superconducting wires for fusion, Scientific Reports
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7822827
    - title: MIT News, Tests show high-temperature superconducting magnets are ready for fusion (2024)
      url: https://news.mit.edu/2024/tests-show-high-temperature-superconducting-magnets-fusion-ready-0304

- id: cheap-superconducting-tape
  name: Superconducting tape at tens of dollars per kA-m
  kind: technique
  fields: [materials, energy]
  track: modern-materials
  date: { window: [2028, 2040], likely: 2033 }
  status: ongoing
  tier: 3
  summary: >-
    High-temperature superconducting tape cheap enough per unit of current
    carried to be used widely, in grid cables, wind generators, motors and
    MRI machines as well as fusion magnets. Makers aim at tens of dollars
    per kiloampere-meter.
  requires: [rebco-coated-conductor]
  helped_by: [hts-fusion-magnets]
  criterion: >-
    REBCO tape sells in volume for under $20 per kiloampere-meter of
    current capacity (at the operating conditions of a fusion or motor
    magnet, about 20 K).
  efforts:
    - who: SuperOx; Faraday Factory Japan; Shanghai Superconductor; Fujikura
      where: Russia, Japan, China
      when: 2026
      outcome: ongoing
      note: Scaling production lines for fusion customers; SuperOx's stated goal is "tens of dollars per kiloampere-meter".
  forecast:
    note: >-
      Public prices are scarce. Fusion orders of thousands of kilometers are
      what drives the scale-up, so the date tracks fusion financing. Judgment
      with low confidence: early 2030s.
    sources:
      - title: Molodyk et al. 2021, Scientific Reports
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7822827
  sources:
    - title: Molodyk et al. 2021, Scientific Reports
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7822827
