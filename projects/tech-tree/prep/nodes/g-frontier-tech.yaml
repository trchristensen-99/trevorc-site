- id: closed-loop-life-support
  name: Closed-loop life support
  kind: technique
  fields: [engineering, biology]
  track: space
  date: { window: [2035, 2065], likely: 2045 }
  status: speculative
  tier: 3
  summary: >-
    Habitats that recycle nearly all their air and water and grow much of
    their own food, so crews far from Earth are not tied to supply ships. The
    ISS recycles 98 percent of its water but no oxygen-food loop has run
    for years with people.
  requires: [space-stations]
  helped_by: [cultivated-meat, electrolysis]
  criterion: >-
    A crew of at least four lives for a year in a sealed habitat (on Earth,
    in orbit or on another world) with at least 98 percent of water and
    oxygen recycled and at least half of food grown inside, with no resupply
    of those.
  efforts:
    - who: NASA ISS environmental control system
      where: USA
      when: 2023
      outcome: achieved
      note: Total water recovery reached 98 percent with the brine processor (June 2023); oxygen is made by electrolysis of resupplied water.
    - who: Biosphere 2
      where: USA
      when: 1991
      outcome: abandoned
      note: Eight people sealed in for two years (1991 to 1993); oxygen fell so low that air had to be pumped in.
    - who: Beihang University, Lunar Palace 1 (Yuegong-1)
      where: China
      when: 2018
      outcome: ongoing
      note: Rotating crews of four lived in a ground facility for 370 days (2017 to 2018) with oxygen and water fully recycled and much of the food grown inside.
  forecast:
    note: >-
      Ground tests have come close for a year, but not in space or under
      partial gravity, and no space agency has funded a flight-scale
      bioregenerative system. A Mars settlement or a permanent lunar base
      would force the issue. Judgment: mid-2040s for a flight-proven system.
    sources:
      - title: Wikipedia, Yuegong-1
        url: https://en.wikipedia.org/wiki/Yuegong-1
      - title: NASA, NASA achieves water recovery milestone on International Space Station (2023)
        url: https://www.nasa.gov/missions/station/iss-research/nasa-achieves-water-recovery-milestone-on-international-space-station/
  sources:
    - title: NASA, NASA achieves water recovery milestone on International Space Station (2023)
      url: https://www.nasa.gov/missions/station/iss-research/nasa-achieves-water-recovery-milestone-on-international-space-station/
    - title: Wikipedia, Biosphere 2
      url: https://en.wikipedia.org/wiki/Biosphere_2

- id: mars-propellant-production
  name: Rocket propellant made on Mars
  kind: technique
  fields: [engineering, chemistry]
  track: space
  date: { window: [2033, 2060], likely: 2040 }
  status: speculative
  tier: 3
  summary: >-
    Making methane and oxygen on Mars from atmospheric carbon dioxide and
    buried ice, so ships can fly home without hauling return fuel from Earth.
    MOXIE made 122 grams of oxygen; a return Starship needs hundreds of
    tonnes of propellant.
  requires: [mars-oxygen-moxie, electrolysis]
  helped_by: [solar-photovoltaic, small-modular-reactors]
  criterion: >-
    A plant on Mars produces at least 10 tonnes of rocket propellant
    (oxidizer and fuel) and loads it into a vehicle.
  efforts:
    - who: SpaceX
      where: USA
      when: 2033
      outcome: ongoing
      note: Its Mars architecture assumes Sabatier-process methane plants powered by large solar arrays; Mars missions were pushed back by five to seven years in February 2026.
    - who: NASA (MOXIE follow-ons in the Moon to Mars architecture)
      where: USA
      when: 2023
      outcome: ongoing
  forecast:
    note: >-
      The step from 12 grams an hour to tonnes needs uncrewed cargo landings
      with power plants, ice mining and automation, all before crews arrive,
      since SpaceX's plan relies on it for the trip home. Mars launch windows
      come every 26 months. Judgment: about 2040, on uncrewed precursor
      flights.
    sources:
      - title: Wikipedia, SpaceX Mars program
        url: https://en.wikipedia.org/wiki/SpaceX_Mars_program
      - title: NASA, MOXIE completes Mars mission (2023)
        url: https://www.nasa.gov/missions/mars-2020-perseverance/perseverance-rover/nasas-oxygen-generating-experiment-moxie-completes-mars-mission/
  sources:
    - title: Wikipedia, SpaceX Mars program
      url: https://en.wikipedia.org/wiki/SpaceX_Mars_program

- id: nuclear-space-propulsion
  name: Nuclear propulsion in space
  kind: device
  fields: [engineering, energy]
  track: space
  date: { window: [2028, 2040], likely: 2031 }
  status: ongoing
  tier: 3
  summary: >-
    Rockets heated by a fission reactor (nuclear thermal), or electric
    thrusters powered by one (nuclear electric), which could halve Mars trip
    times compared with chemical rockets. NERVA engines ran on the ground in
    the 1960s; none has flown.
  requires: [nuclear-reactor, rocketry]
  criterion: >-
    A spacecraft in space is propelled by a fission reactor, either by
    heating propellant directly or by powering electric thrusters.
  efforts:
    - who: NASA and the Atomic Energy Commission, Rover and NERVA
      where: USA
      when: 1964
      outcome: abandoned
      note: Ground tests from 1959 to 1969 reached about 850 seconds of specific impulse, twice chemical engines; cancelled January 1973.
    - who: DARPA and NASA, DRACO
      where: USA
      when: 2025
      outcome: abandoned
      note: A nuclear thermal flight demonstration cancelled in 2025; DARPA cited falling launch costs.
    - who: NASA, Space Reactor-1 Freedom
      where: USA
      when: 2028
      outcome: ongoing
      note: Announced March 2026, a nuclear electric pathfinder reusing the Gateway power module, proposed for launch in December 2028 with two Mars flybys.
  forecast:
    note: >-
      Nuclear propulsion has lost funding every time chemical alternatives
      looked good enough, most recently in 2025. SR-1 Freedom's 2028 date is
      a proposal; new nuclear flight hardware usually slips several years.
      Judgment: early 2030s.
    sources:
      - title: Wikipedia, Space Reactor-1 Freedom
        url: https://en.wikipedia.org/wiki/Space_Reactor-1_Freedom
      - title: Wikipedia, DRACO
        url: https://en.wikipedia.org/wiki/Demonstration_Rocket_for_Agile_Cislunar_Operations
  sources:
    - title: Wikipedia, NERVA
      url: https://en.wikipedia.org/wiki/NERVA
    - title: Wikipedia, Space Reactor-1 Freedom
      url: https://en.wikipedia.org/wiki/Space_Reactor-1_Freedom

