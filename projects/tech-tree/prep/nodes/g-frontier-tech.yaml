- id: magnetic-fusion-gain
  name: Magnetic fusion with gain above 1
  kind: discovery
  fields: [physics, energy]
  track: nuclear-particle
  date: { window: [2027, 2032], likely: 2028 }
  status: ongoing
  tier: 2
  summary: >-
    A magnetically confined plasma that makes more fusion power than the
    heating power put into it (Q above 1), which laser fusion passed in
    2022. JET reached Q of 0.67 in 1997; compact high-field tokamaks under
    construction aim to pass 1 around 2027.
  requires: [tokamak, hts-fusion-magnets]
  helped_by: [optimized-stellarator, fusion-triple-product-ignition]
  criterion: >-
    A magnetic confinement device (tokamak, stellarator or other) produces
    more fusion power than the external heating power absorbed by the
    plasma (Q above 1), with deuterium-tritium fuel.
  efforts:
    - who: JET (EUROfusion, Culham)
      where: UK, EU
      when: 1997
      outcome: achieved
      note: Q of 0.67 with 16 MW of fusion power in 1997; a record 69 MJ in October 2023 before closing.
    - who: Commonwealth Fusion Systems, SPARC
      where: USA
      when: 2027
      outcome: ongoing
      note: First of 18 magnets installed January 2026 and about 80 percent complete by July 2026; first plasma and Q above 1 targeted for 2027, design Q about 11.
    - who: ASIPP Hefei, BEST
      where: China
      when: 2027
      outcome: ongoing
      note: Compact superconducting tokamak due for completion in 2027, aiming at Q of about 5.
    - who: ITER
      where: France
      when: 2039
      outcome: ongoing
      note: Deuterium-tritium operation now planned for 2039, aiming at Q of 10.
  forecast:
    note: >-
      SPARC and BEST both target 2027. New fusion machines take a year or
      more from first plasma to full field and tritium operation, and SPARC
      has already slipped from 2025. Judgment: first Q above 1 in 2028.
    sources:
      - title: Nuclear News Network, CFS SPARC tracker
        url: https://www.nuclearnewsnetwork.com/industry-trackers/fusion-energy-companies/cfs-sparc
      - title: Nuclear News Network, China BEST tracker
        url: https://www.nuclearnewsnetwork.com/industry-trackers/fusion-energy-companies/china-best
      - title: Creely et al. 2020, Overview of the SPARC tokamak, Journal of Plasma Physics
        url: https://www.cambridge.org/core/product/identifier/S0022377820001257/type/journal_article
  sources:
    - title: TechCrunch, Commonwealth Fusion Systems installs reactor magnet (January 2026)
      url: https://techcrunch.com/2026/01/06/commonwealth-fusion-systems-installs-reactor-magnet-lands-deal-with-nvidia/
    - title: ITER 2024 baseline summary
      url: https://iter.org/sites/default/files/media/2024-07/baseline_press_conference_summary_july-2024_b.pdf
    - title: Wikipedia, Joint European Torus
      url: https://en.wikipedia.org/wiki/Joint_European_Torus

- id: fusion-drivers
  name: Repetition-rated drivers for inertial fusion
  kind: device
  fields: [physics, energy]
  track: nuclear-particle
  date: { window: [2030, 2042], likely: 2035 }
  status: ongoing
  tier: 3
  summary: >-
    Lasers or pulsed-power machines efficient enough, and fast enough to
    fire many times a second, to turn laser-style fusion into a power plant.
    NIF's flashlamp lasers fire a few times a day and waste most of the
    power they draw.
  requires: [laser, fusion-ignition-nif]
  criterion: >-
    A driver delivers fusion-class energy (megajoule scale) to targets at
    least once a second for hours, with wall-plug efficiency of about 10
    percent or better.
  efforts:
    - who: DOE inertial fusion energy hubs (LLNL-led STARFIRE, with Focused Energy and Xcimer)
      where: USA
      when: 2023
      outcome: ongoing
      note: $42 million for three research hubs announced December 2023.
    - who: Xcimer Energy
      where: USA
      when: 2026
      outcome: ongoing
      note: Krypton fluoride laser; its Phoenix prototype started operating in June 2026, with a larger Anvil system planned for 2028 and a plant in the mid-2030s.
    - who: Focused Energy (with RWE at Biblis); Marvel Fusion
      where: Germany, USA
      when: 2026
      outcome: ongoing
      note: Focused Energy raised a $240 million Series A in May 2026 and plans a plant in the mid-2030s.
    - who: Pacific Fusion
      where: USA
      when: 2030
      outcome: rival
      note: Uses pulsed power instead of lasers; raised over $900 million and broke ground in New Mexico in August 2026, aiming at net facility gain by 2030.
  forecast:
    note: >-
      Company plans converge on demonstration drivers around 2028 to 2030 and
      plants in the mid-2030s. Each needs a new laser or pulser architecture
      plus cheap mass-produced targets. Judgment: 2035.
    sources:
      - title: POWER, Xcimer starts operations of prototype for laser fusion architecture (2026)
        url: https://www.powermag.com/xcimer-energy-starts-operations-of-prototype-for-laser-fusion-architecture/
      - title: New Mexico governor, Pacific Fusion campus announcement (2025)
        url: https://www.governor.state.nm.us/2025/09/26/governor-announces-1-billion-fusion-research-and-manufacturing-campus-in-new-mexico-pacific-fusion-project-will-create-hundreds-of-jobs/
  sources:
    - title: US DOE, $42 million for inertial fusion energy hubs (2023)
      url: https://www.energy.gov/articles/doe-announces-42-million-inertial-fusion-energy-hubs
    - title: Focused Energy, $240 million Series A (2026)
      url: https://www.focused-energy.co/news-release/focused-energy-sets-a-new-benchmark-240-million-for-the-largest-series-a-financing-in-the-global-fusion-industry

- id: tritium-breeding-blanket
  name: Tritium breeding blankets
  kind: technique
  fields: [energy, physics]
  track: nuclear-energy
  date: { window: [2033, 2050], likely: 2040 }
  status: speculative
  tier: 3
  summary: >-
    Lithium-bearing walls around a fusion plasma that capture its neutrons
    and turn the lithium into tritium. The world has only a few tens of
    kilograms of tritium, so deuterium-tritium plants must make their own
    fuel; no large breeding system has yet been tried.
  requires: [nuclear-reactor, lithium-ion-battery]
  uses: [res-lithium]
  criterion: >-
    A blanket in a fusion neutron environment breeds more tritium than the
    plant burns (tritium breeding ratio above 1), measured over a full
    operating campaign, and the tritium is extracted for reuse.
  efforts:
    - who: ITER test blanket modules (EU, Japan, China, Korea)
      where: France
      when: 2039
      outcome: ongoing
      note: Four mock-up blanket designs to be tested in two ports during deuterium-tritium operation.
    - who: UKAEA, LIBRTI
      where: UK
      when: 2026
      outcome: ongoing
      note: About £220 million (2023 to 2030) for a breeding test facility using a 14 MeV neutron source in the old JET power building; Commonwealth Fusion Systems joined in July 2026.
  forecast:
    note: >-
      Breeding can only be shown at full scale in a deuterium-tritium plant
      or a strong neutron source; ITER's tests start in 2039 and the first
      pilot plants (ARC, STEP) aim for the 2030s. Judgment: about 2040.
    sources:
      - title: ITER, Tritium breeding
        url: https://www.iter.org/machine/supporting-systems/tritium-breeding
      - title: UKAEA, LIBRTI
        url: https://www.ukaea.org/work/librti/
  sources:
    - title: ITER, Tritium breeding
      url: https://www.iter.org/machine/supporting-systems/tritium-breeding
    - title: Wikipedia, Breeding blanket
      url: https://en.wikipedia.org/wiki/Breeding_blanket

- id: fusion-net-electricity
  name: First net electricity from fusion
  kind: discovery
  fields: [energy, physics]
  track: nuclear-energy
  date: { window: [2029, 2042], likely: 2034 }
  status: speculative
  tier: 2
  summary: >-
    A fusion machine that sends out more electricity than the whole facility
    draws, if only for a test run. Scientific gain counts only the heating
    energy reaching the fuel; here the lasers, magnets, pumps and
    conversion losses all count against it.
  requires: [fusion-ignition-nif, tokamak]
  helped_by: [fusion-triple-product-ignition, deep-learning]
  routes:
    - name: Tokamak
      requires: [magnetic-fusion-gain, hts-fusion-magnets]
      note: Commonwealth Fusion Systems (SPARC then ARC), China (BEST then CFEDR), Tokamak Energy, UKAEA STEP.
    - name: Stellarator
      requires: [optimized-stellarator, hts-fusion-magnets]
      note: Proxima Fusion (Alpha, early 2030s), Type One Energy (Infinity Two at TVA), Thea Energy.
    - name: Inertial (laser or pulsed power)
      requires: [fusion-ignition-nif, fusion-drivers]
      note: Xcimer, Focused Energy, Marvel Fusion; Pacific Fusion with pulsed power.
    - name: Magnetized target and pulsed magnetic
      requires: [magneto-inertial-fusion]
      note: Helion (direct electricity recovery, Orion plant for Microsoft), General Fusion, Zap Energy.
  criterion: >-
    A fusion device produces more electrical energy than the entire facility
    consumes over the same period (engineering gain above 1), measured and
    published, even for a single run of seconds to minutes.
  efforts:
    - who: Helion Energy
      where: USA
      when: 2028
      outcome: ongoing
      note: Promised Microsoft at least 50 MW from its Orion plant by 2028 under a 2023 agreement; it had earlier expected Polaris to make electricity in 2024, which it did not.
    - who: Commonwealth Fusion Systems, ARC
      where: USA
      when: 2032
      outcome: ongoing
      note: A 400 MW plant near Richmond, Virginia, planned for the early 2030s; Google has agreed to buy half its output and Eni over $1 billion of power.
    - who: Pacific Fusion
      where: USA
      when: 2030
      outcome: ongoing
      note: Aims at facility gain by 2030, a step short of net electricity.
  forecast:
    note: >-
      Private fusion has raised about $14 billion (FIA, July 2026) and most
      firms say the early 2030s; Helion says it will begin initial
      operations in 2028, softened in 2026 from producing electricity then.
      Metaculus's question on a plant with wall-plug gain above 1 had a
      median near 2044. Those dates have slipped before, and engineering gain needs a Q well above 5 to 10 for magnetic
      routes or much higher target gains for inertial ones. Judgment: the
      first net-electric run around 2034, by whichever route gets there.
    sources:
      - title: Fusion Industry Association, 2026 global fusion industry report
        url: https://www.fusionindustryassociation.org/fusion-industry-attracts-record-annual-funding-of-4-48bn-raising-total-to-14-24bn/
      - title: Helion, world's first fusion power purchase agreement with Microsoft (2023)
        url: https://www.helionenergy.com/newsroom/helion-announces-worlds-first-fusion-ppa-with-microsoft
      - title: TechCrunch, Commonwealth Fusion Systems books a $1B power deal (2025)
        url: https://techcrunch.com/2025/09/22/commonwealth-fusion-systems-books-a-1b-power-deal-for-its-future-fusion-reactor/
  sources:
    - title: Fusion Industry Association, 2026 global fusion industry report
      url: https://www.fusionindustryassociation.org/fusion-industry-attracts-record-annual-funding-of-4-48bn-raising-total-to-14-24bn/
    - title: Proxima Fusion, Alpha
      url: https://www.proximafusion.com/program/alpha
    - title: Type One Energy, Series B (2026)
      url: https://www.typeoneenergy.com/news/type-one-energy-completes-200m-series-b-financing

