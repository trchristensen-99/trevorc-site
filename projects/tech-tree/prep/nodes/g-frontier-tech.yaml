- id: personal-self-driving-cars
  name: Self-driving personal cars
  kind: device
  fields: [engineering, computing]
  track: land-transport
  date: { window: [2028, 2042], likely: 2033 }
  status: speculative
  tier: 3
  summary: >-
    Cars that people own and that drive themselves anywhere in a large
    region with no one watching the road, so the owner can sleep or work.
    In 2026 consumer systems, including Tesla's Full Self-Driving, still
    required a supervising driver.
  requires: [robotaxis-at-scale]
  criterion: >-
    At least 100,000 privately owned cars are legally allowed to drive
    themselves door to door, including on highways and city streets across
    at least a whole metropolitan area, with no human required to watch the
    road (SAE level 4 in private ownership).
  efforts:
    - who: Tesla (FSD, camera-only end-to-end neural network)
      where: USA
      when: 2026
      outcome: ongoing
      note: Still sold as "Supervised" for consumers in 2026, while unsupervised in Tesla's own robotaxi fleets in some cities.
    - who: Waymo and car makers (lidar, radar and detailed maps)
      where: USA, Japan
      when: 2026
      outcome: rival
      note: The sensor-heavy approach that works in robotaxis is costlier per car, which is why it has stayed in fleets.
  forecast:
    note: >-
      Robotaxis work in mapped, geofenced cities with remote support;
      personal cars must handle any road and weather, and makers would carry
      the liability. Expect the first unsupervised personal-car offers late
      in the 2020s and 100,000 such cars in the early to mid 2030s. Judgment.
    sources:
