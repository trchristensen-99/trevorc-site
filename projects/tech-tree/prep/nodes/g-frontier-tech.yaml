# ---------------------------------------------------------------------------
# Quantum computing: the open steps
# ---------------------------------------------------------------------------

- id: topological-qubits
  name: Topological qubits
  kind: device
  fields: [physics, computing]
  track: quantum-atomic
  date: { window: [2028, 2045], likely: 2035 }
  status: ongoing
  tier: 3
  summary: >-
    Qubits that store information in exotic states (Majorana zero modes)
    spread across a superconducting nanowire, so local noise cannot easily
    disturb them. If they work they would need far less error correction;
    whether anyone has made one is disputed.
  requires: [superconductivity, quantum-mechanics, integrated-circuit]
  criterion: >-
    A qubit whose protection comes from topological states, confirmed by
    independent groups (for example through braiding or parity
    measurements), with error rates below those of the best conventional
    qubits.
  efforts:
    - who: Microsoft (Station Q, Majorana 1)
      where: USA, Denmark, Netherlands
      when: 2025
      outcome: ongoing
      note: Announced Majorana 1 with eight "topological qubits" in February 2025, but the accompanying Nature paper said its measurements did not by themselves show the states were topological. Microsoft is in the final stage of DARPA's Quantum Benchmarking Initiative.
  forecast:
    note: >-
      Two decades of Majorana claims have not yet produced an agreed working
      qubit. Microsoft says it can reach useful scale quickly once one works;
      DARPA's program will judge by 2033. Low confidence; it may be overtaken
      by other platforms before it matures.
    sources:
      - title: Microsoft Quantum team 2025, Interferometric single-shot parity measurement in InAs-Al hybrid devices, Nature
        url: https://doi.org/10.1038/s41586-024-08445-2
      - title: DARPA, Quantum Benchmarking Initiative
        url: https://www.darpa.mil/research/programs/quantum-benchmarking-initiative
  sources:
    - title: Microsoft, Majorana 1 chip carves new path for quantum computing (2025)
      url: https://news.microsoft.com/source/features/innovation/microsofts-majorana-1-chip-carves-new-path-for-quantum-computing/
    - title: Microsoft Quantum team 2025, Nature 638, 651
      url: https://doi.org/10.1038/s41586-024-08445-2

- id: useful-quantum-advantage
  name: Useful quantum advantage
  kind: discovery
  fields: [computing, physics]
  track: computers
  date: { window: [2026, 2031], likely: 2027 }
  status: ongoing
  tier: 2
  summary: >-
    A quantum computer doing a calculation someone actually needs, in
    physics, chemistry or materials, better than any classical computer can.
    Earlier "supremacy" tasks were contrived; in 2025 and 2026 Google and IBM
    claimed the first verifiable or useful advantages, and classical
    researchers are testing each claim.
  requires: [quantum-supremacy, quantum-computing]
  helped_by: [below-threshold-error-correction, logical-qubit-processors]
  criterion: >-
    A quantum computer solves a problem of scientific or commercial value
    (not a benchmark designed for quantum hardware) faster, more cheaply or
    more accurately than the best known classical method, and the claim
    survives at least a year of attempts to match it classically.
  efforts:
    - who: Google Quantum AI (Quantum Echoes on Willow)
      where: USA
      when: 2025
      outcome: ongoing
      note: Claimed the first verifiable quantum advantage in October 2025, measuring an out-of-time-order correlator about 13,000 times faster than supercomputers (Nature).
    - who: IBM with the University of Chicago, Qedma and Algorithmiq
      where: USA, Israel, Finland
      when: 2026
      outcome: ongoing
      note: Published three advantage claims in July 2026 on its Quantum Advantage Tracker. Within two weeks a classical team reproduced the University of Chicago result in 37 minutes on GPUs; the other two had not been matched.
  forecast:
    note: >-
      IBM predicted the first advantages would be found by the end of 2026
      and set up a public tracker for claims and rebuttals. Classical
      simulation has overturned most earlier claims within months, so I
      expect a claim to survive a year of scrutiny around 2027, with the
      first commercially valuable one (chemistry or materials) later.
    sources:
      - title: IBM Quantum blog, The dawn of quantum advantage (2025)
        url: https://www.ibm.com/quantum/blog/quantum-advantage-era
      - title: IBM, Quantum advantage claims (July 2026)
        url: https://www.ibm.com/quantum/blog/quantum-advantage
      - title: Manabe, Gu and Pan 2026, classical reproduction of the IBM and UChicago result (arXiv)
        url: https://arxiv.org/abs/2608.13110
  sources:
    - title: Google Quantum AI 2025, Observation of constructive interference at the edge of quantum ergodicity, Nature
      url: https://doi.org/10.1038/s41586-025-09526-6
    - title: Google, Our quantum hardware demonstrates verifiable quantum advantage (2025)
      url: https://blog.google/innovation-and-ai/technology/research/quantum-hardware-verifiable-advantage/
    - title: IBM and University of Chicago demonstrate quantum advantage (July 2026)
      url: https://newsroom.ibm.com/2026-07-30-ibm-and-the-university-of-chicago-demonstrate-quantum-advantage,-establishing-trusted-quantum-computation-on-logical-circuits

