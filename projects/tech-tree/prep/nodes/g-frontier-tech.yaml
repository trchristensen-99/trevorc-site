- id: superhuman-coder
  name: Automated coder (superhuman coder)
  kind: technique
  fields: [computing, society]
  track: deep-learning
  date: { window: [2027, 2035], likely: 2029 }
  status: speculative
  tier: 2
  summary: >-
    AI that does all the coding work of a frontier AI lab better and much
    faster than its best engineers, so that human researchers only choose
    what to build. It is the first step in most forecasts of AI speeding up
    its own development.
  requires: [ai-agents, ai-coding-assistants, ai-horizon-1-workday]
  helped_by: [ai-horizon-1-month, ai-datacenters]
  criterion: >-
    The AI 2027 "superhuman coder" bar: a frontier AI company could run the
    system on 5 percent of its compute as about 30 times as many agents as it
    has human researchers, each doing the company's coding tasks about 30
    times faster than its best human engineer, at equal or better quality.
    A lab saying it has stopped hiring software engineers for research
    because AI does that work would be strong evidence.
  efforts:
    - who: Anthropic (Claude Code, Claude Opus and Mythos models)
      where: USA
      when: 2026
      outcome: ongoing
      note: Claude Opus 4.6 (February 2026) was the first model METR measured above an 8-hour, 50 percent time horizon; an early Mythos Preview reached about 17 hours (April 2026).
    - who: OpenAI (Codex, GPT-5.x and GPT-6)
      where: USA
      when: 2026
      outcome: ongoing
      note: METR found GPT-5.6 Sol (June 2026) cheated on tasks more often than any public model it had tested and judged it would not enable fully automated AI research.
    - who: Google DeepMind; xAI; DeepSeek; Cursor; Cognition
      where: USA, UK, China
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      METR's 50 percent time horizon on software tasks crossed 1 hour in
      February 2025 and 8 hours in February 2026 (Claude Opus 4.6, about 12
      hours, 95 percent interval 5 to 61 hours), doubling about every 4.3
      months since 2023. The 80 percent horizon is four to six times shorter
      (about 3 hours for the best model), and METR says its tasks cannot
      measure beyond about 16 hours, so the trend is now hard to check.
      Carried forward, a 50 percent horizon of a work-month arrives around
      2027 to 2029. The AI 2027 scenario put the superhuman coder in early
      2027; in August 2026 its authors' medians for the similar "automated
      coder" were November 2027 (Kokotajlo) and January 2030 (Lifland), and
      the AI Futures model's December 2025 median was late 2031, and its
      August 2026 default run reaches it around October 2027. I put it at
      2028, allowing for the reliability gap between finishing half of long
      tasks and doing a lab's work.
    sources:
      - title: METR, Time horizon 1.1 (January 2026)
        url: https://metr.org/blog/2026-01-29-time-horizon-1-1/
      - title: METR, benchmark results (time horizons by model)
        url: https://metr.org/assets/benchmark_results_1_1.yaml
      - title: AI Futures Project, Q2.5 2026 timelines update (August 2026)
        url: https://blog.aifutures.org/p/q25-2026-timelines-update-uplift
      - title: AI Futures Project, AI Futures Model December 2025 update
        url: https://blog.aifutures.org/p/ai-futures-model-dec-2025-update
      - title: AI 2027, takeoff forecast (definitions)
        url: https://ai-2027.com/research/takeoff-forecast
  sources:
    - title: AI 2027, takeoff forecast (definitions of superhuman coder and researcher)
      url: https://ai-2027.com/research/takeoff-forecast
    - title: METR, Time horizons
      url: https://metr.org/time-horizons/
    - title: METR, GPT-5.6 Sol evaluation (June 2026)
      url: https://metr.org/blog/2026-06-26-gpt-5-6-sol/

- id: ai-autonomous-science
  name: AI that makes major discoveries in natural science
  kind: technique
  fields: [computing, society]
  track: deep-learning
  date: { window: [2027, 2036], likely: 2030 }
  status: ongoing
  tier: 3
  summary: >-
    AI agents that form hypotheses, run experiments through automated labs
    or simulations, and reach discoveries in physics, chemistry or biology
    on their own. By 2026 AI had proved significant math results, but its
    lab discoveries still relied on humans to run the experiments.
  requires: [ai-discovered-results, ai-agents]
  helped_by: [superhuman-coder, robot-foundation-models, protein-structure-prediction]
  criterion: >-
    An AI system, with humans only supplying resources and checking the
    work, makes a discovery in a natural science that is published in a
    leading journal with the AI as the main contributor, and that experts
    rank among the important results of its field that year.
  efforts:
    - who: FutureHouse (Robin)
      where: USA
      when: 2025
      outcome: ongoing
      note: A multi-agent system proposed ripasudil as a treatment for dry macular degeneration (May 2025), with humans running the lab work; published in Nature in May 2026.
    - who: Google (AI co-scientist)
      where: USA, UK
      when: 2025
      outcome: ongoing
      note: Proposed drug-repurposing candidates for leukemia and independently arrived at an unpublished, already validated mechanism of gene transfer in bacteria (February 2025).
    - who: Sakana AI (AI Scientist v2)
      where: Japan
      when: 2025
      outcome: ongoing
      note: A fully AI-written paper passed peer review at an ICLR 2025 workshop and was withdrawn as planned.
    - who: Edison Scientific (Kosmos)
      where: USA
      when: 2025
      outcome: ongoing
      note: Runs of about 12 hours were judged equal to months of human research; about 79 percent of report statements were accurate.
  forecast:
    note: >-
      Math, where answers can be checked by machine, fell first: in May 2026
      an unreleased OpenAI model disproved Erdős's 1946 unit distance
      conjecture, a result Tim Gowers said he would have recommended for the
      Annals of Mathematics. Natural science also needs physical
      experiments, which are slower and need lab automation. If automated
      coders arrive near 2029, AI-led discovery in simulation-heavy fields
      should follow within a year or two. Judgment: around 2030.
    sources:
      - title: Quanta Magazine, Why the legendary Erdős problems are falling to AI (August 2026)
        url: https://www.quantamagazine.org/why-the-legendary-erdos-problems-are-falling-to-ai-20260803/
      - title: FutureHouse, Robin, end-to-end scientific discovery with a multi-agent system
        url: https://www.futurehouse.org/research-announcements/demonstrating-end-to-end-scientific-discovery-with-robin-a-multi-agent-system
  sources:
    - title: Google Research, Accelerating scientific breakthroughs with an AI co-scientist (2025)
      url: https://research.google/blog/accelerating-scientific-breakthroughs-with-an-ai-co-scientist/
    - title: Sakana AI, The AI Scientist generates its first peer-reviewed scientific publication (2025)
      url: https://sakana.ai/ai-scientist-first-publication/
    - title: Kosmos, an AI scientist for autonomous discovery (arXiv 2025)
      url: https://arxiv.org/abs/2511.02824

- id: continual-learning-ai
  name: AI that learns on the job
  kind: technique
  fields: [computing]
  track: deep-learning
  date: { window: [2027, 2040], likely: 2031 }
  status: speculative
  tier: 3
  summary: >-
    AI that keeps learning from its own experience after it is deployed,
    building up skill and context the way a new employee does, rather than
    staying frozen between training runs. Many researchers see this, or
    learned world models, as the missing piece that scaling alone may not
    supply.
  requires: [reasoning-models, ai-agents]
  criterion: >-
    A deployed AI system improves at a new job from its own experience and
    feedback over days to weeks, about as fast and as lastingly as a capable
    human hire, without its developer running a new training run, across
    white-collar work in general.
  efforts:
    - who: Frontier labs (OpenAI, Anthropic, Google DeepMind)
      where: USA, UK
      when: 2026
      outcome: ongoing
      note: Memory and long context let 2026 agents carry notes between sessions, but their weights stay fixed between releases.
    - who: Yann LeCun, AMI Labs (Advanced Machine Intelligence)
      where: France, USA
      when: 2025
      outcome: rival
      note: Founded December 2025 after LeCun left Meta, to build world models that learn how the physical world works; raised $1.03 billion in March 2026.
  forecast:
    note: >-
      Dwarkesh Patel argued in June 2025 that the lack of continual learning
      is the main reason models do not yet replace human workers, and gave
      2032 as his 50 percent date for AI that learns on the job as easily as
      a human. Lab research on test-time training and memory is active but
      no lab has shipped it. Judgment: early 2030s, with wide uncertainty.
    sources:
      - title: Dwarkesh Patel, Why I don't think AGI is right around the corner (June 2025)
        url: https://www.dwarkesh.com/p/timelines-june-2025
  sources:
    - title: Dwarkesh Patel, Why I don't think AGI is right around the corner (June 2025)
      url: https://www.dwarkesh.com/p/timelines-june-2025
    - title: Wikipedia, Yann LeCun
      url: https://en.wikipedia.org/wiki/Yann_LeCun

