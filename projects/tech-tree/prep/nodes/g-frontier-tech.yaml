- id: compressed-air-storage
  name: Gigawatt-hour compressed air storage
  kind: infrastructure
  fields: [energy, engineering]
  track: grid
  date: 2025
  status: achieved
  tier: 3
  summary: >-
    Storing energy by pumping air into salt caverns or mines and releasing
    it through turbines, now with the heat of compression kept and reused.
    China's plants of 300 to 600 MW and 1.5 to 2.4 GWh, with about 70
    percent round-trip efficiency, made it a grid-scale rival to batteries.
  requires: [power-grid, steam-turbine]
  competes: [grid-batteries]
  efforts:
    - who: Hubei Yingcheng plant (Nengchu-1)
      where: China
      when: 2025
      outcome: achieved
      note: 300 MW and 1,500 MWh, about 70 percent efficient, fully grid-connected in January 2025.
    - who: Huai'an plant, Jiangsu
      where: China
      when: 2026
      outcome: achieved
      note: 600 MW and 2.4 GWh in two units, fully operating by March 2026.
    - who: Hydrostor (Willow Rock, Silver City)
      where: USA, Australia
      when: 2026
      outcome: ongoing
  sources:
    - title: ESS News, World's largest compressed air storage facility in full operation (2025)
      url: https://www.ess-news.com/2025/01/10/worlds-largest-compressed-air-energy-storage-facility-commences-full-operation-in-china/
    - title: ESS News, World's largest compressed air storage station fully operational (2026)
      url: https://www.ess-news.com/2026/03/04/worlds-largest-compressed-air-energy-storage-station-now-fully-operational-in-china/
    - title: Hydrostor, Willow Rock Energy Storage Center
      url: https://hydrostor.ca/project/willow-rock-energy-storage-center/

- id: closed-loop-geothermal
  name: Closed-loop geothermal
  kind: technique
  fields: [energy, engineering]
  track: renewables
  date: { window: [2026, 2030], likely: 2027 }
  status: ongoing
  tier: 3
  summary: >-
    Circulating fluid through sealed, radiator-like loops of deep horizontal
    wells, so heat is taken from rock without fracturing it or needing
    natural hot water. It avoids induced earthquakes but extracts heat more
    slowly.
  requires: [shale-fracking, electric-generator]
  competes: [enhanced-geothermal]
  criterion: >-
    A closed-loop geothermal plant delivers at least 5 MW of electricity to
    a grid for a year.
  efforts:
    - who: Eavor Technologies (Geretsried)
      where: Germany, Canada
      when: 2026
      outcome: ongoing
      note: Designed for about 8.2 MW of electricity and 64 MW of heat; drilling and technical updates through May 2026.
  forecast:
    note: >-
      Geretsried's first loops were drilled by 2026; first power and a year
      of output point to 2027. Judgment.
    sources:
      - title: Eavor, Geretsried project
        url: https://eavor.de/projekt-geretsried/
  sources:
    - title: Eavor, Geretsried project
      url: https://eavor.de/projekt-geretsried/

- id: superhot-rock-geothermal
  name: Superhot rock geothermal
  kind: technique
  fields: [energy, engineering]
  track: renewables
  date: { window: [2030, 2050], likely: 2036 }
  status: speculative
  tier: 3
  summary: >-
    Drilling to rock above about 374 °C, where water becomes supercritical and
    carries several times more energy per well. It would make geothermal
    cheap almost anywhere, but needs drills and well materials that survive
    those temperatures, possibly by vaporizing rock with millimeter waves.
  requires: [shale-fracking, electric-generator]
  helped_by: [enhanced-geothermal]
  criterion: >-
    A plant produces electricity commercially from wells in rock above
    374 °C (supercritical water conditions).
  efforts:
    - who: Quaise Energy (millimeter-wave drilling)
      where: USA
      when: 2026
      outcome: ongoing
      note: Project Obsidian in central Oregon (announced April 2026) plans 50 MW, then 250 MW, then over 1 GW; a confirmation well toward 15,000 feet and 700 °F was under way in October 2026.
  forecast:
    note: >-
      Millimeter-wave drilling has not yet been proven at depth, and well
      casings and pumps must last at supercritical conditions. Judgment:
      mid-2030s for a first commercial plant.
    sources:
      - title: Quaise Energy, Introducing Project Obsidian (2026)
        url: https://www.quaise.com/news/introducing-project-obsidian
      - title: Quaise Energy, Confirming the resource at Project Obsidian (2026)
        url: https://www.quaise.com/news/confirming-the-resource-at-project-obsidian
  sources:
    - title: Quaise Energy, Introducing Project Obsidian (2026)
      url: https://www.quaise.com/news/introducing-project-obsidian

- id: geothermal-at-scale
  name: Next-generation geothermal at gigawatt scale
  kind: infrastructure
  fields: [energy]
  track: renewables
  date: { window: [2029, 2038], likely: 2031 }
  status: ongoing
  tier: 2
  summary: >-
    Engineered geothermal plants, no longer limited to volcanic hot springs,
    adding firm, carbon-free power by the gigawatt. Fervo's Utah plant began
    commercial operation in October 2026 with about 900 MW contracted.
  requires: [electric-generator, shale-fracking]
  routes:
    - name: Fractured hot rock (enhanced geothermal)
      requires: [enhanced-geothermal]
      note: Fervo, Utah FORGE, Sage Geosystems.
    - name: Closed loop
      requires: [closed-loop-geothermal]
      note: Eavor.
    - name: Superhot rock
      requires: [superhot-rock-geothermal]
      note: Quaise.
  criterion: >-
    At least 1 GW of new-type geothermal capacity (enhanced, closed-loop or
    superhot) is operating in one country.
  efforts:
    - who: Fervo Energy (Cape Station, Utah)
      where: USA
      when: 2026
      outcome: ongoing
      note: First 33 MW block in commercial operation October 1, 2026; about 100 MW by January 2027 and a 400 MW next phase targeted for 2028; about 900 MW contracted, including 396 MW for Google.
    - who: Sage Geosystems (with Ormat); Utah FORGE (DOE)
      where: USA
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      Fervo alone plans about 500 MW by 2028. Reaching a gigawatt needs a
      second large site or another developer, and drilling costs must keep
      falling. Judgment: 2031.
    sources:
      - title: ThinkGeoEnergy, Fervo reports first power at Cape Station (2026)
        url: https://www.thinkgeoenergy.com/fervo-energy-reports-first-power-generation-at-cape-station-enhanced-geothermal-site-utah/
      - title: Fervo Energy, news
        url: https://fervoenergy.com/news/
  sources:
    - title: ThinkGeoEnergy, Fervo reports first power at Cape Station (2026)
      url: https://www.thinkgeoenergy.com/fervo-energy-reports-first-power-generation-at-cape-station-enhanced-geothermal-site-utah/
    - title: Sage Geosystems
      url: https://www.sagegeosystems.com/

# ---------------------------------------------------------------------------
# Carbon removal routes
# ---------------------------------------------------------------------------

- id: beccs
  name: Bioenergy with carbon capture (BECCS)
  kind: technique
  fields: [energy, chemistry]
  track: carbon
  date: { window: [2028, 2034], likely: 2029 }
  status: ongoing
  tier: 3
  summary: >-
    Burning or fermenting plants for energy and burying the CO2, so carbon
    the plants pulled from the air stays underground. It can run at large
    scale with today's equipment, but competes for land and biomass.
  requires: [carbon-capture]
  criterion: >-
    A BECCS plant removes and permanently stores at least 500,000 tonnes of
    biogenic CO2 a year, verified by a third party.
  efforts:
    - who: Stockholm Exergi (Värtaverket combined heat and power plant)
      where: Sweden
      when: 2026
      outcome: ongoing
      note: Under construction (foundation finished September 2026), planned to remove 7.83 million tonnes over its first ten years, with €180 million from the EU Innovation Fund and over SEK 20 billion of Swedish support.
    - who: Microsoft and other carbon removal buyers
      where: USA
      when: 2025
      outcome: ongoing
      note: BECCS makes up most of the tonnes contracted in large removal deals.
  forecast:
    note: >-
      Stockholm Exergi's plant is the first large one with financing in
      place; at about 800,000 tonnes a year it would meet the bar once
      running, expected near the end of the decade. Judgment: 2029.
    sources:
      - title: Stockholm Exergi, BECCS
        url: https://www.stockholmexergi.se/en/beccs/
  sources:
    - title: Stockholm Exergi, BECCS
      url: https://www.stockholmexergi.se/en/beccs/
    - title: CDR.fyi
      url: https://www.cdr.fyi/

- id: enhanced-weathering
  name: Enhanced rock weathering
  kind: technique
  fields: [chemistry, agriculture]
  track: industrial-chemistry
  date: { window: [2028, 2036], likely: 2031 }
  status: ongoing
  tier: 3
  summary: >-
    Spreading crushed basalt or similar rock on farmland so that rain turns
    CO2 into dissolved bicarbonate, speeding a reaction that controls the
    climate over geological time. It is cheap to spread but hard to measure.
  requires: [climate-science, agriculture]
  criterion: >-
    Enhanced weathering projects deliver at least one million tonnes a year
    of third-party verified CO2 removal.
  efforts:
    - who: Lithos Carbon
      where: USA
      when: 2025
      outcome: ongoing
      note: 5,160 registry-certified tonnes issued by December 2025, then the largest such issuance.
    - who: UNDO
      where: UK
      when: 2026
      outcome: ongoing
      note: Has spread about 358,000 tonnes of rock, which it expects to remove about 79,000 tonnes of CO2 over time.
  forecast:
    note: >-
      Verified tonnes are in the thousands a year, and measurement methods
      are still being settled. Durable removal overall is growing about 40
      percent a year (CDR.fyi, 2026); at faster rates typical of a young
      market, a million verified tonnes a year comes around the early 2030s.
      Judgment.
    sources:
      - title: Lithos Carbon
        url: https://www.lithoscarbon.com/
      - title: CDR.fyi, monthly recap June 2026
        url: https://www.cdr.fyi/blog/cdr-monthly-recap-june-2026
  sources:
    - title: Lithos Carbon
      url: https://www.lithoscarbon.com/
    - title: UNDO
      url: https://www.un-do.com/

