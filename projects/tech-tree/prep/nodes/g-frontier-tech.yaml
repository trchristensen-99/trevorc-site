# Frontier technology: the intermediate steps, alternative routes and
# measurable goals for computing and AI, quantum computing, chips, fusion and
# fission, clean energy, carbon removal, superconductors, space and transport.
# Changes to existing frontier nodes are in patches/frontier-tech.yaml.

# ---------------------------------------------------------------------------
# Quantum computing: the qubit modalities (routes to fault tolerance)
# ---------------------------------------------------------------------------

- id: trapped-ion-qubits
  name: Trapped-ion qubits
  kind: technique
  fields: [physics, computing]
  track: quantum-atomic
  date: 1995
  status: achieved
  tier: 3
  summary: >-
    Qubits stored in single charged atoms held by electric fields and
    controlled with lasers or microwaves. They have the best gate fidelities
    of any platform but run slowly, and scaling means shuttling ions between
    zones on a chip.
  requires: [laser, quantum-mechanics]
  efforts:
    - who: Ignacio Cirac and Peter Zoller
      where: Austria
      when: 1995
      outcome: achieved
      note: Proposed a quantum computer built from cold trapped ions.
    - who: Christopher Monroe, David Wineland and colleagues (NIST)
      where: USA
      when: 1995
      outcome: achieved
      note: First two-qubit quantum logic gate, on a single beryllium ion.
    - who: Quantinuum; IonQ (with Oxford Ionics); AQT; Oxford Ionics
      where: USA, UK, Austria
      when: 2025
      outcome: ongoing
  sources:
    - title: Monroe et al. 1995, Demonstration of a Fundamental Quantum Logic Gate, Physical Review Letters
      url: https://doi.org/10.1103/PhysRevLett.75.4714

- id: superconducting-qubits
  name: Superconducting qubits
  kind: device
  fields: [physics, electronics]
  track: quantum-atomic
  date: 1999
  status: achieved
  tier: 3
  summary: >-
    Qubits made from tiny superconducting circuits with Josephson junctions,
    cooled near absolute zero and made with chip fabrication methods. They are
    fast and the most developed platform (Google, IBM, USTC), but need wiring
    and refrigeration for every qubit.
  requires: [superconductivity, integrated-circuit, quantum-mechanics]
  uses: [res-helium]
  efforts:
    - who: Yasunobu Nakamura, Yuri Pashkin and Jaw-Shen Tsai (NEC)
      where: Japan
      when: 1999
      outcome: achieved
      note: Coherent control of a single-Cooper-pair box, the first superconducting qubit.
    - who: Google Quantum AI; IBM; USTC (Zuchongzhi); Rigetti; AWS
      where: USA, China
      when: 2025
      outcome: ongoing
  sources:
    - title: Nakamura, Pashkin and Tsai 1999, Coherent control of macroscopic quantum states in a single-Cooper-pair box, Nature
      url: https://doi.org/10.1038/19718

- id: photonic-qubits
  name: Photonic quantum computing
  kind: technique
  fields: [physics, computing]
  track: quantum-atomic
  date: 2003
  status: achieved
  tier: 3
  summary: >-
    Computing with single photons in optical circuits. Photons barely
    interact, so gates are probabilistic and built from measurement, but
    chips can be made in ordinary silicon photonics foundries and work at
    room temperature apart from the detectors.
  requires: [laser, quantum-mechanics, optical-fiber]
  efforts:
    - who: Emanuel Knill, Raymond Laflamme and Gerard Milburn
      where: USA, Canada, Australia
      when: 2001
      outcome: achieved
      note: Showed that linear optics plus photon detection is enough for efficient quantum computing.
    - who: Jeremy O'Brien and colleagues (University of Queensland)
      where: Australia
      when: 2003
      outcome: achieved
      note: First all-optical controlled-NOT gate.
    - who: Pan Jianwei and Lu Chaoyang (USTC), Jiuzhang
      where: China
      when: 2020
      outcome: achieved
      note: Quantum advantage on Gaussian boson sampling with 76 detected photons.
    - who: PsiQuantum; Xanadu; Quandela
      where: USA, Canada, France
      when: 2025
      outcome: ongoing
  sources:
    - title: Knill, Laflamme and Milburn 2001, A scheme for efficient quantum computation with linear optics, Nature
      url: https://doi.org/10.1038/35051009
    - title: O'Brien et al. 2003, Demonstration of an all-optical quantum controlled-NOT gate, Nature
      url: https://doi.org/10.1038/nature02054
    - title: Zhong et al. 2020, Quantum computational advantage using photons, Science
      url: https://doi.org/10.1126/science.abe8770

- id: neutral-atom-arrays
  name: Neutral-atom qubit arrays
  kind: technique
  fields: [physics, computing]
  track: quantum-atomic
  date: 2016
  status: achieved
  tier: 3
  summary: >-
    Uncharged atoms held in grids of laser tweezers and entangled by exciting
    them to large Rydberg states. Atoms can be moved mid-computation, which
    suits error-correcting codes, and arrays grew from dozens to thousands of
    atoms in under a decade.
  requires: [laser, quantum-mechanics]
  efforts:
    - who: Thad Walker and Mark Saffman (Wisconsin); Antoine Browaeys (Institut d'Optique)
      where: USA, France
      when: 2010
      outcome: achieved
      note: First neutral-atom controlled-NOT gate using Rydberg blockade (Wisconsin, 2010).
    - who: Browaeys group; Mikhail Lukin and Markus Greiner (Harvard)
      where: France, USA
      when: 2016
      outcome: achieved
      note: Defect-free arrays assembled atom by atom with movable tweezers.
    - who: QuEra; Atom Computing; Pasqal; Infleqtion
      where: USA, France
      when: 2025
      outcome: ongoing
  sources:
    - title: Isenhower et al. 2010, Demonstration of a Neutral Atom Controlled-NOT Quantum Gate, Physical Review Letters
      url: https://doi.org/10.1103/PhysRevLett.104.010503
    - title: Barredo et al. 2016, An atom-by-atom assembler of defect-free arbitrary two-dimensional atomic arrays, Science
      url: https://doi.org/10.1126/science.aah3778

- id: logical-qubit-processors
  name: Processors of many logical qubits
  kind: device
  fields: [physics, computing]
  track: quantum-atomic
  date: 2023
  status: achieved
  tier: 3
  summary: >-
    Running algorithms on dozens of error-corrected logical qubits at once
    rather than on bare physical qubits. The codes were small and the
    circuits short, but it showed the machinery of fault tolerance working
    together.
  requires: [quantum-error-correction, neutral-atom-arrays]
  helped_by: [trapped-ion-qubits]
  efforts:
    - who: Dolev Bluvstein, Mikhail Lukin and colleagues (Harvard, MIT, QuEra)
      where: USA
      when: 2023
      outcome: achieved
      note: Up to 48 logical qubits on 280 atoms, with entangling gates between them.
    - who: Quantinuum (Helios)
      where: USA, UK
      when: 2025
      outcome: independent
      note: "November 2025: 98 barium-ion qubits with 99.92 percent two-qubit fidelity, encoding a claimed 48 error-corrected logical qubits (a 2:1 ratio some observers question)."
    - who: Harvard, MIT and QuEra
      where: USA
      when: 2025
      outcome: achieved
      note: A 3,000-atom array run continuously for over two hours, and a fault-tolerant architecture with dozens of logical qubits below threshold (Nature, 2025).
  sources:
    - title: Quantum Computing Report, Quantinuum launches Helios (2025)
      url: https://quantumcomputingreport.com/quantinuum-launches-helios-quantum-computer-with-industry-leading-fidelity-and-singapore-partnership/
    - title: Chiu et al. 2025, Continuous operation of a coherent 3,000-qubit system (arXiv)
      url: https://arxiv.org/abs/2506.20660
    - title: Bluvstein et al. 2023, Logical quantum processor based on reconfigurable atom arrays, Nature
      url: https://doi.org/10.1038/s41586-023-06927-3

# ---------------------------------------------------------------------------
# Fusion: confinement routes and the steps to a power plant
# ---------------------------------------------------------------------------

- id: optimized-stellarator
  name: Optimized stellarator
  kind: device
  fields: [physics, energy]
  track: nuclear-particle
  date: 2021
  status: achieved
  tier: 3
  summary: >-
    A twisted magnetic bottle whose coils are shaped by computer optimization
    so the plasma stays confined without a large current flowing through it,
    which avoids the sudden disruptions of tokamaks. Wendelstein 7-X showed in
    2021 that the optimization works.
  requires: [tokamak, stored-program-computer, superconductivity]
  competes: [tokamak]
  efforts:
    - who: Lyman Spitzer (Princeton)
      where: USA
      when: 1951
      outcome: achieved
      note: Invented the stellarator; early ones lost heat too fast and were eclipsed by the tokamak.
    - who: Max Planck Institute for Plasma Physics, Wendelstein 7-X
      where: Germany
      when: 2021
      outcome: achieved
      note: First plasma 2015; reduced neoclassical heat loss confirmed in Nature (2021); record long-pulse triple product sustained for 43 seconds in May 2025.
    - who: Proxima Fusion; Type One Energy; Thea Energy
      where: Germany, USA
      when: 2025
      outcome: ongoing
      note: Startups designing stellarator power plants with high-temperature superconducting magnets.
  sources:
    - title: Beidler et al. 2021, Demonstration of reduced neoclassical energy transport in Wendelstein 7-X, Nature
      url: https://doi.org/10.1038/s41586-021-03687-w
    - title: EUROfusion, Wendelstein 7-X sets world record for long plasma triple product (2025)
      url: https://euro-fusion.org/eurofusion-news/wendelstein-7-x-sets-world-record-for-long-plasma-triple-product/

- id: hts-fusion-magnets
  name: High-field superconducting fusion magnets
  kind: device
  fields: [physics, materials]
  track: nuclear-particle
  date: 2021
  status: achieved
  tier: 3
  summary: >-
    Large magnets wound from high-temperature superconducting tape that reach
    about 20 tesla. Fusion power density rises with the fourth power of field
    strength, so these allow tokamaks and stellarators tens of times smaller
    than ITER for the same performance.
  requires: [rebco-coated-conductor, tokamak]
  efforts:
    - who: Commonwealth Fusion Systems and MIT Plasma Science and Fusion Center
      where: USA
      when: 2021
      outcome: achieved
      note: A 20 tesla large-bore magnet test on September 5, 2021, the design used in SPARC.
    - who: Tokamak Energy; Energy Singularity (HH70)
      where: UK, China
      when: 2024
      outcome: independent
      note: Energy Singularity's HH70, the first all-HTS tokamak, made its first plasma in 2024.
  sources:
    - title: MIT News, MIT-designed project achieves major advance toward fusion energy (2021)
      url: https://news.mit.edu/2021/MIT-CFS-major-advance-toward-fusion-energy-0908
    - title: Wikipedia, HH70
      url: https://en.wikipedia.org/wiki/HH70

- id: magneto-inertial-fusion
  name: Magnetized target fusion
  kind: technique
  fields: [physics, energy]
  track: nuclear-particle
  date: 2014
  status: achieved
  tier: 3
  summary: >-
    A middle path between magnetic and laser fusion: a magnetized plasma is
    squeezed in a fast pulse by a collapsing liner, colliding plasmas or
    magnetic fields. It needs neither steady confinement nor huge lasers,
    and it is the route of several of the best-funded startups.
  requires: [tokamak, electromagnetism]
  helped_by: [fusion-ignition-nif]
  efforts:
    - who: Sandia National Laboratories, MagLIF on the Z machine
      where: USA
      when: 2014
      outcome: achieved
      note: Magnetized liner inertial fusion produced thermonuclear neutrons at fusion-relevant temperatures.
    - who: Helion Energy (pulsed field-reversed configuration)
      where: USA
      when: 2026
      outcome: ongoing
      note: Aims to recover electricity directly from the expanding plasma. Its Polaris machine reached 150 million degrees and in January 2026 became the first private device to run deuterium-tritium fusion; it has not yet claimed electricity.
    - who: General Fusion (liquid-metal liner)
      where: Canada
      when: 2026
      outcome: ongoing
      note: LM26 made first plasma in March 2025; laid off about a quarter of staff in May 2025, then listed on Nasdaq in July 2026 and reported 1.1 keV electron temperature in October 2026.
    - who: Zap Energy (sheared-flow Z-pinch)
      where: USA
      when: 2025
      outcome: ongoing
      note: FuZE-3 reached about 1.6 gigapascals of plasma pressure (November 2025).
  sources:
    - title: Helion, Helion achieves new fusion energy milestones
      url: https://www.helionenergy.com/newsroom/helion-achieves-new-fusion-energy-milestones
    - title: General Fusion, 1 keV electron temperature milestone (2026)
      url: https://generalfusion.com/post/general-fusion-achieves-world-first-1-kev-electron-temperature-milestone-on-its-path-to-commercial-fusion-power/
    - title: Gomez et al. 2014, Experimental Demonstration of Fusion-Relevant Conditions in Magnetized Liner Inertial Fusion, Physical Review Letters
      url: https://doi.org/10.1103/PhysRevLett.113.155003

# ---------------------------------------------------------------------------
# Superconductors
# ---------------------------------------------------------------------------

- id: hydride-superconductors
  name: High-pressure hydride superconductors
  kind: discovery
  fields: [materials, physics]
  track: modern-materials
  date: 2015
  status: achieved
  tier: 3
  summary: >-
    Hydrogen-rich compounds squeezed in diamond anvils to over a million
    atmospheres superconduct at up to about 250 K, close to room temperature,
    as theory predicted. They prove high critical temperatures are possible
    but are useless at ordinary pressure.
  requires: [superconductivity, superconductors-high-temp]
  efforts:
    - who: Mikhail Eremets and colleagues (Max Planck Institute for Chemistry, Mainz)
      where: Germany
      when: 2015
      outcome: achieved
      note: Sulfur hydride superconducting at 203 K at about 150 gigapascals.
    - who: Eremets group; Russell Hemley group (George Washington University)
      where: Germany, USA
      when: 2019
      outcome: achieved
      note: Lanthanum hydride at about 250 K and 170 gigapascals.
  sources:
    - title: Drozdov et al. 2015, Conventional superconductivity at 203 kelvin at high pressures in the sulfur hydride system, Nature
      url: https://doi.org/10.1038/nature14964
    - title: Drozdov et al. 2019, Superconductivity at 250 K in lanthanum hydride under high pressures, Nature
      url: https://doi.org/10.1038/s41586-019-1201-8

# ---------------------------------------------------------------------------
# Space: propellant, the Moon, Mars
# ---------------------------------------------------------------------------

- id: mars-oxygen-moxie
  name: Oxygen made on Mars (MOXIE)
  kind: device
  fields: [engineering, chemistry]
  track: space
  date: 2021
  status: achieved
  tier: 3
  summary: >-
    A toaster-sized unit on the Perseverance rover that split Martian carbon
    dioxide into oxygen, the first use of another planet's resources to make
    something useful. A return trip would need about a thousand times its
    output, mostly as oxidizer for rocket fuel.
  requires: [mars-rovers, electrolysis]
  efforts:
    - who: MIT Haystack Observatory and NASA JPL (Michael Hecht, principal investigator)
      where: USA
      when: 2021
      outcome: achieved
      note: 16 runs from April 2021 to August 2023 made 122 grams of oxygen at up to 12 grams an hour, 98 percent pure.
  sources:
    - title: NASA, NASA's oxygen-generating experiment MOXIE completes Mars mission (2023)
      url: https://www.nasa.gov/missions/mars-2020-perseverance/perseverance-rover/nasas-oxygen-generating-experiment-moxie-completes-mars-mission/
    - title: Hoffman et al. 2022, Mars Oxygen ISRU Experiment (MOXIE), Science Advances
      url: https://doi.org/10.1126/sciadv.abp8636

# ---------------------------------------------------------------------------
# AI: from agents to automated research and AGI
# ---------------------------------------------------------------------------

- id: ai-discovered-results
  name: AI-discovered results in math and algorithms
  kind: technique
  fields: [computing, math]
  track: deep-learning
  date: 2023
  status: achieved
  tier: 3
  summary: >-
    Language models paired with automatic checkers that search for new
    programs and constructions, finding results that beat the best known
    human ones on open problems. The answers are narrow but new, and each can
    be verified by a machine.
  requires: [large-language-models, reinforcement-learning]
  helped_by: [alphago]
  efforts:
    - who: Google DeepMind, FunSearch (Bernardino Romera-Paredes, Pushmeet Kohli and colleagues)
      where: UK
      when: 2023
      outcome: achieved
      note: Found larger cap sets than any known, the first discovery on an open math problem by an LLM-based search (Nature, December 2023).
    - who: Google DeepMind, AlphaEvolve
      where: UK
      when: 2025
      outcome: achieved
      note: "May 2025: multiplied 4x4 complex matrices with 48 multiplications, beating Strassen's 1969 method; improved the best known answer on about 20 percent of 50-plus open problems; a scheduling heuristic recovers 0.7 percent of Google's compute."
  sources:
    - title: Romera-Paredes et al. 2023, Mathematical discoveries from program search with large language models, Nature
      url: https://doi.org/10.1038/s41586-023-06924-6
    - title: Google DeepMind, AlphaEvolve, a Gemini-powered coding agent for designing advanced algorithms (2025)
      url: https://deepmind.google/discover/blog/alphaevolve-a-gemini-powered-coding-agent-for-designing-advanced-algorithms/

- id: starship-orbital-refueling
  name: Ship-to-ship propellant transfer in orbit
  kind: technique
  fields: [engineering]
  track: space
  date: { window: [2027, 2030], likely: 2028 }
  status: ongoing
  tier: 2
  summary: >-
    Pumping cryogenic propellant from one spacecraft to another in orbit, so a
    ship can leave Earth orbit with full tanks. Both US lunar landers and
    SpaceX's Mars plans depend on it, and it has not yet been done at scale
    with cryogenic fuel.
  requires: [reusable-rockets, space-stations]
  helped_by: [fully-reusable-rockets]
  criterion: >-
    One spacecraft transfers cryogenic propellant (liquid oxygen and methane
    or hydrogen) to another in orbit at the scale of tens of tonnes or more,
    as NASA's lunar lander contracts require before an uncrewed landing.
  efforts:
    - who: SpaceX (Starship Human Landing System for NASA)
      where: USA
      when: 2027
      outcome: ongoing
      note: Moved propellant between tanks inside one ship on its third flight (March 2024); a tanker-to-depot demonstration was scheduled for early 2027 as of NASA's October 2026 update. A lunar landing needs an estimated 4 to 14 tanker flights.
    - who: Blue Origin (Blue Moon Mark 2 with a refueling transporter)
      where: USA
      when: 2028
      outcome: rival
      note: The smaller Mark 1 cargo lander had not flown by October 2026, with launch no earlier than early 2027.
    - who: Soviet and Russian Progress tankers
      where: USSR, Russia
      when: 1978
      outcome: achieved
      note: Routine transfer of storable (not cryogenic) propellant to space stations since 1978.
  forecast:
    note: >-
      SpaceX's first orbital Starship flight came only in September 2026, and
      the ship-to-ship test has already slipped from 2025 to 2027. Boil-off,
      docking of two very large ships and fast tanker turnaround all have to
      work. I expect the first transfer demonstration in 2027 to 2028 and
      treat 2028 as the date it is done at the scale a landing needs.
    sources:
      - title: Wikipedia, Starship HLS
        url: https://en.wikipedia.org/wiki/Starship_HLS
      - title: Wikipedia, SpaceX Starship flight tests
        url: https://en.wikipedia.org/wiki/SpaceX_Starship_flight_tests
  sources:
    - title: Wikipedia, Starship HLS
      url: https://en.wikipedia.org/wiki/Starship_HLS
    - title: Wikipedia, Blue Moon Pathfinder Mission 1
      url: https://en.wikipedia.org/wiki/Blue_Moon_Pathfinder_Mission_1

- id: propellant-depot
  name: Orbital propellant depots
  kind: infrastructure
  fields: [engineering]
  track: space
  date: { window: [2028, 2036], likely: 2029 }
  status: speculative
  tier: 3
  summary: >-
    Tanks parked in orbit that collect propellant from many launches and
    store it for weeks to months, the space equivalent of a fuel station.
    They turn launch cost, not rocket size, into the limit on how far
    missions can go.
  requires: [starship-orbital-refueling]
  criterion: >-
    A depot holds at least 100 tonnes of cryogenic propellant in orbit for a
    month or more with low boil-off, and then refuels a vehicle that departs
    for the Moon or beyond.
  efforts:
    - who: SpaceX (depot ship filled by tanker Starships)
      where: USA
      when: 2027
      outcome: ongoing
      note: Part of the lunar lander plan; the first fill-up flights were scheduled for 2027.
    - who: United Launch Alliance (ACES depot concepts)
      where: USA
      when: 2009
      outcome: abandoned
      note: Proposed depots around the Centaur upper stage in the 2000s and 2010s; never flown.
  forecast:
    note: >-
      A depot needs a working transfer first, then storage for weeks, which no
      one has shown for cryogenic propellant. SpaceX's lunar lander plan uses
      exactly this (a depot ship filled by several tankers), and the first
      crewed US landing (Artemis IV, targeted 2028) depends on it. If
      transfers work in 2027 to 2028, a depot follows within a year or so.
      Judgment: 2029, with slips likely.
    sources:
      - title: Wikipedia, Starship HLS
        url: https://en.wikipedia.org/wiki/Starship_HLS
  sources:
    - title: Wikipedia, Starship HLS
      url: https://en.wikipedia.org/wiki/Starship_HLS

- id: commercial-lunar-landers
  name: Commercial lunar landers
  kind: device
  fields: [engineering]
  track: space
  date: 2024
  status: achieved
  tier: 3
  summary: >-
    Private companies landing robotic craft on the Moon under fixed-price NASA
    delivery contracts. The first landed tipped on its side in 2024; Firefly's
    Blue Ghost made the first fully successful one in 2025.
  requires: [moon-landing, nasa-cots]
  efforts:
    - who: Intuitive Machines (IM-1 Odysseus)
      where: USA
      when: 2024
      outcome: achieved
      note: First private soft landing, February 22, 2024, near Malapert A; broke a leg and tipped over. IM-2 (March 2025) also tipped over, so its PRIME-1 ice drill never ran.
    - who: Firefly Aerospace (Blue Ghost Mission 1)
      where: USA
      when: 2025
      outcome: achieved
      note: Landed upright in Mare Crisium on March 2, 2025 and operated for two weeks.
    - who: ispace
      where: Japan
      when: 2025
      outcome: abandoned
      note: Both landers crashed (April 2023 and June 2025).
  sources:
    - title: Wikipedia, IM-1
      url: https://en.wikipedia.org/wiki/IM-1
    - title: Wikipedia, Blue Ghost Mission 1
      url: https://en.wikipedia.org/wiki/Blue_Ghost_Mission_1
    - title: Wikipedia, IM-2
      url: https://en.wikipedia.org/wiki/IM-2

- id: lunar-water-mining
  name: Water mined on the Moon
  kind: technique
  fields: [engineering, chemistry]
  track: space
  date: { window: [2030, 2050], likely: 2038 }
  status: speculative
  tier: 3
  summary: >-
    Extracting water ice from permanently shadowed craters near the lunar
    poles for drinking, oxygen and rocket fuel. It is the main reason both
    the US and China aim for the south pole, but no one has yet drilled into
    lunar ice.
  requires: [commercial-lunar-landers, electrolysis]
  helped_by: [artemis-accords, mars-oxygen-moxie]
  criterion: >-
    Equipment on the Moon extracts at least one tonne of water (or the oxygen
    from it) from lunar soil or ice within a year, for use there.
  efforts:
    - who: NASA (PRIME-1 drill on IM-2; VIPER rover)
      where: USA
      when: 2025
      outcome: abandoned
      note: PRIME-1's drill was extended but never operated after the lander tipped over in March 2025.
    - who: CNSA (Chang'e 8)
      where: China
      when: 2028
      outcome: ongoing
      note: Planned to test in-situ resource use in 2028 as a step toward the International Lunar Research Station.
    - who: Interlune
      where: USA
      when: 2026
      outcome: ongoing
      note: Aims to mine helium-3 rather than water; claims over $500 million in purchase orders.
  forecast:
    note: >-
      The ice has been mapped from orbit, but its form and concentration on
      the ground are unknown, and the only drill sent so far never ran. Tonne
      scale needs a powered, long-lived plant near a crater, which in turn
      needs a lunar base program (the US targets 2029 to 2036, China's ILRS
      construction runs 2026 to 2035). Judgment: late 2030s.
    sources:
      - title: Wikipedia, International Lunar Research Station
        url: https://en.wikipedia.org/wiki/International_Lunar_Research_Station
      - title: Wikipedia, IM-2
        url: https://en.wikipedia.org/wiki/IM-2
  sources:
    - title: Wikipedia, IM-2
      url: https://en.wikipedia.org/wiki/IM-2
    - title: Interlune
      url: https://www.interlune.space/

- id: lunar-base
  name: Permanent lunar base
  kind: infrastructure
  fields: [engineering, society]
  track: space
  date: { window: [2032, 2055], likely: 2040 }
  status: speculative
  tier: 2
  summary: >-
    A base near the lunar south pole where crews live in rotation, like
    Antarctic stations, supplied from Earth at first and later partly from
    local ice. NASA paused its lunar-orbit Gateway in 2026 to focus on a
    surface base; China plans one with partner countries.
  requires: [crewed-lunar-return]
  helped_by: [lunar-water-mining, propellant-depot, small-modular-reactors, closed-loop-life-support]
  criterion: >-
    People live on the Moon continuously for at least a year, with crews
    rotating and no gap of more than a few weeks.
  efforts:
    - who: NASA (Artemis V onward)
      where: USA
      when: 2029
      outcome: ongoing
      note: In March 2026 NASA paused the Gateway station "as designed" and refocused on a surface base built from 2029 to 2036, with about one landing a year from Artemis V (late 2028).
    - who: China and partners, International Lunar Research Station
      where: China, Russia and 11 other members
      when: 2035
      outcome: ongoing
      note: Construction phase 2026 to 2035, missions ILRS-1 to 5 in 2031 to 2035, use from 2036.
    - who: SpaceX
      where: USA
      when: 2026
      outcome: ongoing
      note: In February 2026 Musk said Mars missions would wait five to seven years while SpaceX focuses on a lunar base.
  forecast:
    note: >-
      Agency schedules put early base elements in the early 2030s, but
      continuous occupancy needs reliable landings every few months, surface
      power through the two-week lunar night and habitats that do not yet
      exist. Antarctica took about 45 years from the first expeditions to
      year-round stations (1911 to 1956). Judgment: around 2040.
    sources:
      - title: Wikipedia, Lunar Gateway
