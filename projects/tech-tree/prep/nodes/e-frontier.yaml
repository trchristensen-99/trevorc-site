  name: Molecular nanotechnology
  kind: technique
  fields: [materials, chemistry]
  date: { window: [2040, 2100], likely: 2065 }
  status: speculative
  tier: 2
  summary: >-
    Building things atom by atom with programmable molecular machines, as Richard
    Feynman suggested in 1959 and Eric Drexler argued in 1986. Today's partial
    steps are DNA origami, molecular motors and designed proteins.
  requires: [scanning-tunneling-microscope, recombinant-dna]
  helped_by: [protein-structure-prediction, deep-learning, 3d-printing]
  efforts:
    - who: Richard Feynman, There's Plenty of Room at the Bottom
      where: USA
      when: 1959
      outcome: achieved
      note: The founding lecture.
    - who: Eric Drexler, Engines of Creation (1986) and Nanosystems (1992)
      where: USA
      when: 1986
      outcome: ongoing
      note: Disputed by Richard Smalley in 2003 over "fat fingers" and "sticky fingers".
    - who: Paul Rothemund (Caltech), DNA origami
      where: USA
      when: 2006
      outcome: achieved
    - who: Ben Feringa, Fraser Stoddart, Jean-Pierre Sauvage
      where: Netherlands, UK / USA, France
      when: 2016
      outcome: achieved
      note: Nobel for molecular machines.
    - who: David Baker (UW Institute for Protein Design); UK ARIA programmable matter
      where: USA, UK
      when: 2026
      outcome: ongoing
      note: AI-designed proteins as nanoscale parts.
  forecast:
    note: >-
      Read as general-purpose machines that position atoms to build macroscopic
      products. Progress runs through biology (designed proteins, DNA
      nanostructures) rather than Drexler's diamond mechanosynthesis, which has
      had little experimental work. AI protein design (2024 Nobel) speeds parts
      design, not assembly. Pure judgment; the range is very wide.
    sources:
      - title: Chemical and Engineering News 81(48), Drexler and Smalley make the case for and against molecular assemblers (2003)
        url: https://doi.org/10.1021/cen-v081n048.p037
      - title: Nobel Prize in Chemistry 2016
        url: https://www.nobelprize.org/prizes/chemistry/2016/summary/
  sources:
    - title: Feynman 1959, There's Plenty of Room at the Bottom
      url: https://calteches.library.caltech.edu/1976/1/1960Bottom.pdf

# ------------------------------------------------ ENVIRONMENT AND AGRICULTURE

- id: desalination
  name: Reverse-osmosis desalination
  kind: technique
  fields: [chemistry, engineering]
  date: 1960
  status: achieved
  tier: 2
  summary: >-
    Pushing seawater through membranes that pass water but not salt, made
    practical by Loeb and Sourirajan's membrane around 1960. About 95 million
    cubic meters a day are now desalinated, supplying most drinking water in
    Israel and the Gulf.
  requires: [plastics, power-grid]
  helped_by: [research-grant-system, nuclear-power]
  uses: [res-oil, res-natural-gas]
  efforts:
    - who: Sidney Loeb and Srinivasa Sourirajan (UCLA)
      where: USA
      when: 1960
      outcome: achieved
      note: Asymmetric cellulose acetate membrane; first commercial RO plant at Coalinga, California in 1965.
    - who: Multi-stage flash distillation (Kuwait, Saudi Arabia)
      where: Kuwait
      when: 1957
      outcome: rival
      note: Thermal desalination, still common where fuel is cheap.
    - who: John Cadotte (FilmTec), thin-film composite polyamide membrane
      where: USA
      when: 1977
      outcome: achieved
    - who: IDE Technologies (Sorek, 2013); ACWA Power; Saudi Water Authority
      where: Israel, Saudi Arabia
      when: 2013
      outcome: achieved
      note: Seawater RO now takes about 3 kWh per cubic meter.
  sources:
    - title: Jones et al. 2019, The state of desalination and brine production, Science of the Total Environment
      url: https://doi.org/10.1016/j.scitotenv.2018.12.076
    - title: Reverse osmosis, Wikipedia
      url: https://en.wikipedia.org/wiki/Reverse_osmosis

- id: carbon-capture
  name: Carbon capture and storage
  kind: technique
  fields: [energy, chemistry]
  date: 1996
  status: achieved
  tier: 2
  summary: >-
    Capturing CO2 from gas processing, power plants or factories and burying it
    deep underground. Norway's Sleipner has stored about a million metric tons a year
    since 1996, but global capture is only about 50 million metric tons a year, a
    tiny fraction of emissions.
  requires: [oil-refining, plate-tectonics]
  helped_by: [shale-fracking, carbon-pricing]
  uses: [res-natural-gas]
  efforts:
    - who: SACROC, CO2 enhanced oil recovery
      where: USA
      when: 1972
      outcome: achieved
      note: CO2 injected to push out more oil, not for climate.
    - who: Statoil (Equinor), Sleipner
      where: Norway
      when: 1996
      outcome: achieved
      note: Driven by Norway's 1991 carbon tax.
    - who: SaskPower, Boundary Dam
      where: Canada
      when: 2014
      outcome: achieved
      note: First power plant CCS; below design capture rate.
    - who: Northern Lights (Equinor, Shell, TotalEnergies)
      where: Norway
      when: 2025
      outcome: ongoing
      note: First cross-border CO2 shipping and storage service.
  sources:
    - title: Global CCS Institute, Global Status of CCS 2024
      url: https://www.globalccsinstitute.com/resources/global-status-report/
    - title: Equinor, Sleipner
      url: https://www.equinor.com/energy/sleipner

- id: direct-air-capture
  name: Direct air capture
  kind: technique
  fields: [chemistry, energy]
  date: 2017
  status: ongoing
  tier: 2
  summary: >-
    Machines that pull CO2 straight out of the air with sorbents or solvents so it
    can be buried, proposed by Klaus Lackner in 1999. Plants exist but capture
    thousands, not millions, of tons and cost several hundred dollars a ton.
  requires: [carbon-capture]
  helped_by: [enhanced-geothermal, solar-photovoltaic]
  efforts:
    - who: Climeworks (Capricorn 2017, Orca 2021, Mammoth 2024)
      where: Switzerland / Iceland
      when: 2024
      outcome: ongoing
      note: Mammoth's nameplate is 36,000 t a year, but it removed only 675 net tons in the first half of 2026.
    - who: 1PointFive (Occidental), Stratos, with Carbon Engineering technology
      where: USA
      when: 2026
      outcome: ongoing
      note: Designed for 500,000 t a year; Phase 1 commissioning hit a delay in mid-2026.
    - who: Heirloom; CarbonCapture Inc.; Sirona
      where: USA, Kenya
      when: 2023
      outcome: ongoing
  effort:
    cost_usd: 1300000000
    note: Stratos alone cost about $1.3 billion. Frontier's buyers (Stripe, Google, Shopify and others) pledged $1 billion in advance purchases from 2022.
  sources:
    - title: Gasworld, Climeworks upgrades DAC at Iceland facility after low capture
      url: https://www.gasworld.com/story/climeworks-upgrades-dac-tech-at-iceland-facility-after-low-co2-capture-record/2259464.article/
    - title: RBN Energy, Stratos DAC project targets Q2 2026 startup
      url: https://rbnenergy.com/daily-posts/analyst-insight/stratos-dac-project-target-q2-2026-startup

- id: gigaton-carbon-removal
  name: Gigaton-scale carbon removal
  kind: infrastructure
  fields: [energy, society]
  date: { window: [2042, 2075], likely: 2055 }
  status: speculative
  tier: 3
  summary: >-
    Removing a billion metric tons or more of CO2 a year with engineered methods such
    as direct air capture, bioenergy with capture, enhanced weathering and biochar.
    Climate pathways call for 7 to 9 billion metric tons a year of total removal by
    2050; novel methods remove about 1.3 million today.
  requires: [direct-air-capture, carbon-capture]
  helped_by: [carbon-pricing, solar-photovoltaic, enhanced-geothermal]
  efforts:
    - who: Frontier advance market commitment (Stripe, Alphabet, Shopify, Meta, McKinsey)
      where: USA
      when: 2022
      outcome: ongoing
    - who: Microsoft carbon removal purchases
      where: USA
      when: 2025
      outcome: ongoing
      note: Largest single buyer, tens of millions of tons contracted, mostly BECCS and forestry.
    - who: US DAC hubs (DOE); EU Carbon Removal Certification
      where: USA, EU
      when: 2024
      outcome: ongoing
  forecast:
    note: >-
      Read as 1 Gt a year of durable novel removal. From 1.3 Mt (2024) that is
      a roughly 770-fold scale-up. Solar took about 20 years to grow that much
      at 30 to 40 percent a year, but solar sells a product people want; removal
      only sells if policy pays for it. Plants are underperforming nameplate
      (Mammoth). If carbon prices or mandates arrive in the 2030s, mid-2050s
      is plausible; otherwise much later.
    sources:
      - title: The State of Carbon Dioxide Removal, 2nd edition (2024)
        url: https://www.stateofcdr.org/
      - title: Carbon Brief, Nine key takeaways about the state of CO2 removal in 2024
        url: https://www.carbonbrief.org/nine-key-takeaways-about-the-state-of-co2-removal-in-2024/
  sources:
    - title: The State of Carbon Dioxide Removal, 2nd edition (2024)
      url: https://www.stateofcdr.org/

- id: solar-geoengineering
  name: Solar geoengineering
  kind: technique
  fields: [physics, society]
  date: { window: [2035, 2080], likely: 2052 }
  status: speculative
  tier: 3
  summary: >-
    Cooling the planet by reflecting a little sunlight, most plausibly with
    aerosols sprayed into the stratosphere the way the 1991 Pinatubo eruption
    cooled Earth by about half a degree. It would be cheap and fast but would not
    remove CO2, and its governance is unresolved.
  requires: [climate-science]
  helped_by: [stored-program-computer, earth-observation]
  competes: [gigaton-carbon-removal]
  efforts:
    - who: Paul Crutzen (2006 essay); Mikhail Budyko (1974)
      where: Germany, USSR
      when: 2006
      outcome: achieved
    - who: Harvard SCoPEx
      where: USA / Sweden
      when: 2024
      outcome: abandoned
      note: Balloon test cancelled after opposition in Sweden.
    - who: UK ARIA Exploring Climate Cooling program
      where: UK
      when: 2025
      outcome: ongoing
      note: About 57 million pounds, including small outdoor experiments.
    - who: Stardust Solutions; Make Sunsets
      where: Israel, USA
      when: 2025
      outcome: ongoing
      note: Startups; Mexico banned solar geoengineering experiments in 2023.
  forecast:
    note: >-
      Read as deliberate deployment large enough to change global temperature.
      Technically feasible within about a decade of a decision (Smith and
      Wagner estimated about $2 billion a year for the first years). The
      barrier is political: a single country could act, which makes timing
      depend on climate damage and governance. Very uncertain.
    sources:
      - title: Smith and Wagner 2018, Stratospheric aerosol injection tactics and costs, Environmental Research Letters
        url: https://iopscience.iop.org/article/10.1088/1748-9326/aae98d
      - title: National Academies, Reflecting Sunlight (2021)
        url: https://nap.nationalacademies.org/catalog/25762/reflecting-sunlight-recommendations-for-solar-geoengineering-research-and-research-governance
  sources:
    - title: National Academies, Reflecting Sunlight (2021)
      url: https://nap.nationalacademies.org/catalog/25762/reflecting-sunlight-recommendations-for-solar-geoengineering-research-and-research-governance

- id: nitrogen-fertilizer-scale
  name: Synthetic nitrogen fertilizer at global scale
  kind: infrastructure
  fields: [agriculture, chemistry]
  date: 1960
  status: achieved
  tier: 3
  summary: >-
    The postwar spread of Haber-Bosch ammonia plants, many converted from
    explosives factories, that took nitrogen fertilizer from about 11 million
    tons a year in 1961 to over 100 million. Roughly half the world's people are
    fed by it.
  requires: [haber-bosch]
  helped_by: [shale-fracking]
  uses: [res-natural-gas, res-coal, res-phosphate, res-potash]
  efforts:
    - who: US wartime ammonia plants converted to fertilizer
      where: USA
      when: 1946
      outcome: achieved
    - who: Yara, CF Industries, Sinopec and Chinese coal-based plants, Nutrien
      where: Norway, USA, China, Canada
      when: 2024
      outcome: achieved
      note: About 1 to 2 percent of world energy goes into ammonia.
  effort:
    note: Erisman et al. (2008) estimate about 48 percent of humanity depends on synthetic nitrogen. Green ammonia from electrolysis is the main substitute for gas feedstock.
  sources:
    - title: Erisman et al. 2008, How a century of ammonia synthesis changed the world, Nature Geoscience
      url: https://www.nature.com/articles/ngeo325
    - title: Our World in Data, Fertilizers
      url: https://ourworldindata.org/fertilizers

- id: center-pivot-irrigation
  name: Center-pivot irrigation
  kind: device
  fields: [agriculture, engineering]
  date: 1948
  status: achieved
  tier: 3
  summary: >-
    A long sprinkler arm that rotates around a well, watering a circle of up to a
    square kilometer, invented by Nebraska farmer Frank Zybach. It turned
    semi-arid plains into cropland and made the green circles seen from planes.
  requires: [irrigation, internal-combustion-engine]
  uses: [res-fresh-water]
  efforts:
    - who: Frank Zybach
      where: USA
      when: 1948
      outcome: achieved
      note: Patented 1952; Valmont and Lindsay industrialized it.
  effort:
    note: Draws down aquifers such as the Ogallala faster than they recharge.
  sources:
    - title: Smithsonian, How center pivot irrigation brought the Dust Bowl back to life
      url: https://www.smithsonianmag.com/innovation/how-center-pivot-irrigation-brought-dust-bowl-back-to-life-180970243/

- id: drip-irrigation
  name: Drip irrigation
  kind: technique
  fields: [agriculture, engineering]
  date: 1965
  status: achieved
  tier: 3
  summary: >-
    Delivering water drop by drop to each plant's roots through plastic tubes and
    emitters, using far less water than flooding or sprinklers. Simcha Blass and
    Kibbutz Hatzerim commercialized it as Netafim in 1965.
  requires: [plastics, irrigation]
  uses: [res-fresh-water]
  efforts:
    - who: Simcha Blass and Kibbutz Hatzerim (Netafim)
      where: Israel
      when: 1965
      outcome: achieved
    - who: Jain Irrigation; Rivulis
      where: India, Israel
      when: 1990
      outcome: achieved
  sources:
    - title: Netafim, Wikipedia
      url: https://en.wikipedia.org/wiki/Netafim

- id: precision-agriculture
  name: Precision agriculture
  kind: technique
  fields: [agriculture, electronics]
  date: 1996
  status: achieved
  tier: 3
  summary: >-
    Farming field by field and meter by meter with GPS-steered tractors, yield
    maps, soil sensors and variable-rate seeding and spraying. It saves seed,
    fertilizer and fuel and is now standard on large farms.
  requires: [gps, stored-program-computer]
  helped_by: [earth-observation, deep-learning]
  efforts:
    - who: John Deere, Trimble, CNH
      where: USA
      when: 1996
      outcome: achieved
      note: Yield monitors (1992) and GPS autosteer (late 1990s to 2000s).
    - who: Blue River Technology (Deere, See and Spray)
      where: USA
      when: 2022
      outcome: ongoing
      note: Camera-guided spot spraying of weeds.
  sources:
    - title: USDA ERS, Precision agriculture in the digital era (2023)
      url: https://www.ers.usda.gov/publications/pub-details?pubid=105893

- id: cultivated-meat
  name: Cultivated meat
  kind: technique
  fields: [agriculture, biology]
  date: 2020
  status: ongoing
  tier: 3
  summary: >-
    Growing animal muscle and fat cells in bioreactors instead of raising animals.
    Singapore first approved sales in 2020 and the US in 2023, but costs and scale
    remain far from conventional meat, and several US states have banned it.
  requires: [cell-culture]
  helped_by: [recombinant-dna]
  efforts:
    - who: Mark Post (Maastricht University), first cultured burger
      where: Netherlands
      when: 2013
      outcome: achieved
      note: Cost about $330,000.
    - who: Eat Just (GOOD Meat)
      where: Singapore
      when: 2020
      outcome: ongoing
    - who: UPSIDE Foods; Mosa Meat; Aleph Farms; Vow
      where: USA, Netherlands, Israel, Australia
      when: 2023
      outcome: ongoing
      note: Florida and Alabama banned sales in 2024.
  sources:
    - title: GFI, State of the industry, cultivated meat
      url: https://gfi.org/resource/cultivated-meat-seafood-and-ingredients-state-of-the-industry/

# ------------------------------------------------------------ INSTITUTIONS

- id: research-grant-system
  name: Federal research grants and the research university
  kind: institution
  fields: [society]
  date: 1945
  status: achieved
  tier: 1
  summary: >-
    Governments paying universities, through competitive peer-reviewed grants,
    to do basic research and train scientists, as Vannevar Bush proposed in 1945.
    The model created the modern research university and was copied worldwide.
  requires: [universities, peer-review]
  helped_by: [nuclear-weapon, radar]
  efforts:
    - who: Vannevar Bush, Science, the Endless Frontier
      where: USA
      when: 1945
      outcome: achieved
      note: Report to President Truman, July 1945, after the wartime OSRD.
    - who: NIH extramural grants (1946), Office of Naval Research (1946), National Science Foundation (1950)
      where: USA
      when: 1950
      outcome: achieved
    - who: Bayh-Dole Act
      where: USA
      when: 1980
      outcome: achieved
      note: Let universities patent federally funded inventions, spurring tech transfer.
    - who: Deutsche Forschungsgemeinschaft, UK Research Councils, Japan JSPS, China NSFC (1986), European Research Council (2007)
      where: Germany, UK, Japan, China, EU
      when: 1986
      outcome: independent
  effort:
    note: >-
      US federal R&D runs about $200 billion a year; world R&D spending passed
      about $2.5 trillion. Grant writing and administration take a large share
      of researchers' time; a 2007 US survey put administrative work at about
      42 percent.
  sources:
    - title: Bush 1945, Science, the Endless Frontier (GPO GovInfo full text)
      url: https://www.govinfo.gov/content/pkg/GOVPUB-PR32_400-e7966ee70a4f7b47f862431c9776f727/html/GOVPUB-PR32_400-e7966ee70a4f7b47f862431c9776f727.htm
    - title: NSF, National Center for Science and Engineering Statistics
      url: https://ncses.nsf.gov/

- id: darpa
  name: DARPA model of research funding
  kind: institution
  fields: [society, computing]
  date: 1958
  status: achieved
  tier: 3
  summary: >-
    A small agency of temporary program managers with broad freedom to fund risky
    projects toward specific goals, founded as ARPA in 1958 after Sputnik. It
    seeded the internet, GPS receivers, stealth and self-driving cars, and has been
    copied as ARPA-E, ARPA-H and the UK's ARIA.
  requires: [research-grant-system]
  helped_by: [satellites]
  efforts:
    - who: US Department of Defense, ARPA
      where: USA
      when: 1958
      outcome: achieved
    - who: ARPA-E (2009), IARPA (2006), ARPA-H (2022), UK ARIA (2023), Germany SPRIND (2019)
      where: USA, UK, Germany
      when: 2009
      outcome: achieved
    - who: Convergent Research, focused research organizations
      where: USA
      when: 2021
      outcome: ongoing
      note: Time-limited nonprofit teams for tools no lab or startup would build.
  sources:
    - title: DARPA, About
      url: https://www.darpa.mil/about
    - title: Azoulay et al. 2019, Funding breakthrough research, the ARPA model
      url: https://www.journals.uchicago.edu/doi/10.1086/699933

- id: cern
  name: International big-science laboratories
  kind: institution
  fields: [society, physics]
  date: 1954
  status: achieved
  tier: 3
  summary: >-
    Treaty-based labs where many countries pool money for machines none could
    build alone, starting with CERN in 1954. The model was reused for ITER, the
    European Southern Observatory and the ISS.
  requires: [research-grant-system]
  helped_by: [nuclear-weapon]
  efforts:
    - who: CERN (12 founding states)
      where: Switzerland / France
      when: 1954
      outcome: achieved
      note: Tim Berners-Lee invented the web there in 1989.
    - who: ESO (1962), EMBL (1974), ITER (2006), SKA Observatory (2021)
      where: International
      when: 1962
      outcome: achieved
  sources:
    - title: CERN, Our history
      url: https://home.cern/about/who-we-are/our-history

- id: iso-standards
  name: International standards bodies (ISO)
  kind: institution
  fields: [society, engineering]
  date: 1947
  status: achieved
  tier: 3
  summary: >-
    The International Organization for Standardization, founded in 1947, which
    sets shared specifications so parts, containers, screws and paperwork work
    across borders. Its 1968 container standard made global intermodal shipping
    work.
  requires: [factory-system]
  efforts:
    - who: ISO, 25 founding national bodies
      where: Switzerland
      when: 1947
      outcome: achieved
    - who: IEC (1906), ITU (1865), IETF (1986)
      where: International
      when: 1986
      outcome: achieved
      note: Electrical, telecom and internet standards bodies.
  sources:
    - title: ISO, About us
      url: https://www.iso.org/about

- id: venture-capital
  name: Venture capital
  kind: institution
  fields: [society]
  date: 1946
  status: achieved
  tier: 2
  summary: >-
    Funds that buy stakes in young, risky technology companies and expect most to
    fail and a few to pay for all, begun by Georges Doriot's American Research
    and Development in 1946. It funded much of semiconductors, computing,
    biotech and now space and fusion.
  requires: [joint-stock-company, stock-exchange]
  helped_by: [research-grant-system, patents]
  efforts:
    - who: Georges Doriot, American Research and Development Corporation
      where: USA
      when: 1946
      outcome: achieved
      note: A $70,000 stake in Digital Equipment (1957) became hundreds of millions.
    - who: Arthur Rock; Kleiner Perkins and Sequoia (1972)
      where: USA
      when: 1972
      outcome: achieved
      note: The 1979 ERISA prudent-man rule let pension funds invest.
    - who: Israel Yozma (1993); China state guidance funds
      where: Israel, China
      when: 1993
      outcome: independent
  sources:
    - title: Nicholas, VC, An American History (Harvard University Press)
      url: https://www.hup.harvard.edu/books/9780674988002

- id: outer-space-treaty
  name: Outer Space Treaty
  kind: institution
  fields: [society]
  date: 1967
  status: achieved
  tier: 3
  summary: >-
    The 1967 UN treaty that declares space free for all to explore, bans claims
    of national sovereignty and nuclear weapons in orbit, and makes states
    responsible for their companies' activities. It still frames debates over
    lunar bases and asteroid mining.
  requires: [satellites]
  efforts:
    - who: United Nations (US, USSR, UK first signers)
      where: International
      when: 1967
      outcome: achieved
    - who: Artemis Accords
      where: USA and partners
      when: 2020
      outcome: ongoing
      note: Over 50 signatories by 2025; China and Russia stand apart.
  sources:
    - title: UNOOSA, Outer Space Treaty
      url: https://www.unoosa.org/oosa/en/ourwork/spacelaw/treaties/outerspacetreaty.html

- id: montreal-protocol
  name: Montreal Protocol
  kind: institution
  fields: [society, chemistry]
  date: 1987
  status: achieved
  tier: 3
  summary: >-
    The 1987 treaty that phased out ozone-destroying CFCs, ratified by every UN
    member state. The ozone layer is on track to recover by about 2066, making it
    the most successful global environmental agreement.
  requires: [climate-science]
  efforts:
    - who: Mario Molina and F. Sherwood Rowland (1974); Joe Farman, British Antarctic Survey (1985)
      where: USA, UK
      when: 1985
      outcome: achieved
      note: Predicted, then found, the ozone hole.
    - who: UNEP and signatories; Kigali Amendment (2016) on HFCs
      where: International
      when: 1987
      outcome: achieved
  sources:
    - title: UNEP Ozone Secretariat, The Montreal Protocol
      url: https://ozone.unep.org/treaties/montreal-protocol
    - title: WMO, Ozone layer on track to recover within four decades (2023)
      url: https://wmo.int/news/media-centre/ozone-layer-recovery-track-helping-avoid-global-warming-05degc

- id: ipcc
  name: Intergovernmental Panel on Climate Change
  kind: institution
  fields: [society, physics]
  date: 1988
  status: achieved
  tier: 2
  summary: >-
    A UN body, founded in 1988, in which thousands of volunteer scientists assess
    published climate research and governments approve the summaries line by
    line. Its reports set the scientific basis for the Paris Agreement.
  requires: [climate-science, peer-review]
  efforts:
    - who: World Meteorological Organization and UN Environment Programme
      where: International
      when: 1988
      outcome: achieved
      note: Shared the 2007 Nobel Peace Prize; Sixth Assessment 2021 to 2023, Seventh cycle under way.
  sources:
    - title: IPCC, History of the IPCC
      url: https://www.ipcc.ch/about/history/

- id: open-source
  name: Free and open-source software
  kind: institution
  fields: [society, computing]
  date: 1983
  status: achieved
  tier: 2
  summary: >-
    Licensing software so anyone may use, study, change and share it, organized
    around Richard Stallman's GNU project (1983) and the term "open source"
    (1998). Linux and other open projects now run most servers, phones and cloud
    infrastructure.
  requires: [programming-languages, internet]
  helped_by: [personal-computer, world-wide-web]
  efforts:
    - who: Richard Stallman, GNU project and GPL (1989)
      where: USA
      when: 1983
      outcome: achieved
    - who: Linus Torvalds, Linux
      where: Finland
      when: 1991
      outcome: achieved
    - who: Open Source Initiative (Bruce Perens, Eric Raymond)
      where: USA
