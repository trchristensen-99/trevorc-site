- id: gps
  name: Global Positioning System
  kind: infrastructure
  fields: [engineering, electronics]
  date: 1978
  status: achieved
  tier: 1
  summary: >-
    A US military constellation of satellites with atomic clocks that lets any
    receiver compute its position to meters, first launched in 1978 and fully
    operational in 1995. Opened fully to civilians in 2000, it now times phone
    networks, power grids and finance as well as guiding people.
  requires: [satellites, atomic-clock, relativity, integrated-circuit]
  helped_by: [stored-program-computer, smartphone]
  efforts:
    - who: US Air Force NAVSTAR program (Bradford Parkinson and others)
      where: USA
      when: 1978
      outcome: achieved
      note: First Block I satellite February 1978; full operational capability 1995; Selective Availability turned off May 2000.
    - who: GLONASS
      where: USSR / Russia
      when: 1995
      outcome: rival
    - who: Galileo (EU), BeiDou (China, global 2020), NavIC (India), QZSS (Japan)
      where: EU, China, India, Japan
      when: 2020
      outcome: rival
  effort:
    span: [1973, 1995]
    people: 10000
    cost_usd: 20000000000
    note: >-
      About $7.2 billion in R&D and procurement through 1994 in then-year dollars
      (roughly $15 to 20 billion today), and about $1.5 to 2 billion a year since.
      Relativity matters: uncorrected, clocks would drift about 38 microseconds a
