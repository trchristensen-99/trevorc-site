  fields: [energy, materials]
  date: { window: [2027, 2033], likely: 2029 }
  status: ongoing
  tier: 2
  summary: >-
    Batteries with a solid ceramic or sulfide electrolyte instead of a flammable
    liquid, allowing a lithium-metal anode for more energy and less fire risk.
    Prototype cells exist; making them cheaply at scale is the hurdle.
  requires: [lithium-ion-battery]
  competes: [sodium-ion-battery, lithium-iron-phosphate]
  uses: [res-lithium, res-nickel]
  efforts:
    - who: Toyota with Idemitsu Kosan
      where: Japan
      when: 2027
      outcome: ongoing
      note: Sulfide electrolyte; production for EVs targeted 2027 to 2028. Toyota once aimed at the 2020 Olympics.
    - who: QuantumScape with Volkswagen PowerCo
      where: USA / Germany
      when: 2026
      outcome: ongoing
      note: Anode-free ceramic separator; B-sample cells 2025, Eagle line 2026, license up to 80 GWh.
    - who: Samsung SDI with BMW and Solid Power
      where: South Korea, USA
      when: 2027
      outcome: ongoing
    - who: CATL, BYD, Gotion, WeLion, Qingtao
      where: China
      when: 2027
      outcome: ongoing
      note: Semi-solid packs already ship (NIO 150 kWh); all-solid targets 2027 to 2030.
    - who: Factorial Energy with Mercedes-Benz and Stellantis
      where: USA
      when: 2025
      outcome: ongoing
      note: Road tests of a semi-solid pack in 2025.
  forecast:
    note: >-
      Read as all-solid-state cells in a series-production car sold in volume
      (tens of thousands a year). Every major player now points to 2027 to 2028
      for small runs, but these dates have slipped repeatedly (Toyota's from
      2020, QuantumScape's from 2024). Liquid LFP and sodium keep getting
      cheaper, which raises the bar. Small runs late 2020s; mass market early
      2030s.
    sources:
