- id: superconductors-high-temp
  name: High-temperature superconductors
  kind: discovery
  fields: [materials, physics]
  date: 1986
  status: achieved
  tier: 2
  summary: >-
    Copper oxide ceramics that lose all electrical resistance at far higher
    temperatures than metals, found by Bednorz and Muller in 1986; YBCO works in
    cheap liquid nitrogen. REBCO tapes now enable compact fusion magnets.
  requires: [superconductivity, quantum-mechanics]
  uses: [res-rare-earths, res-copper, res-helium]
  efforts:
    - who: Georg Bednorz and K. Alex Muller (IBM Zurich)
      where: Switzerland
      when: 1986
      outcome: achieved
      note: Lanthanum barium copper oxide at 35 K; Nobel 1987.
    - who: Maw-Kuen Wu and Paul Chu (Alabama, Houston)
      where: USA
      when: 1987
      outcome: achieved
      note: YBCO at 93 K, above liquid nitrogen's 77 K.
    - who: Commonwealth Fusion Systems and MIT PSFC
      where: USA
      when: 2021
      outcome: achieved
      note: 20 tesla large-bore REBCO fusion magnet.
    - who: Faraday Factory Japan, Shanghai Superconductor, SuperPower (Furukawa), Fujikura
      where: Japan, China, USA
      when: 2026
      outcome: ongoing
      note: REBCO tape makers scaling for fusion and cables.
  effort:
    note: >-
      Older niobium superconductors need liquid helium at 4 K; HTS at 20 K or
      77 K cuts helium demand, a real substitution since helium is scarce.
  sources:
    - title: Nobel Prize in Physics 1987
      url: https://www.nobelprize.org/prizes/physics/1987/summary/
    - title: MIT News, Tests show high-temperature superconducting magnets are ready for fusion
      url: https://news.mit.edu/2024/tests-show-high-temperature-superconducting-magnets-fusion-ready-0304

- id: room-temperature-superconductor
  name: Room-temperature, ambient-pressure superconductor
  kind: discovery
  fields: [materials, physics]
  date: { window: [2035, 2100], likely: 2065 }
  status: speculative
  tier: 3
  summary: >-
    A material that superconducts at everyday temperature and pressure, which
    would transform power lines, motors, magnets and computing. Hydrides come close
    only under crushing pressures, and recent claims (LK-99, Dias) collapsed.
  requires: [superconductors-high-temp]
  helped_by: [deep-learning, quantum-computing]
  efforts:
    - who: Mikhail Eremets (Max Planck Mainz), hydrides H3S and LaH10
      where: Germany
      when: 2019
      outcome: achieved
      note: Superconductivity up to about 250 K, but at about 1.7 million atmospheres.
    - who: Ranga Dias (Rochester)
      where: USA
      when: 2023
      outcome: abandoned
      note: Room-temperature claims retracted from Nature in 2022 and 2023 after misconduct findings.
    - who: Quantum Energy Research Centre, LK-99
      where: South Korea
      when: 2023
      outcome: abandoned
      note: Viral claim; replications found copper sulfide impurities, not superconductivity.
    - who: Nickelate and materials-discovery AI efforts (Google DeepMind GNoME, Microsoft)
      where: USA, UK, China
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      The record critical temperature at ambient pressure has been stuck near
      133 to 138 K (mercury cuprates) since 1993. No theory rules out room
      temperature, but none predicts how to get it, and the field has a history
      of false claims. AI-guided materials search raises the search rate, not
      the odds per candidate. Low confidence; it may never happen.
    sources:
      - title: Nature, LK-99 isn't a superconductor (2023)
        url: https://www.nature.com/articles/d41586-023-02585-7
      - title: Drozdov et al. 2019, Superconductivity at 250 K in lanthanum hydride, Nature
        url: https://www.nature.com/articles/s41586-019-1201-8
  sources:
    - title: Nature, LK-99 isn't a superconductor (2023)
      url: https://www.nature.com/articles/d41586-023-02585-7

