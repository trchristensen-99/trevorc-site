  fields: [engineering]
  date: { window: [2026, 2031], likely: 2028 }
  status: ongoing
  tier: 2
  summary: >-
    A rocket whose booster and upper stage both return and refly, aiming to cut
    launch cost per kilogram another tenfold or more. SpaceX's Starship has caught
    boosters in the launch tower, but its ship has not yet been recovered and
    reflown.
  requires: [reusable-rockets]
  helped_by: [nasa-cots, venture-capital]
  uses: [res-natural-gas]
  metric: launch-cost-per-kg
  efforts:
    - who: SpaceX, Starship and Super Heavy
      where: USA
      when: 2026
      outcome: ongoing
      note: First flight April 2023; first tower catch October 2024; V3 debut (Flight 12) May 22, 2026, reached its suborbital target despite engine losses. Orbital refueling not yet shown.
    - who: CALT, Long March 9 (reusable redesign); LandSpace
      where: China
      when: 2033
      outcome: ongoing
    - who: Stoke Space (Nova), Relativity (Terran R)
      where: USA
      when: 2026
      outcome: ongoing
  effort:
    span: [2019, 2026]
    cost_usd: 15000000000
    note: Very rough; SpaceX said in 2023 it was spending about $2 billion a year on Starship. NASA's lunar lander contracts cover about $4 billion.
  forecast:
    note: >-
      Read as a Starship ship recovered and reflown to orbit, with the booster
      also reused. Booster catches and reuse are done; the ship needs a working
      heat shield and catch. SpaceX tends to meet its technical goals 2 to 3
      times later than Musk's stated dates (Falcon Heavy, crewed Dragon,
      Starship orbit). Musk's 2026 target suggests about 2028.
