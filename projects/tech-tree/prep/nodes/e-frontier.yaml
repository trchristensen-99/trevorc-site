    spell its name in 35 xenon atoms.
  requires: [quantum-mechanics]
  helped_by: [stored-program-computer]
  efforts:
    - who: Gerd Binnig and Heinrich Rohrer (IBM Zurich)
      where: Switzerland
      when: 1981
      outcome: achieved
      note: Nobel 1986; the atomic force microscope followed in 1986.
    - who: Don Eigler (IBM Almaden)
      where: USA
      when: 1989
      outcome: achieved
      note: Positioned single atoms.
  sources:
    - title: Nobel Prize in Physics 1986
      url: https://www.nobelprize.org/prizes/physics/1986/summary/

