- id: crewed-lunar-return
  name: Return of people to the Moon
  kind: technique
  fields: [engineering, society]
  date: { window: [2028, 2033], likely: 2029 }
  status: ongoing
  tier: 2
  summary: >-
    Landing people on the Moon for the first time since 1972, this time near the
    south pole where ice may supply water and fuel. Artemis II flew four
    astronauts around the Moon in April 2026; the US and China both aim to land
    by about 2030.
  requires: [moon-landing, fully-reusable-rockets]
  helped_by: [nasa-cots, space-stations]
  competes: []
  efforts:
    - who: NASA Artemis (SLS, Orion; SpaceX Starship HLS and Blue Origin Blue Moon landers)
      where: USA
      when: 2028
      outcome: ongoing
      note: Artemis II crewed flyby April 1 to 10, 2026. In 2026 NASA made Artemis III a 2027 Earth-orbit lander docking test and moved the first landing to Artemis IV, targeted 2028.
    - who: CMSA (Long March 10, Mengzhou, Lanyue)
      where: China
      when: 2030
      outcome: ongoing
      note: Abort and low-altitude rocket tests done in 2026; landing planned before 2030, then the ILRS base with Russia by 2035.
  effort:
    cost_usd: 93000000000
    note: NASA's Inspector General estimated Artemis at about $93 billion through 2025.
  forecast:
    note: >-
      Read as any crewed landing. US landings depend on in-orbit propellant
      transfer with Starship or Blue Moon, not yet demonstrated, and Artemis
      dates have slipped from 2024 to 2028. China's program has met its
      milestones on schedule so far and targets before 2030, though its
      first uncrewed Long March 10 orbital flight is still ahead. Best guess
      2029, by either.
    sources:
      - title: CSIS, Artemis rewritten, NASA's new Moon plan
        url: https://aerospace.csis.org/artemis-rewritten-nasas-new-moon-plan-its-risks-and-whether-the-u-s-can-still-beat-china/
      - title: Scientific American, How China could still win the new moon race
        url: https://www.scientificamerican.com/article/how-china-could-still-win-the-new-moon-race
  sources:
