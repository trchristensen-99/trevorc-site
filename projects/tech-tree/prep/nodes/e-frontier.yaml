      note: Won by Scaled Composites, funded by Paul Allen.
    - who: Gavi pneumococcal advance market commitment
      where: International
      when: 2009
      outcome: achieved
      note: $1.5 billion; vaccines reached low-income countries years faster.
    - who: Frontier (Stripe and partners)
      where: USA
      when: 2022
      outcome: ongoing
  effort:
