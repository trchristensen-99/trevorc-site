      url: https://www.nasa.gov/mission/artemis-ii/
    - title: NASA OIG, NASA's management of the Artemis missions (2021)
      url: https://oig.nasa.gov/docs/IG-22-003.pdf

- id: crewed-mars-landing
  name: People on Mars
  kind: technique
  fields: [engineering, medicine]
  date: { window: [2033, 2055], likely: 2041 }
  status: speculative
  tier: 2
  summary: >-
    Landing a crew on Mars and bringing them home, a trip of about two to three
    years through deep-space radiation. It needs heavy lift, orbital refueling,
    propellant made from Martian air and reliable life support.
  requires: [fully-reusable-rockets, space-stations, mars-rovers]
  helped_by: [nuclear-power, crewed-lunar-return]
  uses: [res-natural-gas]
  efforts:
    - who: SpaceX, Starship
      where: USA
      when: 2029
      outcome: ongoing
      note: Musk long promised uncrewed Starships to Mars in the late-2026 window; reports in 2026 say that was shelved to focus on the Moon.
    - who: NASA Moon to Mars architecture
      where: USA
      when: 2040
      outcome: ongoing
    - who: CNSA
      where: China
      when: 2033
      outcome: ongoing
      note: Officials have floated crewed missions in the 2030s.
  forecast:
    note: >-
      Metaculus's question on the first human Mars landing had a median near
      2035 to 2037 (quartiles about 2030 to 2046). I am later: orbital refueling,
      in-situ propellant and ship reentry are all undemonstrated, launch windows
      come every 26 months, and Musk's Mars dates have slipped by a window
      almost every cycle since 2016. Mid-2030s is possible if Starship matures
      quickly; early 2040s is my median.
    sources:
      - title: Metaculus, Date first human lands on Mars
        url: https://www.metaculus.com/questions/17154/date-first-human-lands-on-mars
      - title: Analytics Insight, SpaceX delays 2026 Mars mission
        url: https://www.analyticsinsight.net/amp/story/news/spacex-delays-2026-mars-mission-shifts-starship-focus-to-nasa-moon-landing
  sources:
    - title: NASA, Moon to Mars architecture
      url: https://www.nasa.gov/moontomarsarchitecture/

- id: mars-settlement
  name: Permanent Mars settlement
  kind: infrastructure
  fields: [engineering, society]
  date: { window: [2050, 2120], likely: 2070 }
  status: speculative
  tier: 2
  summary: >-
    A permanently inhabited, growing settlement on Mars that could in time
    survive without supply ships from Earth. Beyond rockets, it needs closed-loop
    life support, local manufacturing, radiation shelter and an answer to whether
    people can raise children in 38 percent gravity.
  requires: [crewed-mars-landing]
  helped_by: [3d-printing, nuclear-power, molecular-nanotechnology]
  efforts:
    - who: SpaceX
      where: USA
      when: 2050
      outcome: ongoing
      note: Musk's stated goal of a self-sustaining city of a million people.
  forecast:
    note: >-
      Read as a continuously inhabited base of at least about 100 people. The
      Antarctic analog took 50 years from first landing to permanent stations,
      with no rocket needed. Self-sufficiency is far harder: no closed
      ecological system (Biosphere 2) has run for years. Cheap launch is
      necessary, not sufficient. Very uncertain.
    sources:
      - title: Metaculus, Date first human lands on Mars
        url: https://www.metaculus.com/questions/17154/date-first-human-lands-on-mars
      - title: Weinersmith and Weinersmith, A City on Mars (2023)
        url: https://www.acityonmars.com/
  sources:
    - title: SpaceX, Mars
      url: https://www.spacex.com/humanspaceflight/mars/

- id: space-based-solar
  name: Space-based solar power
  kind: infrastructure
  fields: [energy, engineering]
  date: { window: [2035, 2065], likely: 2047 }
  status: speculative
  tier: 3
  summary: >-
    Large solar arrays in orbit that beam power to Earth as microwaves, catching
    sunlight around the clock. Proposed by Peter Glaser in 1968, it has only been
    shown in tiny demonstrations; launch cost is the deciding factor.
  requires: [solar-photovoltaic, satellites]
  helped_by: [fully-reusable-rockets]
  competes: [solar-photovoltaic, grid-batteries]
  efforts:
    - who: Caltech Space Solar Power Project, MAPLE
      where: USA
      when: 2023
      outcome: achieved
      note: First wireless power beamed in space and detected on Earth, milliwatts.
    - who: JAXA and Japan Space Systems, OHISAMA
      where: Japan
      when: 2026
      outcome: ongoing
      note: Small satellite to beam about 1 kW-class power to Usuda.
    - who: CAST / Xidian University
      where: China
      when: 2030
      outcome: ongoing
      note: Plans MW-scale orbital demo in the 2030s.
    - who: ESA SOLARIS; Space Solar (UK); Aetherflux (USA)
      where: Europe, UK, USA
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      Read as first MW-scale power delivered to a grid from orbit. NASA's 2024
      Office of Technology, Policy and Strategy study found it costlier than
      ground renewables unless launch and in-space assembly costs fall
      dramatically. Starship-class launch could change that, but ground solar
      plus batteries keep getting cheaper too. China is the most likely first
      mover.
