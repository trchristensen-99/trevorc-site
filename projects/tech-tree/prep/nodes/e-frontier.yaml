- id: inducement-prizes
  name: Inducement prizes and advance market commitments
  kind: institution
  fields: [society]
  date: 2004
  status: achieved
  tier: 3
  summary: >-
    Paying for results instead of effort: a prize for the first to hit a goal, or
    a promise to buy a product if someone makes it. The Ansari XPRIZE was won by
    SpaceShipOne in 2004; a 2009 vaccine commitment and the 2022 Frontier carbon
    removal fund used the buyer's version.
