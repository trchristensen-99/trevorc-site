- id: interstellar-probe
  name: Probe to another star
  kind: device
  fields: [engineering, physics]
  date: { window: [2060, 2200], likely: 2100 }
  status: speculative
  tier: 3
  summary: >-
    A spacecraft sent to reach another star system within a human lifetime, for
    example gram-scale light sails pushed to a fifth of light speed by
    ground-based lasers. Voyager 1, the fastest-leaving probe, would take about
    75,000 years to reach the nearest star.
  requires: [laser, planetary-probes]
  helped_by: [fusion-power, molecular-nanotechnology]
  efforts:
    - who: Breakthrough Starshot (Yuri Milner, Avi Loeb)
      where: USA
      when: 2016
      outcome: ongoing
      note: $100 million research program; work largely paused after 2022.
    - who: Johns Hopkins APL, Interstellar Probe concept
      where: USA
      when: 2019
      outcome: ongoing
      note: Heliopause probe, not a star mission.
  forecast:
    note: >-
      Read as launching a probe designed to reach another star within a century.
      Laser sails need gigawatt-class phased lasers and materials that survive
      thousands of g; nothing is funded at that scale. Pure judgment.
    sources:
      - title: Breakthrough Initiatives, Starshot
        url: https://breakthroughinitiatives.org/initiative/3
  sources:
    - title: Breakthrough Initiatives, Starshot
      url: https://breakthroughinitiatives.org/initiative/3

# ------------------------------------------------- PHYSICS AND EARTH SCIENCE

- id: standard-model
  name: Standard Model of particle physics
  kind: discovery
  fields: [physics, math]
  date: 1973
  status: achieved
  tier: 2
  summary: >-
    The theory of the known elementary particles and three of the four forces,
    assembled from electroweak unification (1967) and quantum chromodynamics
    (1973). Every collider test since has agreed with it, though it leaves out
    gravity and dark matter.
  requires: [quantum-mechanics, relativity]
  helped_by: [particle-accelerator, stored-program-computer]
  efforts:
    - who: Sheldon Glashow, Steven Weinberg, Abdus Salam
      where: USA, UK / Pakistan
      when: 1967
      outcome: achieved
      note: Electroweak theory; Nobel 1979.
    - who: David Gross, Frank Wilczek, David Politzer
      where: USA
      when: 1973
      outcome: achieved
      note: Asymptotic freedom in QCD; Nobel 2004.
    - who: CERN (W and Z bosons, 1983), Fermilab (top quark, 1995)
      where: Switzerland, USA
      when: 1983
      outcome: achieved
  sources:
    - title: CERN, The Standard Model
      url: https://home.cern/science/physics/standard-model

- id: higgs-boson
  name: Higgs boson discovery
  kind: discovery
  fields: [physics]
  date: 2012
  status: achieved
  tier: 3
  summary: >-
    The particle that confirms how other particles get mass, predicted in 1964
    and found at CERN's Large Hadron Collider on July 4, 2012. It completed the
    Standard Model.
  requires: [standard-model, cern, superconductivity]
  helped_by: [world-wide-web, stored-program-computer]
  efforts:
    - who: ATLAS and CMS collaborations, LHC (CERN)
      where: Switzerland / France
      when: 2012
      outcome: achieved
      note: Peter Higgs and Francois Englert shared the 2013 Nobel.
    - who: Fermilab Tevatron
      where: USA
      when: 2011
      outcome: rival
    - who: CERN Future Circular Collider; China CEPC
      where: Europe, China
      when: 2040
      outcome: ongoing
      note: Proposed Higgs factories of about 15 billion Swiss francs.
  effort:
    span: [1994, 2012]
    people: 10000
    cost_usd: 13000000000
    note: The LHC machine cost about 4.6 billion Swiss francs to build; ATLAS and CMS each have about 3,000 to 5,000 members.
  sources:
    - title: CERN, The Higgs boson
      url: https://home.cern/science/physics/higgs-boson
    - title: CERN, The Large Hadron Collider (facts and figures)
      url: https://home.cern/science/accelerators/large-hadron-collider

- id: gravitational-wave-detection
  name: Gravitational-wave detection
  kind: discovery
  fields: [physics]
  date: 2015
  status: achieved
  tier: 2
  summary: >-
    Measuring ripples in spacetime from colliding black holes with laser
    interferometers 4 km long, sensitive to a thousandth of a proton's width. LIGO
    made the first detection on September 14, 2015, a century after Einstein's
    prediction.
  requires: [relativity, laser]
  helped_by: [research-grant-system, stored-program-computer]
  efforts:
    - who: LIGO (Caltech, MIT; Rainer Weiss, Kip Thorne, Barry Barish)
      where: USA
      when: 2015
      outcome: achieved
      note: Nobel 2017.
    - who: Virgo (Italy, France), KAGRA (Japan)
      where: Italy, Japan
      when: 2017
      outcome: achieved
    - who: ESA and NASA, LISA
      where: Europe
      when: 2035
      outcome: ongoing
      note: Space-based detector.
  effort:
    span: [1972, 2015]
    people: 1000
    cost_usd: 2000000000
    note: NSF's largest single investment, about $1.1 billion over four decades.
  sources:
    - title: Nobel Prize in Physics 2017
      url: https://www.nobelprize.org/prizes/physics/2017/summary/
    - title: Caltech LIGO, Facts
      url: https://www.ligo.caltech.edu/page/facts

- id: plate-tectonics
  name: Plate tectonics
  kind: discovery
  fields: [physics, society]
  date: 1967
  status: achieved
  tier: 2
  summary: >-
    The theory that Earth's surface is made of moving plates that spread at ocean
    ridges and sink at trenches, settled by seafloor magnetic stripes between
    1962 and 1968. It explains earthquakes, volcanoes, mountains and where ores
    and oil form.
  requires: [scientific-method]
  helped_by: [radar, nuclear-weapon]
  efforts:
    - who: Harry Hess (Princeton), seafloor spreading
      where: USA
      when: 1962
      outcome: achieved
    - who: Fred Vine and Drummond Matthews (Cambridge); Lawrence Morley
      where: UK, Canada
      when: 1963
      outcome: achieved
      note: Magnetic stripes on the seafloor, mapped with Navy magnetometers.
    - who: J. Tuzo Wilson, Dan McKenzie, Jason Morgan, Xavier Le Pichon
      where: Canada, UK, USA, France
      when: 1967
      outcome: achieved
  effort:
    note: Built on Alfred Wegener's rejected continental drift (1912) and Cold War ocean surveys and seismograph networks set up to detect nuclear tests.
  sources:
    - title: USGS, This Dynamic Earth, developing the theory
      url: https://pubs.usgs.gov/gip/dynamic/developing.html

- id: climate-science
  name: Modern climate science
  kind: discovery
  fields: [physics, chemistry]
  date: 1967
  status: achieved
  tier: 2
  summary: >-
    Measurements and models showing that carbon dioxide from fossil fuels is
    accumulating and warming Earth, from the Keeling curve (1958) to Manabe and
    Wetherald's 1967 model. Its predictions of about 3 degrees C per doubling of
    CO2 have held up.
  requires: [thermodynamics, quantum-mechanics]
  helped_by: [stored-program-computer, earth-observation]
  efforts:
    - who: Charles David Keeling (Scripps), Mauna Loa CO2 record
      where: USA
      when: 1958
      outcome: achieved
    - who: Syukuro Manabe and Richard Wetherald (GFDL)
      where: USA
      when: 1967
      outcome: achieved
      note: Manabe shared the 2021 Nobel.
    - who: Charney report (US National Academy)
      where: USA
      when: 1979
      outcome: achieved
      note: Estimated 1.5 to 4.5 C of warming per CO2 doubling.
  sources:
    - title: NOAA Global Monitoring Laboratory, Trends in atmospheric CO2 (Mauna Loa record)
      url: https://gml.noaa.gov/ccgg/trends/
    - title: Nobel Prize in Physics 2021
      url: https://www.nobelprize.org/prizes/physics/2021/summary/

- id: scanning-tunneling-microscope
  name: Scanning tunneling microscope
  kind: device
  fields: [physics, materials]
  date: 1981
  status: achieved
  tier: 3
  summary: >-
