# Part E: other fields since 1945 (energy, space, transport, materials,
# environment, agriculture, physics, institutions) and the future frontier.
# Status as of 2026-10-27. cost_usd values are rough, in 2025 US dollars.

# ---------------------------------------------------------------- ENERGY

- id: nuclear-power
  name: Nuclear power
  kind: infrastructure
  fields: [energy, physics]
  date: 1954
  status: achieved
  tier: 1
  summary: >-
    Fission reactors that boil water to drive turbines, first feeding a grid at
    Obninsk in 1954. About 440 reactors now supply roughly 9 percent of the
    world's electricity with almost no carbon emissions.
  requires: [nuclear-fission, power-grid, electric-generator]
  helped_by: [nuclear-weapon, stored-program-computer]
  competes: [fusion-power]
  uses: [res-uranium]
  efforts:
    - who: Argonne National Laboratory, EBR-I
      where: USA
      when: 1951
      outcome: achieved
      note: First electricity from fission, enough to light four bulbs (December 20, 1951).
    - who: Obninsk AM-1
      where: USSR
      when: 1954
      outcome: achieved
      note: First reactor to feed a power grid (5 MW), June 27, 1954.
    - who: Calder Hall (UKAEA)
      where: UK
      when: 1956
      outcome: independent
      note: First commercial-scale nuclear station, opened October 1956.
    - who: Shippingport (Rickover, Westinghouse, Duquesne Light)
      where: USA
      when: 1957
      outcome: independent
      note: >-
        First full-scale US plant, a pressurized water reactor adapted from the
        naval program that powered USS Nautilus (1955). The PWR became the
        world's dominant design.
    - who: China (CNNC, CGN; Hualong One fleet)
      where: China
      when: 2026
      outcome: ongoing
      note: Builds more reactors than the rest of the world combined in the 2020s.
  effort:
    span: [1942, 1957]
    people: 100000
    note: >-
      Rides on the Manhattan Project (about 130,000 people, about $30 billion in
      2025 dollars). Vogtle 3 and 4 in Georgia cost about $35 billion for two
      units and Hinkley Point C is estimated near 46 billion pounds, which is
      why cost, not physics, is the constraint in the West.
  sources:
    - title: IAEA Bulletin 16(3), Blokhintsev and Krasin, Building and operation of the first atomic power station (Obninsk, 1974)
      url: https://www.iaea.org/sites/default/files/publications/magazines/bulletin/bull16-3/16304700712.pdf
    - title: World Nuclear Association, Nuclear Power in the World Today
      url: https://world-nuclear.org/information-library/current-and-future-generation/nuclear-power-in-the-world-today

- id: small-modular-reactors
  name: Small modular reactors and advanced fission
  kind: device
  fields: [energy, engineering]
  date: 2020
  status: ongoing
  tier: 2
  summary: >-
    Factory-built reactors under about 300 MW, meant to cut nuclear costs through
    series production rather than one-off megaprojects. A handful run in Russia
    and China; the first Western units are under construction.
  requires: [nuclear-power]
  helped_by: [research-grant-system, 3d-printing]
  competes: [fusion-power, enhanced-geothermal]
  uses: [res-uranium]
  efforts:
    - who: Rosatom, Akademik Lomonosov floating plant
      where: Russia
      when: 2020
      outcome: achieved
      note: Two 35 MWe KLT-40S reactors on a barge at Pevek, commercial since May 2020.
    - who: China Huaneng, Tsinghua University, HTR-PM
      where: China
      when: 2023
      outcome: achieved
      note: High-temperature gas-cooled pebble-bed reactor, commercial operation December 2023.
    - who: CNNC, Linglong One (ACP100)
      where: China
      when: 2026
      outcome: ongoing
      note: 125 MWe land-based PWR at Changjiang, Hainan; commissioning in 2026.
    - who: Ontario Power Generation and GE Vernova Hitachi, BWRX-300 at Darlington
      where: Canada
      when: 2025
      outcome: ongoing
      note: Construction license April 2025; first unit grid power expected 2029 to 2030, three more planned.
    - who: TerraPower Natrium (Kemmerer, Wyoming); X-energy with Dow; Kairos Power Hermes
      where: USA
      when: 2026
      outcome: ongoing
      note: Sodium-cooled, pebble-bed and molten-salt-cooled designs under construction or licensing.
    - who: NuScale (with ENTRA1 and TVA)
      where: USA
      when: 2025
      outcome: ongoing
      note: First US SMR design certified (2023 for 50 MWe module, uprate approved 2025); the first planned plant (CFPP, Utah) was cancelled in 2023 over cost.
    - who: US DOE Reactor Pilot Program (Antares, Valar Atomics, Deployable Energy, Aalo)
      where: USA
      when: 2026
      outcome: ongoing
      note: Four test reactors reached criticality by July 2026 against a July 4 goal of three.
    - who: Rolls-Royce SMR
      where: UK
      when: 2025
      outcome: ongoing
      note: Selected by Great British Energy, Nuclear in June 2025.
  sources:
    - title: IAEA, Small Modular Reactors
      url: https://www.iaea.org/topics/small-modular-reactors
    - title: US DOE, Fourth criticality ahead of July 4th goal (2026)
      url: https://www.energy.gov/articles/department-energy-celebrates-fourth-criticality-ahead-july-4th-goal
    - title: World Nuclear News, Additional SMRs in the pipeline for Darlington
      url: https://www.world-nuclear-news.org/articles/additional-smrs-in-the-pipeline-for-darlington

- id: molten-salt-thorium
  name: Thorium molten salt reactors
  kind: device
  fields: [energy, chemistry]
  date: { window: [2030, 2045], likely: 2036 }
  status: ongoing
  tier: 3
  summary: >-
    Reactors with fuel dissolved in molten fluoride salt that can breed fissile
    uranium-233 from abundant thorium. Oak Ridge ran a test reactor in the 1960s;
    China's Wuwei reactor converted thorium to uranium in 2025.
  requires: [nuclear-power]
  competes: [small-modular-reactors]
  uses: [res-uranium]
  efforts:
    - who: Oak Ridge National Laboratory, Molten Salt Reactor Experiment
      where: USA
      when: 1965
      outcome: abandoned
      note: Ran 1965 to 1969, including on U-233; program cut in favor of sodium fast breeders.
    - who: Shanghai Institute of Applied Physics (CAS), TMSR-LF1
      where: China
      when: 2025
      outcome: ongoing
      note: 2 MWt; critical October 2023, thorium added October 2024, first thorium-to-uranium conversion announced November 2025. A 373 MWt follow-on is planned around 2030.
    - who: Copenhagen Atomics, Terrestrial Energy, Flibe Energy
      where: Denmark, Canada, USA
      when: 2026
      outcome: ongoing
    - who: India's three-stage thorium program (BARC)
      where: India
      when: 2026
      outcome: ongoing
      note: Solid-fuel route through fast breeders rather than molten salt.
  forecast:
    note: >-
      Read as a thorium-fueled molten salt reactor delivering grid power. China
      has moved fastest, from construction start (2018) to thorium conversion
      (2025) in seven years, and plans a 10 MWe class demo near 2030. Salt
      corrosion, tritium handling and fuel reprocessing are unsolved at
      commercial scale, and thorium is not needed while uranium is cheap, so
      Western efforts lag. Best guess mid-2030s in China, later elsewhere.
    sources:
      - title: World Nuclear News, Chinese MSR achieves conversion of thorium-uranium fuel
        url: https://world-nuclear-news.org/articles/chinese-msr-achieves-conversion-of-thorium-uranium-fuel
  sources:
    - title: World Nuclear News, Chinese MSR achieves conversion of thorium-uranium fuel
      url: https://world-nuclear-news.org/articles/chinese-msr-achieves-conversion-of-thorium-uranium-fuel
    - title: ORNL, Molten Salt Reactor Experiment
      url: https://www.ornl.gov/molten-salt-reactor/history

- id: laser
  name: Laser
  kind: device
  fields: [physics, electronics]
  date: 1960
  status: achieved
  tier: 2
  summary: >-
    A light source that amplifies light by stimulated emission into an intense,
    coherent beam, first built by Theodore Maiman with a ruby crystal in 1960. It
    underlies fiber optics, precision measurement, laser fusion and much of modern
    manufacturing.
  requires: [quantum-mechanics]
  helped_by: [radar]
  efforts:
    - who: Charles Townes and colleagues (Columbia), maser
      where: USA
      when: 1954
      outcome: achieved
      note: The microwave precursor; Townes and Schawlow proposed the optical version in 1958.
    - who: Nikolay Basov and Alexander Prokhorov (Lebedev Institute)
      where: USSR
      when: 1955
      outcome: independent
      note: Shared the 1964 Nobel with Townes.
    - who: Theodore Maiman (Hughes Research Laboratories)
      where: USA
      when: 1960
      outcome: achieved
      note: First working laser, May 16, 1960.
  sources:
    - title: APS Physics History, May 16, 1960, Maiman builds first working laser
      url: https://www.aps.org/apsnews/2010/05/physics-history
    - title: Nobel Prize in Physics 1964
      url: https://www.nobelprize.org/prizes/physics/1964/summary/

- id: tokamak
  name: Tokamak magnetic confinement
  kind: technique
  fields: [physics, energy]
  date: 1968
  status: achieved
  tier: 2
  summary: >-
    A doughnut-shaped magnetic bottle that holds plasma hot enough for fusion,
    proposed by Tamm and Sakharov in 1951. Soviet T-3 results in 1968 made it the
    world's main fusion approach.
  requires: [quantum-mechanics, electromagnetism]
  helped_by: [nuclear-weapon, stored-program-computer]
  competes: [fusion-ignition-nif]
  efforts:
    - who: Kurchatov Institute, T-3
      where: USSR
      when: 1968
      outcome: achieved
      note: Reported 10 million degree plasmas; a British Culham team confirmed with laser scattering in 1969.
    - who: JET (EUROfusion, Culham)
      where: UK / EU
      when: 2023
      outcome: achieved
      note: Record 69 MJ of fusion energy in its final experiments before closing in December 2023.
    - who: EAST (ASIPP, Hefei)
      where: China
      when: 2025
      outcome: achieved
      note: 1,066 seconds of high-confinement plasma, January 2025.
    - who: WEST (CEA)
      where: France
      when: 2025
      outcome: achieved
      note: 1,337 second plasma, February 2025.
    - who: Princeton Plasma Physics Laboratory stellarator program; Wendelstein 7-X (Max Planck)
      where: USA, Germany
      when: 2015
      outcome: rival
      note: Stellarators, the twisted alternative, revived by W7-X (first plasma 2015).
  sources:
    - title: Tokamak, Wikipedia
      url: https://en.wikipedia.org/wiki/Tokamak
    - title: Joint European Torus, Wikipedia
      url: https://en.wikipedia.org/wiki/Joint_European_Torus

- id: fusion-ignition-nif
  name: Laser fusion ignition
  kind: discovery
  fields: [physics, energy]
  date: 2022
  status: achieved
  tier: 3
  summary: >-
    On December 5, 2022, the National Ignition Facility got more fusion energy out
    of a fuel pellet (3.15 MJ) than its lasers put in (2.05 MJ), the first
    controlled fusion ignition. By 2025 shots reached 8.6 MJ, a target gain above 4.
  requires: [laser, nuclear-weapon]
  helped_by: [stored-program-computer]
  efforts:
    - who: Lawrence Livermore National Laboratory, National Ignition Facility
      where: USA
      when: 2022
      outcome: achieved
      note: >-
        Gain counts laser energy at the target only; the lasers drew about 300 MJ
        from the grid. Record 8.6 MJ from 2.08 MJ in April 2025.
  effort:
    span: [1997, 2022]
    people: 3000
    cost_usd: 7000000000
    note: About $3.5 billion to build (finished 2009), plus over a decade of operation, mostly funded for weapons stewardship.
  sources:
    - title: LLNL, Achieving fusion ignition
      url: https://lasers.llnl.gov/science/achieving-fusion-ignition
    - title: Physics World, NIF laser fusion milestone ignites debate
      url: https://physicsworld.com/a/national-ignition-facilitys-laser-fusion-milestone-ignites-debate/

- id: fusion-power
  name: Fusion power plant
  kind: infrastructure
  fields: [energy, physics]
  date: { window: [2032, 2055], likely: 2039 }
  status: ongoing
  tier: 1
  summary: >-
    A power plant that makes net electricity by fusing hydrogen isotopes, with
    abundant fuel and no long-lived high-level waste. Science gain has been shown,
    but no device has yet made net electricity.
  requires: [tokamak, superconductors-high-temp]
  helped_by: [fusion-ignition-nif, laser, deep-learning, stored-program-computer]
  competes: [small-modular-reactors, solar-photovoltaic]
  uses: [res-lithium, res-helium]
  efforts:
    - who: ITER (EU, China, India, Japan, Korea, Russia, USA)
      where: France
      when: 2034
      outcome: ongoing
      note: 2024 baseline moved start of research operations to 2034 and deuterium-tritium to 2039, adding about 5 billion euros. Aims at Q=10, not electricity.
    - who: Lawrence Livermore National Laboratory, NIF
      where: USA
      when: 2022
      outcome: ongoing
      note: Ignition December 2022; laser drivers need roughly 100 times better wall-plug efficiency for a plant.
    - who: Commonwealth Fusion Systems, SPARC then ARC
      where: USA
      when: 2027
      outcome: ongoing
      note: High-field REBCO tokamak; 20 T magnet test 2021, SPARC first plasma targeted 2027, ARC plant in Virginia early 2030s.
    - who: Helion Energy, Polaris then Orion
      where: USA
      when: 2028
      outcome: ongoing
      note: Pulsed field-reversed configuration with direct energy recovery; broke ground on Orion in Malaga, Washington in 2025 for a 50 MW Microsoft contract by 2028.
    - who: TAE Technologies
      where: USA
      when: 2026
      outcome: ongoing
      note: Beam-driven FRC; announced a merger with Trump Media and Technology Group in December 2025 and plans a 50 MWe plant.
    - who: ASIPP Hefei, EAST and BEST
      where: China
      when: 2027
      outcome: ongoing
      note: BEST, a compact superconducting tokamak aiming at burning plasma with Q above 1 (design Q=5), due end of 2027; CFEDR demo to follow.
    - who: Tokamak Energy; UKAEA STEP
      where: UK
      when: 2040
      outcome: ongoing
      note: Spherical tokamaks; STEP prototype plant at West Burton targeted 2040.
    - who: General Fusion, Zap Energy, Type One Energy, Proxima Fusion, Marvel Fusion, Pacific Fusion
      where: Canada, USA, Germany
      when: 2026
      outcome: ongoing
    - who: Energy Singularity; China Fusion Energy Co.
      where: China
      when: 2026
      outcome: ongoing
      note: Chinese private and state HTS tokamaks (HH70 first plasma 2024).
  effort:
    span: [1951, 2026]
    people: 30000
    cost_usd: 80000000000
    note: >-
      ITER alone is officially over 20 billion euros plus the 2024 overrun; the
      US DOE once estimated the full in-kind total near $65 billion. Private
      fusion firms raised roughly $10 billion by 2025 (Fusion Industry
      Association). Public fusion research worldwide has run on the order of
      $1 to 2 billion a year since the 1970s.
  forecast:
    note: >-
      Read as first fusion electricity sold to a grid from a plant with net
      electric gain. Company dates (Helion 2028, CFS early 2030s, TAE, STEP
      2040) have a poor record: SPARC slipped from 2025 to 2027, ITER first
      plasma from 2016 to 2034, and Helion has missed earlier stated dates
      (in 2026 it softened 2028 from producing electricity to beginning
      initial operations). Metaculus's 100 MW question sat at 2043 in late
      2025 (middle half 2035 to 2057). The Fusion Industry Association survey says most firms expect
      grid power in the 2030s, but that is self-reported. Tritium breeding,
      materials under neutron flux and plant availability are untested. I put
      a first small net-electric plant late 2030s, meaningful share of world
      power after 2050.
    sources:
      - title: Metaculus, When will the first 100 MW fusion electrical facility come into service?
        url: https://www.metaculus.com/questions/363/when-will-the-first-100-megawatt-fusion-based-electrical-generation-facility-come-into-service
      - title: Physics World, Fusion industry predicts electricity generation by the 2030s (FIA survey)
        url: https://physicsworld.com/a/fusion-industry-predicts-electricity-generation-by-the-2030s/
      - title: Physics World, ITER hit by decade-long delay and 5 billion euro price hike
        url: https://physicsworld.com/a/iter-fusion-reactor-hit-by-massive-decade-long-delay-and-e5bn-price-hike/
      - title: DatacenterDynamics, Helion begins work at fusion plant for Microsoft by 2028
        url: https://datacenterdynamics.com/en/news/helion-begins-work-at-fusion-plant-expects-to-deliver-power-to-microsoft-by-2028/
  sources:
    - title: ITER, Wikipedia
      url: https://en.wikipedia.org/wiki/ITER
    - title: SPARC (tokamak), Wikipedia
      url: https://en.wikipedia.org/wiki/SPARC_(tokamak)
    - title: ANS, Trump Media to merge with TAE Technologies
      url: https://www.ans.org/news/article-7632/trump-media-to-merge-with-fusion-startup-tae-technologies-in-6b-deal/

- id: solar-photovoltaic
  name: Silicon solar cell
  kind: device
  fields: [energy, electronics]
  date: 1954
  status: achieved
  tier: 1
  summary: >-
    A semiconductor junction that turns sunlight directly into electricity, first
    made practical at Bell Labs in 1954 at about 6 percent efficiency. Module
    prices fell over 99 percent since 1975, making it the cheapest new
    electricity in much of the world.
  requires: [quantum-mechanics, transistor]
  helped_by: [satellites, integrated-circuit, research-grant-system]
  uses: [res-silicon, res-silver]
  metric: solar-pv-module-price
  efforts:
    - who: Daryl Chapin, Calvin Fuller, Gerald Pearson (Bell Labs)
      where: USA
      when: 1954
      outcome: achieved
      note: Announced April 25, 1954.
    - who: Vanguard 1
      where: USA
      when: 1958
      outcome: achieved
      note: First solar-powered satellite; space was PV's first real market.
    - who: Germany's feed-in tariff (EEG, 2000) and Chinese manufacturers (LONGi, Jinko, Trina, Tongwei)
      where: Germany, China
      when: 2000
      outcome: achieved
      note: German demand then Chinese scale drove the learning curve; China makes over 80 percent of the world's modules.
  effort:
    note: >-
      Price fell about 20 percent per doubling of cumulative capacity (Wright's
      law), from about $132/W in 1975 to $0.27/W in 2024 (2025 dollars). The
      world added about 510 GW in 2025, past 2.4 TW cumulative. Silver paste is
      a constraint at terawatt scale; makers are shifting to copper
      metallization.
  sources:
    - title: APS Physics History, Bell Labs demonstrates the first practical silicon solar cell
      url: https://www.aps.org/publications/apsnews/200904/physicshistory.cfm
    - title: Our World in Data, Solar PV prices
      url: https://ourworldindata.org/grapher/solar-pv-prices

- id: perovskite-solar-cells
  name: Perovskite solar cells
  kind: discovery
  fields: [energy, materials]
  date: 2009
  status: achieved
  tier: 3
  summary: >-
    Solar cells made from cheap, solution-processed metal halide perovskite
    crystals, first reported at 3.8 percent efficiency in 2009 and above 26
    percent within 15 years. Their weakness is degradation under heat, light and
    moisture.
  requires: [solar-photovoltaic]
  efforts:
    - who: Akihiro Kojima, Tsutomu Miyasaka and colleagues (Toin University of Yokohama)
      where: Japan
      when: 2009
      outcome: achieved
    - who: Henry Snaith (Oxford) and Nam-Gyu Park (Sungkyunkwan) groups
      where: UK, South Korea
      when: 2012
      outcome: achieved
      note: Solid-state cells near 10 percent launched the field.
  sources:
    - title: Kojima et al. 2009, J. Am. Chem. Soc. 131, 6050
      url: https://pubs.acs.org/doi/10.1021/ja809598r
    - title: NREL, Best research-cell efficiency chart
      url: https://www.nrel.gov/pv/cell-efficiency.html

- id: perovskite-silicon-tandem
  name: Perovskite-silicon tandem solar cells
  kind: device
  fields: [energy, materials]
  date: 2024
  status: ongoing
  tier: 3
  summary: >-
    A perovskite layer stacked on a silicon cell to harvest blue and red light
    separately, beating silicon's practical limit of about 27 percent. Lab cells
    reached 35.5 percent in 2026; durable mass production is the open problem.
  requires: [perovskite-solar-cells, solar-photovoltaic]
  uses: [res-silicon]
  efforts:
    - who: LONGi Green Energy
      where: China
      when: 2026
      outcome: ongoing
      note: Certified 35.5 percent cell (ESTI, July 2026); 31.4 percent tandem module.
    - who: Oxford PV
      where: UK / Germany
      when: 2024
      outcome: ongoing
      note: First commercial tandem module shipments, September 2024, from Brandenburg.
    - who: Helmholtz-Zentrum Berlin, KAUST, EPFL/CSEM, Fraunhofer ISE
      where: Germany, Saudi Arabia, Switzerland
      when: 2026
      outcome: ongoing
    - who: Hanwha Qcells, Trina, JinkoSolar, GCL
      where: South Korea, China
      when: 2026
      outcome: ongoing
      note: Pilot lines; Qcells targeted mass production around 2026 to 2027.
  sources:
    - title: LONGi, 35.5 percent tandem cell world record (2026)
      url: https://www.longi.com/en/news/crystalline-silicon-perovskite-tandem-solar-cell-new-world-efficiency-2026/
    - title: NREL, Best research-cell efficiency chart
      url: https://www.nrel.gov/pv/cell-efficiency.html

- id: wind-power
  name: Utility-scale wind turbines
  kind: device
  fields: [energy, engineering]
  date: 1979
  status: achieved
  tier: 2
  summary: >-
    Three-bladed, upwind, grid-connected turbines on the Danish design, scaled
    from tens of kilowatts in the late 1970s to 15 MW machines today. Global
    capacity passed about 1,300 GW in 2025.
  requires: [electric-generator, power-grid, windmill]
  helped_by: [carbon-fiber, stored-program-computer]
  uses: [res-rare-earths]
  efforts:
    - who: Johannes Juul, Gedser turbine
      where: Denmark
      when: 1957
      outcome: achieved
      note: 200 kW three-bladed prototype that set the "Danish concept".
    - who: Vestas, Bonus (now Siemens Gamesa), Nordtank
      where: Denmark
      when: 1979
      outcome: achieved
      note: Small commercial turbines sold into the California wind rush of the early 1980s.
    - who: NASA/DOE MOD series
      where: USA
      when: 1975
      outcome: abandoned
      note: Large two-bladed government turbines that mostly failed; incremental Danish scaling won.
    - who: Goldwind, Envision, Mingyang
      where: China
      when: 2025
      outcome: achieved
      note: China added about 120 GW in 2025 alone and holds over half of world capacity.
  effort:
    note: >-
      Direct-drive generators use neodymium-iron-boron magnets (roughly 600 kg of
      magnet per MW, about a third of it rare earths); geared designs with induction generators avoid them
      at some cost in maintenance.
  sources:
    - title: GWEC, Global Wind Report 2026
      url: https://www.gwec.net/reports/globalwindreport
    - title: Gedser wind turbine, Wikipedia
      url: https://en.wikipedia.org/wiki/Gedser_wind_turbine

- id: offshore-wind
  name: Offshore wind
