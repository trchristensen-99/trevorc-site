- id: asteroid-mining
  name: Asteroid mining
  kind: technique
  fields: [engineering, materials]
  date: { window: [2035, 2080], likely: 2050 }
  status: speculative
  tier: 3
  summary: >-
    Extracting water, metals or platinum-group elements from asteroids, most
    likely first as water for rocket fuel in space rather than metal shipped to
    Earth. Sample-return missions show the access, not the economics.
  requires: [asteroid-sample-return, reusable-rockets]
  helped_by: [fully-reusable-rockets, orbital-manufacturing]
  uses: [res-platinum-group]
  efforts:
    - who: Planetary Resources; Deep Space Industries
      where: USA
      when: 2018
      outcome: abandoned
      note: Both well-funded startups were sold off in 2018 to 2019 without mining.
    - who: AstroForge
      where: USA
      when: 2025
      outcome: ongoing
      note: Odin flyby probe lost contact after launch in February 2025.
    - who: Origin Space; Karman+
      where: China, USA
      when: 2026
      outcome: ongoing
  forecast:
    note: >-
      Read as first commercial sale of material mined from an asteroid. Two
      earlier waves of startups failed for lack of buyers; in-space customers
      (depots, stations) do not yet exist, and shipping metal to Earth would
      crash its price. Depends on cheap launch and a space economy that needs
      local water.
    sources:
      - title: The Space Review, The asteroid mining bubble has burst (2019)
        url: https://www.thespacereview.com/article/3633/1
  sources:
    - title: AstroForge, company site
      url: https://www.astroforge.com/
    - title: The Space Review, The new wave of asteroid mining ventures (2025, includes the Odin mission)
      url: https://www.thespacereview.com/article/4955/1

