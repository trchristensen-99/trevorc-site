      when: 1991
      outcome: achieved
      note: Eleven 450 kW turbines.
    - who: Equinor, Hywind Scotland
      where: UK
      when: 2017
      outcome: achieved
      note: First floating wind farm.
    - who: China Three Gorges, Mingyang
      where: China
      when: 2025
      outcome: achieved
      note: China has about half of world offshore capacity.
  sources:
    - title: Vindeby Offshore Wind Farm, Wikipedia
      url: https://en.wikipedia.org/wiki/Vindeby_Offshore_Wind_Farm

- id: lithium-ion-battery
  name: Lithium-ion battery
  kind: device
  fields: [energy, chemistry]
  date: 1991
  status: achieved
  tier: 1
  summary: >-
    A rechargeable battery that shuttles lithium ions between a layered oxide
    cathode and a carbon anode, commercialized by Sony in 1991. Cell prices fell
    about 99 percent since then, enabling phones, laptops, electric cars and grid
    storage.
  requires: [electric-battery, periodic-table]
  helped_by: [research-grant-system, personal-computer]
  uses: [res-lithium, res-cobalt, res-nickel]
  metric: lithium-ion-battery-price
  efforts:
    - who: M. Stanley Whittingham (Exxon)
      where: USA
      when: 1976
      outcome: achieved
      note: Lithium titanium disulfide cathode; metallic lithium anode was a fire risk.
    - who: John Goodenough and Koichi Mizushima (Oxford)
      where: UK
      when: 1980
      outcome: achieved
      note: Lithium cobalt oxide cathode, doubling voltage.
    - who: Akira Yoshino (Asahi Kasei)
      where: Japan
      when: 1985
      outcome: achieved
      note: Carbon (petroleum coke) anode, the first safe practical cell.
    - who: Sony
      where: Japan
      when: 1991
      outcome: achieved
      note: First commercial cells, in a camcorder.
    - who: CATL, BYD, LG Energy Solution, Panasonic, Samsung SDI, SK On
      where: China, South Korea, Japan
      when: 2026
      outcome: achieved
      note: Demand passed 1 TWh a year in 2024; Chinese makers hold about three quarters of production.
  effort:
    note: >-
      Whittingham, Goodenough and Yoshino shared the 2019 Chemistry Nobel. The
      graphite anode and the cobalt in early cathodes are supply risks; nickel-
      rich and cobalt-free chemistries (LFP) and sodium-ion substitute.
  sources:
    - title: Nobel Prize in Chemistry 2019
