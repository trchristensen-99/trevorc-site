# What others forecast for each future technology. See SCHEMA.md, "Forecasts".
# Metaculus figures were read from Internet Archive snapshots of each question
# (the site blocks automated reading); each note gives the snapshot month.
# Collected 2026-10-30 and 2026-10-31.

agi:
  - title: "Metaculus: When will the first general AI system be devised, tested, and publicly announced?"
    url: https://www.metaculus.com/questions/5121/
    kind: crowd
    asof: 2026-10
    median: 2031.1
    q25: 2028.3
    q75: 2037.3
    match: same
    note: Community prediction from about 1,840 forecasters, read from an Internet Archive snapshot of 17 October 2026. The node's criterion embeds this question's tests and adds broad job coverage and on-the-job learning, so it is the same bar or slightly stricter.
  - title: "Metaculus: When will the first weakly general AI system be devised, tested, and publicly announced?"
    url: https://www.metaculus.com/questions/3479/
    kind: crowd
    asof: 2026-09
    median: 2027.7
    q25: 2026.7
    q75: 2030.1
    match: looser
    note: About 1,730 forecasters, read from an Internet Archive snapshot of 23 September 2026. Weak AGI is a cognitive benchmark basket (Turing test, Winograd, SAT, Montezuma's Revenge) with no robotics or job coverage, a much easier bar.
  - title: "Manifold: AGI When? [High Quality Turing Test]"
    url: https://manifold.markets/ManifoldAI/agi-when-resolves-to-the-year-in-wh-d5c5ad8e4708
    kind: market
    asof: 2026-10
    median: 2031.3
    q10: 2027.8
    q25: 2029
    q75: 2035.5
    q90: 2042
    match: looser
    note: Quantiles interpolated from the yearly buckets of this play-money market (about 1,080 traders). It resolves on passing a demanding Turing test, without the node's job coverage, cost or robotics requirements.
  - title: "Kalshi: When will any company achieve AGI?"
    url: https://kalshi.com/markets/kxagico
    kind: market
    asof: 2026-10
    median: 2028.2
    q25: 2027.4
    q75: 2029
    match: looser
    note: Resolves when any company officially announces it has achieved AGI; quantiles interpolated between the quarterly contracts' mid prices (39 percent before 2028, 52 percent before April 2028, 76 percent before 2029). An announcement is a far easier bar than the node's capability test.
  - title: "Kalshi: When will OpenAI achieve AGI?"
    url: https://kalshi.com/markets/kxoaiagi
    kind: market
    asof: 2026-10
    median: 2028.6
    q25: 2027.5
    match: looser
    note: Resolves when OpenAI announces it has attained AGI; prices were about 6.5 percent before 2027, 43 percent before 2028 and 66 percent before 2030, and the quantiles are linear interpolations between those. One company's announcement is an easier bar than the node.
  - title: "AI Futures Project (Kokotajlo): top-expert-dominating AI"
    url: https://blog.aifutures.org/p/q25-2026-timelines-update-uplift
    kind: expert
    asof: 2026-08
    median: 2028
    match: stricter
    note: Daniel Kokotajlo's median for AI at least as good as top human experts at virtually all cognitive tasks, as given in the site's forecast note. That is above the node's competent-professional bar, though it omits the node's robotics test.
  - title: "AI Futures Project (Lifland): top-expert-dominating AI"
    url: https://blog.aifutures.org/p/q25-2026-timelines-update-uplift
    kind: expert
    asof: 2026-08
    median: 2032
    match: stricter
    note: Eli Lifland's median for top-expert-dominating AI, as given in the site's forecast note; a higher cognitive bar than the node's, without its robotics test.
  - title: "Dwarkesh Patel: AI that learns on the job like a human"
    url: https://www.dwarkesh.com/p/timelines-june-2025
    kind: expert
    asof: 2025-06
    median: 2032
    match: looser
    note: Patel's 50 percent date for AI that learns on the job as easily as a human, which is only the second part of the node's three-part criterion.
  - title: "2023 Expert Survey on Progress in AI (Grace et al., 2,778 researchers): high-level machine intelligence"
    url: https://arxiv.org/abs/2401.02843
    kind: survey
    asof: 2023-10
    median: 2047
    q10: 2027
    match: stricter
    note: Aggregate forecast for unaided machines doing every task better and more cheaply than human workers (10 percent by 2027, 50 percent by 2047), a stricter bar than 90 percent of computer-based tasks.
