      url: https://world-nuclear.org/information-library/nuclear-fuel-cycle/conversion-enrichment-and-fabrication/uranium-enrichment
res-germanium:
  recycling: <1%
  risk:
    rating: very high
    note: No world production figures are published; China is the leading producer and exporter,
      introduced export licenses in August 2023 and banned exports to the US in December 2024
      (USGS).
  note: A byproduct of zinc refining and coal ash. Used in fiber optics, infrared optics and some
    chips and solar cells for satellites. Manufacturing scrap is recycled, old products rarely.
  sources:
    - title: "USGS, Mineral Commodity Summaries 2026: Germanium"
      url: https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-germanium.pdf
    - title: "UNEP International Resource Panel, Recycling Rates of Metals: A Status Report (Graedel et
        al., 2011)"
      url: https://www.resourcepanel.org/reports/recycling-rates-metals
res-fresh-water:
  risk:
    rating: high
    note: "My judgment: renewable globally, but scarce where most needed; agriculture takes about 70% of
      withdrawals, and aquifers such as the Ogallala and the North China Plain are drawn down faster
      than they refill."
  sources:
    - title: FAO AQUASTAT
      url: https://www.fao.org/aquastat/en/
res-fertile-soil:
  risk:
    rating: moderate
    note: "My judgment: the FAO's 2015 assessment found about a third of the world's soils moderately to
      highly degraded, mostly by erosion, nutrient loss and salinization; fertilizer and better
      practice offset much of it."
  sources:
    - title: FAO and ITPS, Status of the World's Soil Resources (2015)
      url: https://www.fao.org/documents/card/en/c/c6814873-efc3-41db-b7d3-2081a10ede50/
res-wood:
  risk:
    rating: low
    note: "My judgment: renewable and widely grown; local overcutting was a real constraint before coal."
  sources: []
res-clay:
  risk:
    rating: low
    note: "My judgment: common clays are effectively unlimited."
  sources: []
res-limestone:
  risk:
    rating: low
    note: "My judgment: abundant worldwide; the limit on cement is its carbon dioxide, not the rock."
