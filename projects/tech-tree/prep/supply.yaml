res-silicon:
  year: 2025
  production:
    value: 4600000
    unit: t
    what: silicon metal (not ferrosilicon)
  producers:
    - [ China, 87 ]
    - [ Brazil, 3.9 ]
    - [ Norway, 2.8 ]
    - [ France, 1.5 ]
    - [ Australia, 1 ]
  risk:
    rating: high
    note: >-
      My judgment: quartz itself is abundant, so the score (which would be
      very high) overstates it, but turning it into silicon metal and solar-
      and chip-grade polysilicon is concentrated in China (87% of silicon
      metal), and the ultra-pure quartz for crucible-grown crystals comes
      mostly from Spruce Pine, North Carolina.
  note: Silicon itself is the second most abundant element in the crust; the constraint is refining,
    which takes cheap electricity and is concentrated in China, as is nearly all solar-grade
    polysilicon.
  sources:
    - title: "USGS, Mineral Commodity Summaries 2026: Silicon"
      url: https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-silicon.pdf
