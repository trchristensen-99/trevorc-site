# World supply of each resource (see SCHEMA.md): production, reserves (in
# the same unit), the leading producers and processors (percent of world
# output), the end-of-life recycling rate (UNEP 2011 bands), demand in 2040
# as a multiple of today (IEA stated policies), and leading uses. The build
# turns these into a supply-risk rating; `risk` gives a judgment instead.
# Minerals: USGS Mineral Commodity Summaries 2026 (2025 data, estimated).
res-copper:
  year: 2025
  production:
    value: 23000000
    unit: t
    what: copper content
  reserves:
    value: 980000000
    unit: t
  producers:
    - [ Chile, 23 ]
    - [ Congo (Kinshasa), 13.9 ]
    - [ Peru, 11.7 ]
    - [ China, 7.8 ]
    - [ Russia, 5.7 ]
  processing:
    stage: refining
    producers:
      - [ China, 48.3 ]
      - [ Congo (Kinshasa), 9.7 ]
      - [ Chile, 5.9 ]
      - [ Japan, 4.8 ]
  recycling: ">50%"
  demand_2040: 1.3
  uses:
    - [ building construction (US), 42 ]
    - [ electrical and electronic products (US), 23 ]
  note: Reserves have stayed at a few decades of production for a century, because prices fund new
    discovery, but ore grades are falling. The IEA sees a possible 30% shortfall of mine supply by
    2035 as grids and electric vehicles add demand; China refines nearly half of the world's copper.
  sources:
    - title: "USGS, Mineral Commodity Summaries 2026: Copper"
      url: https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-copper.pdf
    - title: "UNEP International Resource Panel, Recycling Rates of Metals: A Status Report (Graedel et
        al., 2011)"
      url: https://www.resourcepanel.org/reports/recycling-rates-metals
    - title: IEA, Global Critical Minerals Outlook 2025
      url: https://www.iea.org/reports/global-critical-minerals-outlook-2025
    - title: USGS, Mineral Commodity Summaries 2026 data release (CSV)
      url: https://doi.org/10.5066/P1WKQ63T
