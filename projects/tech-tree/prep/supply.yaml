    value: 190
    unit: million m³
    what: helium
  producers:
    - [ United States, 42.6 ]
    - [ Qatar, 33.2 ]
    - [ Russia, 9.5 ]
    - [ Algeria, 5.8 ]
    - [ Canada, 3.2 ]
  recycling: <1%
