# What each technology took: merged key by key into the node's `effort`
# (see SCHEMA.md). A key set to null removes it.
#
#   span: [from, to]   years of focused work on this result
#   people: 10         people working on it at once (researchers, engineers,
#                      builders; not trial volunteers or customers). For
#                      something not yet achieved: the number working on it now
#   person_years: 30   total, when the sources give one (else people x years)
#   cost_usd: 1e6      total cost, 2025 dollars
#   compute_usd: 1e6   the cost of computing alone (AI training runs)
#   work: build        mostly building what people already knew how to make
#                      (default research: finding out how)
#   growth: 0.1        for something not yet achieved: how fast the effort on
#                      it is growing, a fraction a year
#   rough: true        my order-of-magnitude estimate from the histories,
#                      not a documented figure
#
# People and years are orders of magnitude. Where a node's own sources
# cover the history, the figures come from them.

# ------------------------------------------------- corrections to older entries

- id: monumental-architecture
  span: null
  people: null
  note: >-
    For scale, the Great Pyramid (about 2580 to 2560 BC, long after the first
    monuments): excavations of the workers' town at Giza suggest a paid,
    rotating workforce of about 10,000 to 30,000 at a time over roughly 20
    years. Göbekli Tepe itself was built by foragers over generations.
- id: rocketry
  span: [1920, 1926]
  people: 3
  rough: true
  note: >-
    Goddard worked largely alone, with a few assistants and a Smithsonian
    grant of $5,000 (1917). The V-2 that followed was another order of
    effort: Peenemünde had about 5,000 staff by 1942, plus tens of thousands
    of forced laborers at the Mittelwerk; at least 10,000 prisoners died
    building V-2s, more than were killed by them.
- id: space-stations
  span: [1967, 1971]
  people: 5000
  rough: true
  note: >-
    Salyut 1 was built quickly from Almaz military station hardware. The ISS
    (1984 to 2011) is often cited at about $150 billion across partners, the
    most expensive single object ever built.
  cost_usd: null
