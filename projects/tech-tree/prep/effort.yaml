- id: nuclear-power
  people: 5000
  rough: true
  note: >-
    Rides on the Manhattan Project (about 130,000 people, about $30 billion
    in 2025 dollars); the reactor programs that followed (Argonne, Oak
    Ridge, Rickover's naval reactors) employed thousands. Vogtle 3 and 4 in
    Georgia cost about $35 billion for two units and Hinkley Point C is
    estimated near 46 billion pounds, which is why cost, not physics, is the
    constraint in the West.
- id: polio-vaccine
  people: 50
  person_years: 3000
  rough: true
  note: >-
    Salk's Pittsburgh lab, a few dozen people, developed the vaccine from
    1948 to 1953. The 1954 Francis field trial then enlisted roughly 20,000
    physicians, 40,000 nurses and 200,000 volunteers, most of them part-time
    for a few months, funded by the March of Dimes; the person-years here
    count that as about 2,500.
- id: mrna-vaccines
  people: 3000
  rough: true
  note: >-
    Moderna's and Pfizer and BioNTech's vaccine programs, a few thousand
    people for a year, resting on three decades of mRNA work by Karikó,
    Weissman and others. The trials enrolled about 74,000 volunteers.
    Operation Warp Speed committed about $18 billion across several
    vaccines, on top of the companies' own spending.
