note: >-
  Sum of all sources in OWID's world series, including traditional biomass
  (wood, charcoal, crop residues, dung), converted from TWh a year to
  average power (divided by 8,766 hours). One method throughout: the
  physical energy content method the Statistical Review adopted in 2025,
  in which nuclear counts at its heat input and hydro, wind and solar at
  their electricity output (OWID indicator metadata: "non-combustible
  renewables on the energy content of their gross electrical output").
  This is the right basis for physical limits such as waste heat, but it
  gives renewables less weight than the older substitution method (which
  grossed their output up as if made in a fossil plant at about 40
  percent efficiency), so totals differ from older charts by a few
  percent in recent years. Before 1965 the world figures are Smil's
  estimates; traditional biomass is Smil's to 2015 and held at its 2015
  value (11,111 TWh, about 1.27 TW) since. Without traditional biomass
  the 2025 total is 19.0 TW. Growth: 1.07 percent a year 1800 to 1950
  (doubling in 65 years), 2.93 percent 1950 to 2000 (24 years), 1.64
  percent 2000 to 2025 (43 years); 1.54 percent over 1800 to 2025.
  Downloaded 2026-11-06 (data updated 2026-06-30, covering 1800 to 2025).
  Kardashev Type I on Sagan's scale is 1e16 W, 10,000 TW, about 490
  times the 2025 value (Sagan's K = 0.73).
