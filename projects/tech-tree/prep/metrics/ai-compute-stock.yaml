note: >-
  Epoch's median estimates of AI accelerators sold each quarter (Nvidia,
  Google TPU, AMD, Huawei and others) in H100-equivalents, summed from
  Q1 2022 with no retirements, times the H100's 9.895e14 dense 16-bit
  FLOP/s (Epoch's chip table). Chips sold before 2022 are left out, so
  early points are too low and early growth looks too fast; fit from 2024.
  Q3 2026 was incomplete when read and is omitted. Epoch's 90 percent
  range for mid 2026 is 25 to 39 million H100e. The stock grew 2.6 times
  from mid 2025 to mid 2026. Human brains for comparison: 8.3e9 people at
  Carlsmith's 1e15 FLOP/s is 8.3e24 FLOP/s.
