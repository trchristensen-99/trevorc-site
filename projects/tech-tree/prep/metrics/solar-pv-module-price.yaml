license: CC BY 4.0
note: >-
  Module price only, excluding installation and balance of system. Nemet (2009)
  for 1975 to 2003, Farmer and Lafond (2016) for 2004 to 2009, IRENA's global
  module price index (pvXchange benchmark for modules sold in Europe) for 2010
  to 2019, and IRENA's "mainstream" crystalline silicon module series from 2020
  (OWID joins the two without rescaling; they differ by under 20 percent in
  2020 to 2023). Deflated to 2025 US$ by OWID with the World Bank US GDP
  deflator. Values rounded to 4 decimals from the OWID CSV downloaded
  2026-10-28 (OWID revised the series on 2026-10-23, which lowered 2024 from
  0.27 to 0.13). Paired with solar-pv-cumulative-capacity for a Wright's law
  fit (price drop per doubling of cumulative capacity).
