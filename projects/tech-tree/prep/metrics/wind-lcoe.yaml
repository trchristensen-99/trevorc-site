note: >-
  Levelized cost of electricity: lifetime cost of building, financing and
  running a plant divided by its lifetime output, without subsidies, as
  estimated by IRENA in constant 2025 US$ (4 significant figures, OWID CSV
  downloaded 2026-10-28). Global capacity-weighted average for onshore wind farms commissioned each year; IRENA's series starts in 1984. The fall has flattened since about 2021.
