note: >-
  Harvested wheat per hectare in England (medieval and early modern points,
  Broadberry et al., British Economic Growth 1270-1870) and the United
  Kingdom (from 1887; FAO from 1961). Early points are averages over decades.
  From 1961 to 1999 only every fifth year is kept; every year from 2000.
  OWID CSV downloaded 2026-10-28. Yields roughly doubled between 1300 and
  1800, nearly tripled by 1961, and then doubled again by the late 1990s with
  semi-dwarf varieties, fertilizer and fungicides; the national average has
  been flat at 7 to 9 tonnes since the late 1990s, with weather-driven dips
  (2001, 2012, 2020, 2024).
