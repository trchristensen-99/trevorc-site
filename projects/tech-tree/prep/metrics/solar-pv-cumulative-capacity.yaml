  concentrated solar power, which is under 1 percent of the total (roughly 7 GW),
  so it can stand in for cumulative PV. Values rounded to 2 decimals from the
  OWID CSV downloaded 2026-10-27. Series starts in 2000; IRENA's figures are AC
  or DC depending on the country.
