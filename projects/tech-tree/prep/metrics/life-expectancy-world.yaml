source:
  title: "Our World in Data, Life expectancy at birth (Riley 2005 before 1950; UN World Population Prospects 2024 from 1950)"
  url: https://ourworldindata.org/grapher/life-expectancy?country=~OWID_WRL
license: CC BY 4.0
note: >-
  Period life expectancy at birth for the whole world, both sexes, from the
  OWID CSV downloaded 2026-10-28: James Riley's long-run estimates (1770 to
  1913) and UN WPP 2024 from 1950, every fifth year to 1985, then every
  year. It more than doubled, from 32 in 1900 to 73 in 2023. The dips are
  China's famine (1959 to 1961) and COVID-19 (2020 to 2021). Gains have
  slowed from about 3.6 years a decade over 1950 to 2023 to 2.8 over 2000 to
  2023, and both the UN and IHME expect them to keep slowing as poorer
  countries catch up with the leaders, so the straight-line trend
  overstates the future.
scenarios:
  - id: un-wpp-2024
    name: UN WPP 2024
    kind: projection
    points: [[2024, 73.32], [2030, 74.39], [2040, 75.81], [2050, 77.02], [2060, 78.06], [2070, 79.06], [2080, 79.98], [2090, 80.86], [2100, 81.73]]
    low: [[2024, 72.92], [2030, 73.38], [2040, 74.37], [2050, 75.25], [2060, 76.09], [2070, 76.78], [2080, 77.61], [2090, 78.32], [2100, 79.04]]
    high: [[2024, 73.69], [2030, 75.27], [2040, 77.11], [2050, 78.5], [2060, 79.8], [2070, 80.95], [2080, 81.97], [2090, 82.95], [2100, 83.91]]
    note: >-
      The UN's medium variant, with the 95 percent prediction interval from
      its probabilistic projections (file PPP/E0). Each country's gains are
      projected by a Bayesian model of how gains have slowed as life
      expectancy rose in all countries, with the 2020 to 2023 COVID years
      left out of the fit. The world reaches 77.0 in 2050 and 81.7 in 2100.
    sources:
      - title: "UN World Population Prospects 2024, probabilistic projections of life expectancy at birth (UN_PPP2024_Output_e0.xlsx)"
        url: https://population.un.org/wpp/assets/Excel%20Files/2_Indicators%20(Probabilistic)/EXCEL_FILES/4_Mortality/UN_PPP2024_Output_e0.xlsx
      - title: "UN World Population Prospects 2024, demographic indicators, medium variant (CSV)"
        url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_Demographic_Indicators_Medium.csv.gz
  - id: ihme-gbd-2021
    name: IHME GBD reference
    kind: projection
    points: [[2023, 73.17], [2050, 78.2]]
    low: [[2023, 73.17], [2050, 75.2]]
    high: [[2023, 73.17], [2050, 80.3]]
    note: >-
      IHME's Global Burden of Disease reference scenario: world life
      expectancy rises from 73.6 years in 2022 (IHME's own estimate) to 78.2
      in 2050 (95 percent uncertainty 75.2 to 80.3), about 0.16 years a year
      against 0.27 a year over 1990 to 2019. Falling cardiovascular deaths
      give the largest share of the gain. The line starts from the UN's 2023
      value so it joins the data.
    sources:
      - title: "GBD 2021 Forecasting Collaborators, Burden of disease scenarios for 204 countries and territories, 2022 to 2050, Lancet 403:2204 (2024)"
        url: https://doi.org/10.1016/S0140-6736(24)00685-8
  - id: model-rejuvenation
    name: "Model: rejuvenation at the tree's date"
    kind: model
    points: [[2024, 73.3], [2030, 74.4], [2040, 75.8], [2050, 77.0], [2060, 78.1], [2065, 78.9], [2070, 79.8], [2075, 81.1], [2080, 82.7], [2090, 86.0], [2100, 87.9]]
    low: [[2024, 73.3], [2030, 74.4], [2040, 75.8], [2050, 77.0], [2060, 78.1], [2070, 79.1], [2080, 80.0], [2090, 80.9], [2100, 81.7]]
    high: [[2024, 73.3], [2030, 74.4], [2040, 75.8], [2045, 76.5], [2050, 77.5], [2055, 78.6], [2060, 80.0], [2065, 81.8], [2070, 83.6], [2075, 85.0], [2080, 85.9], [2090, 87.2], [2100, 88.2]]
    note: >-
      A simple model, not a forecast; every point is computed, none is data.
      Baseline (no new aging biology): the UN medium path above. On top of
      it, rejuvenation therapies (node aging-reversal) arrive in 2062, the
      tree's likely date; the band uses the tree's window, arrival in 2045
      (high) or 2110 (low, which leaves the baseline unchanged to 2100).
      Effect: the aging-reversal criterion's 10-year reset, applied once to
      everyone 60 and over, so they die at the rates of people 10 years
      younger. Applied to the UN's 2023 world life table, that adds 6.5 years
      to life expectancy at birth (my calculation). Uptake: a logistic curve
      reaching half of older people 20 years after arrival (scale 6 years),
      matching antiretroviral therapy for HIV, which reached 24 percent of
      people with HIV in 2010 and 53 percent in 2016, 20 years after
      combination therapy (node hiv-antiretroviral-therapy). The added
      years are held fixed, as a share of the users. A one-time reset adds
      at most 0.27 years a year to world life expectancy, so on its own it
      does not reach longevity escape velocity (node longevity-escape-velocity);
      that needs repeated or continuing rejuvenation.
    sources:
      - title: "UN World Population Prospects 2024, complete life tables, both sexes, 1950 to 2023 (CSV)"
        url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_Life_Table_Complete_Medium_Both_1950-2023.csv.gz
      - title: "WHO Global Health Observatory: data on the HIV response (antiretroviral therapy coverage, 24 percent in 2010)"
        url: https://www.who.int/data/gho/data/themes/hiv-aids/data-on-the-hiv-aids-response
      - title: "CBS News: for first time, over half of people with HIV taking AIDS drugs (UNAIDS, July 2017)"
        url: https://www.cbsnews.com/news/hiv-aids-drugs-for-first-time-over-half-taking-meds
