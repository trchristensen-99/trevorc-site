license: Apache-2.0 (database repository); check the wiki's terms before reuse
note: >-
  Thomas Bloom's erdosproblems.com lists problems Paul Erdős posed; the
  community database on GitHub mirrors it and logs counts at every commit
  from 31 August 2025 (read 2026-11-06). "Solved" includes problems later
  found solved in old papers and grows partly because problems are added
  (992 to 1,221). On 6 October 2026 the site stopped showing statuses and
  counts, so that problems are read as questions rather than a scoreboard,
  and the solved count has not moved since 28 September; the series may
  have ended. The AI line counts distinct problems with a "full solution"
  in sections 1(a), 1(c) and 1(d) of the community wiki (AI alone, AI
  building on literature, AI with humans), leaving out 1(b), where an
  earlier solution was found afterwards; counting 1(b) gives 79. The wiki
  says it is not a benchmark and stopped on 30 June 2026, before Astra's
  three Erdős solutions in August. Quanta reported 565 solved and 652 open
  when it went to press in August 2026, and 111 status changes from 2024
  to August 2025.
