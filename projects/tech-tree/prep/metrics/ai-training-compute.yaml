id: ai-training-compute
name: Training compute of notable AI models
short: AI training compute
field: computing
unit: FLOP
better: higher
log: true
fit: {from: 2010}  # the deep-learning era; before 2010 compute doubled about every two years
points:                           # [year, value]; a representative set of landmark and frontier models
  - [1950, 40]                    # Theseus (Shannon's maze-solving mouse)
  - [1957, 694894.9377361819]     # Perceptron Mark I
  - [1980, 273738240]             # Neocognitron
  - [1986, 673920000]             # MLP with back-propagation (Rumelhart et al.)
  - [1987, 28328002560]           # NETtalk
  - [1989, 1496338054440]         # LeCun's zip-code CNN
  - [1992, 18232157622832.703]    # TD-Gammon (speculative)
  - [1997, 31512000000000]        # LSTM
  - [2000, 6339000000000000]      # Bengio neural language model
  - [2012, 4.7e17]                # AlexNet
  - [2014, 5.6e19]                # Seq2Seq LSTM
  - [2016, 6.62e21]               # GNMT (Google Neural Machine Translation)
  - [2017, 6.49439910290227e20]   # AlphaGo Zero
  - [2018, 2.85e20]               # BERT-Large
  - [2019, 1.07734e23]            # AlphaStar
  - [2020, 3.14e23]               # GPT-3 175B
  - [2021, 8.586e23]              # Megatron-Turing NLG 530B
  - [2022, 2.5272e24]             # PaLM 540B
  - [2023, 5.0e25]                # Gemini 1.0 Ultra (speculative); GPT-4 is 2.1e25
  - [2024, 3.8e25]                # Llama 3.1 405B (largest disclosed; closed 2024 models undisclosed)
  - [2025, 5.0e26]                # Grok 4 (speculative); GPT-4.5 is 3.8e26
  - [2026, 9.4e26]                # GPT-6 Astra (likely; CI about 5e26 to 2e27)
source:
  title: Epoch AI, Notable AI Models dataset
  url: https://epoch.ai/data/notable-ai-models
license: CC BY 4.0
note: >-
  Exact values from Epoch AI's notable_ai_models.csv, downloaded 2026-10-27.
  Most frontier values after 2022 are Epoch estimates, not lab disclosures, and
  the confidence labels range from confident to speculative. Epoch finds
  frontier training compute growing about 4 to 5 times per year since 2010
  (https://epoch.ai/blog/training-compute-of-frontier-ai-models-grows-by-4-5x-per-year).
scenarios:                        # paths start from the 2026 point, GPT-6 Astra (9.4e26 FLOP, Epoch estimate)
  - id: epoch-4-5x
    name: Epoch trend, 4 to 5 times a year
    kind: trend
    points: [[2026, 9.4e26], [2027, 4.7e27], [2028, 2.35e28], [2030, 5.9e29]]
    low: [[2027, 3.76e27], [2028, 1.5e28], [2030, 2.4e29]]
    high: [[2027, 4.7e27], [2028, 2.35e28], [2030, 5.9e29]]
    note: >-
      Frontier training compute growing 5 times a year (Epoch AI's trends
      page, February 2026), with the band down to 4 times a year (Epoch's
      2024 estimate), from GPT-6 Astra. It passes 1e28 FLOP in 2027 and
      1e29 in 2029.
    sources:
      - title: Epoch AI, Trends in AI (data-trends)
        url: https://epoch.ai/data-trends
      - title: Epoch AI, Training compute of frontier AI models grows by 4-5x per year
        url: https://epoch.ai/blog/training-compute-of-frontier-ai-models-grows-by-4-5x-per-year
  - id: epoch-feasible-2030
    name: Epoch, feasible by 2030
    kind: model
    points: [[2026, 9.4e26], [2030, 2.0e29]]
    low: [[2030, 1.0e28]]
    high: [[2030, 3.0e29]]
    note: >-
      Epoch AI's 2024 analysis found training runs of about 2e29 FLOP
      "will likely be feasible by the end of this decade", with power the
      tightest limit: 1 to 5 gigawatt campuses allow runs of 1e28 to 3e29
      FLOP by 2030, which gives the band. Its September 2025 report for
      Google DeepMind expected about 1e29 FLOP by 2030, with clusters
      costing over $100 billion. The path implies about 3.8 times a year.
    sources:
      - title: Epoch AI, Can AI scaling continue through 2030? (August 2024)
        url: https://epoch.ai/blog/can-ai-scaling-continue-through-2030
      - title: "Epoch AI, What will AI look like in 2030? (September 2025)"
        url: https://epoch.ai/blog/what-will-ai-look-like-in-2030
  - id: since-gpt4
    name: Since GPT-4, about 3 times a year
    kind: trend
    points: [[2026, 9.4e26], [2027, 2.82e27], [2028, 8.46e27], [2030, 7.6e28]]
    note: >-
      The slower pace of the largest estimated runs since GPT-4: from 2.1e25
      FLOP (GPT-4, March 2023) to 9.4e26 (GPT-6 Astra, September 2026) is
      about 3 times a year in this dataset, carried forward. It reaches 1e28
      in 2028 and 1e29 only after 2030.
