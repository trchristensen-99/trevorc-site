note: >-
  The price of CELLS only, not packs (see battery-pack-price for finished
  packs; BNEF's 2025 pack average was $108/kWh, of which $74 was cells).
  Representative cell price across major chemistries, constant 2024 US$ per
  kWh. 1991 to 2015 follow Ziegler and Trancik (2021, Energy Environ. Sci.
  14, 1635); later years blend BloombergNEF and Avicenne survey data. 1991 to
  2024 are rounded to 1 decimal from the OWID CSV (downloaded 2026-10-27,
  unchanged on 2026-10-28). 2025 is the cell share in BNEF's 2025 survey
  chart (real 2025 US$; that chart also puts 2024 cells at $78, so the two
  dollar bases agree closely):
  https://about.bnef.com/insights/clean-transport/lithium-ion-battery-pack-prices-fall-to-108-per-kilowatt-hour-despite-rising-metal-prices-bloombergnef/
