note: >-
  FrontierMath is a set of unpublished, hard mathematics problems written
  by mathematicians, with answers a computer can check; tiers 1 to 3 run
  from advanced undergraduate to early research level. Values are the best
  score Epoch AI measured for any model released by each date, from
  Epoch's CSV (downloaded 2026-10-28). Epoch released version 2 on 12 June
  2026 after fixing errors in 42 percent of problems and re-ran older
  models, so these values are higher than the version 1 scores reported at
  the time (on version 1 the best was 40.7 at the end of 2025, GPT-5.2,
  and 52.4 in April 2026). The AI Digest 2025 survey's median for the end
  of 2025 was 40 percent on version 1, almost exactly right (40.7); the
  Forecasting Research Institute's LEAP experts (mid-2025) expected 31
  percent then, 55 by the end of 2027 and 75 by the end of 2030, all far
  too low. Epoch wrote in September 2025 that FrontierMath "could be
  solved as early as 2027 on current trends". OpenAI funded FrontierMath
  and has access to much of it. Scores saturate, so the straight-line
  trend is a poor guide near 100 percent.
