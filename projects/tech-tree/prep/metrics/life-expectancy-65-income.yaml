id: life-expectancy-65-income
name: Remaining life expectancy at 65 by country income group
short: Life expectancy at 65 by income
unit: years
better: higher
log: false
field: medicine
fit: {from: 1970}  # old-age death rates barely moved before about 1970, then began to fall
source:
  title: "UN World Population Prospects 2024 (income groups and world); Our World in Data life tables, Human Mortality Database 2025 before 1950 (best country)"
  url: https://population.un.org/wpp/downloads
license: CC BY 3.0 IGO (UN WPP); CC BY 4.0 (OWID)
note: >-
  How many more years a 65-year-old could expect to live at that year's death
  rates (both sexes), for the four World Bank income groups and the world from
  UN World Population Prospects 2024 (CSV checked 2026-10-29; every fifth year
  1950 to 1985, then every year to 2023), and for the best country or
  territory with at least 1 million people and complete death registration
  (those covered by the Human Mortality Database), from OWID's life tables
  (HMD before 1950, UN from 1950), every fifth year from 1840. Income groups
  use the World Bank classification of May 2024 for every year, as at birth.
  In 2023: high-income 20.6 years, upper-middle 17.3, lower-middle 15.3,
  low-income 14.1, world 17.6, and the record 23.2 (Hong Kong). The gap
  between rich and poor countries is much smaller at 65 than at birth, since
  most of the gap at birth is deaths of children and young adults, but it has
  grown, from 3.8 years in 1950 and 3.2 in 1970 to 6.5 in 2023: deaths from
  heart disease and stroke at older ages fell from about 1970 in rich
  countries far faster than in poor ones. Gains at old ages are what aging
  research targets. The best-country line crept from 11 to 15 years between
  1840 and 1950 and has risen about 1.4 years a decade since 1970, led by
  Japan and then Hong Kong (Lithuania's UN estimates lead in the early 1960s;
  the 1945 value is from HMD and the 1950 one from the UN, so the two sources
  join with a small step).
