    scenarios:
      - id: un-wpp-2024
        name: UN WPP 2024
        kind: projection
        points: [[2024, 23.19], [2030, 23.80], [2040, 24.88], [2050, 25.99], [2060, 27.01], [2070, 27.90], [2080, 28.72], [2090, 29.53], [2100, 30.42]]
        note: >-
          The UN's medium variant for Hong Kong, the place with the highest
          projected value in each decade to 2100: 26.0 years in 2050 and 30.4
          in 2100, about 1.0 year a decade, slower than the 1.4 a decade since
          1970. The UN publishes prediction intervals only for life expectancy
          at birth, so no band is shown.
        sources:
          - title: "UN World Population Prospects 2024, demographic indicators, medium variant (CSV)"
            url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_Demographic_Indicators_Medium.csv.gz
      - id: model-rejuvenation
        name: "Model: rejuvenation at the tree's date"
        kind: model
        points: [[2024, 23.2], [2030, 23.8], [2040, 24.9], [2050, 26.0], [2060, 27.0], [2062, 27.2], [2065, 28.2],
          [2070, 31.4], [2075, 34.5], [2080, 35.9], [2085, 36.5], [2090, 37.0], [2095, 37.4], [2100, 37.9]]
        low: [[2024, 23.2], [2030, 23.8], [2040, 24.9], [2050, 26.0], [2060, 27.0], [2070, 27.9], [2080, 28.7], [2090, 29.5], [2100, 30.4]]
        high: [[2024, 23.2], [2030, 23.8], [2040, 24.9], [2045, 25.4], [2050, 27.6], [2055, 31.3], [2060, 33.8], [2065, 34.8],
          [2070, 35.4], [2075, 35.8], [2080, 36.2], [2085, 36.6], [2090, 37.0], [2095, 37.4], [2100, 37.9]]
        note: >-
          A simple model, not a forecast; every point is computed, none is
          data. Baseline (no new aging biology): the UN medium path for Hong
          Kong. On top of it, rejuvenation therapies (node aging-reversal)
          arrive in 2062, the tree's likely date; the band uses the tree's
          window, arrival in 2045 (high) or 2110 (low, which leaves the
          baseline unchanged to 2100). Effect: the aging-reversal criterion's
          10-year reset, applied once to everyone 60 and over, so they die at
          the rates of people 10 years younger. On Hong Kong's 2023 UN life
          table that adds 7.5 years at 65 (my calculation). The added years
          are held fixed and scaled by the share of people over 60 who have
          had it. Uptake in the leading country follows the high-income curve:
          half of people over 60 8 years after arrival (scale 3 years), set
          between the United States' uptake of HIV therapy (53 percent of
          adults in care within about 2 years, HCSUS) and of statins in
          high-income countries (66.5 percent of people with heart disease in
          2003 to 2009, PURE, as reported by Marcus et al. 2022). The fastest
          gain is about 0.65 years a year, short of the one year a year that
          longevity escape velocity needs.
        sources:
          - title: "UN World Population Prospects 2024, complete life tables, both sexes, 1950 to 2023 (CSV)"
            url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_Life_Table_Complete_Medium_Both_1950-2023.csv.gz
          - title: "UN World Population Prospects 2024, population by five-year age group, medium variant (CSV)"
            url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_PopulationByAge5GroupSex_Medium.csv.gz
          - title: "Cunningham et al. (HCSUS), Prevalence and predictors of highly active antiretroviral therapy use in patients with HIV infection in the United States, JAIDS 25:115 (2000)"
            url: https://doi.org/10.1097/00042560-200010010-00005
          - title: "World Bank World Development Indicators: antiretroviral therapy coverage, percent of people living with HIV (SH.HIV.ARTC.ZS), low-income countries, from UNAIDS"
            url: https://data.worldbank.org/indicator/SH.HIV.ARTC.ZS?locations=XM
          - title: "Marcus et al., Use of statins for the prevention of cardiovascular disease in 41 low-income and middle-income countries, Lancet Global Health 10:e369 (2022), which also reports the PURE study"
            url: https://doi.org/10.1016/S2214-109X(21)00551-9
