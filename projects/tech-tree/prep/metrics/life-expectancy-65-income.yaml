          [2070, 26.6], [2075, 27.6], [2080, 28.1], [2085, 28.5], [2090, 28.8], [2095, 29.0], [2100, 29.2]]
        note: >-
          A simple model, not a forecast; every point is computed, none is
          data. Baseline (no new aging biology): the UN medium path for the
          world. On top of it, rejuvenation therapies (node aging-reversal)
          arrive in 2062, the tree's likely date; the band uses the tree's
          window, arrival in 2045 (high) or 2110 (low, which leaves the
          baseline unchanged to 2100). Effect: the aging-reversal criterion's
          10-year reset, applied once to everyone 60 and over, so they die at
          the rates of people 10 years younger. On the UN's 2023 world life
          table that adds 7.3 years at 65 (my calculation). The added years
          are held fixed and scaled by the share of people over 60 who have
          had it. Uptake differs by income group, the point of the comparison.
          My logistic curves reach half of people over 60 8 years after
          arrival in high-income countries (scale 3 years, so 90 percent after
          about 15) and 25 years after in low-income countries (scale 6, 90
          percent after about 38), with 15 and 20 years for upper-middle and
          lower-middle income (my interpolation). They are set from two past
          therapies. Combination antiretroviral therapy for HIV (1996): in the
          United States 53 percent of adults in HIV care were taking it by
          late 1997 to January 1998 (HCSUS), while in low-income countries
          coverage of all people with HIV was 19 percent in 2010 and first
          passed half in 2016, 20 years on, and only after generic drugs and
          donor programmes such as PEPFAR and the Global Fund (World Bank,
          from UNAIDS). Statins (first approved in 1987) had no such push: in
          2003 to 2009, 66.5 percent of people with heart disease took one in
          high-income countries against 3.3 percent in low-income ones (PURE),
          and in national surveys from 2013 to 2019 still only 8.2 percent did
          in low-income countries (Marcus et al. 2022). The world line weights
          each group's uptake by its share of the world's people over 60 in
          the UN projection, so world uptake reaches half about 17 years after
          arrival.
