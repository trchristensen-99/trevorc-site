note: >-
  NHGRI Genome Sequencing Program production costs, all 78 data points as published (Sept 2001 to May 2022; page last updated May 16, 2023). Years are fractional: each point is dated to the end of its month (for example 2001.75 is 2001-09-30). Values are nominal US dollars per million bases of raw sequence, rounded to six significant figures. Sanger-era data counts Phred Q20 bases; second-generation data uses each platform's own quality threshold. Moore's law (halving every two years) would have taken $5,292 to about $4 by mid-2022; the actual figure is about $0.006, roughly 700 times lower.
