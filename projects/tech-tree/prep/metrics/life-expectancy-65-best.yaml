note: >-
  How many more years a 65-year-old could expect to live at that year's
  death rates (both sexes), in the best country or territory with at least
  1 million people and complete death registration (those covered by the
  Human Mortality Database, which leaves out UN estimates for places like
  Puerto Rico); every fifth year to 1985, then every year to 2023. Computed
  from the OWID life tables and population data downloaded 2026-10-28.
  Gains at old ages are what aging research targets. Remaining life at 65
  crept from 11 to 15 years between 1840 and 1950, while life expectancy at
  birth rose by more than 25 years on falling child and infectious deaths;
  from about 1970, as deaths from heart disease and stroke fell at older ages,
  it rose by about 1.4 years a decade, with Japan and then Hong Kong in
  the lead. Lithuania's UN estimates lead in the early 1960s. The 1945
  value is from HMD (Norway) and the 1950 one from the UN, so the two
  sources join with a small step.
scenarios:
  - id: un-wpp-2024
    name: UN WPP 2024 (Hong Kong)
    kind: projection
    points: [[2024, 23.19], [2030, 23.8], [2040, 24.88], [2050, 25.99], [2060, 27.01], [2070, 27.9], [2080, 28.72], [2090, 29.53], [2100, 30.42]]
    note: >-
      The UN's medium variant for Hong Kong, the place with the highest
      projected value in each decade to 2100: 26.0 years in 2050 and 30.4 in
      2100, about 1.0 year a decade, slower than the 1.4 a decade since
      1970. The UN publishes prediction intervals only for life expectancy
      at birth, so no band is shown.
    sources:
      - title: "UN World Population Prospects 2024, demographic indicators, medium variant (CSV)"
        url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_Demographic_Indicators_Medium.csv.gz
  - id: model-rejuvenation
    name: "Model: rejuvenation at the tree's date"
    kind: model
    points: [[2024, 23.2], [2030, 23.8], [2040, 24.9], [2050, 26.0], [2060, 27.0], [2065, 28.1], [2070, 30.4], [2075, 33.8], [2080, 35.7], [2090, 37.0], [2100, 37.9]]
    low: [[2024, 23.2], [2030, 23.8], [2040, 24.9], [2050, 26.0], [2060, 27.0], [2070, 27.9], [2080, 28.7], [2090, 29.5], [2100, 30.4]]
    high: [[2024, 23.2], [2030, 23.8], [2040, 24.9], [2045, 25.4], [2050, 27.2], [2055, 30.3], [2060, 33.3], [2065, 34.7], [2070, 35.3], [2075, 35.8], [2080, 36.2], [2090, 37.0], [2100, 37.9]]
    note: >-
      A simple model, not a forecast; every point is computed, none is data.
      Baseline (no new aging biology): the UN medium path for Hong Kong. On
      top of it, rejuvenation therapies (node aging-reversal) arrive in
      2062, the tree's likely date; the band uses the tree's window, arrival
      in 2045 (high) or 2110 (low, the baseline). Effect: the aging-reversal
      criterion's 10-year reset, applied once to everyone 60 and over, so
      they die at the rates of people 10 years younger; on Hong Kong's 2023
      UN life table that adds 7.5 years to remaining life at 65 (my
      calculation). Uptake in the leading country: a logistic curve reaching
      half of older people 10 years after arrival (scale 3 years, so 10 to
      90 percent takes about 13 years), my assumption for a reimbursed
      therapy in a rich country, twice as fast as the world's uptake of HIV
      therapy. The peak gain is 0.6 years a year, short of the one year a
      year that longevity escape velocity needs (node
      longevity-escape-velocity): a single reset raises the level but does
      not keep it rising.
    sources:
      - title: "UN World Population Prospects 2024, complete life tables, both sexes, 1950 to 2023 (CSV)"
        url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_Life_Table_Complete_Medium_Both_1950-2023.csv.gz
