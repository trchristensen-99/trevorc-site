note: >-
  Tier 4 is a small set of research-level problems written by
  mathematicians (48 in version 1, 41 in version 2 of June 2026). Values are the best score Epoch AI measured for any model
  released by each date (CSV downloaded 2026-10-28); GPT-6.1 Sol solved
  all 41. On version 1, still used for the AI Digest 2026 survey, the
  best score was 31.3 percent at the end of 2025 and 47.9 by May 2026;
  the survey's median for the end of 2026 was 62 percent, and a Manifold
  market on the end-of-2026 score resolved at 90 percent or more in
  September 2026, so forecasters were far too low. With so few problems,
  each is worth about 2.4 points, and the series is now saturated.
