note: >-
  Cheapest price McCallum found each year for hard disk drives (IBM's RAMAC
  in 1956 onward), converted by OWID to constant 2020 US$ with the US consumer
  price index, and here from dollars per terabyte to dollars per gigabyte (4
  significant figures). OWID CSV downloaded 2026-10-28; the series ends in
  2023. The decline has slowed since about 2010, from halving every 1 to 2
  years to every 4 or so.
