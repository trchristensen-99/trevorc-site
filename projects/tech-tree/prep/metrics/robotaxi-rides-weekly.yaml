note: >-
  Paid driverless rides a week as Waymo announced them, dated by the
  announcement. Waymo was the largest robotaxi service outside China;
  Baidu's Apollo Go peaked above 350,000 a week in March 2026 before Chinese
  regulators froze new permits after a mass stall in Wuhan, and Tesla, Zoox,
  Pony.ai and WeRide don't publish weekly counts. Growth slowed from about
  four times a year in 2024 to about twice a year by 2026, so the trend is
  fitted from 2025. Waymo gave no new weekly figure between March and
  October 2026 (its third-quarter call cited 15 cities and 300 million
  autonomous miles). For scale, Uber and Lyft give very roughly 75 million
  US trips a week, so 500,000 is under 1 percent. Sources: Engadget
  (https://www.engadget.com/waymo-says-its-robotaxis-are-now-making-50000-paid-trips-every-week-130005096.html),
  TechCrunch (https://techcrunch.com/2025/02/27/waymo-has-doubled-its-weekly-robotaxi-rides-in-less-than-a-year/),
  Insurance Journal (https://amp.claimsjournal.com/news/national/2026/02/12/335668.htm).
