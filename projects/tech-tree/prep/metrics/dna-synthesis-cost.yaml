note: >-
  Price to the customer of double-stranded synthetic genes, in nominal US
  dollars per base, as tabulated by Carlson (1999 to 2017). 2026 is Twist
  Bioscience's list price for gene fragments
  (https://www.twistbioscience.com/products/genes: "from $0.07/bp", rising
  to $0.09 for 3 to 5 kb and $0.09 to $0.23 for cloned genes); GenScript
  lists cloned genes from $0.15 a base. Carlson's 2016 and 2017 values ($0.03
  and $0.02) are lower than any list price found today and may reflect bulk
  contracts, so the curve has in practice been flat at about $0.07 to $0.15
  for list-price genes since about 2014. Short column-synthesized oligos fell
  much more slowly, from $1 a base (1992) to $0.05 (2017) in the same table;
  array-synthesized oligo pools are far cheaper, which Carlson (2025) puts at
  $0.00001 to $0.001 a base, but need assembly and error correction to make
  genes.
