note: >-
  World production of all cereals (wheat, rice, maize, barley, sorghum,
  millet and others) divided by harvested area, from FAOSTAT via OWID (CSV
  downloaded 2026-10-28). Rice is counted as paddy. The rise from 1.35 tonnes
  in 1961 to over 4 is the Green Revolution and its successors: semi-dwarf
  wheat and rice, hybrid maize, fertilizer and irrigation. Growth has been
  roughly linear (about 0.045 tonnes a year), so the exponential fit slowly
  overstates future gains.
