note: >-
  Lines of code from the data files behind the mathlib statistics page,
  generated 2026-11-06; Lean 3 mathlib until early 2023, then mathlib4
  after the port, so the step in 2023 is partly a change of language. On
  2026-11-06 the page listed 140,178 definitions and 293,404 theorems from
  772 contributors. Growth has been steady, about 250,000 to
  450,000 lines a year, not explosive, because every change is reviewed by
  people; AI-built proofs live outside it and dwarf it (Fermat's Last
  Theorem alone is about 13 million lines, the classification of finite
  simple groups about 43 million).
