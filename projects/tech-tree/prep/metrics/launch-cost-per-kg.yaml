source:
  title: "CSIS Aerospace Security Project (2022), via Our World in Data, Cost of space launches to low Earth orbit"
  url: https://ourworldindata.org/grapher/cost-space-launches-low-earth-orbit
license: CC BY 4.0 (OWID processing); underlying data CSIS
note: >-
  Each point is one launch vehicle, dated by its first successful launch, at the
  cost of a dedicated launch divided by its LEO payload capacity, in constant
  2021 US$. Several years have more than one vehicle, so fit the lower envelope
  rather than a mean. Small rockets cost more per kg at any date. Series ends in
  2019 and prices expendable list prices; Falcon 9 with booster reuse (internal
  cost said to be far below list) and Starship are not reflected. Original CSIS
  page: https://aerospace.csis.org/data/space-launch-to-low-earth-orbit-how-much-does-it-cost/
