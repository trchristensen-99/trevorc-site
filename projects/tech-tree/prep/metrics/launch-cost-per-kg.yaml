id: launch-cost-per-kg
name: Cost to launch a kilogram to low Earth orbit (cheapest vehicle available)
short: Launch cost per kg
unit: USD per kg (constant 2021 US$)
better: lower
log: true
field: engineering
points:                           # [year of first successful launch, value]; only vehicles that set a new low
  - [1962, 14900]  # Kosmos (Small)
  - [1965, 8200]   # Proton (Heavy)
  - [1967, 5400]   # Saturn V (Heavy)
  - [1985, 5100]   # Zenit 2 (Medium)
  - [2010, 2600]   # Falcon 9 (Medium)
  - [2018, 1500]   # Falcon Heavy (Heavy)
source:
  title: "CSIS Aerospace Security Project (2022), via Our World in Data, Cost of space launches to low Earth orbit"
  url: https://ourworldindata.org/grapher/cost-space-launches-low-earth-orbit
license: CC BY 4.0 (OWID processing); underlying data CSIS
note: >-
  The record line of the cheapest vehicle available: of the 60 vehicles in the
  CSIS table (first flights 1962 to 2019), only those whose cost per kilogram
  beat every earlier vehicle are kept, dated by first successful launch. Cost
  is the price of a dedicated launch divided by the vehicle's LEO payload
  capacity, in constant 2021 US$. Earlier versions of this file plotted every
  vehicle; small rockets cost 5 to 30 times more per kilogram at any date, so
  that cloud had no usable trend (r² 0.14). The record line stalled from 1967
  to 2010 and then fell fast with SpaceX. These are list prices for fully
  expendable payload capacity; SpaceX's internal cost with booster reuse is
  lower, but not published. The CSIS table ends in 2019 (OWID checked
  2026-10-28) and has no Starship point. Original CSIS page:
  https://aerospace.csis.org/data/space-launch-to-low-earth-orbit-how-much-does-it-cost/
