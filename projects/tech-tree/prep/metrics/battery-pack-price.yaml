note: >-
  Volume-weighted average price of a finished pack (cells plus modules,
  battery management, wiring and housing; for stationary storage, the rack)
  across electric cars, buses, commercial vehicles, two- and three-wheelers
  and stationary storage, all restated by BNEF in real 2025 dollars. 2013 to
  2025 are the labelled bars of BNEF's 2025 survey chart (lithium_11.png in
  the press release); 2010 is from the line chart in "New record lows for
  battery prices"
  (https://about.bnef.com/insights/clean-transport/new-record-lows-for-battery-prices/),
  whose caption gives $1,474 (written "$!,474"). BNEF restates the whole
  history every year, so older releases quote smaller numbers for the same
  years (for example $1,100 for 2010 in the 2020 survey). Segment prices are
  lower than the average: in 2025, stationary storage packs averaged $70, car
  packs $99 and all packs in China $84. The cell share of the 2025 average
  was $74.
