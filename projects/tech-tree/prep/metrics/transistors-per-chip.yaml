note: >-
  1971 to 2021 are the OWID series (downloaded 2026-10-27), rounded to whole
  transistors, keeping only years where the record changed; OWID's source
  (Rupp) ends in 2021. 2022, 2023 and 2026 are the largest counts in the
  microprocessor table of Wikipedia's "Transistor count" article (read
  2026-10-28; CC BY-SA 4.0). Since about 2019 the record holders are
  multi-chip packages (AMD's Epyc Rome in 2019 already was), so the series
  measures transistors per processor package, not per die. GPUs, which are
  not in this series, are larger still (Nvidia's two-die B200, 2024, about
  208 billion).
