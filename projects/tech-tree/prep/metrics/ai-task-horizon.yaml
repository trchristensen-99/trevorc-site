note: >-
  The length of software, research-engineering and cybersecurity tasks,
  measured by how long they take skilled humans, that a model completes with
  50 percent probability. Only models METR marks as state of the art at
  release are kept (18 of 26), dated by release. Values are METR's Time
  Horizon 1.1 estimates (228 tasks, after METR's correction of 3 March 2026),
  from https://metr.org/assets/benchmark_results_1_1.yaml, downloaded
  2026-10-28; TH1.1 revised several older models (GPT-4 from 6.0 to 4.0
  minutes, GPT-5 from 131 to 203). METR's own doubling time from 2023 on is
  about 129 days (CI 104 to 158), and about 188 days over the whole series.
  METR says estimates above 16 hours are unreliable with the current task
  suite, so the last two points (12 and 17 hours) have very wide intervals,
  and its page says it is no longer actively updated: no model released after
  April 2026 had been measured by October 2026. A 50 percent horizon is not
  the same as doing the job reliably; METR's 80 percent horizons are about 4
  to 8 times shorter.
