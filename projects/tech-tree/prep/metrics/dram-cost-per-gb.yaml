note: >-
  Cheapest retail or catalogue price McCallum found each year for main memory
  (magnetic core before the mid-1970s, then DRAM chips and modules), converted
  by OWID to constant 2020 US$ with the US consumer price index, and here from
  dollars per terabyte to dollars per gigabyte (4 significant figures). OWID
  CSV downloaded 2026-10-28; the series ends in 2023. McCallum's original site
  (jcmit.net) no longer serves his tables. DRAM prices are cyclical, so single
  years can sit well off the trend.
