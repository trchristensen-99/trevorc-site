          IHME's Global Burden of Disease reference scenario: world life
          expectancy rises from 73.6 years in 2022 (IHME's own estimate) to
          78.2 in 2050 (95 percent uncertainty 75.2 to 80.3), about 0.16 years
          a year against 0.27 a year over 1990 to 2019. The line starts from
          the UN's 2023 value so it joins the data.
        sources:
          - title: "GBD 2021 Forecasting Collaborators, Burden of disease scenarios for 204 countries and territories, 2022 to 2050, Lancet 403:2204 (2024)"
            url: https://doi.org/10.1016/S0140-6736(24)00685-8
      - id: model-rejuvenation
        name: "Model: rejuvenation at the tree's date"
        kind: model
        points: [[2024, 73.3], [2030, 74.4], [2040, 75.8], [2050, 77.0], [2060, 78.1], [2062, 78.3], [2065, 78.8],
          [2070, 80.0], [2075, 81.7], [2080, 83.6], [2085, 85.2], [2090, 86.5], [2095, 87.4], [2100, 88.0]]
        low: [[2024, 73.3], [2030, 74.4], [2040, 75.8], [2050, 77.0], [2060, 78.1], [2070, 79.1], [2080, 80.0], [2090, 80.9], [2100, 81.7]]
        high: [[2024, 73.3], [2030, 74.4], [2040, 75.8], [2045, 76.5], [2050, 77.5], [2055, 79.1], [2060, 81.0], [2065, 82.9],
          [2070, 84.4], [2075, 85.4], [2080, 86.2], [2085, 86.8], [2090, 87.3], [2095, 87.7], [2100, 88.2]]
        note: >-
          A simple model, not a forecast; every point is computed, none is
          data. Baseline (no new aging biology): the UN medium path above. On
          top of it, rejuvenation therapies (node aging-reversal) arrive in
          2062, the tree's likely date; the band uses the tree's window,
          arrival in 2045 (high) or 2110 (low, which leaves the baseline
          unchanged to 2100). Effect: the aging-reversal criterion's 10-year
          reset, applied once to everyone 60 and over, so they die at the
          rates of people 10 years younger. On the UN's 2023 life tables that
          adds 6.5 years to the world's life expectancy at birth, 7.3 in
          high-income, 7.1 in upper-middle, 6.0 in lower-middle and 5.5 in
          low-income countries, where fewer people live to 60 (my
          calculation). The added years are held fixed and scaled by the share
          of people over 60 who have had it. Uptake differs by income group,
          the point of the comparison. My logistic curves reach half of people
          over 60 8 years after arrival in high-income countries (scale 3
          years, so 90 percent after about 15) and 25 years after in
          low-income countries (scale 6, 90 percent after about 38), with 15
          and 20 years for upper-middle and lower-middle income (my
          interpolation). They are set from two past therapies. Combination
          antiretroviral therapy for HIV (1996): in the United States 53
          percent of adults in HIV care were taking it by late 1997 to January
          1998 (HCSUS), while in low-income countries coverage of all people
          with HIV was 19 percent in 2010 and first passed half in 2016, 20
          years on, and only after generic drugs and donor programmes such as
          PEPFAR and the Global Fund (World Bank, from UNAIDS). Statins (first
          approved in 1987) had no such push: in 2003 to 2009, 66.5 percent of
          people with heart disease took one in high-income countries against
          3.3 percent in low-income ones (PURE), and in national surveys from
          2013 to 2019 still only 8.2 percent did in low-income countries
          (Marcus et al. 2022). The world line weights each group's uptake by
          its share of the world's people over 60 in the UN projection (in
          2050: high income 20 percent, upper-middle 42, lower-middle 33, low
          5), so world uptake reaches half about 17 years after arrival. With
          arrival in 2062 the world gains 0.9 years by 2070, 3.6 by 2080 and
          6.3 by 2100; a single reset adds at most about 0.4 years a year, so
          on its own it does not reach longevity escape velocity (node
          longevity-escape-velocity).
