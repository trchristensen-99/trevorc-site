      - id: model-rejuvenation
        name: "Model: rejuvenation at the tree's date"
        kind: model
        points: [[2024, 65.1], [2030, 66.3], [2040, 67.9], [2050, 69.3], [2060, 70.7], [2062, 70.9], [2065, 71.4],
          [2070, 72.2], [2075, 73.2], [2080, 74.5], [2085, 76.1], [2090, 77.9], [2095, 79.4], [2100, 80.6]]
        low: [[2024, 65.1], [2030, 66.3], [2040, 67.9], [2050, 69.3], [2060, 70.7], [2070, 72.0], [2080, 73.3], [2090, 74.5], [2100, 75.7]]
        high: [[2024, 65.1], [2030, 66.3], [2040, 67.9], [2045, 68.6], [2050, 69.4], [2055, 70.3], [2060, 71.5], [2065, 72.9],
          [2070, 74.7], [2075, 76.4], [2080, 77.9], [2085, 78.9], [2090, 79.8], [2095, 80.5], [2100, 81.1]]
        note: >-
          A simple model, not a forecast; every point is computed, none is
          data. Baseline (no new aging biology): the UN medium path for
          low-income countries. On top of it, rejuvenation therapies (node
          aging-reversal) arrive in 2062, the tree's likely date; the band
          uses the tree's window, arrival in 2045 (high) or 2110 (low, which
          leaves the baseline unchanged to 2100). Effect: the aging-reversal
          criterion's 10-year reset, applied once to everyone 60 and over, so
          they die at the rates of people 10 years younger. On the UN's 2023
          life table for the group that adds 5.5 years at birth, less than in
          richer countries because fewer people live to 60 (my calculation).
          The added years are held fixed and scaled by the share of people
          over 60 who have had it. Uptake differs by income group, the point
          of the comparison. My logistic curves reach half of people over 60 8
          years after arrival in high-income countries (scale 3 years, so 90
          percent after about 15) and 25 years after in low-income countries
          (scale 6, 90 percent after about 38), with 15 and 20 years for
          upper-middle and lower-middle income (my interpolation). They are
          set from two past therapies. Combination antiretroviral therapy for
          HIV (1996): in the United States 53 percent of adults in HIV care
          were taking it by late 1997 to January 1998 (HCSUS), while in
          low-income countries coverage of all people with HIV was 19 percent
          in 2010 and first passed half in 2016, 20 years on, and only after
          generic drugs and donor programmes such as PEPFAR and the Global
          Fund (World Bank, from UNAIDS). Statins (first approved in 1987) had
          no such push: in 2003 to 2009, 66.5 percent of people with heart
          disease took one in high-income countries against 3.3 percent in
          low-income ones (PURE), and in national surveys from 2013 to 2019
          still only 8.2 percent did in low-income countries (Marcus et al.
          2022). With arrival in 2062, low-income countries gain 1.2 years by
          2080 and 4.9 by 2100, and the gap to high-income countries widens
          from 15.7 years in 2062 to 21.0 in 2075 before narrowing again to
          17.5 in 2100.
        sources:
          - title: "UN World Population Prospects 2024, complete life tables, both sexes, 1950 to 2023 (CSV)"
            url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_Life_Table_Complete_Medium_Both_1950-2023.csv.gz
          - title: "UN World Population Prospects 2024, population by five-year age group, medium variant (CSV)"
            url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_PopulationByAge5GroupSex_Medium.csv.gz
          - title: "Cunningham et al. (HCSUS), Prevalence and predictors of highly active antiretroviral therapy use in patients with HIV infection in the United States, JAIDS 25:115 (2000)"
            url: https://doi.org/10.1097/00042560-200010010-00005
          - title: "World Bank World Development Indicators: antiretroviral therapy coverage, percent of people living with HIV (SH.HIV.ARTC.ZS), low-income countries, from UNAIDS"
            url: https://data.worldbank.org/indicator/SH.HIV.ARTC.ZS?locations=XM
          - title: "Marcus et al., Use of statins for the prevention of cardiovascular disease in 41 low-income and middle-income countries, Lancet Global Health 10:e369 (2022), which also reports the PURE study"
            url: https://doi.org/10.1016/S2214-109X(21)00551-9
