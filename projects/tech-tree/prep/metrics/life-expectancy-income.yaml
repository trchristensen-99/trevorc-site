id: life-expectancy-income
name: Life expectancy at birth by country income group
short: Life expectancy by income
unit: years
better: higher
log: false
field: medicine
fit: {from: 1970}  # after the post-war catch-up and China's 1959 to 1961 famine
source:
  title: "UN World Population Prospects 2024, via Our World in Data (Riley 2005 for the world before 1950)"
  url: https://ourworldindata.org/grapher/life-expectancy?country=OWID_WRL~High-income+countries~Upper-middle-income+countries~Lower-middle-income+countries~Low-income+countries
license: CC BY 3.0 IGO (UN WPP); CC BY 4.0 (OWID)
note: >-
  Period life expectancy at birth, both sexes, for the four World Bank income
  groups and the world, from UN World Population Prospects 2024 (the numbers
  OWID republishes, checked against the UN's CSV on 2026-10-29), every fifth
  year to 1985, then every year to 2023. The world line also carries James
  Riley's long-run estimates for 1770 to 1913. The UN groups countries by the
  World Bank classification current in May 2024 (fiscal year 2024, based on
  2022 income per person) and applies it to every year back to 1950, so
  "low-income" means today's low-income countries throughout, not the
  countries that were poorest in 1950. In 2023: high-income (90 countries,
  1.26 billion people, such as the United States, Japan and Germany) 81.4
  years; upper-middle (54 countries, 2.81 billion, such as China, Indonesia
  and Brazil) 75.9; lower-middle (54 countries, 3.25 billion, such as India,
  Pakistan and Nigeria) 69.6; low-income (26 countries, 0.74 billion, such as
  Ethiopia, DR Congo and Sudan) 64.9; world 73.2. The gap between high- and
  low-income countries was 30.6 years in 1950, 26.5 in 1970, 24.5 in 2000 and
  16.5 in 2023, closed mostly by fewer child and infectious deaths and, from
  the mid-2000s, HIV treatment in Africa. The dips are China's famine
  (upper-middle, 1959 to 1961), Rwanda's genocide (low-income, 1994) and
  COVID-19 (2020 to 2021). The UN and IHME both expect gains to slow; they
  disagree most about the poorest countries, where IHME expects much faster
  catch-up.
