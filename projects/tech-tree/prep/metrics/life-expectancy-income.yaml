        low: [[2023, 64.94], [2050, 69.4]]
        high: [[2023, 64.94], [2050, 76.2]]
        note: >-
          IHME does not publish World Bank income groups in this paper; this
          is its forecast for sub-Saharan Africa, home to all but a handful of
          the 26 low-income countries (the others include Afghanistan, Syria
          and Yemen) but also to richer ones such as Nigeria and South Africa.
          IHME puts the region at 64.4 years in 2022 and 73.6 in 2050 (95
          percent uncertainty 69.4 to 76.2), the largest gain of any region;
          the UN has sub-Saharan Africa going from 61.1 to 66.8 over the same
          years, so the two differ by about 3 years now and 7 by 2050. The
          line starts from the UN's 2023 low-income value so it joins the
          data.
