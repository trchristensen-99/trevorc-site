note: >-
  Computed from Epoch AI's ml_hardware.csv (downloaded 2026-10-27) as FP32 peak
  FLOP/s divided by release price in nominal USD, keeping only GPUs that set a
  new record; the dataset has few priced consumer GPUs after 2022. ML
  accelerators are better measured in tensor FP16/FP8, where price-performance
  is higher (for example H100 SXM at about 2.9e10 dense FP16 FLOP/s per dollar
  and GB200 at about 6.8e10). Epoch's 2022 study of 470 GPUs found FP32
  FLOP/s per dollar doubling about every 2.5 years, and every 2.07 years for
  GPUs used in ML (https://epoch.ai/blog/trends-in-gpu-price-performance).
